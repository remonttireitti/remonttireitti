  <circle cx="620" cy="380" r="44" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="605" y="388" font-family="system-ui,sans-serif" font-size="28">=÷</text>
  <text x="80" y="420" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#0369a1">Kilpailuta remontti ilmaiseksi</text>
