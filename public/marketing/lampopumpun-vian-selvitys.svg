<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Lämpöpumpun vian selvitys  tarkista oire itse</title>
  <desc id="desc">Lämpöpumpun ulkoyksikkö ja tarkistuslista: ei lämmitä, virhekoodi, vuoto.</desc>
  <rect width="800" height="520" fill="#fff7ed"/>
  <rect x="80" y="80" width="280" height="200" rx="12" fill="#fff" stroke="#fdba74" stroke-width="2"/>
  <rect x="120" y="200" width="200" height="60" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <circle cx="220" cy="170" r="36" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
  <text x="205" y="178" font-family="system-ui,sans-serif" font-size="24">D</text>
  <text x="100" y="120" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#9a3412">Ulkoyksikkö</text>
  <rect x="420" y="80" width="300" height="340" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="450" y="120" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Vian selvitys</text>
  <text x="450" y="160" font-family="system-ui,sans-serif" font-size="14" fill="#475569"> Lämmitystila päällä?</text>
  <text x="450" y="195" font-family="system-ui,sans-serif" font-size="14" fill="#475569"> Suodatin puhdas?</text>
  <text x="450" y="230" font-family="system-ui,sans-serif" font-size="14" fill="#475569"> Lumi pois ulkoyksikön edestä?</text>
  <text x="450" y="265" font-family="system-ui,sans-serif" font-size="14" fill="#475569"> Virhekoodi näytöllä?</text>
  <rect x="450" y="300" width="180" height="36" rx="8" fill="#ea580c"/>
  <text x="468" y="323" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#fff">Tilaa huolto tarvittaessa</text>
  <text x="80" y="420" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#9a3412">Lämpöpumppu ei lämmitä?</text>
  <text x="80" y="450" font-family="system-ui,sans-serif" font-size="15" fill="#475569">Ilmainen tarkistuslista ennen huoltokäyntiä</text>
</svg>
