# keittio_ilp.yaml
# Keittiön ilmalämpöpumppu — KOKO tiedosto, kopioi config/packages/
#
# climate.keittio_ilp:
#   hvac_modes: off, auto, cool, dry, heat, fan_only
#   min_temp: 16 / max_temp: 30
#   fan_modes: auto, quiet, low, medium, high
#   swing_modes: up_down_auto, highest, middle, normal, lowest, 3d_auto
#   swing_horizontal_modes: left_right_auto, left_left, left_center,
#     center_center, center_right, right_right, left_right, right_left, 3d_auto
#
# Logiikka:
#   - Ovi auki → off
#   - Jäähdytyskausi (ulko ≥ 20 °C) → cool JÄÄ PÄÄLLE, swing highest (katto)
#   - Lämmityskausi (ulko ≤ 16 °C) → heat JÄÄ PÄÄLLE, swing lowest (lattia)
#   - 16–20 °C: kausi ei vaihdu
#   - Lämmitys ↔ jäähdytys: 4 h viive (input_number.keittio_ilp_kausi_viive)
#   - Lähellä asetusta → fan quiet; kaukana → high
#   - Suuri poikkeama → tehostettu asetus
#   - Komentoja vain kun arvo oikeasti muuttuu (ei kompressorin pätkimistä)

input_select:
  keittio_ilp_tila:
    name: Keittiö ILP ohjaus
    options:
      - Automaatti
      - Pois
      - Manuaali
    initial: Automaatti
    icon: mdi:air-conditioner
  keittio_ilp_manuaali_tila:
    name: Keittiö ILP manuaali tila
    options:
      - Lämmitys
      - Jäähdytys
    initial: Lämmitys
    icon: mdi:thermostat
  keittio_ilp_kausi:
    name: Keittiö ILP kausi
    options:
      - Lämmitys
      - Jäähdytys
    initial: Lämmitys
    icon: mdi:sun-snowflake

input_number:
  keittio_ilp_lampo:
    name: Keittiö ILP lämpö (ulko ≤ 20 °C)
    min: 16
    max: 30
    step: 0.5
    mode: slider
    unit_of_measurement: "°C"
    icon: mdi:fire
    initial: 22
  keittio_ilp_jaahdytys:
    name: Keittiö ILP jäähdytys (ulko > 20 °C)
    min: 16
    max: 30
    step: 0.5
    mode: slider
    unit_of_measurement: "°C"
    icon: mdi:snowflake
    initial: 24
  keittio_ilp_kausi_viive:
    name: Keittiö ILP kausivaihdon viive
    min: 3
    max: 8
    step: 0.5
    mode: slider
    unit_of_measurement: "h"
    icon: mdi:timer-sand
    initial: 4

input_datetime:
  keittio_ilp_kausi_vaihto:
    name: Keittiö ILP viimeisin kausivaihto
    has_date: true
    has_time: true

input_text:
  keittio_ilp_status:
    name: Keittiö ILP tila
    max: 255
    initial: Käynnistyy

sensor:
  - platform: statistics
    name: Keittio ilp kustannus 5min
    unique_id: keittio_ilp_kustannus_5min
    entity_id: sensor.hetkellinen_kustannus_30min_keski_arvo
    state_characteristic: mean
    max_age:
      minutes: 5
    sampling_size: 30

template:
  - trigger:
      - platform: time_pattern
        minutes: "/5"
      - platform: homeassistant
        event: start
      - platform: state
        entity_id:
          - sensor.ulkolampotila_met_no
          - sensor.energi_data_service
          - sensor.hetkellinen_kustannus_3_tuntia_keski_arvo
          - sensor.hetkellinen_kustannus_30min_keski_arvo
          - sensor.keittio_ilp_kustannus_5min
    sensor:
      - name: Keittio ilp tavoite
        unique_id: keittio_ilp_tavoite
        unit_of_measurement: "°C"
        device_class: temperature
        state: >
          {% set BASE_TEMP = 24 %}
          {% set OUTDOOR_COLD = -30 %}
          {% set OUTDOOR_WARM = 10 %}
          {% set OUTDOOR_EFFECT = 3 %}
          {% set PRICE_CHEAP = 0 %}
          {% set PRICE_EXPENSIVE = 30 %}
          {% set PRICE_EFFECT = 1.5 %}
          {% set COST_CHEAP = 0 %}
          {% set COST_EXPENSIVE = 100 %}
          {% set COST_EFFECT = 1.5 %}
          {% set MIN_TEMP = 22 %}
          {% set MAX_TEMP = 24 %}
          {% set outdoor = states('sensor.ulkolampotila_met_no') | float(0) %}
          {% set price_now = states('sensor.energi_data_service') | float(0) %}
          {% set cost_5m = states('sensor.keittio_ilp_kustannus_5min') %}
          {% set cost_3h = states('sensor.hetkellinen_kustannus_3_tuntia_keski_arvo') %}
          {% set cost_30m = states('sensor.hetkellinen_kustannus_30min_keski_arvo') %}
          {% set avgCost = 0.0 %}
          {% if is_number(cost_5m) %}{% set avgCost = cost_5m | float %}
          {% elif is_number(cost_3h) %}{% set avgCost = cost_3h | float %}
          {% elif is_number(cost_30m) %}{% set avgCost = cost_30m | float %}
          {% endif %}
          {% if outdoor <= OUTDOOR_COLD %}{% set adj_outdoor = OUTDOOR_EFFECT %}
          {% elif outdoor >= OUTDOOR_WARM %}{% set adj_outdoor = -OUTDOOR_EFFECT %}
          {% else %}{% set adj_outdoor = OUTDOOR_EFFECT * (1 - ((outdoor - OUTDOOR_COLD) / (OUTDOOR_WARM - OUTDOOR_COLD)) * 2) %}{% endif %}
          {% if price_now <= PRICE_CHEAP %}{% set adj_price = PRICE_EFFECT %}
          {% elif price_now >= PRICE_EXPENSIVE %}{% set adj_price = -PRICE_EFFECT %}
          {% else %}{% set adj_price = PRICE_EFFECT * (1 - ((price_now - PRICE_CHEAP) / (PRICE_EXPENSIVE - PRICE_CHEAP)) * 2) %}{% endif %}
          {% if avgCost <= COST_CHEAP %}{% set adj_cost = COST_EFFECT %}
          {% elif avgCost >= COST_EXPENSIVE %}{% set adj_cost = -COST_EFFECT %}
          {% else %}{% set adj_cost = COST_EFFECT * (1 - ((avgCost - COST_CHEAP) / (COST_EXPENSIVE - COST_CHEAP)) * 2) %}{% endif %}
          {% set target = BASE_TEMP + adj_outdoor + adj_price + adj_cost %}
          {{ [[MIN_TEMP, target] | max, MAX_TEMP] | min | round(1) }}

script:
  keittio_ilp_aseta:
    alias: Keittiö ILP aseta (vain muuttuneet arvot)
    mode: queued
    max: 2
    fields:
      hvac:
        selector:
          text:
      temperature:
        selector:
          number:
      fan:
        selector:
          text:
      swing:
        selector:
          text:
      status:
        selector:
          text:
    sequence:
      - variables:
          hvac_now: "{{ states('climate.keittio_ilp') }}"
          temp_now: "{{ state_attr('climate.keittio_ilp', 'temperature') | float(0) }}"
          fan_now: "{{ state_attr('climate.keittio_ilp', 'fan_mode') }}"
          swing_now: "{{ state_attr('climate.keittio_ilp', 'swing_mode') }}"
          hvac_want: "{{ hvac }}"
          temp_want: "{{ temperature | float(24) }}"
          fan_want: "{{ fan }}"
          swing_want: "{{ swing }}"
      - if:
          - condition: template
            value_template: "{{ hvac_now != hvac_want }}"
        then:
          - action: climate.set_hvac_mode
            target:
              entity_id: climate.keittio_ilp
            data:
              hvac_mode: "{{ hvac_want }}"
      - if:
          - condition: template
            value_template: "{{ hvac_want != 'off' and (temp_now | float(0) - temp_want | float(0)) | abs >= 0.4 }}"
        then:
          - action: climate.set_temperature
            target:
              entity_id: climate.keittio_ilp
            data:
              temperature: "{{ temp_want }}"
      - if:
          - condition: template
            value_template: "{{ hvac_want != 'off' and fan_now != fan_want }}"
        then:
          - action: climate.set_fan_mode
            target:
              entity_id: climate.keittio_ilp
            data:
              fan_mode: "{{ fan_want }}"
      - if:
          - condition: template
            value_template: "{{ hvac_want != 'off' and swing_now != swing_want }}"
        then:
          - action: climate.set_swing_mode
            target:
              entity_id: climate.keittio_ilp
            data:
              swing_mode: "{{ swing_want }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.keittio_ilp_status
        data:
          value: "{{ status }}"

  keittio_ilp_paivita:
    alias: Keittiö ILP päivitä
    mode: single
    sequence:
      - variables:
          outdoor: "{{ states('sensor.ulkolampotila_met_no') | float(0) }}"
          indoor: "{{ state_attr('climate.keittio_ilp', 'current_temperature') | float(0) }}"
          ovi_auki: "{{ is_state('binary_sensor.terassi_ovi_contact', 'on') }}"
          target_cool: "{{ states('input_number.keittio_ilp_jaahdytys') | float(24) }}"
          target_heat: "{{ [[16, (states('sensor.keittio_ilp_tavoite') | float(22)) + (states('input_number.keittio_ilp_lampo') | float(22) - 22)] | max, 30] | min | round(1) }}"
          kausi_nyt: "{{ states('input_select.keittio_ilp_kausi') | trim }}"
          kausi_haluttu: >-
            {% set o = states('sensor.ulkolampotila_met_no') | float(0) %}
            {% set cur = states('input_select.keittio_ilp_kausi') | trim %}
            {{ 'Jäähdytys' if o >= 20 else ('Lämmitys' if o <= 16 else cur) }}
          lukitus_ok: >-
            {% set last = as_timestamp(states('input_datetime.keittio_ilp_kausi_vaihto'), 0) %}
            {% set h = states('input_number.keittio_ilp_kausi_viive') | float(4) %}
            {{ last | float(0) == 0 or (now().timestamp() - last | float(0)) >= (h * 3600) }}
          kausi: "{{ kausi_haluttu if (kausi_haluttu == kausi_nyt or lukitus_ok | bool) else kausi_nyt }}"
          jaahdytys: "{{ (kausi | trim) == 'Jäähdytys' }}"
          gap: >-
            {% if (kausi | trim) == 'Jäähdytys' %}
              {{ indoor | float(0) - target_cool | float(0) }}
            {% else %}
              {{ target_heat | float(0) - indoor | float(0) }}
            {% endif %}
          send_temp: >-
            {% set g = gap | float(0) %}
            {% if (kausi | trim) == 'Jäähdytys' %}
              {% set t = target_cool | float(24) %}
              {% set out = t - 2 if g >= 2 else (t - 1 if g >= 1 else t) %}
              {{ [[16, out] | max, 30] | min | round(1) }}
            {% else %}
              {% set t = target_heat | float(22) %}
              {% set out = t + 2 if g >= 2 else (t + 1 if g >= 1 else t) %}
              {{ [[16, out] | max, 30] | min | round(1) }}
            {% endif %}
          fan: "{{ 'quiet' if gap | float(0) <= 0.6 else ('high' if gap | float(0) >= 1.5 else 'low') }}"
          swing: "{{ 'highest' if (kausi | trim) == 'Jäähdytys' else 'lowest' }}"
          hvac_want: "{{ 'cool' if (kausi | trim) == 'Jäähdytys' else 'heat' }}"
          status: >-
            {% set suunta = 'katto' if (kausi | trim) == 'Jäähdytys' else 'lattia' %}
            {% set lukko = '' if lukitus_ok | bool else ' · kausilukko' %}
            {{ kausi | trim }} {{ send_temp }} °C · {{ fan }} · {{ suunta }} · sisä {{ indoor | round(1) }} °C · ulko {{ outdoor | round(1) }} °C{{ lukko }}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ ovi_auki | bool }}"
            sequence:
              - action: script.keittio_ilp_aseta
                data:
                  hvac: "off"
                  temperature: 24
                  fan: quiet
                  swing: normal
                  status: "Pois — terassi ovi auki (ulko {{ outdoor | round(1) }} °C, sisä {{ indoor | round(1) }} °C)"
        default:
          - if:
              - condition: template
                value_template: "{{ (kausi | trim) != kausi_nyt }}"
            then:
              - action: input_select.select_option
                target:
                  entity_id: input_select.keittio_ilp_kausi
                data:
                  option: "{{ kausi | trim }}"
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.keittio_ilp_kausi_vaihto
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          - action: script.keittio_ilp_aseta
            data:
              hvac: "{{ hvac_want }}"
              temperature: "{{ send_temp }}"
              fan: "{{ fan }}"
              swing: "{{ swing }}"
              status: "{{ status }}"

  keittio_ilp_automaatti:
    alias: Keittiö ILP automaatti käynnistä
    mode: single
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.keittio_ilp_tila
        data:
          option: Automaatti
      - action: script.keittio_ilp_paivita

  keittio_ilp_pois:
    alias: Keittiö ILP pois
    mode: single
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.keittio_ilp_tila
        data:
          option: Pois
      - action: script.keittio_ilp_aseta
        data:
          hvac: "off"
          temperature: 24
          fan: quiet
          swing: normal
          status: Pois — laite sammutettu

  keittio_ilp_manuaali:
    alias: Keittiö ILP manuaali ajo
    mode: single
    sequence:
      - variables:
          indoor: "{{ state_attr('climate.keittio_ilp', 'current_temperature') | float(0) }}"
          target_heat: "{{ states('input_number.keittio_ilp_lampo') | float(22) }}"
          target_cool: "{{ states('input_number.keittio_ilp_jaahdytys') | float(24) }}"
          jaahdytys: "{{ is_state('input_select.keittio_ilp_manuaali_tila', 'Jäähdytys') }}"
          ovi_auki: "{{ is_state('binary_sensor.terassi_ovi_contact', 'on') }}"
          gap: >-
            {% set i = state_attr('climate.keittio_ilp', 'current_temperature') | float(0) %}
            {% if is_state('input_select.keittio_ilp_manuaali_tila', 'Jäähdytys') %}
              {{ i - states('input_number.keittio_ilp_jaahdytys') | float(24) }}
            {% else %}
              {{ states('input_number.keittio_ilp_lampo') | float(22) - i }}
            {% endif %}
          fan: "{{ 'quiet' if gap | float(0) <= 0.6 else ('high' if gap | float(0) >= 1.5 else 'low') }}"
          swing: "{{ 'highest' if jaahdytys | bool else 'lowest' }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ ovi_auki | bool }}"
            sequence:
              - action: script.keittio_ilp_aseta
                data:
                  hvac: "off"
                  temperature: 24
                  fan: quiet
                  swing: normal
                  status: Manuaali estetty — terassi ovi auki
          - conditions:
              - condition: template
                value_template: "{{ jaahdytys | bool }}"
            sequence:
              - action: script.keittio_ilp_aseta
                data:
                  hvac: cool
                  temperature: "{{ target_cool }}"
                  fan: "{{ fan }}"
                  swing: "{{ swing }}"
                  status: "Manuaali jäähdytys {{ target_cool }} °C · {{ fan }} · katto"
        default:
          - action: script.keittio_ilp_aseta
            data:
              hvac: heat
              temperature: "{{ target_heat }}"
              fan: "{{ fan }}"
              swing: "{{ swing }}"
              status: "Manuaali lämmitys {{ target_heat }} °C · {{ fan }} · lattia"

automation:
  - id: keittio_ilp_tila_automaatti
    alias: Keittiö ILP → automaatti
    mode: single
    trigger:
      - platform: state
        entity_id: input_select.keittio_ilp_tila
        to: Automaatti
    action:
      - action: script.keittio_ilp_paivita

  - id: keittio_ilp_tila_pois
    alias: Keittiö ILP → pois
    mode: single
    trigger:
      - platform: state
        entity_id: input_select.keittio_ilp_tila
        to: Pois
    action:
      - action: script.keittio_ilp_aseta
        data:
          hvac: "off"
          temperature: 24
          fan: quiet
          swing: normal
          status: Pois — laite sammutettu

  - id: keittio_ilp_lampotila
    alias: Keittiö ILP lämpötila
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/5"
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: binary_sensor.terassi_ovi_contact
      - platform: state
        entity_id: sensor.ulkolampotila_met_no
        for: "00:10:00"
      - platform: state
        entity_id:
          - sensor.keittio_ilp_tavoite
          - input_number.keittio_ilp_lampo
          - input_number.keittio_ilp_jaahdytys
    condition:
      - condition: state
        entity_id: input_select.keittio_ilp_tila
        state: Automaatti
    action:
      - action: script.keittio_ilp_paivita

  - id: keittio_ilp_ovi_auki
    alias: Keittiö ILP → ovi auki
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.terassi_ovi_contact
        to: "on"
    action:
      - action: script.keittio_ilp_aseta
        data:
          hvac: "off"
          temperature: 24
          fan: quiet
          swing: normal
          status: Pois — terassi ovi auki

  - id: keittio_ilp_ovi_kiinni
    alias: Keittiö ILP → ovi kiinni
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.terassi_ovi_contact
        to: "off"
        for: "00:02:00"
    condition:
      - condition: state
        entity_id: input_select.keittio_ilp_tila
        state: Automaatti
    action:
      - action: script.keittio_ilp_paivita
