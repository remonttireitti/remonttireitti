# packages-energia-kokonaisteho.yaml
# KOKO tiedosto → config/packages/packages-energia-kokonaisteho.yaml
#
# Palauttaa sensor.energia_kokonaisteho_w (L1+L2+L3).
#
# PAKKO ennen reloadia, jos entiteetti näyttää "Integraatio template ei enää tarjoa":
#   Asetukset → Entiteetit → Energia kokonaisteho W → hammasratas → Poista
#   sitten YAML-lataus tai HA-restart.

template:
  - sensor:
      - name: Energia kokonaisteho W
        unique_id: energia_kokonaisteho_w
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:flash
        state: >
          {{ states('sensor.l1_vaihe_power') | float(0)
           + states('sensor.l2_vaihe_power') | float(0)
           + states('sensor.l3_vaihe_power') | float(0) }}
        availability: >
          {{ states('sensor.l1_vaihe_power') not in ['unknown','unavailable']
             or states('sensor.l2_vaihe_power') not in ['unknown','unavailable']
             or states('sensor.l3_vaihe_power') not in ['unknown','unavailable'] }}
