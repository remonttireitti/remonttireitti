# packages-keittio_ilp.yaml
# Keittiön ilmalämpöpumppu.
#
# Entityt:
#   climate.keittio_ilp
#   binary_sensor.terassi_ovi_contact  (on = auki, off = kiinni)
#   sensor.ulkolampotila_met_no
#   sensor.energi_data_service
#   sensor.hetkellinen_kustannus_30min_keski_arvo
#
# Automaatin säännöt:
#   - Terassi ovi auki → pois
#   - Jäähdytyskausi (ulko ≥ 20 °C) → jäähdytys JÄÄ PÄÄLLE (ei off)
#   - Lämmityskausi (ulko ≤ 16 °C) → lämmitys JÄÄ PÄÄLLE (ei off)
#   - 16–20 °C: säilytä kausi
#   - Lämmitys ↔ jäähdytys: vähintään 4 h viive (säädettävä 3–5 h)
#   - Lähellä asetusta → puhallus low; kaukana → high
#   - Jäähdytys: puhallus katon rajaan; lämmitys: lattian rajaan
#   - Suuri poikkeama → tehostettu asetus (lämmitys korkeammaksi / jäähdytys alemmas)
#   - climate-komentoja ei lähetetä jos tila on jo oikein (estää kompressorin pätkimisen)

input_select:
  keittio_ilp_tila:
    name: Keittiö ILP ohjaus
    options:
      - Automaatti
      - Pois
      - Manuaali
    initial: Automaatti
    icon: mdi:air-conditioner
  keittio_ilp_manuaali_tila:
    name: Keittiö ILP manuaali tila
    options:
      - Lämmitys
      - Jäähdytys
    initial: Lämmitys
    icon: mdi:thermostat
  keittio_ilp_kausi:
    name: Keittiö ILP kausi
    options:
      - Lämmitys
      - Jäähdytys
    initial: Lämmitys
    icon: mdi:sun-snowflake

input_number:
  keittio_ilp_lampo:
    name: Keittiö ILP lämpö (ulko ≤ 20 °C)
    min: 18
    max: 28
    step: 0.5
    mode: slider
    unit_of_measurement: "°C"
    icon: mdi:fire
    initial: 22
  keittio_ilp_jaahdytys:
    name: Keittiö ILP jäähdytys (ulko > 20 °C)
    min: 18
    max: 30
    step: 0.5
    mode: slider
    unit_of_measurement: "°C"
    icon: mdi:snowflake
    initial: 24
  keittio_ilp_kausi_viive:
    name: Keittiö ILP kausivaihdon viive
    min: 3
    max: 8
    step: 0.5
    mode: slider
    unit_of_measurement: "h"
    icon: mdi:timer-sand
    initial: 4

input_datetime:
  keittio_ilp_kausi_vaihto:
    name: Keittiö ILP viimeisin kausivaihto
    has_date: true
    has_time: true

input_text:
  keittio_ilp:
    name: Keittiö ILP tila
    max: 255
    initial: Käynnistyy

sensor:
  - platform: statistics
    name: Keittio ilp kustannus 5min
    unique_id: keittio_ilp_kustannus_5min
    entity_id: sensor.hetkellinen_kustannus_30min_keski_arvo
    state_characteristic: mean
    max_age:
      minutes: 5
    sampling_size: 30

template:
  - trigger:
      - platform: time_pattern
        minutes: "/5"
      - platform: homeassistant
        event: start
      - platform: state
        entity_id:
          - sensor.ulkolampotila_met_no
          - sensor.energi_data_service
          - sensor.hetkellinen_kustannus_3_tuntia_keski_arvo
          - sensor.hetkellinen_kustannus_30min_keski_arvo
          - sensor.keittio_ilp_kustannus_5min
    sensor:
      - name: Keittio ilp tavoite
        unique_id: keittio_ilp_tavoite
        unit_of_measurement: "°C"
        device_class: temperature
        state: >
          {% set BASE_TEMP = 24 %}
          {% set OUTDOOR_COLD = -30 %}
          {% set OUTDOOR_WARM = 10 %}
          {% set OUTDOOR_EFFECT = 3 %}
          {% set PRICE_CHEAP = 0 %}
          {% set PRICE_EXPENSIVE = 30 %}
          {% set PRICE_EFFECT = 1.5 %}
          {% set COST_CHEAP = 0 %}
          {% set COST_EXPENSIVE = 100 %}
          {% set COST_EFFECT = 1.5 %}
          {% set MIN_TEMP = 22 %}
          {% set MAX_TEMP = 24 %}
          {% set outdoor = states('sensor.ulkolampotila_met_no') | float(0) %}
          {% set price_now = states('sensor.energi_data_service') | float(0) %}
          {% set cost_5m = states('sensor.keittio_ilp_kustannus_5min') %}
          {% set cost_3h = states('sensor.hetkellinen_kustannus_3_tuntia_keski_arvo') %}
          {% set cost_30m = states('sensor.hetkellinen_kustannus_30min_keski_arvo') %}
          {% set avgCost = 0.0 %}
          {% if is_number(cost_5m) %}{% set avgCost = cost_5m | float %}
          {% elif is_number(cost_3h) %}{% set avgCost = cost_3h | float %}
          {% elif is_number(cost_30m) %}{% set avgCost = cost_30m | float %}
          {% endif %}
          {% if outdoor <= OUTDOOR_COLD %}{% set adj_outdoor = OUTDOOR_EFFECT %}
          {% elif outdoor >= OUTDOOR_WARM %}{% set adj_outdoor = -OUTDOOR_EFFECT %}
          {% else %}{% set adj_outdoor = OUTDOOR_EFFECT * (1 - ((outdoor - OUTDOOR_COLD) / (OUTDOOR_WARM - OUTDOOR_COLD)) * 2) %}{% endif %}
          {% if price_now <= PRICE_CHEAP %}{% set adj_price = PRICE_EFFECT %}
          {% elif price_now >= PRICE_EXPENSIVE %}{% set adj_price = -PRICE_EFFECT %}
          {% else %}{% set adj_price = PRICE_EFFECT * (1 - ((price_now - PRICE_CHEAP) / (PRICE_EXPENSIVE - PRICE_CHEAP)) * 2) %}{% endif %}
          {% if avgCost <= COST_CHEAP %}{% set adj_cost = COST_EFFECT %}
          {% elif avgCost >= COST_EXPENSIVE %}{% set adj_cost = -COST_EFFECT %}
          {% else %}{% set adj_cost = COST_EFFECT * (1 - ((avgCost - COST_CHEAP) / (COST_EXPENSIVE - COST_CHEAP)) * 2) %}{% endif %}
          {% set target = BASE_TEMP + adj_outdoor + adj_price + adj_cost %}
          {{ [[MIN_TEMP, target] | max, MAX_TEMP] | min | round(1) }}

script:
  keittio_ilp_paivita:
    alias: Keittiö ILP päivitä
    mode: single
    sequence:
      - variables:
          outdoor: "{{ states('sensor.ulkolampotila_met_no') | float(0) }}"
          indoor: "{{ state_attr('climate.keittio_ilp', 'current_temperature') | float(0) }}"
          ovi_auki: "{{ is_state('binary_sensor.terassi_ovi_contact', 'on') }}"
          hvac_now: "{{ states('climate.keittio_ilp') }}"
          temp_now: "{{ state_attr('climate.keittio_ilp', 'temperature') | float(0) }}"
          fan_now: "{{ state_attr('climate.keittio_ilp', 'fan_mode') }}"
          swing_now: "{{ state_attr('climate.keittio_ilp', 'swing_mode') }}"
          target_curve: "{{ states('sensor.keittio_ilp_tavoite') | float(22) }}"
          target_heat_user: "{{ states('input_number.keittio_ilp_lampo') | float(22) }}"
          target_cool: "{{ states('input_number.keittio_ilp_jaahdytys') | float(24) }}"
          target_heat: "{{ [[18, (states('sensor.keittio_ilp_tavoite') | float(22)) + (states('input_number.keittio_ilp_lampo') | float(22) - 22)] | max, 28] | min | round(1) }}"
          kausi_nyt: "{{ states('input_select.keittio_ilp_kausi') }}"
          kausi_haluttu: >
            {% set o = states('sensor.ulkolampotila_met_no') | float(0) %}
            {% set cur = states('input_select.keittio_ilp_kausi') %}
            {% if o >= 20 %}Jäähdytys
            {% elif o <= 16 %}Lämmitys
            {% else %}{{ cur }}{% endif %}
          lukitus_ok: >
            {% set last = as_timestamp(states('input_datetime.keittio_ilp_kausi_vaihto'), 0) %}
            {% set h = states('input_number.keittio_ilp_kausi_viive') | float(4) %}
            {{ last | float(0) == 0 or (now().timestamp() - last | float(0)) >= (h * 3600) }}
          kausi: >
            {% set cur = states('input_select.keittio_ilp_kausi') %}
            {% set o = states('sensor.ulkolampotila_met_no') | float(0) %}
            {% set wanted = 'Jäähdytys' if o >= 20 else ('Lämmitys' if o <= 16 else cur) %}
            {% set last = as_timestamp(states('input_datetime.keittio_ilp_kausi_vaihto'), 0) %}
            {% set h = states('input_number.keittio_ilp_kausi_viive') | float(4) %}
            {% set ok = last | float(0) == 0 or (now().timestamp() - last | float(0)) >= (h * 3600) %}
            {{ wanted if wanted == cur or ok else cur }}
          jaahdytys: "{{ (kausi | trim) == 'Jäähdytys' }}"
          poikkeama: >
            {% set i = state_attr('climate.keittio_ilp', 'current_temperature') | float(0) %}
            {% set o = states('sensor.ulkolampotila_met_no') | float(0) %}
            {% set cur = states('input_select.keittio_ilp_kausi') %}
            {% set last = as_timestamp(states('input_datetime.keittio_ilp_kausi_vaihto'), 0) %}
            {% set h = states('input_number.keittio_ilp_kausi_viive') | float(4) %}
            {% set ok = last | float(0) == 0 or (now().timestamp() - last | float(0)) >= (h * 3600) %}
            {% set wanted = 'Jäähdytys' if o >= 20 else ('Lämmitys' if o <= 16 else cur) %}
            {% set kausi = wanted if wanted == cur or ok else cur %}
            {% set heat = [[18, (states('sensor.keittio_ilp_tavoite') | float(22)) + (states('input_number.keittio_ilp_lampo') | float(22) - 22)] | max, 28] | min %}
            {% set cool = states('input_number.keittio_ilp_jaahdytys') | float(24) %}
            {{ (i - cool) if kausi == 'Jäähdytys' else (heat - i) }}
          send_temp: >
            {% set i = state_attr('climate.keittio_ilp', 'current_temperature') | float(0) %}
            {% set o = states('sensor.ulkolampotila_met_no') | float(0) %}
            {% set cur = states('input_select.keittio_ilp_kausi') %}
            {% set last = as_timestamp(states('input_datetime.keittio_ilp_kausi_vaihto'), 0) %}
            {% set h = states('input_number.keittio_ilp_kausi_viive') | float(4) %}
            {% set ok = last | float(0) == 0 or (now().timestamp() - last | float(0)) >= (h * 3600) %}
            {% set wanted = 'Jäähdytys' if o >= 20 else ('Lämmitys' if o <= 16 else cur) %}
            {% set kausi = wanted if wanted == cur or ok else cur %}
            {% set heat = [[18, (states('sensor.keittio_ilp_tavoite') | float(22)) + (states('input_number.keittio_ilp_lampo') | float(22) - 22)] | max, 28] | min %}
            {% set cool = states('input_number.keittio_ilp_jaahdytys') | float(24) %}
            {% if kausi == 'Jäähdytys' %}
              {% set gap = i - cool %}
              {% set t = cool - 2 if gap >= 2 else (cool - 1 if gap >= 1 else cool) %}
              {{ [[18, t] | max, 30] | min | round(1) }}
            {% else %}
              {% set gap = heat - i %}
              {% set t = heat + 2 if gap >= 2 else (heat + 1 if gap >= 1 else heat) %}
              {{ [[18, t] | max, 28] | min | round(1) }}
            {% endif %}
          fan: >
            {% set i = state_attr('climate.keittio_ilp', 'current_temperature') | float(0) %}
            {% set o = states('sensor.ulkolampotila_met_no') | float(0) %}
            {% set cur = states('input_select.keittio_ilp_kausi') %}
            {% set last = as_timestamp(states('input_datetime.keittio_ilp_kausi_vaihto'), 0) %}
            {% set h = states('input_number.keittio_ilp_kausi_viive') | float(4) %}
            {% set ok = last | float(0) == 0 or (now().timestamp() - last | float(0)) >= (h * 3600) %}
            {% set wanted = 'Jäähdytys' if o >= 20 else ('Lämmitys' if o <= 16 else cur) %}
            {% set kausi = wanted if wanted == cur or ok else cur %}
            {% set heat = [[18, (states('sensor.keittio_ilp_tavoite') | float(22)) + (states('input_number.keittio_ilp_lampo') | float(22) - 22)] | max, 28] | min %}
            {% set cool = states('input_number.keittio_ilp_jaahdytys') | float(24) %}
            {% set gap = (i - cool) if kausi == 'Jäähdytys' else (heat - i) %}
            {% set want = 'low' if gap <= 0.6 else ('high' if gap >= 1.5 else 'medium') %}
            {% set modes = state_attr('climate.keittio_ilp', 'fan_modes') or [] %}
            {% set low = ['Quiet', 'quiet', 'Silent', 'silent', 'Low', 'low', '1', 'Level 1'] %}
            {% set mid = ['Medium', 'medium', 'Mid', 'mid', '3', 'Level 3', 'Auto', 'auto'] %}
            {% set high = ['High', 'high', 'Powerful', 'powerful', '5', 'Level 5'] %}
            {% set cands = low if want == 'low' else (high if want == 'high' else mid) %}
            {% set ns = namespace(found=want) %}
            {% for c in cands %}
              {% if c in modes %}{% set ns.found = c %}{% break %}{% endif %}
            {% endfor %}
            {{ ns.found }}
          swing: >
            {% set o = states('sensor.ulkolampotila_met_no') | float(0) %}
            {% set cur = states('input_select.keittio_ilp_kausi') %}
            {% set last = as_timestamp(states('input_datetime.keittio_ilp_kausi_vaihto'), 0) %}
            {% set h = states('input_number.keittio_ilp_kausi_viive') | float(4) %}
            {% set ok = last | float(0) == 0 or (now().timestamp() - last | float(0)) >= (h * 3600) %}
            {% set wanted = 'Jäähdytys' if o >= 20 else ('Lämmitys' if o <= 16 else cur) %}
            {% set kausi = wanted if wanted == cur or ok else cur %}
            {% set modes = state_attr('climate.keittio_ilp', 'swing_modes') or [] %}
            {% set cool = ['1', 'Position 1', 'Highest', 'highest', 'fixedTop', 'Up', 'up', 'Top', 'top', 'Vertical Highest', 'Fixed Highest'] %}
            {% set heat = ['5', 'Position 5', 'Lowest', 'lowest', 'fixedBottom', 'Down', 'down', 'Bottom', 'bottom', 'Vertical Lowest', 'Fixed Lowest'] %}
            {% set cands = cool if kausi == 'Jäähdytys' else heat %}
            {% set ns = namespace(found=cands[0]) %}
            {% for c in cands %}
              {% if c in modes %}{% set ns.found = c %}{% break %}{% endif %}
            {% endfor %}
            {{ ns.found }}
          hvac_want: "{{ 'cool' if (kausi | trim) == 'Jäähdytys' else 'heat' }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ ovi_auki | bool }}"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ hvac_now != 'off' }}"
                then:
                  - action: climate.set_hvac_mode
                    target:
                      entity_id: climate.keittio_ilp
                    data:
                      hvac_mode: "off"
              - action: input_text.set_value
                target:
                  entity_id: input_text.keittio_ilp
                data:
                  value: "Pois — terassi ovi auki (ulko {{ outdoor | round(1) }} °C, sisä {{ indoor | round(1) }} °C)"
        default:
          - if:
              - condition: template
                value_template: "{{ (kausi | trim) != (kausi_nyt | trim) }}"
            then:
              - action: input_select.select_option
                target:
                  entity_id: input_select.keittio_ilp_kausi
                data:
                  option: "{{ kausi | trim }}"
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.keittio_ilp_kausi_vaihto
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          - if:
              - condition: template
                value_template: "{{ hvac_now != hvac_want }}"
            then:
              - action: climate.set_hvac_mode
                target:
                  entity_id: climate.keittio_ilp
                data:
                  hvac_mode: "{{ hvac_want }}"
          - if:
              - condition: template
                value_template: "{{ (temp_now | float(0) - send_temp | float(0)) | abs >= 0.4 }}"
            then:
              - action: climate.set_temperature
                target:
                  entity_id: climate.keittio_ilp
                data:
                  temperature: "{{ send_temp }}"
          - if:
              - condition: template
                value_template: "{{ (fan_now | default('') | lower) != (fan | default('') | lower) }}"
            then:
              - action: climate.set_fan_mode
                target:
                  entity_id: climate.keittio_ilp
                data:
                  fan_mode: "{{ fan }}"
                continue_on_error: true
          - if:
              - condition: template
                value_template: "{{ (swing_now | default('') | string | lower) != (swing | default('') | string | lower) }}"
            then:
              - action: climate.set_swing_mode
                target:
                  entity_id: climate.keittio_ilp
                data:
                  swing_mode: "{{ swing }}"
                continue_on_error: true
          - action: input_text.set_value
            target:
              entity_id: input_text.keittio_ilp
            data:
              value: >
                {% set suunta = 'katto' if (kausi | trim) == 'Jäähdytys' else 'lattia' %}
                {% set lukko = '' if lukitus_ok | bool else ' · kausilukko' %}
                {{ (kausi | trim) }} {{ send_temp }} °C · puhallus {{ fan }} · {{ suunta }} · sisä {{ indoor | round(1) }} °C · ulko {{ outdoor | round(1) }} °C{{ lukko }}

  keittio_ilp_automaatti:
    alias: Keittiö ILP automaatti käynnistä
    mode: single
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.keittio_ilp_tila
        data:
          option: Automaatti
      - action: script.turn_on
        target:
          entity_id: script.keittio_ilp_paivita

  keittio_ilp_pois:
    alias: Keittiö ILP pois
    mode: single
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.keittio_ilp_tila
        data:
          option: Pois
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.keittio_ilp
        data:
          hvac_mode: "off"
      - action: input_text.set_value
        target:
          entity_id: input_text.keittio_ilp
        data:
          value: Pois — laite sammutettu

  keittio_ilp_manuaali:
    alias: Keittiö ILP manuaali ajo
    mode: single
    sequence:
      - variables:
          indoor: "{{ state_attr('climate.keittio_ilp', 'current_temperature') | float(0) }}"
          target_heat: "{{ states('input_number.keittio_ilp_lampo') | float(22) }}"
          target_cool: "{{ states('input_number.keittio_ilp_jaahdytys') | float(24) }}"
          mode: "{{ states('input_select.keittio_ilp_manuaali_tila') }}"
          ovi_auki: "{{ is_state('binary_sensor.terassi_ovi_contact', 'on') }}"
          jaahdytys: "{{ states('input_select.keittio_ilp_manuaali_tila') == 'Jäähdytys' }}"
          gap: >
            {% set i = state_attr('climate.keittio_ilp', 'current_temperature') | float(0) %}
            {% if is_state('input_select.keittio_ilp_manuaali_tila', 'Jäähdytys') %}
              {{ i - states('input_number.keittio_ilp_jaahdytys') | float(24) }}
            {% else %}
              {{ states('input_number.keittio_ilp_lampo') | float(22) - i }}
            {% endif %}
          fan: "{{ 'low' if gap | float(0) <= 0.6 else ('high' if gap | float(0) >= 1.5 else 'medium') }}"
          swing: "{{ '1' if jaahdytys else '5' }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ ovi_auki | bool }}"
            sequence:
              - action: climate.set_hvac_mode
                target:
                  entity_id: climate.keittio_ilp
                data:
                  hvac_mode: "off"
              - action: input_text.set_value
                target:
                  entity_id: input_text.keittio_ilp
                data:
                  value: "Manuaali estetty — terassi ovi auki"
          - conditions:
              - condition: template
                value_template: "{{ jaahdytys | bool }}"
            sequence:
              - action: climate.set_hvac_mode
                target:
                  entity_id: climate.keittio_ilp
                data:
                  hvac_mode: cool
              - action: climate.set_temperature
                target:
                  entity_id: climate.keittio_ilp
                data:
                  temperature: "{{ target_cool }}"
              - action: climate.set_fan_mode
                target:
                  entity_id: climate.keittio_ilp
                data:
                  fan_mode: "{{ fan }}"
                continue_on_error: true
              - action: climate.set_swing_mode
                target:
                  entity_id: climate.keittio_ilp
                data:
                  swing_mode: "{{ swing }}"
                continue_on_error: true
              - action: input_text.set_value
                target:
                  entity_id: input_text.keittio_ilp
                data:
                  value: "Manuaali jäähdytys {{ target_cool }} °C · {{ fan }} · katto"
        default:
          - action: climate.set_hvac_mode
            target:
              entity_id: climate.keittio_ilp
            data:
              hvac_mode: heat
          - action: climate.set_temperature
            target:
              entity_id: climate.keittio_ilp
            data:
              temperature: "{{ target_heat }}"
          - action: climate.set_fan_mode
            target:
              entity_id: climate.keittio_ilp
            data:
              fan_mode: "{{ fan }}"
            continue_on_error: true
          - action: climate.set_swing_mode
            target:
              entity_id: climate.keittio_ilp
            data:
              swing_mode: "{{ swing }}"
            continue_on_error: true
          - action: input_text.set_value
            target:
              entity_id: input_text.keittio_ilp
            data:
              value: "Manuaali lämmitys {{ target_heat }} °C · {{ fan }} · lattia"

automation:
  - id: keittio_ilp_tila_automaatti
    alias: Keittiö ILP → automaatti
    mode: single
    trigger:
      - platform: state
        entity_id: input_select.keittio_ilp_tila
        to: Automaatti
    action:
      - action: script.turn_on
        target:
          entity_id: script.keittio_ilp_paivita

  - id: keittio_ilp_tila_pois
    alias: Keittiö ILP → pois
    mode: single
    trigger:
      - platform: state
        entity_id: input_select.keittio_ilp_tila
        to: Pois
    action:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.keittio_ilp
        data:
          hvac_mode: "off"
      - action: input_text.set_value
        target:
          entity_id: input_text.keittio_ilp
        data:
          value: Pois — laite sammutettu

  - id: keittio_ilp_lampotila
    alias: Keittiö ILP lämpötila
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/5"
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: binary_sensor.terassi_ovi_contact
      - platform: state
        entity_id: sensor.ulkolampotila_met_no
        for: "00:10:00"
      - platform: state
        entity_id:
          - sensor.keittio_ilp_tavoite
          - input_number.keittio_ilp_lampo
          - input_number.keittio_ilp_jaahdytys
    condition:
      - condition: state
        entity_id: input_select.keittio_ilp_tila
        state: Automaatti
    action:
      - action: script.keittio_ilp_paivita

  - id: keittio_ilp_ovi_auki
    alias: Keittiö ILP → ovi auki
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.terassi_ovi_contact
        to: "on"
    action:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.keittio_ilp
        data:
          hvac_mode: "off"
      - action: input_text.set_value
        target:
          entity_id: input_text.keittio_ilp
        data:
          value: "Pois — terassi ovi auki"

  - id: keittio_ilp_ovi_kiinni
    alias: Keittiö ILP → ovi kiinni
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.terassi_ovi_contact
        to: "off"
        for: "00:02:00"
    condition:
      - condition: state
        entity_id: input_select.keittio_ilp_tila
        state: Automaatti
    action:
      - action: script.keittio_ilp_paivita
