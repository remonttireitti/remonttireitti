# iv.yaml
# → config/packages/iv.yaml  (tiedostonimi ILMAN yhdysviivaa)
#
# Ohjaus:
#   input_select.iv_ohjaus: Automaatti | Manuaali | Tehostus | Pois
#   input_boolean.iv_kasi_ajo: on kun ei automaatti (Node-RED: älä ylikirjoita)
#   MQTT iv/ohjaus  {"ohjaus":"...","poisto":40,"tulo":35,"kasi":true}

input_select:
  iv_ohjaus:
    name: IV ohjaus
    options:
      - Automaatti
      - Manuaali
      - Tehostus
      - Pois
    initial: Automaatti
    icon: mdi:fan

input_boolean:
  iv_kasi_ajo:
    name: IV käsinajo
    icon: mdi:gesture-tap

input_number:
  iv_manuaali_poisto:
    name: IV käsi poisto
    min: 15
    max: 100
    step: 5
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:fan
    initial: 40
  iv_manuaali_tulo:
    name: IV käsi tulo
    min: 15
    max: 100
    step: 5
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:fan-plus
    initial: 35

timer:
  iv_tehostus:
    name: IV tehostus
    duration: "00:30:00"
    restore: true

script:
  iv_kirjoita:
    alias: IV kirjoita puhaltimet
    mode: restart
    fields:
      poisto:
        selector:
          number:
      tulo:
        selector:
          number:
    sequence:
      - variables:
          p: "{{ poisto | float(40) | round(0) }}"
          t: "{{ tulo | float(35) | round(0) }}"
          ohj: "{{ states('input_select.iv_ohjaus') }}"
      - action: mqtt.publish
        data:
          topic: iv/ohjaus
          retain: true
          payload: >
            {"ohjaus":"{{ ohj }}","poisto":{{ p }},"tulo":{{ t }},"kasi":{{ 'true' if is_state('input_boolean.iv_kasi_ajo', 'on') else 'false' }}}
        continue_on_error: true
      - action: mqtt.publish
        data:
          topic: homeassistant/iv/ohjaus
          retain: true
          payload: >
            {"ohjaus":"{{ ohj }}","poisto":{{ p }},"tulo":{{ t }},"kasi":{{ 'true' if is_state('input_boolean.iv_kasi_ajo', 'on') else 'false' }}}
        continue_on_error: true
      - action: input_number.set_value
        target:
          entity_id: input_number.iv_poisto
        data:
          value: "{{ p }}"
        continue_on_error: true
      - action: input_number.set_value
        target:
          entity_id: input_number.iv_tulo
        data:
          value: "{{ t }}"
        continue_on_error: true
      - action: number.set_value
        target:
          entity_id:
            - number.iv_poisto
            - number.iv_poisto_prosentti
        data:
          value: "{{ p }}"
        continue_on_error: true
      - action: number.set_value
        target:
          entity_id:
            - number.iv_tulo
            - number.iv_tulo_prosentti
        data:
          value: "{{ t }}"
        continue_on_error: true

  iv_automaatti:
    alias: IV automaatti
    mode: single
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Automaatti
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.iv_kasi_ajo
      - action: timer.cancel
        target:
          entity_id: timer.iv_tehostus
        continue_on_error: true
      - action: mqtt.publish
        data:
          topic: iv/ohjaus
          retain: true
          payload: '{"ohjaus":"Automaatti","kasi":false}'
        continue_on_error: true
      - action: mqtt.publish
        data:
          topic: homeassistant/iv/ohjaus
          retain: true
          payload: '{"ohjaus":"Automaatti","kasi":false}'
        continue_on_error: true

  iv_manuaali:
    alias: IV käsinajo
    mode: restart
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Manuaali
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.iv_kasi_ajo
      - action: timer.cancel
        target:
          entity_id: timer.iv_tehostus
        continue_on_error: true
      - action: script.iv_kirjoita
        data:
          poisto: "{{ states('input_number.iv_manuaali_poisto') | float(40) }}"
          tulo: "{{ states('input_number.iv_manuaali_tulo') | float(35) }}"

  iv_tehostus:
    alias: IV tehostus 30 min
    mode: restart
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Tehostus
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.iv_kasi_ajo
      - action: input_number.set_value
        target:
          entity_id: input_number.iv_manuaali_poisto
        data:
          value: 70
      - action: input_number.set_value
        target:
          entity_id: input_number.iv_manuaali_tulo
        data:
          value: 70
      - action: timer.start
        target:
          entity_id: timer.iv_tehostus
        data:
          duration: "00:30:00"
      - delay:
          milliseconds: 200
      - action: script.iv_kirjoita
        data:
          poisto: 70
          tulo: 70

  iv_pois:
    alias: IV pois / minimipuhallus
    mode: single
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Pois
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.iv_kasi_ajo
      - action: timer.cancel
        target:
          entity_id: timer.iv_tehostus
        continue_on_error: true
      - action: script.iv_kirjoita
        data:
          poisto: 15
          tulo: 15

  iv_sauna:
    alias: IV sauna
    mode: restart
    sequence:
      - if:
          - condition: state
            entity_id: input_boolean.sauna_tila
            state: "on"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.sauna_tila
          - action: timer.cancel
            target:
              entity_id: timer.sauna_tila
            continue_on_error: true
          - action: mqtt.publish
            data:
              topic: iv/ohjaus
              retain: false
              payload: '{"sauna":false}'
            continue_on_error: true
        else:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.sauna_tila
          - action: timer.start
            target:
              entity_id: timer.sauna_tila
            continue_on_error: true
          - action: mqtt.publish
            data:
              topic: iv/ohjaus
              retain: false
              payload: '{"sauna":true}'
            continue_on_error: true

automation:
  - id: iv_ohjaus_manuaali_saato
    alias: IV käsi — liukusäädin
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - input_number.iv_manuaali_poisto
          - input_number.iv_manuaali_tulo
    condition:
      - condition: state
        entity_id: input_select.iv_ohjaus
        state: Manuaali
    action:
      - action: script.iv_kirjoita
        data:
          poisto: "{{ states('input_number.iv_manuaali_poisto') | float(40) }}"
          tulo: "{{ states('input_number.iv_manuaali_tulo') | float(35) }}"

  - id: iv_tehostus_loppu
    alias: IV tehostus päättyi
    trigger:
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.iv_tehostus
    action:
      - action: script.iv_automaatti
