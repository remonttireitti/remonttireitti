      - condition: state
        entity_id: input_select.iv_ohjaus
        state: Automaatti
      - condition: state
        entity_id: input_select.iv_auto_anturit
        state: "Kosteus ja PM"
    action:
      - service: script.iv_auto_aja

  - id: iv_auto_kosteus_co2
    alias: IV auto kosteus co2
    initial_state: false
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.iv_auto_tavoite
        for:
          seconds: 30
      - platform: time_pattern
        minutes: "/2"
    condition:
      - condition: state
        entity_id: input_select.iv_ohjaus
        state: Automaatti
      - condition: state
        entity_id: input_select.iv_auto_anturit
        state: "Kosteus ja CO2"
    action:
      - service: script.iv_auto_aja

  - id: iv_auto_vain_co2
    alias: IV auto vain co2
    initial_state: false
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.iv_auto_tavoite
        for:
          seconds: 30
      - platform: time_pattern
        minutes: "/2"
    condition:
      - condition: state
        entity_id: input_select.iv_ohjaus
        state: Automaatti
      - condition: state
        entity_id: input_select.iv_auto_anturit
        state: "Vain CO2"
    action:
      - service: script.iv_auto_aja

  - id: iv_auto_vain_pm
    alias: IV auto vain pm
    initial_state: false
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.iv_auto_tavoite
        for:
          seconds: 30
      - platform: time_pattern
        minutes: "/2"
    condition:
      - condition: state
        entity_id: input_select.iv_ohjaus
        state: Automaatti
      - condition: state
        entity_id: input_select.iv_auto_anturit
        state: "Vain PM"
    action:
      - service: script.iv_auto_aja

  - id: iv_auto_vain_kosteus
    alias: IV auto vain kosteus
    initial_state: true
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.iv_auto_tavoite
        for:
          seconds: 30
      - platform: time_pattern
        minutes: "/2"
    condition:
      - condition: state
        entity_id: input_select.iv_ohjaus
        state: Automaatti
      - condition: state
