# iv.yaml
# → config/packages/iv.yaml  (tiedostonimi ILMAN yhdysviivaa)
#
# Käsinajo kirjoittaa AirFiin HA:n Modbus-integraatiolla.
# Rekisterit (holding, 0-pohjainen osoite, sama kartta kuin HA:ssa):
#   2  = suoraohjaus 1=käsi / 0=automaatti
#   10 = tulo %
#   11 = poisto %
#   12 = poissa-tila
#   56 = sauna
#
# Hubin nimi = configuration.yaml → modbus: → name:
# Muuta Developer Toolsista: input_text.iv_modbus_hub
# Slave yleensä 1: input_number.iv_modbus_slave
#
# Puhallinminimi 25 % (AirFi ei ota pienempää).
#
# Olemassa olevat IV-automaatiot: lisää ehto
#   input_select.iv_ohjaus == Automaatti
# muuten ne ylikirjoittavat käden.

input_select:
  iv_ohjaus:
    name: IV ohjaus
    options:
      - Automaatti
      - Manuaali
      - Tehostus
      - Pois
    initial: Automaatti
    icon: mdi:fan

input_boolean:
  iv_kasi_ajo:
    name: IV käsinajo
    icon: mdi:gesture-tap

input_text:
  iv_modbus_hub:
    name: IV Modbus-hub
    initial: airfi
    max: 40
    icon: mdi:lan

input_number:
  iv_modbus_slave:
    name: IV Modbus-slave
    min: 1
    max: 247
    step: 1
    mode: box
    icon: mdi:numeric
    initial: 1
  iv_manuaali_poisto:
    name: IV käsi poisto
    min: 25
    max: 100
    step: 5
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:fan
    initial: 40
  iv_manuaali_tulo:
    name: IV käsi tulo
    min: 25
    max: 100
    step: 5
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:fan-plus
    initial: 35

timer:
  iv_tehostus:
    name: IV tehostus
    duration: "00:30:00"
    restore: true

script:
  iv_kirjoita:
    alias: IV kirjoita puhaltimet
    mode: restart
    fields:
      poisto:
        selector:
          number:
      tulo:
        selector:
          number:
    sequence:
      - variables:
          p: "{{ [25, [100, poisto | int(40)] | min] | max }}"
          t: "{{ [25, [100, tulo | int(35)] | min] | max }}"
          hub: "{{ states('input_text.iv_modbus_hub') | trim }}"
          slave: "{{ states('input_number.iv_modbus_slave') | int(1) }}"
      - action: modbus.write_register
        data:
          hub: "{{ hub }}"
          slave: "{{ slave | int }}"
          address: 2
          value: 1
      - delay:
          milliseconds: 200
      - action: modbus.write_register
        data:
          hub: "{{ hub }}"
          slave: "{{ slave | int }}"
          address: 10
          value: "{{ t | int }}"
      - delay:
          milliseconds: 200
      - action: modbus.write_register
        data:
          hub: "{{ hub }}"
          slave: "{{ slave | int }}"
          address: 11
          value: "{{ p | int }}"

  iv_suora_pois:
    alias: IV palauta automaatti koneelle
    mode: single
    sequence:
      - variables:
          hub: "{{ states('input_text.iv_modbus_hub') | trim }}"
          slave: "{{ states('input_number.iv_modbus_slave') | int(1) }}"
      - action: modbus.write_register
        data:
          hub: "{{ hub }}"
          slave: "{{ slave | int }}"
          address: 2
          value: 0
      - delay:
          milliseconds: 200
      - action: modbus.write_register
        data:
          hub: "{{ hub }}"
          slave: "{{ slave | int }}"
          address: 12
          value: 0

  iv_sauna_kirjoita:
    alias: IV sauna Modbus
    mode: restart
    fields:
      paalle:
        selector:
          boolean:
    sequence:
      - variables:
          hub: "{{ states('input_text.iv_modbus_hub') | trim }}"
          slave: "{{ states('input_number.iv_modbus_slave') | int(1) }}"
          v: "{{ 1 if paalle else 0 }}"
      - action: modbus.write_register
        data:
          hub: "{{ hub }}"
          slave: "{{ slave | int }}"
          address: 56
          value: "{{ v | int }}"

  iv_automaatti:
    alias: IV automaatti
    mode: single
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Automaatti
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.iv_kasi_ajo
      - action: timer.cancel
        target:
          entity_id: timer.iv_tehostus
        continue_on_error: true
      - action: script.iv_suora_pois

  iv_manuaali:
    alias: IV käsinajo
    mode: restart
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Manuaali
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.iv_kasi_ajo
      - action: timer.cancel
        target:
          entity_id: timer.iv_tehostus
        continue_on_error: true
      - action: script.iv_kirjoita
        data:
          poisto: "{{ states('input_number.iv_manuaali_poisto') | float(40) }}"
          tulo: "{{ states('input_number.iv_manuaali_tulo') | float(35) }}"

  iv_tehostus:
    alias: IV tehostus 30 min
    mode: restart
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Tehostus
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.iv_kasi_ajo
      - action: input_number.set_value
        target:
          entity_id: input_number.iv_manuaali_poisto
        data:
          value: 70
      - action: input_number.set_value
        target:
          entity_id: input_number.iv_manuaali_tulo
        data:
          value: 70
      - action: timer.start
        target:
          entity_id: timer.iv_tehostus
        data:
          duration: "00:30:00"
      - delay:
          milliseconds: 200
      - action: script.iv_kirjoita
        data:
          poisto: 70
          tulo: 70

  iv_pois:
    alias: IV pois / minimipuhallus
    mode: single
    sequence:
      - variables:
          hub: "{{ states('input_text.iv_modbus_hub') | trim }}"
          slave: "{{ states('input_number.iv_modbus_slave') | int(1) }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Pois
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.iv_kasi_ajo
      - action: timer.cancel
        target:
          entity_id: timer.iv_tehostus
        continue_on_error: true
      - action: script.iv_kirjoita
        data:
          poisto: 25
          tulo: 25
      - delay:
          milliseconds: 200
      - action: modbus.write_register
        data:
          hub: "{{ hub }}"
          slave: "{{ slave | int }}"
          address: 12
          value: 1

  iv_sauna:
    alias: IV sauna
    mode: restart
    sequence:
      - if:
          - condition: state
            entity_id: input_boolean.sauna_tila
            state: "on"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.sauna_tila
          - action: timer.cancel
            target:
              entity_id: timer.sauna_tila
            continue_on_error: true
          - action: script.iv_sauna_kirjoita
            data:
              paalle: false
        else:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.sauna_tila
          - action: timer.start
            target:
              entity_id: timer.sauna_tila
            continue_on_error: true
          - action: script.iv_sauna_kirjoita
            data:
              paalle: true

automation:
  - id: iv_ohjaus_manuaali_saato
    alias: IV käsi — liukusäädin
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - input_number.iv_manuaali_poisto
          - input_number.iv_manuaali_tulo
    condition:
      - condition: state
        entity_id: input_select.iv_ohjaus
        state: Manuaali
    action:
      - action: script.iv_kirjoita
        data:
          poisto: "{{ states('input_number.iv_manuaali_poisto') | float(40) }}"
          tulo: "{{ states('input_number.iv_manuaali_tulo') | float(35) }}"

  - id: iv_tehostus_loppu
    alias: IV tehostus päättyi
    trigger:
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.iv_tehostus
    action:
      - action: script.iv_automaatti

  - id: iv_kasi_pito
    alias: IV käsi — pidä asetus
    mode: restart
    trigger:
      - platform: time_pattern
        seconds: "/30"
    condition:
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.iv_ohjaus
            state: Automaatti
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.iv_ohjaus
                state: Tehostus
            sequence:
              - action: script.iv_kirjoita
                data:
                  poisto: 70
                  tulo: 70
          - conditions:
              - condition: state
                entity_id: input_select.iv_ohjaus
                state: Pois
            sequence:
              - action: script.iv_kirjoita
                data:
                  poisto: 25
                  tulo: 25
        default:
          - action: script.iv_kirjoita
            data:
              poisto: "{{ states('input_number.iv_manuaali_poisto') | float(40) }}"
              tulo: "{{ states('input_number.iv_manuaali_tulo') | float(35) }}"
