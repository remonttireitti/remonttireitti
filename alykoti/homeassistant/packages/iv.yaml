# iv.yaml
# → config/packages/iv.yaml  (tiedostonimi ILMAN yhdysviivaa)
#
# AirFi TCP jumittuu jos Modbusia kirjoitetaan liian tiheään.
# Sääntö: yksi kirjoitus kerrallaan, vähintään 3 s edellisestä,
# liukusäädin lähettää vasta kun arvo on pysynyt 3 s.
# Älä kirjoita holding 2 = 1 (E1).
#
# Nosta myös configuration.yaml:n modbus-sensorien scan_interval
# vähintään 15 s — jatkuva luku + kirjoitus tukkii väylän.

input_select:
  iv_ohjaus:
    name: IV ohjaus
    options:
      - Automaatti
      - Manuaali
      - Tehostus
      - Pois
    initial: Automaatti
    icon: mdi:fan

input_boolean:
  iv_kasi_ajo:
    name: IV käsinajo
    icon: mdi:gesture-tap

input_text:
  iv_modbus_hub:
    name: IV Modbus-hub
    initial: airfi
    max: 40
    icon: mdi:lan

input_datetime:
  iv_modbus_tauko:
    name: IV viimeisin Modbus-kirjoitus
    has_date: true
    has_time: true

input_number:
  iv_modbus_slave:
    name: IV Modbus-slave
    min: 1
    max: 247
    step: 1
    mode: box
    icon: mdi:numeric
    initial: 1
  iv_manuaali_poisto:
    name: IV käsi poisto
    min: 25
    max: 100
    step: 5
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:fan
    initial: 40
  iv_manuaali_tulo:
    name: IV käsi tulo
    min: 25
    max: 100
    step: 5
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:fan-plus
    initial: 35
  iv_lahetetty_poisto:
    name: IV viimeksi lähetetty poisto
    min: 0
    max: 100
    step: 1
    mode: box
    initial: 0
  iv_lahetetty_tulo:
    name: IV viimeksi lähetetty tulo
    min: 0
    max: 100
    step: 1
    mode: box
    initial: 0

timer:
  iv_tehostus:
    name: IV tehostus
    duration: "00:30:00"
    restore: true

script:
  iv_odota_tauko:
    alias: IV odota ettei väylä jumitu
    mode: single
    sequence:
      - variables:
          viime: "{{ as_timestamp(states('input_datetime.iv_modbus_tauko'), 0) | float(0) }}"
          nyt: "{{ now().timestamp() }}"
          odota: "{{ [0, 3 - (nyt | float - viime)] | max }}"
      - delay:
          seconds: "{{ odota | float(0) }}"

  iv_merkkaa_kirjoitus:
    alias: IV merkitse Modbus-kirjoitus
    mode: single
    sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.iv_modbus_tauko
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  iv_kuittaa:
    alias: IV kuittaa E1 / hätäseis
    mode: single
    sequence:
      - variables:
          hub: "{{ states('input_text.iv_modbus_hub') | trim }}"
          slave: "{{ states('input_number.iv_modbus_slave') | int(1) }}"
      - action: script.iv_odota_tauko
      - action: modbus.write_register
        data:
          hub: "{{ hub }}"
          slave: "{{ slave | int }}"
          address: 1
          value: 0
      - delay:
          seconds: 1
      - action: modbus.write_register
        data:
          hub: "{{ hub }}"
          slave: "{{ slave | int }}"
          address: 2
          value: 0
      - delay:
          seconds: 1
      - action: modbus.write_register
        data:
          hub: "{{ hub }}"
          slave: "{{ slave | int }}"
          address: 12
          value: 0
      - action: script.iv_merkkaa_kirjoitus
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Automaatti
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.iv_kasi_ajo

  iv_kirjoita:
    alias: IV kirjoita puhaltimet
    mode: single
    fields:
      poisto:
        selector:
          number:
      tulo:
        selector:
          number:
    sequence:
      - variables:
          p: "{{ [25, [100, poisto | int(40)] | min] | max }}"
          t: "{{ [25, [100, tulo | int(35)] | min] | max }}"
          hub: "{{ states('input_text.iv_modbus_hub') | trim }}"
          slave: "{{ states('input_number.iv_modbus_slave') | int(1) }}"
      - condition: template
        value_template: >
          {{ p | int != states('input_number.iv_lahetetty_poisto') | int(-1)
             or t | int != states('input_number.iv_lahetetty_tulo') | int(-1) }}
      - action: script.iv_odota_tauko
      - action: modbus.write_register
        data:
          hub: "{{ hub }}"
          slave: "{{ slave | int }}"
          address: 10
          value: "{{ t | int }}"
      - delay:
          seconds: 1
      - action: modbus.write_register
        data:
          hub: "{{ hub }}"
          slave: "{{ slave | int }}"
          address: 11
          value: "{{ p | int }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.iv_lahetetty_tulo
        data:
          value: "{{ t | int }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.iv_lahetetty_poisto
        data:
          value: "{{ p | int }}"
      - action: script.iv_merkkaa_kirjoitus

  iv_automaatti:
    alias: IV automaatti
    mode: single
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Automaatti
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.iv_kasi_ajo
      - action: timer.cancel
        target:
          entity_id: timer.iv_tehostus
        continue_on_error: true

  iv_manuaali:
    alias: IV käsinajo
    mode: single
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Manuaali
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.iv_kasi_ajo
      - action: timer.cancel
        target:
          entity_id: timer.iv_tehostus
        continue_on_error: true
      - action: script.iv_kirjoita
        data:
          poisto: "{{ states('input_number.iv_manuaali_poisto') | float(40) }}"
          tulo: "{{ states('input_number.iv_manuaali_tulo') | float(35) }}"

  iv_tehostus:
    alias: IV tehostus 30 min
    mode: single
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Tehostus
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.iv_kasi_ajo
      - action: input_number.set_value
        target:
          entity_id: input_number.iv_manuaali_poisto
        data:
          value: 70
      - action: input_number.set_value
        target:
          entity_id: input_number.iv_manuaali_tulo
        data:
          value: 70
      - action: timer.start
        target:
          entity_id: timer.iv_tehostus
        data:
          duration: "00:30:00"
      - action: script.iv_kirjoita
        data:
          poisto: 70
          tulo: 70

  iv_pois:
    alias: IV pois / minimipuhallus
    mode: single
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Pois
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.iv_kasi_ajo
      - action: timer.cancel
        target:
          entity_id: timer.iv_tehostus
        continue_on_error: true
      - action: script.iv_kirjoita
        data:
          poisto: 25
          tulo: 25

  iv_sauna:
    alias: IV sauna
    mode: single
    sequence:
      - variables:
          hub: "{{ states('input_text.iv_modbus_hub') | trim }}"
          slave: "{{ states('input_number.iv_modbus_slave') | int(1) }}"
          paalle: "{{ is_state('input_boolean.sauna_tila', 'off') }}"
      - action: script.iv_odota_tauko
      - if:
          - condition: template
            value_template: "{{ paalle }}"
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.sauna_tila
          - action: timer.start
            target:
              entity_id: timer.sauna_tila
            continue_on_error: true
          - action: modbus.write_register
            data:
              hub: "{{ hub }}"
              slave: "{{ slave | int }}"
              address: 56
              value: 1
        else:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.sauna_tila
          - action: timer.cancel
            target:
              entity_id: timer.sauna_tila
            continue_on_error: true
          - action: modbus.write_register
            data:
              hub: "{{ hub }}"
              slave: "{{ slave | int }}"
              address: 56
              value: 0
      - action: script.iv_merkkaa_kirjoitus

automation:
  - id: iv_ohjaus_manuaali_saato
    alias: IV käsi — liukusäädin
    initial_state: true
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - input_number.iv_manuaali_poisto
          - input_number.iv_manuaali_tulo
        for:
          seconds: 3
    condition:
      - condition: state
        entity_id: input_select.iv_ohjaus
        state: Manuaali
      - condition: template
        value_template: >
          {{ trigger.to_state.state not in ['unknown', 'unavailable', ''] }}
    action:
      - action: script.iv_kirjoita
        data:
          poisto: "{{ states('input_number.iv_manuaali_poisto') | float(40) }}"
          tulo: "{{ states('input_number.iv_manuaali_tulo') | float(35) }}"

  - id: iv_tehostus_loppu
    alias: IV tehostus päättyi
    initial_state: true
    trigger:
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.iv_tehostus
    action:
      - action: script.iv_automaatti
