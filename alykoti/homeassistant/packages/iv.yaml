  - id: iv_liukujat_seuraa
    alias: IV liukujat seuraa mitattua
    initial_state: true
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - sensor.airfi_poistoilmapuhallin_nopeus
          - sensor.airfi_tuloilmapuhallin_nopeus
      - platform: state
        entity_id: input_select.iv_ohjaus
      - platform: state
        entity_id:
          - input_number.iv_manuaali_poisto
          - input_number.iv_manuaali_tulo
    condition:
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.iv_ohjaus
            state: Manuaali
    action:
      - variables:
          p_raw: "{{ states('sensor.airfi_poistoilmapuhallin_nopeus') }}"
          t_raw: "{{ states('sensor.airfi_tuloilmapuhallin_nopeus') }}"
          p: "{{ [0, [100, ((p_raw | float(0) / 5) | round(0) * 5)] | min] | max | int }}"
          t: "{{ [0, [100, ((t_raw | float(0) / 5) | round(0) * 5)] | min] | max | int }}"
      - if:
          - condition: template
            value_template: "{{ p_raw not in ['unknown', 'unavailable', 'none', ''] and (states('input_number.iv_manuaali_poisto') | float(-1)) != (p | float) }}"
        then:
          - service: input_number.set_value
            target:
              entity_id: input_number.iv_manuaali_poisto
            data:
              value: "{{ p }}"
      - if:
          - condition: template
            value_template: "{{ t_raw not in ['unknown', 'unavailable', 'none', ''] and (states('input_number.iv_manuaali_tulo') | float(-1)) != (t | float) }}"
        then:
          - service: input_number.set_value
            target:
              entity_id: input_number.iv_manuaali_tulo
            data:
              value: "{{ t }}"

  - id: iv_lampo_saato
    alias: IV lampoasetus kirjoita
    initial_state: true
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - input_number.iv_lampo_asetus
          - input_number.iv_ohitus_asetus
          - input_number.iv_ohitus_ulko
          - input_number.iv_ohitus_viive
          - input_number.iv_poissa_lampo
        for:
          seconds: 1
    condition:
      - condition: template
        value_template: "{{ trigger.to_state.context.user_id is not none }}"
    action:
      - service: script.iv_odota_tauko
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.entity_id == 'input_number.iv_lampo_asetus' }}"
            sequence:
              - service: script.iv_kirjoita_sana
                data:
                  osoite: 4
                  arvo: "{{ [50, [260, (states('input_number.iv_lampo_asetus') | float(21) * 10) | round(0)] | min] | max | int }}"
          - conditions:
              - condition: template
                value_template: "{{ trigger.entity_id == 'input_number.iv_ohitus_asetus' }}"
            sequence:
              - service: script.iv_kirjoita_sana
                data:
                  osoite: 46
                  arvo: "{{ [100, [300, (states('input_number.iv_ohitus_asetus') | float(22) * 10) | round(0)] | min] | max | int }}"
          - conditions:
              - condition: template
                value_template: "{{ trigger.entity_id == 'input_number.iv_ohitus_ulko' }}"
            sequence:
              - service: script.iv_kirjoita_sana
                data:
                  osoite: 47
                  arvo: "{{ 25 if is_state('binary_sensor.iv_ohitus_kielletty', 'on') else [0, [25, states('input_number.iv_ohitus_ulko') | float(12)] | min] | max | int }}"
          - conditions:
              - condition: template
                value_template: "{{ trigger.entity_id == 'input_number.iv_ohitus_viive' }}"
            sequence:
              - service: script.iv_kirjoita_sana
                data:
                  osoite: 48
                  arvo: "{{ [0, [120, states('input_number.iv_ohitus_viive') | float(15)] | min] | max | int }}"
          - conditions:
              - condition: template
                value_template: "{{ trigger.entity_id == 'input_number.iv_poissa_lampo' }}"
            sequence:
              - service: script.iv_kirjoita_sana
                data:
                  osoite: 51
                  arvo: "{{ [50, [260, (states('input_number.iv_poissa_lampo') | float(18) * 10) | round(0)] | min] | max | int }}"
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.iv_modbus_tauko
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  - id: iv_ohitus_suoja
    alias: IV LTO-ohitus kielletty kun lammitetaan
    initial_state: true
    mode: restart
    trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: binary_sensor.iv_ohitus_kielletty
      - platform: time_pattern
        minutes: "/15"
    condition:
      - condition: template
        value_template: >
          {% set want = 25 if is_state('binary_sensor.iv_ohitus_kielletty', 'on')
             else [0, [25, states('input_number.iv_ohitus_ulko') | float(12)] | min] | max | int %}
          {% set have = states('sensor.airfi_ohituksen_ulkoilmaraja') %}
          {{ have in ['unknown', 'unavailable', 'none', '']
             or (have | float(-99) | round(0) | int) != want }}
    action:
      - service: script.iv_odota_tauko
      - service: script.iv_kirjoita_sana
        data:
          osoite: 47
          arvo: "{{ 25 if is_state('binary_sensor.iv_ohitus_kielletty', 'on') else [0, [25, states('input_number.iv_ohitus_ulko') | float(12)] | min] | max | int }}"
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.iv_modbus_tauko
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  - id: iv_lampo_seuraa
    alias: IV lampoasetus seuraa konetta
    initial_state: true
    mode: restart
    trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id:
          - sensor.airfi_lampotila_asetus_luku
          - sensor.airfi_ohituksen_asetuslampotila
          - sensor.airfi_ohituksen_ulkoilmaraja
          - sensor.airfi_ohituksen_viive
          - sensor.airfi_poissa_lampotila
    condition:
      - condition: template
        value_template: "{{ (now().timestamp() - as_timestamp(states('input_datetime.iv_modbus_tauko'), 0) | float(0)) > 90 }}"
    action:
      - variables:
          lampo: "{{ states('sensor.airfi_lampotila_asetus_luku') }}"
          ohitus: "{{ states('sensor.airfi_ohituksen_asetuslampotila') }}"
          ulko: "{{ states('sensor.airfi_ohituksen_ulkoilmaraja') }}"
          viive: "{{ states('sensor.airfi_ohituksen_viive') }}"
          poissa: "{{ states('sensor.airfi_poissa_lampotila') }}"
      - if:
          - condition: template
            value_template: "{{ lampo not in ['unknown', 'unavailable', 'none', ''] }}"
        then:
          - service: input_number.set_value
            target:
              entity_id: input_number.iv_lampo_asetus
            data:
              value: "{{ [5, [26, (lampo | float(21) * 2) | round(0) / 2] | min] | max }}"
      - if:
          - condition: template
            value_template: "{{ ohitus not in ['unknown', 'unavailable', 'none', ''] }}"
        then:
          - service: input_number.set_value
            target:
              entity_id: input_number.iv_ohitus_asetus
            data:
              value: "{{ [10, [30, (ohitus | float(22) * 2) | round(0) / 2] | min] | max }}"
      - if:
          - condition: template
            value_template: >
              {{ ulko not in ['unknown', 'unavailable', 'none', '']
                 and not is_state('binary_sensor.iv_ohitus_kielletty', 'on')
                 and not ((ulko | float(0)) >= 25
                          and (states('input_number.iv_ohitus_ulko') | float(12)) < 25) }}
        then:
          - service: input_number.set_value
            target:
              entity_id: input_number.iv_ohitus_ulko
            data:
              value: "{{ [0, [25, ulko | float(12)] | min] | max | int }}"
      - if:
          - condition: template
            value_template: "{{ viive not in ['unknown', 'unavailable', 'none', ''] }}"
        then:
          - service: input_number.set_value
            target:
              entity_id: input_number.iv_ohitus_viive
            data:
              value: "{{ [0, [120, viive | float(15)] | min] | max | int }}"
      - if:
          - condition: template
            value_template: "{{ poissa not in ['unknown', 'unavailable', 'none', ''] }}"
        then:
          - service: input_number.set_value
            target:
              entity_id: input_number.iv_poissa_lampo
            data:
              value: "{{ [5, [26, (poissa | float(18) * 2) | round(0) / 2] | min] | max }}"
