# iv.yaml — käsinajo + automaatti (CO2 / kosteus / PM).
#
# Yhteys on VAIN configuration.yaml → modbus: !include modbus.yaml
# (hub name: airfi). Tähän tiedostoon EI SAA laittaa `modbus:`-avainta.
#
# TCP-kirjoitus: holding 2 = 0, holding 8 = 1, sitten 10/11.
# Älä kirjoita holding 2 = 1 (tässä koneessa E1).

input_select:
  iv_ohjaus:
    name: IV ohjaus
    options:
      - Automaatti
      - Manuaali
      - Tehostus
      - Pois
    initial: Automaatti
    icon: mdi:fan
  iv_auto_anturit:
    name: IV automaatin anturit
    options:
      - Kaikki kolme
      - CO2 ja PM
      - Kosteus ja PM
      - Kosteus ja CO2
      - Vain CO2
      - Vain PM
      - Vain kosteus
    initial: Kaikki kolme
    icon: mdi:tune-variant

input_boolean:
  iv_modbus_kirjoitus:
    name: IV Modbus-kirjoitus
    icon: mdi:upload-network
    initial: true

input_number:
  iv_manuaali_poisto:
    name: IV käsi poisto
    min: 25
    max: 100
    step: 5
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:fan
    initial: 40
  iv_manuaali_tulo:
    name: IV käsi tulo
    min: 25
    max: 100
    step: 5
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:fan-plus
    initial: 35

input_text:
  iv_co2_entiteetti:
    name: IV CO2-entiteetti
    initial: sensor.iv_co2_skaala
    max: 128
    icon: mdi:molecule-co2
  iv_kosteus_entiteetti:
    name: IV kosteus-entiteetti
    initial: sensor.airfi_kosteus_rh
    max: 128
    icon: mdi:water-percent
  iv_pm_entiteetti:
    name: IV PM-entiteetti
    initial: sensor.iv_pm_skaala
    max: 128
    icon: mdi:air-filter

input_datetime:
  iv_modbus_tauko:
    name: IV viimeisin Modbus-kirjoitus
    has_date: true
    has_time: true

timer:
  iv_tehostus:
    name: IV tehostus
    duration: "00:30:00"
    restore: true

template:
  - sensor:
      - name: IV auto CO2 tavoite
        unique_id: iv_auto_co2_tavoite
        unit_of_measurement: "%"
        availability: |
          {% set e = states('input_text.iv_co2_entiteetti') | trim %}
          {{ e not in ['unknown', 'unavailable', 'none', '']
             and states(e) not in ['unknown', 'unavailable', 'none', ''] }}
        state: |
          {% set e = states('input_text.iv_co2_entiteetti') | trim %}
          {% set s = states(e) | float(0) %}
          {% set raw = s if 'skaala' in e else (35 if s <= 800 else (35 + (s - 800) / 200 * 15 if s <= 1000 else (50 + (s - 1000) / 200 * 20 if s <= 1200 else 70 + ([1, (s - 1200) / 400] | min) * 20))) %}
          {{ [25, [100, ((raw / 5) | round(0) * 5)] | min] | max | int }}

      - name: IV auto kosteus tavoite
        unique_id: iv_auto_kosteus_tavoite
        unit_of_measurement: "%"
        availability: |
          {% set e = states('input_text.iv_kosteus_entiteetti') | trim %}
          {{ e not in ['unknown', 'unavailable', 'none', '']
             and states(e) not in ['unknown', 'unavailable', 'none', ''] }}
        state: |
          {% set e = states('input_text.iv_kosteus_entiteetti') | trim %}
          {% set s = states(e) | float(0) %}
          {% set raw = s if ('skaala' in e or 'bonus' in e) else (35 if s <= 55 else (35 + (s - 55) / 10 * 15 if s <= 65 else (50 + (s - 65) / 10 * 20 if s <= 75 else 70 + ([1, (s - 75) / 15] | min) * 20))) %}
          {{ [25, [100, ((raw / 5) | round(0) * 5)] | min] | max | int }}

      - name: IV auto PM tavoite
        unique_id: iv_auto_pm_tavoite
        unit_of_measurement: "%"
        availability: |
          {% set e = states('input_text.iv_pm_entiteetti') | trim %}
          {{ e not in ['unknown', 'unavailable', 'none', '']
             and states(e) not in ['unknown', 'unavailable', 'none', ''] }}
        state: |
          {% set e = states('input_text.iv_pm_entiteetti') | trim %}
          {% set s = states(e) | float(0) %}
          {% set raw = s if 'skaala' in e else (35 if s <= 12 else (35 + (s - 12) / 13 * 15 if s <= 25 else (50 + (s - 25) / 25 * 20 if s <= 50 else 70 + ([1, (s - 50) / 50] | min) * 20))) %}
          {{ [25, [100, ((raw / 5) | round(0) * 5)] | min] | max | int }}

      - name: IV auto tavoite
        unique_id: iv_auto_tavoite
        unit_of_measurement: "%"
        availability: |
          {% set m = states('input_select.iv_auto_anturit') %}
          {% set ok_c = states('sensor.iv_auto_co2_tavoite') not in ['unknown', 'unavailable', 'none', ''] %}
          {% set ok_k = states('sensor.iv_auto_kosteus_tavoite') not in ['unknown', 'unavailable', 'none', ''] %}
          {% set ok_p = states('sensor.iv_auto_pm_tavoite') not in ['unknown', 'unavailable', 'none', ''] %}
          {{ ('CO2' in m and ok_c) or ('kosteus' in m and ok_k) or ('PM' in m and ok_p) }}
        state: |
          {% set m = states('input_select.iv_auto_anturit') %}
          {% set c = states('sensor.iv_auto_co2_tavoite') | float(-1) %}
          {% set k = states('sensor.iv_auto_kosteus_tavoite') | float(-1) %}
          {% set p = states('sensor.iv_auto_pm_tavoite') | float(-1) %}
          {% set arvot = ([c] if 'CO2' in m and c >= 0 else []) + ([k] if 'kosteus' in m and k >= 0 else []) + ([p] if 'PM' in m and p >= 0 else []) %}
          {{ [25, [100, arvot | max] | min] | max | int if arvot | count > 0 else none }}

      - name: IV auto lahde
        unique_id: iv_auto_lahde
        availability: |
          {{ states('sensor.iv_auto_tavoite') not in ['unknown', 'unavailable', 'none', ''] }}
        state: |
          {% set m = states('input_select.iv_auto_anturit') %}
          {% set t = states('sensor.iv_auto_tavoite') | float(0) %}
          {% set c = states('sensor.iv_auto_co2_tavoite') | float(-1) %}
          {% set k = states('sensor.iv_auto_kosteus_tavoite') | float(-1) %}
          {% set p = states('sensor.iv_auto_pm_tavoite') | float(-1) %}
          {% set nimet = (['CO2'] if 'CO2' in m and c == t else []) + (['kosteus'] if 'kosteus' in m and k == t else []) + (['PM'] if 'PM' in m and p == t else []) %}
          {{ nimet | join(' + ') if nimet | count > 0 else '—' }}

script:
  iv_odota_tauko:
    alias: IV odota ettei väylä jumitu
    mode: single
    sequence:
      - variables:
          viime: "{{ as_timestamp(states('input_datetime.iv_modbus_tauko'), 0) | float(0) }}"
          odota: "{{ [0, 5 - (now().timestamp() - viime)] | max }}"
      - delay:
          seconds: "{{ odota | float(0) }}"

  iv_kirjoita:
    alias: IV kirjoita puhaltimet
    mode: single
    fields:
      poisto:
        selector:
          number:
      tulo:
        selector:
          number:
    sequence:
      - variables:
          p: "{{ [25, [100, (poisto | default(states('input_number.iv_manuaali_poisto'), true) | int(40))] | min] | max }}"
          t: "{{ [25, [100, (tulo | default(states('input_number.iv_manuaali_tulo'), true) | int(35))] | min] | max }}"
      - action: script.iv_odota_tauko
      - action: modbus.write_register
        data:
          hub: airfi
          slave: 1
          address: 2
          value: 0
      - delay:
          milliseconds: 400
      - action: modbus.write_register
        data:
          hub: airfi
          slave: 1
          address: 8
          value: 1
      - delay:
          seconds: 1
      - action: modbus.write_register
        data:
          hub: airfi
          slave: 1
          address: 10
          value: "{{ t | int }}"
      - delay:
          milliseconds: 400
      - action: modbus.write_register
        data:
          hub: airfi
          slave: 1
          address: 11
          value: "{{ p | int }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.iv_modbus_tauko
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  iv_auto_aja:
    alias: IV auto kirjoita tavoite
    mode: single
    sequence:
      - condition: state
        entity_id: input_select.iv_ohjaus
        state: Automaatti
      - variables:
          rh: "{{ states('sensor.airfi_kosteus_rh') | float(50) }}"
          rh_pct: "{{ 35 if rh | float(50) <= 55 else (50 if rh | float(50) <= 65 else (70 if rh | float(50) <= 75 else 90)) }}"
          auto: "{{ states('sensor.iv_auto_tavoite') }}"
          tavoite: "{{ auto | int(rh_pct) if auto not in ['unknown', 'unavailable', 'none', ''] else rh_pct | int }}"
          nyt_p: "{{ states('sensor.airfi_poistoilmapuhallin_nopeus') | float(0) }}"
      - condition: template
        value_template: "{{ (nyt_p | float - tavoite | float) | abs >= 5 }}"
      - action: script.iv_kirjoita
        data:
          poisto: "{{ tavoite }}"
          tulo: "{{ tavoite }}"

  iv_kuittaa:
    alias: IV kuittaa hätäseis
    mode: single
    sequence:
      - action: script.iv_odota_tauko
      - action: modbus.write_register
        data:
          hub: airfi
          slave: 1
          address: 1
          value: 0
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.iv_modbus_tauko
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Automaatti

  iv_automaatti:
    alias: IV automaatti
    mode: single
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Automaatti

  iv_manuaali:
    alias: IV käsinajo
    mode: single
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Manuaali

  iv_tehostus:
    alias: IV tehostus 30 min
    mode: single
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Tehostus

  iv_pois:
    alias: IV pois / minimi
    mode: single
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Pois

  iv_sauna:
    alias: IV sauna
    mode: single
    sequence:
      - variables:
          paalle: "{{ is_state('input_boolean.sauna_tila', 'off') }}"
      - action: script.iv_odota_tauko
      - if:
          - condition: template
            value_template: "{{ paalle }}"
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.sauna_tila
            continue_on_error: true
          - action: timer.start
            target:
              entity_id: timer.sauna_tila
            continue_on_error: true
          - action: modbus.write_register
            data:
              hub: airfi
              slave: 1
              address: 56
              value: 1
        else:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.sauna_tila
            continue_on_error: true
          - action: timer.cancel
            target:
              entity_id: timer.sauna_tila
            continue_on_error: true
          - action: modbus.write_register
            data:
              hub: airfi
              slave: 1
              address: 56
              value: 0
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.iv_modbus_tauko
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  iv_auto_anturit_kytke:
    alias: IV auto anturit kytke
    mode: restart
    sequence:
      - variables:
          valittu: >
            {% set m = {
              'Kaikki kolme': 'automation.iv_auto_co2_kosteus_pm',
              'CO2 ja PM': 'automation.iv_auto_co2_pm',
              'Kosteus ja PM': 'automation.iv_auto_kosteus_pm',
              'Kosteus ja CO2': 'automation.iv_auto_kosteus_co2',
              'Vain CO2': 'automation.iv_auto_vain_co2',
              'Vain PM': 'automation.iv_auto_vain_pm',
              'Vain kosteus': 'automation.iv_auto_vain_kosteus'
            } %}
            {{ m.get(states('input_select.iv_auto_anturit'), 'automation.iv_auto_co2_kosteus_pm') }}
      - action: automation.turn_off
        target:
          entity_id:
            - automation.iv_auto_co2_kosteus_pm
            - automation.iv_auto_co2_pm
            - automation.iv_auto_kosteus_pm
            - automation.iv_auto_kosteus_co2
            - automation.iv_auto_vain_co2
            - automation.iv_auto_vain_pm
            - automation.iv_auto_vain_kosteus
        continue_on_error: true
      - action: automation.turn_on
        target:
          entity_id: "{{ valittu }}"
        continue_on_error: true

automation:
  - id: iv_ohjaus_manuaali_saato
    alias: IV kasi liukusaadin
    initial_state: true
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - input_number.iv_manuaali_poisto
          - input_number.iv_manuaali_tulo
        for:
          seconds: 5
    action:
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Manuaali
      - action: script.iv_kirjoita
        data:
          poisto: "{{ states('input_number.iv_manuaali_poisto') | float(40) }}"
          tulo: "{{ states('input_number.iv_manuaali_tulo') | float(35) }}"

  - id: iv_ohjaus_vaihto
    alias: IV ohjaus vaihto
    initial_state: true
    mode: restart
    trigger:
      - platform: state
        entity_id: input_select.iv_ohjaus
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.iv_ohjaus
                state: Automaatti
            sequence:
              - action: timer.cancel
                target:
                  entity_id: timer.iv_tehostus
                continue_on_error: true
              - action: script.iv_auto_anturit_kytke
                continue_on_error: true
              - action: script.iv_auto_aja
                continue_on_error: true
          - conditions:
              - condition: state
                entity_id: input_select.iv_ohjaus
                state: Manuaali
            sequence:
              - action: timer.cancel
                target:
                  entity_id: timer.iv_tehostus
                continue_on_error: true
              - action: script.iv_kirjoita
                data:
                  poisto: "{{ states('input_number.iv_manuaali_poisto') | float(40) }}"
                  tulo: "{{ states('input_number.iv_manuaali_tulo') | float(35) }}"
          - conditions:
              - condition: state
                entity_id: input_select.iv_ohjaus
                state: Tehostus
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.iv_manuaali_poisto
                data:
                  value: 70
              - action: input_number.set_value
                target:
                  entity_id: input_number.iv_manuaali_tulo
                data:
                  value: 70
              - action: timer.start
                target:
                  entity_id: timer.iv_tehostus
                data:
                  duration: "00:30:00"
              - action: script.iv_kirjoita
                data:
                  poisto: 70
                  tulo: 70
          - conditions:
              - condition: state
                entity_id: input_select.iv_ohjaus
                state: Pois
            sequence:
              - action: timer.cancel
                target:
                  entity_id: timer.iv_tehostus
                continue_on_error: true
              - action: script.iv_kirjoita
                data:
                  poisto: 25
                  tulo: 25

  - id: iv_tehostus_loppu
    alias: IV tehostus päättyi
    initial_state: true
    trigger:
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.iv_tehostus
    action:
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Automaatti

  - id: iv_auto_anturit_kytkin
    alias: IV auto anturit kytkin
    initial_state: true
    mode: restart
    trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: input_select.iv_auto_anturit
    action:
      - action: script.iv_auto_anturit_kytke
      - condition: state
        entity_id: input_select.iv_ohjaus
        state: Automaatti
      - action: script.iv_auto_aja

  - id: iv_auto_co2_kosteus_pm
    alias: IV auto co2 kosteus pm
    initial_state: true
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.iv_auto_tavoite
        for:
          seconds: 30
      - platform: time_pattern
        minutes: "/2"
    condition:
      - condition: state
        entity_id: input_select.iv_ohjaus
        state: Automaatti
      - condition: state
        entity_id: input_select.iv_auto_anturit
        state: Kaikki kolme
    action:
      - action: script.iv_auto_aja

  - id: iv_auto_co2_pm
    alias: IV auto co2 pm
    initial_state: false
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.iv_auto_tavoite
        for:
          seconds: 30
      - platform: time_pattern
        minutes: "/2"
    condition:
      - condition: state
        entity_id: input_select.iv_ohjaus
        state: Automaatti
      - condition: state
        entity_id: input_select.iv_auto_anturit
        state: "CO2 ja PM"
    action:
      - action: script.iv_auto_aja

  - id: iv_auto_kosteus_pm
    alias: IV auto kosteus pm
    initial_state: false
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.iv_auto_tavoite
        for:
          seconds: 30
      - platform: time_pattern
        minutes: "/2"
    condition:
      - condition: state
        entity_id: input_select.iv_ohjaus
        state: Automaatti
      - condition: state
        entity_id: input_select.iv_auto_anturit
        state: "Kosteus ja PM"
    action:
      - action: script.iv_auto_aja

  - id: iv_auto_kosteus_co2
    alias: IV auto kosteus co2
    initial_state: false
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.iv_auto_tavoite
        for:
          seconds: 30
      - platform: time_pattern
        minutes: "/2"
    condition:
      - condition: state
        entity_id: input_select.iv_ohjaus
        state: Automaatti
      - condition: state
        entity_id: input_select.iv_auto_anturit
        state: "Kosteus ja CO2"
    action:
      - action: script.iv_auto_aja

  - id: iv_auto_vain_co2
    alias: IV auto vain co2
    initial_state: false
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.iv_auto_tavoite
        for:
          seconds: 30
      - platform: time_pattern
        minutes: "/2"
    condition:
      - condition: state
        entity_id: input_select.iv_ohjaus
        state: Automaatti
      - condition: state
        entity_id: input_select.iv_auto_anturit
        state: "Vain CO2"
    action:
      - action: script.iv_auto_aja

  - id: iv_auto_vain_pm
    alias: IV auto vain pm
    initial_state: false
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.iv_auto_tavoite
        for:
          seconds: 30
      - platform: time_pattern
        minutes: "/2"
    condition:
      - condition: state
        entity_id: input_select.iv_ohjaus
        state: Automaatti
      - condition: state
        entity_id: input_select.iv_auto_anturit
        state: "Vain PM"
    action:
      - action: script.iv_auto_aja

  - id: iv_auto_vain_kosteus
    alias: IV auto vain kosteus
    initial_state: false
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.iv_auto_tavoite
        for:
          seconds: 30
      - platform: time_pattern
        minutes: "/2"
    condition:
      - condition: state
        entity_id: input_select.iv_ohjaus
        state: Automaatti
      - condition: state
        entity_id: input_select.iv_auto_anturit
        state: "Vain kosteus"
    action:
      - action: script.iv_auto_aja
