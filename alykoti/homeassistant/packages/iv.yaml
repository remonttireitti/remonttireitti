# iv.yaml — VALINNAINEN käsinajo. Tämä EI ole Modbus-yhteys.
#
# Yhteys on VAIN configuration.yaml → modbus: !include modbus.yaml
# (hub name: airfi). Tähän tiedostoon EI SAA laittaa `modbus:`-avainta.
# Toinen hub samaan 192.168.50.26:502 jumittaa HA:n asiakkaan;
# AirFi-sovellus toimii silti, koska se käyttää omaa TCP-istuntoa.
#
# Jos et tarvitse Käsi/Tehostus/Kuittaa, poista tämä tiedosto HA:sta.
# Kirjoitus vain jos input_boolean.iv_modbus_kirjoitus = on (oletus pois).
# Älä kirjoita holding 2 = 1 (tässä koneessa E1).

input_select:
  iv_ohjaus:
    name: IV ohjaus
    options:
      - Automaatti
      - Manuaali
      - Tehostus
      - Pois
    initial: Automaatti
    icon: mdi:fan

input_boolean:
  iv_modbus_kirjoitus:
    name: IV Modbus-kirjoitus
    icon: mdi:upload-network
    initial: false

input_number:
  iv_manuaali_poisto:
    name: IV käsi poisto
    min: 25
    max: 100
    step: 5
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:fan
    initial: 40
  iv_manuaali_tulo:
    name: IV käsi tulo
    min: 25
    max: 100
    step: 5
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:fan-plus
    initial: 35

input_datetime:
  iv_modbus_tauko:
    name: IV viimeisin Modbus-kirjoitus
    has_date: true
    has_time: true

timer:
  iv_tehostus:
    name: IV tehostus
    duration: "00:30:00"
    restore: true

script:
  iv_odota_tauko:
    alias: IV odota ettei väylä jumitu
    mode: single
    sequence:
      - variables:
          viime: "{{ as_timestamp(states('input_datetime.iv_modbus_tauko'), 0) | float(0) }}"
          odota: "{{ [0, 5 - (now().timestamp() - viime)] | max }}"
      - delay:
          seconds: "{{ odota | float(0) }}"

  iv_kirjoita:
    alias: IV kirjoita puhaltimet
    mode: single
    fields:
      poisto:
        selector:
          number:
      tulo:
        selector:
          number:
    sequence:
      - condition: state
        entity_id: input_boolean.iv_modbus_kirjoitus
        state: "on"
      - condition: template
        value_template: >
          {{ states('sensor.airfi_poistoilmapuhallin_nopeus')
             not in ['unknown', 'unavailable', 'none', ''] }}
      - variables:
          p: "{{ [25, [100, poisto | int(40)] | min] | max }}"
          t: "{{ [25, [100, tulo | int(35)] | min] | max }}"
      - action: script.iv_odota_tauko
      - action: modbus.write_register
        data:
          hub: airfi
          slave: 1
          address: 10
          value: "{{ t | int }}"
      - delay:
          seconds: 2
      - action: modbus.write_register
        data:
          hub: airfi
          slave: 1
          address: 11
          value: "{{ p | int }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.iv_modbus_tauko
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  iv_kuittaa:
    alias: IV kuittaa hätäseis
    mode: single
    sequence:
      - condition: state
        entity_id: input_boolean.iv_modbus_kirjoitus
        state: "on"
      - action: script.iv_odota_tauko
      - action: modbus.write_register
        data:
          hub: airfi
          slave: 1
          address: 1
          value: 0
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.iv_modbus_tauko
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Automaatti

  iv_automaatti:
    alias: IV automaatti
    mode: single
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Automaatti
      - action: timer.cancel
        target:
          entity_id: timer.iv_tehostus
        continue_on_error: true

  iv_manuaali:
    alias: IV käsinajo
    mode: single
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Manuaali
      - action: timer.cancel
        target:
          entity_id: timer.iv_tehostus
        continue_on_error: true
      - action: script.iv_kirjoita
        data:
          poisto: "{{ states('input_number.iv_manuaali_poisto') | float(40) }}"
          tulo: "{{ states('input_number.iv_manuaali_tulo') | float(35) }}"

  iv_tehostus:
    alias: IV tehostus 30 min
    mode: single
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Tehostus
      - action: input_number.set_value
        target:
          entity_id: input_number.iv_manuaali_poisto
        data:
          value: 70
      - action: input_number.set_value
        target:
          entity_id: input_number.iv_manuaali_tulo
        data:
          value: 70
      - action: timer.start
        target:
          entity_id: timer.iv_tehostus
        data:
          duration: "00:30:00"
      - action: script.iv_kirjoita
        data:
          poisto: 70
          tulo: 70

  iv_pois:
    alias: IV pois / minimi
    mode: single
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Pois
      - action: timer.cancel
        target:
          entity_id: timer.iv_tehostus
        continue_on_error: true
      - action: script.iv_kirjoita
        data:
          poisto: 25
          tulo: 25

  iv_sauna:
    alias: IV sauna
    mode: single
    sequence:
      - condition: state
        entity_id: input_boolean.iv_modbus_kirjoitus
        state: "on"
      - variables:
          paalle: "{{ is_state('input_boolean.sauna_tila', 'off') }}"
      - action: script.iv_odota_tauko
      - if:
          - condition: template
            value_template: "{{ paalle }}"
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.sauna_tila
            continue_on_error: true
          - action: timer.start
            target:
              entity_id: timer.sauna_tila
            continue_on_error: true
          - action: modbus.write_register
            data:
              hub: airfi
              slave: 1
              address: 56
              value: 1
        else:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.sauna_tila
            continue_on_error: true
          - action: timer.cancel
            target:
              entity_id: timer.sauna_tila
            continue_on_error: true
          - action: modbus.write_register
            data:
              hub: airfi
              slave: 1
              address: 56
              value: 0
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.iv_modbus_tauko
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

automation:
  - id: iv_ohjaus_manuaali_saato
    alias: IV käsi — liukusäädin
    initial_state: true
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - input_number.iv_manuaali_poisto
          - input_number.iv_manuaali_tulo
        for:
          seconds: 5
    condition:
      - condition: state
        entity_id: input_select.iv_ohjaus
        state: Manuaali
      - condition: state
        entity_id: input_boolean.iv_modbus_kirjoitus
        state: "on"
    action:
      - action: script.iv_kirjoita
        data:
          poisto: "{{ states('input_number.iv_manuaali_poisto') | float(40) }}"
          tulo: "{{ states('input_number.iv_manuaali_tulo') | float(35) }}"

  - id: iv_tehostus_loppu
    alias: IV tehostus päättyi
    initial_state: true
    trigger:
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.iv_tehostus
    action:
      - action: script.iv_automaatti
