# iv.yaml
# → config/packages/iv.yaml  (tiedostonimi ILMAN yhdysviivaa)
#
# TÄMÄ KONE ON MODBUS TCP. Älä kirjoita holding 2 = 1 — se tekee E1:n.
# Testattu polku: h2=0, h8=1, sitten h10=tulo ja h11=poisto.
#
# Lukemat: sensor.iv_poisto_prosentti / sensor.iv_tulo_prosentti
# (input 3x00012 / 3x00013). Jos ne näyttää 0 tai jumissa → E1 päällä.
# Paina kortista Kuittaa, sitten koneen paneelista hätäseis pois.

input_select:
  iv_ohjaus:
    name: IV ohjaus
    options:
      - Automaatti
      - Manuaali
      - Tehostus
      - Pois
    initial: Automaatti
    icon: mdi:fan

input_boolean:
  iv_kasi_ajo:
    name: IV käsinajo
    icon: mdi:gesture-tap

input_text:
  iv_modbus_hub:
    name: IV Modbus-hub
    initial: airfi
    max: 40
    icon: mdi:lan

input_number:
  iv_modbus_slave:
    name: IV Modbus-slave
    min: 1
    max: 247
    step: 1
    mode: box
    icon: mdi:numeric
    initial: 1
  iv_manuaali_poisto:
    name: IV käsi poisto
    min: 25
    max: 100
    step: 5
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:fan
    initial: 40
  iv_manuaali_tulo:
    name: IV käsi tulo
    min: 25
    max: 100
    step: 5
    mode: slider
    unit_of_measurement: "%"
    icon: mdi:fan-plus
    initial: 35

timer:
  iv_tehostus:
    name: IV tehostus
    duration: "00:30:00"
    restore: true

script:
  iv_kuittaa:
    alias: IV kuittaa E1 / hätäseis
    mode: single
    sequence:
      - variables:
          hub: "{{ states('input_text.iv_modbus_hub') | trim }}"
          slave: "{{ states('input_number.iv_modbus_slave') | int(1) }}"
      - action: modbus.write_register
        data:
          hub: "{{ hub }}"
          slave: "{{ slave | int }}"
          address: 8
          value: 0
      - delay:
          milliseconds: 150
      - action: modbus.write_register
        data:
          hub: "{{ hub }}"
          slave: "{{ slave | int }}"
          address: 1
          value: 0
      - delay:
          milliseconds: 150
      - action: modbus.write_register
        data:
          hub: "{{ hub }}"
          slave: "{{ slave | int }}"
          address: 3
          value: 0
      - delay:
          milliseconds: 150
      - action: modbus.write_register
        data:
          hub: "{{ hub }}"
          slave: "{{ slave | int }}"
          address: 10
          value: 0
      - delay:
          milliseconds: 150
      - action: modbus.write_register
        data:
          hub: "{{ hub }}"
          slave: "{{ slave | int }}"
          address: 11
          value: 0
      - delay:
          milliseconds: 150
      - action: modbus.write_register
        data:
          hub: "{{ hub }}"
          slave: "{{ slave | int }}"
          address: 2
          value: 0
      - delay:
          milliseconds: 150
      - action: modbus.write_register
        data:
          hub: "{{ hub }}"
          slave: "{{ slave | int }}"
          address: 12
          value: 0
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Automaatti
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.iv_kasi_ajo

  iv_valmistele:
    alias: IV TCP-valmistelu (ei suoraohjausta)
    mode: single
    sequence:
      - variables:
          hub: "{{ states('input_text.iv_modbus_hub') | trim }}"
          slave: "{{ states('input_number.iv_modbus_slave') | int(1) }}"
      - action: modbus.write_register
        data:
          hub: "{{ hub }}"
          slave: "{{ slave | int }}"
          address: 1
          value: 0
      - delay:
          milliseconds: 150
      - action: modbus.write_register
        data:
          hub: "{{ hub }}"
          slave: "{{ slave | int }}"
          address: 2
          value: 0
      - delay:
          milliseconds: 150
      - action: modbus.write_register
        data:
          hub: "{{ hub }}"
          slave: "{{ slave | int }}"
          address: 12
          value: "{{ 1 if is_state('input_select.iv_ohjaus', 'Pois') else 0 }}"
      - delay:
          milliseconds: 150
      - action: modbus.write_register
        data:
          hub: "{{ hub }}"
          slave: "{{ slave | int }}"
          address: 3
          value: 0
      - delay:
          milliseconds: 150
      - action: modbus.write_register
        data:
          hub: "{{ hub }}"
          slave: "{{ slave | int }}"
          address: 8
          value: 1
      - delay:
          seconds: 1

  iv_kirjoita:
    alias: IV kirjoita puhaltimet
    mode: queued
    max: 5
    fields:
      poisto:
        selector:
          number:
      tulo:
        selector:
          number:
    sequence:
      - variables:
          p: "{{ [25, [100, poisto | int(40)] | min] | max }}"
          t: "{{ [25, [100, tulo | int(35)] | min] | max }}"
          hub: "{{ states('input_text.iv_modbus_hub') | trim }}"
          slave: "{{ states('input_number.iv_modbus_slave') | int(1) }}"
      - action: modbus.write_register
        data:
          hub: "{{ hub }}"
          slave: "{{ slave | int }}"
          address: 10
          value: "{{ t | int }}"
      - delay:
          milliseconds: 150
      - action: modbus.write_register
        data:
          hub: "{{ hub }}"
          slave: "{{ slave | int }}"
          address: 11
          value: "{{ p | int }}"

  iv_automaatti:
    alias: IV automaatti
    mode: single
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Automaatti
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.iv_kasi_ajo
      - action: timer.cancel
        target:
          entity_id: timer.iv_tehostus
        continue_on_error: true
      - variables:
          hub: "{{ states('input_text.iv_modbus_hub') | trim }}"
          slave: "{{ states('input_number.iv_modbus_slave') | int(1) }}"
      - action: modbus.write_register
        data:
          hub: "{{ hub }}"
          slave: "{{ slave | int }}"
          address: 2
          value: 0
      - delay:
          milliseconds: 150
      - action: modbus.write_register
        data:
          hub: "{{ hub }}"
          slave: "{{ slave | int }}"
          address: 12
          value: 0

  iv_manuaali:
    alias: IV käsinajo
    mode: restart
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Manuaali
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.iv_kasi_ajo
      - action: timer.cancel
        target:
          entity_id: timer.iv_tehostus
        continue_on_error: true
      - action: script.iv_valmistele
      - action: script.iv_kirjoita
        data:
          poisto: "{{ states('input_number.iv_manuaali_poisto') | float(40) }}"
          tulo: "{{ states('input_number.iv_manuaali_tulo') | float(35) }}"

  iv_tehostus:
    alias: IV tehostus 30 min
    mode: restart
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Tehostus
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.iv_kasi_ajo
      - action: input_number.set_value
        target:
          entity_id: input_number.iv_manuaali_poisto
        data:
          value: 70
      - action: input_number.set_value
        target:
          entity_id: input_number.iv_manuaali_tulo
        data:
          value: 70
      - action: timer.start
        target:
          entity_id: timer.iv_tehostus
        data:
          duration: "00:30:00"
      - action: script.iv_valmistele
      - action: script.iv_kirjoita
        data:
          poisto: 70
          tulo: 70

  iv_pois:
    alias: IV pois / minimipuhallus
    mode: single
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.iv_ohjaus
        data:
          option: Pois
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.iv_kasi_ajo
      - action: timer.cancel
        target:
          entity_id: timer.iv_tehostus
        continue_on_error: true
      - action: script.iv_valmistele
      - action: script.iv_kirjoita
        data:
          poisto: 25
          tulo: 25

  iv_sauna:
    alias: IV sauna
    mode: restart
    sequence:
      - variables:
          hub: "{{ states('input_text.iv_modbus_hub') | trim }}"
          slave: "{{ states('input_number.iv_modbus_slave') | int(1) }}"
      - if:
          - condition: state
            entity_id: input_boolean.sauna_tila
            state: "on"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.sauna_tila
          - action: timer.cancel
            target:
              entity_id: timer.sauna_tila
            continue_on_error: true
          - action: modbus.write_register
            data:
              hub: "{{ hub }}"
              slave: "{{ slave | int }}"
              address: 56
              value: 0
        else:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.sauna_tila
          - action: timer.start
            target:
              entity_id: timer.sauna_tila
            continue_on_error: true
          - action: modbus.write_register
            data:
              hub: "{{ hub }}"
              slave: "{{ slave | int }}"
              address: 56
              value: 1

automation:
  - id: iv_ohjaus_manuaali_saato
    alias: IV käsi — liukusäädin
    initial_state: true
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - input_number.iv_manuaali_poisto
          - input_number.iv_manuaali_tulo
    condition:
      - condition: state
        entity_id: input_select.iv_ohjaus
        state: Manuaali
      - condition: template
        value_template: >
          {{ trigger.to_state.state not in ['unknown', 'unavailable', ''] }}
    action:
      - delay:
          milliseconds: 400
      - action: script.iv_kirjoita
        data:
          poisto: "{{ states('input_number.iv_manuaali_poisto') | float(40) }}"
          tulo: "{{ states('input_number.iv_manuaali_tulo') | float(35) }}"

  - id: iv_tehostus_loppu
    alias: IV tehostus päättyi
    initial_state: true
    trigger:
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.iv_tehostus
    action:
      - action: script.iv_automaatti
