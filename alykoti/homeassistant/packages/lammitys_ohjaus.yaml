automation:
  - id: lammitys_olohuone_keittio
    alias: Lämmitys olohuone ja keittiö
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/3"
      - platform: state
        entity_id:
          - sensor.vilp_ohjaus_lampotilat_air_temperature_13
          - binary_sensor.terassi_ovi_contact
          - input_select.lammitys_tila_olohuone_keittio
          - timer.lammitys_korotus_olohuone_keittio
          - sensor.lammitys_kaytto_olohuone_keittio
          - sensor.lammitys_tavoite_olohuone_keittio
          - input_number.lammitys_korotus_olohuone_keittio
    action:
      - variables:
          lampo: >
            {% if is_state('input_select.lammitys_tila_olohuone_keittio', 'Pois') %}17
            {% elif is_state('timer.lammitys_korotus_olohuone_keittio', 'active') %}
              {% set t = states('sensor.lammitys_tavoite_olohuone_keittio') %}
              {% set base = t | float(20) if t not in ['unknown','unavailable','none',''] else 20 %}
              {% set k = states('input_number.lammitys_korotus_olohuone_keittio') | float(1.5) %}
              {{ [base + k, 30] | min | round(1) }}
            {% elif states('sensor.vilp_ohjaus_lampotilat_air_temperature_13') | float(0) <= 25 %}17
            {% elif is_state('binary_sensor.lammitys_terassi_auki', 'on') %}17
            {% else %}{{ states('sensor.lammitys_kaytto_olohuone_keittio') | float(20) }}
            {% endif %}
      - action: script.lammitys_aseta_termostaatti
        data:
          climates:
            - climate.olohuone_lattialammitys
            - climate.keittio_lattialammitys
          temperature: "{{ lampo }}"
  - id: lammitys_hm
    alias: Lämmitys HM
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/3"
      - platform: state
        entity_id:
          - sensor.vilp_ohjaus_lampotilat_air_temperature_13
          - binary_sensor.hm_ikkunatunnistin_contact
          - input_select.lammitys_tila_hm
          - timer.lammitys_korotus_hm
          - sensor.lammitys_kaytto_hm
          - sensor.lammitys_tavoite_hm
          - input_number.lammitys_korotus_hm
    action:
      - variables:
          lampo: >
            {% if is_state('input_select.lammitys_tila_hm', 'Pois') %}17
            {% elif is_state('timer.lammitys_korotus_hm', 'active') %}
              {% set t = states('sensor.lammitys_tavoite_hm') %}
