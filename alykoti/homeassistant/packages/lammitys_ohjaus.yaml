  - id: lammitys_korjaa_away
    alias: Lämmitys korjaa Away-esiasetus
    mode: queued
    trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: state
        entity_id:
          - climate.olohuone_lattialammitys
          - climate.keittio_lattialammitys
          - climate.hm_lattialammitys
          - climate.makuhuone_lattialammitys
          - climate.glen_lattialammitys
          - climate.nele_lattialammitys
          - climate.eteisen_lattialammitys
        attribute: preset_mode
      - platform: state
        entity_id:
          - climate.olohuone_lattialammitys
          - climate.keittio_lattialammitys
          - climate.hm_lattialammitys
          - climate.makuhuone_lattialammitys
          - climate.glen_lattialammitys
          - climate.nele_lattialammitys
          - climate.eteisen_lattialammitys
        attribute: temperature
    action:
      - variables:
          zones:
            - entity: climate.olohuone_lattialammitys
              tila: input_select.lammitys_tila_olohuone_keittio
              kaytto: sensor.lammitys_kaytto_olohuone_keittio
            - entity: climate.keittio_lattialammitys
              tila: input_select.lammitys_tila_olohuone_keittio
              kaytto: sensor.lammitys_kaytto_olohuone_keittio
            - entity: climate.hm_lattialammitys
              tila: input_select.lammitys_tila_hm
              kaytto: sensor.lammitys_kaytto_hm
            - entity: climate.makuhuone_lattialammitys
              tila: input_select.lammitys_tila_makuhuone
              kaytto: sensor.lammitys_kaytto_makuhuone
            - entity: climate.glen_lattialammitys
              tila: input_select.lammitys_tila_glen
              kaytto: sensor.lammitys_kaytto_glen
            - entity: climate.nele_lattialammitys
              tila: input_select.lammitys_tila_nele
              kaytto: sensor.lammitys_kaytto_nele
            - entity: climate.eteisen_lattialammitys
              tila: input_select.lammitys_tila_eteinen
              kaytto: sensor.lammitys_kaytto_eteinen
      - repeat:
          for_each: "{{ zones }}"
          sequence:
            - variables:
                eid: "{{ repeat.item.entity }}"
                preset: "{{ state_attr(repeat.item.entity, 'preset_mode') | default('') | lower }}"
                ohjaus: "{{ states(repeat.item.tila) }}"
                tavoite: >
                  {% if repeat.item.entity in ['climate.olohuone_lattialammitys', 'climate.keittio_lattialammitys']
                       and not is_state('binary_sensor.lammitys_halpa_sahko', 'on')
                       and not is_state('timer.lammitys_korotus_olohuone_keittio', 'active') %}
                    {% set t = states('input_number.lammitys_lattia_tausta_olokeittio') | float(18) %}
                    {% set drop = states('input_number.lammitys_hetki_huone_lasku') | float(2) if is_state('binary_sensor.lammitys_hetki_rajoita_huone', 'on') else 0 %}
                    {{ [t - drop, 17] | max }}
                  {% else %}
                    {{ states(repeat.item.kaytto) | float(20) }}
                  {% endif %}
                termo: "{{ state_attr(repeat.item.entity, 'temperature') | float(99) }}"
            - if:
                - condition: template
                  value_template: >
                    {{ ohjaus == 'Automaatti' and (
                      preset == 'away' or
                      (
                        repeat.item.entity == 'climate.nele_lattialammitys' and
                        termo < 19 and
                        tavoite >= 19 and
                        is_state('binary_sensor.lammitys_nele_ikkuna_auki', 'off')
                      )
                    ) }}
              then:
                - action: script.lammitys_aseta_termostaatti
                  data:
                    climates:
                      - "{{ eid }}"
                    temperature: "{{ tavoite }}"

  - id: lammitys_ohjaus_loki
    alias: Lämmitys ohjaus loki
    description: Kirjaa tilan vaihdon ja syyn lokiin. Älä aja käsin.
    mode: queued
    max: 20
    trigger:
      - platform: state
        entity_id: sensor.lammitys_ohjaus_tila
    condition:
      - condition: template
        value_template: "{{ trigger.from_state is none or trigger.from_state.state != trigger.to_state.state }}"
    action:
      - action: logbook.log
        data:
          name: Lämmitys ohjaus
          entity_id: sensor.lammitys_ohjaus_tila
          message: >
            {{ trigger.to_state.state }} — {{ trigger.to_state.attributes.syy | default(states('sensor.lammitys_ohjaus_tila')) }}
            {%- if trigger.from_state is not none and trigger.from_state.state not in ['unknown', 'unavailable', 'none', ''] %}
             (ennen {{ trigger.from_state.state }})
            {%- endif %}

  - id: lammitys_sekoitus
    alias: Lämmitys sekoitus climate.lattialammitys
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/3"
      - platform: homeassistant
        event: start
      - platform: state
        entity_id:
          - sensor.ulkolampotila_met_no
          - sensor.energi_data_service
          - sensor.vilp_ohjaus_lampotilat_air_temperature_8
          - sensor.lammitys_sekoitus_kaytto
    action:
      - variables:
          kv_ok: "{{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_8') | float(0) > 55 }}"
          lampo: "{{ states('sensor.lammitys_sekoitus_kaytto') | float(35) }}"
      - action: script.lammitys_aseta_sekoitus
        data:
          active: "{{ kv_ok }}"
          temperature: "{{ lampo }}"

  - id: lammitys_sekoituspumppu
    alias: Lämmitys sekoituspumppu pulssi
    mode: queued
    max: 8
    trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: timer.lammitys_sekoitus_pulssi
        from: active
        to: idle
        id: pulssi_loppu
      - platform: state
        entity_id: timer.lammitys_sekoitus_odota
        from: active
        to: idle
        id: odota_loppu
      - platform: state
        entity_id: sensor.vilp_ohjaus_lampotilat_air_temperature_8
        id: kv
      - platform: state
        entity_id:
          - sensor.vilp_ohjaus_lampotilat_air_temperature_10
          - sensor.vilp_ohjaus_lampotilat_air_temperature_13
          - sensor.lammitys_sekoitus_kaytto
          - switch.sonoff_4_ch_pro_2_tasmota2
          - switch.sonoff_4_ch_pro_2_tasmota3
          - switch.sonoff_4_ch_pro_2_tasmota4
          - input_text.lammitys_sekoituspumppu
          - input_number.lammitys_menovesi_hystereesi
          - input_number.lammitys_kayra_meno_max
          - input_number.lammitys_kv_pumppu_paalle
          - input_number.lammitys_kv_pumppu_pois
          - input_number.lammitys_aurinko_varo
          - input_number.lammitys_aurinko_teho_raja
          - binary_sensor.lammitys_aurinko_lammittaa
    action:
      - variables:
          pump_e: >
            {% set c = states('input_text.lammitys_sekoituspumppu') | trim %}
            {{ 'switch.sonoff_4_ch_pro_2_tasmota4' if c in ['unknown', 'unavailable', 'none', '', 'switch.sonoff_4_ch_pro_2'] else c }}
          tank_s: "{{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_13') }}"
          tank: "{{ tank_s | float(none) }}"
          kv: "{{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_8') | float(0) }}"
          kv_ennen: "{{ states('input_number.lammitys_kv_ennen_pulssia') | float(0) }}"
          tavoite: "{{ states('sensor.lammitys_sekoitus_kaytto') | float(35) }}"
          hyst: "{{ states('input_number.lammitys_menovesi_hystereesi') | float(1) }}"
          delta: "{{ [states('input_number.lammitys_menovesi_hystereesi') | float(1), 1.5] | max }}"
          katto: "{{ states('input_number.lammitys_kayra_meno_max') | float(48) }}"
          kv_on: "{{ states('input_number.lammitys_kv_pumppu_paalle') | float(58) }}"
          kv_off: "{{ [states('input_number.lammitys_kv_pumppu_pois') | float(56), (states('input_number.lammitys_kv_pumppu_paalle') | float(58)) - 0.5] | min }}"
          max_lasku: "{{ states('input_number.lammitys_kv_pulse_max_lasku') | float(1) }}"
          lasku_nyt: "{{ ((states('input_number.lammitys_kv_ennen_pulssia') | float(0)) - (states('sensor.vilp_ohjaus_lampotilat_air_temperature_8') | float(0))) | round(2) }}"
          solar_block: "{{ 1 if (is_state('binary_sensor.lammitys_aurinko_lammittaa', 'on') and (states('sensor.aurinkolampo_teho_kw') | float(0) >= (states('input_number.lammitys_aurinko_teho_raja') | float(0.8)))) else 0 }}"
          solar_extra: "{{ states('input_number.lammitys_aurinko_varo') | float(2.5) if is_state('binary_sensor.lammitys_aurinko_lammittaa', 'on') else 0 }}"
          tank_ok: "{{ 1 if tank_s not in ['unknown', 'unavailable', 'none', ''] else 0 }}"
          pulssi: "{{ 1 if is_state('timer.lammitys_sekoitus_pulssi', 'active') else 0 }}"
          odottaa: "{{ 1 if is_state('timer.lammitys_sekoitus_odota', 'active') else 0 }}"
          nosta: >
            {{ 1 if (solar_block | int(0) == 0)
               and (tank_ok | int(0) == 1)
               and (kv | float(0) >= (kv_on | float(58)))
               and (kv | float(0) >= ((tank | float(0)) + (delta | float(1.5))))
               and (tank | float(99) < (katto | float(48)))
               and (tank | float(99) < ((tavoite | float(35)) - (hyst | float(1)) - (solar_extra | float(0))))
               else 0 }}
          kv_abort: >
            {{ 1 if (kv | float(0) <= (kv_off | float(56)))
               or ((pulssi | int(0) == 1) and (lasku_nyt | float(0) >= (max_lasku | float(1))))
               else 0 }}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ (pulssi | int(0) == 1) and (kv_abort | int(0) == 1) }}"
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.lammitys_kv_viime_lasku
                data:
                  value: "{{ lasku_nyt | float(0) }}"
              - action: script.lammitys_sekoitus_pulssi_loppu
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'pulssi_loppu' }}"
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.lammitys_kv_viime_lasku
                data:
                  value: "{{ lasku_nyt | float(0) }}"
              - action: script.lammitys_sekoitus_pulssi_loppu
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'odota_loppu' }}"
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.lammitys_kv_viime_lasku
                data:
                  value: "{{ lasku_nyt | float(0) }}"
              - action: script.lammitys_aseta_sekoituspumppu
                data:
                  paalle: false
              - if:
                  - condition: template
                    value_template: "{{ (nosta | int(0) == 1) and (lasku_nyt | float(0) < (max_lasku | float(1))) }}"
                then:
                  - action: script.lammitys_sekoitus_pulssi_alku
          - conditions:
              - condition: template
                value_template: "{{ odottaa | int(0) == 1 }}"
            sequence:
              - action: script.lammitys_aseta_sekoituspumppu
                data:
                  paalle: false
          - conditions:
              - condition: template
                value_template: "{{ pulssi | int(0) == 1 }}"
            sequence:
              - action: script.lammitys_aseta_sekoituspumppu
                data:
                  paalle: true
          - conditions:
              - condition: template
                value_template: "{{ nosta | int(0) == 1 }}"
            sequence:
              - action: script.lammitys_sekoitus_pulssi_alku
        default:
          - action: script.lammitys_aseta_sekoituspumppu
            data:
              paalle: false

  - id: lammitys_aurinkopumppu
    alias: Aurinkolämpöpumppu
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/3"
      - platform: state
        entity_id:
          - sensor.nele_ja_keittio_lattialammitys_anturit_air_temperature_8
          - sensor.vilp_ohjaus_lampotilat_air_temperature_13
          - input_select.lammitys_aurinkopumppu
    action:
      - variables:
          tila: "{{ states('input_select.lammitys_aurinkopumppu') }}"
          solar: "{{ states('sensor.nele_ja_keittio_lattialammitys_anturit_air_temperature_8') | float(0) }}"
          tank: "{{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_13') | float(0) }}"
          diff: "{{ solar - tank }}"
          pump: switch.sonoff_4_ch_pro_2_tasmota3
      - choose:
          - conditions: "{{ tila == 'Pois' }}"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: "{{ pump }}"
          - conditions: "{{ tila == 'Pakko päälle' }}"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: "{{ pump }}"
        default:
          - choose:
              - conditions: "{{ diff | float(0) > 7 }}"
                sequence:
                  - action: switch.turn_on
                    target:
                      entity_id: "{{ pump }}"
            default:
              - action: switch.turn_off
                target:
                  entity_id: "{{ pump }}"

  - id: lammitys_pumppu
    alias: Lattialämmityspumppu päälle/pois
    mode: restart
    trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: state
        entity_id: binary_sensor.lammitys_ll_tarve
      - platform: state
        entity_id:
          - switch.pannuhuone_lapivirtausvastus
          - timer.lammitys_ll_pumppu_viive
          - timer.lammitys_vastus_pulssi
          - timer.lammitys_vastus_odota
      - platform: state
        entity_id:
          - switch.eteisen_lattialammitys
          - switch.nele_ja_keittio_lattialammitys_anturit
          - switch.olohuone_hm_lattialammitys_6
          - switch.makuhuone_glen_lattialammitys
          - switch.olohuone_hm_lattialammitys
          - switch.makuhuone_glen_lattialammitys_6
          - switch.nele_ja_keittio_lattialammitys_anturit_6
      - platform: state
        entity_id:
          - climate.olohuone_lattialammitys
          - climate.keittio_lattialammitys
          - climate.hm_lattialammitys
          - climate.makuhuone_lattialammitys
          - climate.glen_lattialammitys
          - climate.nele_lattialammitys
          - climate.eteisen_lattialammitys
        attribute: hvac_action
    action:
      - variables:
          tarve: "{{ is_state('binary_sensor.lammitys_ll_tarve', 'on') }}"
          vastus_kaytossa: >
            {{ is_state('switch.pannuhuone_lapivirtausvastus', 'on')
               or is_state('timer.lammitys_vastus_pulssi', 'active')
               or is_state('timer.lammitys_vastus_odota', 'active') }}
      - choose:
          - conditions: "{{ tarve }}"
            sequence:
              - action: timer.cancel
                target:
                  entity_id: timer.lammitys_ll_pumppu_viive
                continue_on_error: true
              - action: switch.turn_on
                target:
                  entity_id: switch.sonoff_4_ch_pro_2_tasmota2
        default:
          - action: script.lammitys_vastus_pois
          - choose:
              - conditions: "{{ vastus_kaytossa or is_state('timer.lammitys_ll_pumppu_viive', 'active') }}"
                sequence:
                  - action: switch.turn_on
                    target:
                      entity_id: switch.sonoff_4_ch_pro_2_tasmota2
                  - if:
                      - condition: state
                        entity_id: timer.lammitys_ll_pumppu_viive
                        state: idle
                    then:
                      - action: timer.start
                        target:
                          entity_id: timer.lammitys_ll_pumppu_viive
                        data:
                          duration: "{{ states('input_number.lammitys_ll_pumppu_viive_s') | int(120) }}"
            default:
              - action: switch.turn_off
                target:
                  entity_id: switch.sonoff_4_ch_pro_2_tasmota2

  - id: lammitys_ll_pumppu_viive_loppu
    alias: Lattialämmityspumppu poisviive loppu
    mode: single
    trigger:
      - platform: state
        entity_id: timer.lammitys_ll_pumppu_viive
        from: active
        to: idle
    action:
      - if:
          - condition: state
            entity_id: binary_sensor.lammitys_ll_tarve
            state: "off"
        then:
          - action: script.lammitys_vastus_pois
          - action: switch.turn_off
            target:
              entity_id: switch.sonoff_4_ch_pro_2_tasmota2

  - id: lammitys_vastus_hata
    alias: Lämmitys vastus hätäpois
    mode: restart
    trigger:
      - platform: time_pattern
        seconds: "/10"
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: switch.sonoff_4_ch_pro_2_tasmota2
        to: "off"
      - platform: state
        entity_id:
          - switch.pannuhuone_lapivirtausvastus
          - binary_sensor.lammitys_ll_tarve
          - binary_sensor.lammitys_vastus_sallittu
          - binary_sensor.lammitys_hetki_rajoita_vesi
          - sensor.vilp_ohjaus_lampotilat_air_temperature_10
          - input_select.lammitys_vastus
    action:
      - variables:
          vastus_on: "{{ 1 if is_state('switch.pannuhuone_lapivirtausvastus', 'on') else 0 }}"
          pulssi: "{{ 1 if is_state('timer.lammitys_vastus_pulssi', 'active') else 0 }}"
          odottaa: "{{ 1 if is_state('timer.lammitys_vastus_odota', 'active') else 0 }}"
          kielletty: >
            {{ 1 if is_state('input_select.lammitys_vastus', 'Pois')
               or is_state('binary_sensor.lammitys_hetki_rajoita_vesi', 'on')
               or not is_state('switch.sonoff_4_ch_pro_2_tasmota2', 'on')
               or not is_state('binary_sensor.lammitys_ll_tarve', 'on')
               or (states('sensor.vilp_ohjaus_lampotilat_air_temperature_10') | float(0) >= (states('input_number.lammitys_kayra_meno_max') | float(48)))
               or (is_state('timer.lammitys_vastus_pulssi', 'active')
                   and (((states('sensor.vilp_ohjaus_lampotilat_air_temperature_10') | float(0)) - (states('input_number.lammitys_vastus_meno_ennen') | float(0))) >= (states('input_number.lammitys_vastus_max_nousu') | float(1.5))))
               else 0 }}
          jumissa: >
            {% set e = states.switch.pannuhuone_lapivirtausvastus %}
            {{ 1 if is_state('switch.pannuhuone_lapivirtausvastus', 'on')
               and not is_state('timer.lammitys_vastus_pulssi', 'active')
               and not is_state('timer.lammitys_vastus_odota', 'active')
               and e is not none
               and (as_timestamp(now()) - as_timestamp(e.last_changed)) > 8
               else 0 }}
      - choose:
          - conditions: "{{ trigger.platform == 'homeassistant' }}"
            sequence:
              - action: script.lammitys_vastus_pois
          - conditions: "{{ (vastus_on | int(0) == 1) and ((kielletty | int(0) == 1) or (jumissa | int(0) == 1)) }}"
            sequence:
              - action: script.lammitys_vastus_pois
          - conditions: "{{ (pulssi | int(0) == 1) and not is_state('binary_sensor.lammitys_vastus_sallittu', 'on') }}"
            sequence:
              - action: script.lammitys_vastus_pois

  - id: lammitys_vastus
    alias: Lämmitys läpivirtausvastus pulssi
    mode: queued
    max: 8
    trigger:
      - platform: time_pattern
        seconds: "/15"
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: timer.lammitys_vastus_pulssi
        from: active
        to: idle
        id: pulssi_loppu
      - platform: state
        entity_id: timer.lammitys_vastus_odota
        from: active
        to: idle
        id: odota_loppu
      - platform: state
        entity_id:
          - binary_sensor.lammitys_vastus_sallittu
          - binary_sensor.lammitys_ll_pumppu_valmis
          - switch.sonoff_4_ch_pro_2_tasmota2
          - binary_sensor.lammitys_ll_tarve
          - input_select.lammitys_vastus
    action:
      - variables:
          sallittu: "{{ 1 if is_state('binary_sensor.lammitys_vastus_sallittu', 'on') else 0 }}"
          pulssi: "{{ 1 if is_state('timer.lammitys_vastus_pulssi', 'active') else 0 }}"
          odottaa: "{{ 1 if is_state('timer.lammitys_vastus_odota', 'active') else 0 }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.platform == 'homeassistant' }}"
            sequence:
              - action: script.lammitys_vastus_pois
          - conditions:
              - condition: template
                value_template: "{{ sallittu | int(0) == 0 }}"
            sequence:
              - action: script.lammitys_vastus_pois
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'pulssi_loppu' }}"
            sequence:
              - action: script.lammitys_vastus_pulssi_loppu
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'odota_loppu' }}"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ sallittu | int(0) == 1 }}"
                then:
                  - action: script.lammitys_vastus_pulssi_alku
                else:
                  - action: script.lammitys_vastus_pois
          - conditions:
              - condition: template
                value_template: "{{ odottaa | int(0) == 1 }}"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.pannuhuone_lapivirtausvastus
                continue_on_error: true
          - conditions:
              - condition: template
                value_template: "{{ pulssi | int(0) == 1 }}"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.pannuhuone_lapivirtausvastus
                continue_on_error: true
          - conditions:
              - condition: template
                value_template: "{{ sallittu | int(0) == 1 }}"
            sequence:
              - action: script.lammitys_vastus_pulssi_alku
        default:
          - action: script.lammitys_vastus_pois
