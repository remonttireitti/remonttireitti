            {% set base = state_attr('climate.glen_lattialammitys', 'temperature') | float(20) %}
          {% else %}
            {% set base = base_s | float(20) %}
          {% endif %}
          {% set korotus = states('input_number.lammitys_korotus_glen') | float(0) %}
          {% if is_state('timer.lammitys_korotus_glen', 'active') %}
            {{ [base + korotus, 30] | min | round(1) }}
          {% elif 'Glen' in (state_attr('binary_sensor.lammitys_huone_alaraja', 'huoneet') | default('')) %}
            {{ [base, 19] | max | round(1) }}
          {% elif is_state('binary_sensor.lammitys_hetki_rajoita_huone', 'on') %}
