          - input_number.lammitys_korotus_olohuone_keittio
          - binary_sensor.lammitys_halpa_sahko
          - input_number.lammitys_hinta_lattia_raja
          - input_number.lammitys_lattia_tausta_olokeittio
          - binary_sensor.lammitys_hetki_rajoita_huone
          - input_number.lammitys_hetki_huone_lasku
    action:
      - variables:
          lampo: >
            {% if is_state('input_select.lammitys_tila_olohuone_keittio', 'Pois') %}17
            {% elif is_state('timer.lammitys_korotus_olohuone_keittio', 'active') %}
              {% set t = states('sensor.lammitys_tavoite_olohuone_keittio') %}
              {% set base = t | float(20) if t not in ['unknown','unavailable','none',''] else 20 %}
              {% set k = states('input_number.lammitys_korotus_olohuone_keittio') | float(1.5) %}
              {{ [base + k, 30] | min | round(1) }}
            {% elif states('sensor.vilp_ohjaus_lampotilat_air_temperature_13') | float(0) <= 25 %}17
            {% elif is_state('binary_sensor.lammitys_terassi_auki', 'on') %}17
            {% elif not is_state('binary_sensor.lammitys_halpa_sahko', 'on') %}
              {% set tausta = states('input_number.lammitys_lattia_tausta_olokeittio') | float(18) %}
              {% set drop = states('input_number.lammitys_hetki_huone_lasku') | float(2) if is_state('binary_sensor.lammitys_hetki_rajoita_huone', 'on') else 0 %}
              {{ [tausta - drop, 17] | max | round(1) }}
            {% else %}{{ states('sensor.lammitys_kaytto_olohuone_keittio') | float(20) }}
            {% endif %}
      - action: script.lammitys_aseta_termostaatti
        data:
          climates:
            - climate.olohuone_lattialammitys
            - climate.keittio_lattialammitys
          temperature: "{{ lampo }}"
