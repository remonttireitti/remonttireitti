script:
  lammitys_korotus_kaynnista:
    alias: Lämmitys korotus käynnistä
    mode: parallel
    fields:
      alue:
        description: Lämmitysalue
        required: true
        selector:
          select:
            options:
              - olohuone_keittio
              - hm
              - makuhuone
              - glen
              - nele
              - eteinen
    sequence:
      - variables:
          zone: "{{ alue }}"
          mins: "{{ states('input_number.lammitys_kesto_' ~ zone) | int(60) }}"
          duration: >
            {{ '%02d:%02d:00' | format(mins // 60, mins % 60) }}
      - action: timer.start
        target:
          entity_id: "timer.lammitys_korotus_{{ zone }}"
        data:
          duration: "{{ duration }}"
      - action: automation.trigger
        target:
          entity_id: "automation.lammitys_{{ zone }}"
        data:
          skip_condition: true

  lammitys_korotus_lopeta:
    alias: Lämmitys korotus lopeta
    mode: parallel
    fields:
      alue:
        description: Lämmitysalue
        required: true
        selector:
          select:
            options:
              - olohuone_keittio
              - hm
              - makuhuone
              - glen
              - nele
              - eteinen
    sequence:
      - action: timer.cancel
        target:
          entity_id: "timer.lammitys_korotus_{{ alue }}"
      - action: automation.trigger
        target:
          entity_id: "automation.lammitys_{{ alue }}"
        data:
          skip_condition: true

  lammitys_aseta_termostaatti:
    alias: Lämmitys aseta termostaatti
    mode: queued
    fields:
      climates:
        description: Climate-entityt
        required: true
        selector:
          entity:
            domain: climate
            multiple: true
      temperature:
        description: Tavoitelämpötila °C
        required: true
        selector:
          number:
            min: 5
            max: 35
            step: 0.5
    sequence:
      - variables:
          climate_list: >
            {% if climates is string %}
              {{ [climates] }}
            {% else %}
              {{ climates }}
            {% endif %}
      - repeat:
          for_each: "{{ climate_list }}"
          sequence:
            - variables:
                eid: "{{ repeat.item }}"
                modes: "{{ state_attr(eid, 'preset_modes') or [] }}"
                clear_preset: >
                  {% if 'none' in modes %}none
                  {% elif 'None' in modes %}None
                  {% elif 'home' in modes %}home
                  {% elif 'comfort' in modes %}comfort
                  {% elif 'Comfort' in modes %}Comfort
                  {% else %}none{% endif %}
            - action: climate.set_preset_mode
              target:
                entity_id: "{{ eid }}"
              data:
                preset_mode: "{{ clear_preset }}"
            - delay:
                milliseconds: 700
            - action: climate.set_hvac_mode
              target:
                entity_id: "{{ eid }}"
              data:
                hvac_mode: heat
            - action: climate.set_temperature
              target:
                entity_id: "{{ eid }}"
              data:
                temperature: "{{ temperature }}"
            - delay:
                milliseconds: 900
            - action: climate.set_preset_mode
              target:
                entity_id: "{{ eid }}"
              data:
                preset_mode: "{{ clear_preset }}"

  lammitys_aseta_sekoitus:
    alias: Lämmitys aseta sekoitusventtiili
    mode: single
    fields:
      active:
        description: Sallitaanko lämmitys (käyttövesi > 55 °C)
        required: true
        selector:
          boolean:
      temperature:
        description: Sekoituslämpötila °C
        required: true
        selector:
          number:
            min: 35
            max: 48
            step: 0.5
    sequence:
      - choose:
          - conditions: "{{ active }}"
            sequence:
              - action: climate.set_hvac_mode
                target:
                  entity_id: climate.lattialammitys
                data:
                  hvac_mode: heat
              - action: climate.set_temperature
                target:
                  entity_id: climate.lattialammitys
                data:
                  temperature: "{{ temperature }}"
        default:
          - action: climate.set_hvac_mode
            target:
              entity_id: climate.lattialammitys
            data:
              hvac_mode: "off"

  lammitys_aseta_sekoituspumppu:
    alias: Lämmitys aseta sekoituspumppu
    mode: queued
    max: 3
    fields:
      paalle:
        selector:
          boolean:
    sequence:
      - variables:
          pump: "{{ states('input_text.lammitys_sekoituspumppu') | trim }}"
      - condition: template
        value_template: "{{ pump not in ['unknown', 'unavailable', 'none', ''] }}"
      - choose:
          - conditions: "{{ paalle | bool }}"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: "{{ pump }}"
                continue_on_error: true
        default:
          - action: switch.turn_off
            target:
              entity_id: "{{ pump }}"
            continue_on_error: true

template:
  - sensor:
      - name: Lammitys rajoitus teksti
        unique_id: lammitys_rajoitus_teksti
        icon: mdi:thermometer-alert
        state: >
          {% set t = states('sensor.vilp_ohjaus_lampotilat_air_temperature_13') | float(none) %}
          {% if t is none %}Ei lämmitysvesidataa
          {% elif t <= 25 %}Lämmitys rajoitettu — lämmitysvesi {{ t | round(1) }} °C (raja 25 °C)
          {% else %}Lämmitysvesi {{ t | round(1) }} °C — normaali ohjaus{% endif %}
  - trigger:
      - platform: state
        entity_id:
          - switch.sonoff_4_ch_pro_2_tasmota3
          - sensor.vilp_ohjaus_lampotilat_air_temperature_12
          - sensor.vilp_ohjaus_lampotilat_air_temperature_11
          - input_number.lammitys_aurinko_virtaus_l_s
      - platform: homeassistant
        event: start
    sensor:
      - name: Aurinkolämpö lämpötilaero c
        unique_id: aurinkolampo_lampotilaero_c
        unit_of_measurement: °C
        device_class: temperature
        icon: mdi:delta
        state: >
          {% set meno = states('sensor.vilp_ohjaus_lampotilat_air_temperature_12') | float(none) %}
          {% set paluu = states('sensor.vilp_ohjaus_lampotilat_air_temperature_11') | float(none) %}
          {% if meno is none or paluu is none %}unknown
          {% else %}{{ (meno - paluu) | abs | round(1) }}{% endif %}
      - name: Aurinkolämpö teho kW
        unique_id: aurinkolampo_teho_kw
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        icon: mdi:solar-power-variant
        state: >
          {# P = virtaus[L/s] × ρ[kg/L] × cp[kJ/kgK] × ΔT[°C]; 30 % PG ~50 °C #}
          {% set pump = is_state('switch.sonoff_4_ch_pro_2_tasmota3', 'on') %}
          {% set meno = states('sensor.vilp_ohjaus_lampotilat_air_temperature_12') | float(none) %}
          {% set paluu = states('sensor.vilp_ohjaus_lampotilat_air_temperature_11') | float(none) %}
          {% set flow = states('input_number.lammitys_aurinko_virtaus_l_s') | float(0.5) %}
          {% if not pump or meno is none or paluu is none %}0
          {% else %}
            {% set delta = (meno - paluu) | abs %}
            {% if delta < 0.15 %}0
            {% else %}
              {% set rho = 1.042 %}
              {% set cp = 3.75 %}
              {{ (flow * rho * cp * delta) | round(2) }}
            {% endif %}
          {% endif %}
        attributes:
          virtaus_l_s: "{{ states('input_number.lammitys_aurinko_virtaus_l_s') }}"
          lampotilaero_c: "{{ states('sensor.aurinkolampo_lampotilaero_c') }}"
          meno_c: "{{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_12') }}"
          paluu_c: "{{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_11') }}"
          neste: "Propyleeniglykoli 30 %"
          laskenta: "P[kW] = virtaus × 1,042 kg/L × 3,75 kJ/kgK × |meno−paluu|"
      - name: Aurinkolämpö teho teksti
        unique_id: aurinkolampo_teho_teksti
        icon: mdi:solar-power-variant
        state: >
          {% set p = states('sensor.aurinkolampo_teho_kw') | float(0) %}
          {% set d = states('sensor.aurinkolampo_lampotilaero_c') | float(none) %}
          {% set f = states('input_number.lammitys_aurinko_virtaus_l_s') | float(0.5) %}
          {% if not is_state('switch.sonoff_4_ch_pro_2_tasmota3', 'on') %}Pumppu pois — teho 0 kW
          {% elif p < 0.05 %}Pumppu päällä, lämpötilaero pieni ({{ d if d is not none else '?' }} °C) — teho ~0 kW
          {% else %}{{ p }} kW ({{ f }} L/s, ΔT {{ d }} °C, PG 30 %){% endif %}
  - binary_sensor:
      - name: Lammitys rajoitettu
        unique_id: lammitys_rajoitettu
        icon: mdi:thermometer-alert
        state: >
          {{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_13') | float(99) <= 25 }}
  - trigger:
      - platform: state
        entity_id:
          - binary_sensor.terassi_ovi_contact
          - binary_sensor.hm_ikkunatunnistin_contact
          - binary_sensor.makuhuone_ikkunatunnistin_contact
          - binary_sensor.glen_ikkunatunnistin_contact
          - binary_sensor.nele_ikkunatunnistin_contact
          - binary_sensor.etuovi_current_status_of_the_door
    binary_sensor:
      - name: Lammitys terassi auki
        unique_id: lammitys_terassi_auki
        device_class: door
        state: "{{ is_state('binary_sensor.terassi_ovi_contact', 'on') }}"
      - name: Lammitys hm ikkuna auki
        unique_id: lammitys_hm_ikkuna_auki
        device_class: window
        state: "{{ is_state('binary_sensor.hm_ikkunatunnistin_contact', 'on') }}"
      - name: Lammitys makuhuone ikkuna auki
        unique_id: lammitys_makuhuone_ikkuna_auki
        device_class: window
        state: "{{ is_state('binary_sensor.makuhuone_ikkunatunnistin_contact', 'on') }}"
      - name: Lammitys glen ikkuna auki
        unique_id: lammitys_glen_ikkuna_auki
        device_class: window
        state: "{{ is_state('binary_sensor.glen_ikkunatunnistin_contact', 'on') }}"
      - name: Lammitys nele ikkuna auki
        unique_id: lammitys_nele_ikkuna_auki
        device_class: window
        state: "{{ is_state('binary_sensor.nele_ikkunatunnistin_contact', 'on') }}"
      - name: Lammitys eteinen ovi auki
        unique_id: lammitys_eteinen_ovi_auki
        device_class: door
        state: "{{ is_state('binary_sensor.etuovi_current_status_of_the_door', 'on') }}"
  - trigger:
      - platform: time_pattern
        minutes: "/3"
      - platform: homeassistant
        event: start
      - platform: state
        entity_id:
          - sensor.ulkolampotila_met_no
          - sensor.energi_data_service
          - sensor.hetkellinen_kustannus_30min_keski_arvo
    sensor:
      - name: Lammitys tavoite olohuone keittio
        unique_id: lammitys_tavoite_olohuone_keittio
        unit_of_measurement: "°C"
        device_class: temperature
        state: >
          {% set BASE_TEMP = 22 %}
          {% set OUTDOOR_COLD = -20 %}
          {% set OUTDOOR_WARM = 10 %}
          {% set OUTDOOR_EFFECT = 5 %}
          {% set PRICE_CHEAP = 0 %}
          {% set PRICE_EXPENSIVE = 15 %}
          {% set PRICE_EFFECT = 1.5 %}
          {% set COST_CHEAP = 0 %}
          {% set COST_EXPENSIVE = 70 %}
          {% set COST_EFFECT = 1.5 %}
          {% set MIN_TEMP = 20 %}
          {% set MAX_TEMP = 22 %}
          {% set outdoor = states('sensor.ulkolampotila_met_no') | float(0) %}
          {% set price_now = states('sensor.energi_data_service') | float(0) %}
          {% set avgCost = states('sensor.hetkellinen_kustannus_30min_keski_arvo') | float(0) %}
          {% if outdoor <= OUTDOOR_COLD %}{% set adj_outdoor = OUTDOOR_EFFECT %}
          {% elif outdoor >= OUTDOOR_WARM %}{% set adj_outdoor = -OUTDOOR_EFFECT %}
          {% else %}{% set adj_outdoor = OUTDOOR_EFFECT * (1 - ((outdoor - OUTDOOR_COLD) / (OUTDOOR_WARM - OUTDOOR_COLD)) * 2) %}{% endif %}
          {% if price_now <= PRICE_CHEAP %}{% set adj_price = PRICE_EFFECT %}
          {% elif price_now >= PRICE_EXPENSIVE %}{% set adj_price = -PRICE_EFFECT %}
          {% else %}{% set adj_price = PRICE_EFFECT * (1 - ((price_now - PRICE_CHEAP) / (PRICE_EXPENSIVE - PRICE_CHEAP)) * 2) %}{% endif %}
          {% if avgCost <= COST_CHEAP %}{% set adj_cost = COST_EFFECT %}
          {% elif avgCost >= COST_EXPENSIVE %}{% set adj_cost = -COST_EFFECT %}
          {% else %}{% set adj_cost = COST_EFFECT * (1 - ((avgCost - COST_CHEAP) / (COST_EXPENSIVE - COST_CHEAP)) * 2) %}{% endif %}
          {% set target = BASE_TEMP + adj_outdoor + adj_price + adj_cost %}
          {{ [[MIN_TEMP, target] | max, MAX_TEMP] | min | round(1) }}
      - name: Lammitys tavoite hm
        unique_id: lammitys_tavoite_hm
        unit_of_measurement: "°C"
        device_class: temperature
        state: >
          {% set BASE_TEMP = 22 %}
          {% set OUTDOOR_COLD = -20 %}
          {% set OUTDOOR_WARM = 10 %}
          {% set OUTDOOR_EFFECT = 5 %}
          {% set PRICE_CHEAP = 0 %}
          {% set PRICE_EXPENSIVE = 15 %}
          {% set PRICE_EFFECT = 4.5 %}
          {% set COST_CHEAP = 0 %}
          {% set COST_EXPENSIVE = 50 %}
          {% set COST_EFFECT = 4.5 %}
          {% set MIN_TEMP = 17 %}
          {% set MAX_TEMP = 20 %}
          {% set outdoor = states('sensor.ulkolampotila_met_no') | float(0) %}
          {% set price_now = states('sensor.energi_data_service') | float(0) %}
          {% set avgCost = states('sensor.hetkellinen_kustannus_30min_keski_arvo') | float(0) %}
          {% if outdoor <= OUTDOOR_COLD %}{% set adj_outdoor = OUTDOOR_EFFECT %}
          {% elif outdoor >= OUTDOOR_WARM %}{% set adj_outdoor = -OUTDOOR_EFFECT %}
          {% else %}{% set adj_outdoor = OUTDOOR_EFFECT * (1 - ((outdoor - OUTDOOR_COLD) / (OUTDOOR_WARM - OUTDOOR_COLD)) * 2) %}{% endif %}
          {% if price_now <= PRICE_CHEAP %}{% set adj_price = PRICE_EFFECT %}
          {% elif price_now >= PRICE_EXPENSIVE %}{% set adj_price = -PRICE_EFFECT %}
          {% else %}{% set adj_price = PRICE_EFFECT * (1 - ((price_now - PRICE_CHEAP) / (PRICE_EXPENSIVE - PRICE_CHEAP)) * 2) %}{% endif %}
          {% if avgCost <= COST_CHEAP %}{% set adj_cost = COST_EFFECT %}
          {% elif avgCost >= COST_EXPENSIVE %}{% set adj_cost = -COST_EFFECT %}
          {% else %}{% set adj_cost = COST_EFFECT * (1 - ((avgCost - COST_CHEAP) / (COST_EXPENSIVE - COST_CHEAP)) * 2) %}{% endif %}
          {% set target = BASE_TEMP + adj_outdoor + adj_price + adj_cost %}
          {{ [[MIN_TEMP, target] | max, MAX_TEMP] | min | round(1) }}
      - name: Lammitys tavoite makuhuone
        unique_id: lammitys_tavoite_makuhuone
        unit_of_measurement: "°C"
        device_class: temperature
        state: >
          {% set BASE_TEMP = 22 %}
          {% set OUTDOOR_COLD = -20 %}
          {% set OUTDOOR_WARM = 10 %}
          {% set OUTDOOR_EFFECT = 5 %}
          {% set PRICE_CHEAP = 0 %}
          {% set PRICE_EXPENSIVE = 15 %}
          {% set PRICE_EFFECT = 4.5 %}
          {% set COST_CHEAP = 0 %}
          {% set COST_EXPENSIVE = 50 %}
          {% set COST_EFFECT = 4.5 %}
          {% set MIN_TEMP = 18 %}
          {% set MAX_TEMP = 21 %}
          {% set outdoor = states('sensor.ulkolampotila_met_no') | float(0) %}
