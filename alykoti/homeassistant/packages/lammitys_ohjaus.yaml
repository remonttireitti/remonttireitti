    sensor:
      - name: Lammitys hinta ennakko
        unique_id: lammitys_hinta_ennakko
        unit_of_measurement: c/kWh
        icon: mdi:chart-timeline-variant
        state: >
          {% set look = states('input_number.lammitys_hinta_ennakko_h') | int(6) %}
          {% set ns = namespace(sum=0.0, n=0) %}
          {% for attr in ['raw_today', 'raw_tomorrow'] %}
            {% set rows = state_attr('sensor.energi_data_service', attr) %}
            {% if rows %}
              {% for item in rows %}
                {% set ts = item.hour if item.hour is defined else none %}
                {% set pr = item.price if item.price is defined else none %}
                {% if ts is not none and pr is not none %}
                  {% set start = as_datetime(ts) %}
                  {% if start is not none and start >= now() - timedelta(minutes=15) and start < now() + timedelta(hours=look) %}
                    {% set ns.sum = ns.sum + (pr | float(0)) %}
                    {% set ns.n = ns.n + 1 %}
                  {% endif %}
                {% endif %}
              {% endfor %}
            {% endif %}
          {% endfor %}
          {% if ns.n == 0 %}{{ states('sensor.energi_data_service') | float(0) | round(1) }}
          {% else %}{{ (ns.sum / ns.n) | round(1) }}{% endif %}
        attributes:
          tunteja: "{{ states('input_number.lammitys_hinta_ennakko_h') }}"
          naytteet: >
            {% set look = states('input_number.lammitys_hinta_ennakko_h') | int(6) %}
            {% set ns = namespace(n=0) %}
            {% for attr in ['raw_today', 'raw_tomorrow'] %}
              {% set rows = state_attr('sensor.energi_data_service', attr) %}
              {% if rows %}
                {% for item in rows %}
                  {% set ts = item.hour if item.hour is defined else none %}
                  {% set pr = item.price if item.price is defined else none %}
                  {% if ts is not none and pr is not none %}
                    {% set start = as_datetime(ts) %}
                    {% if start is not none and start >= now() - timedelta(minutes=15) and start < now() + timedelta(hours=look) %}
                      {% set ns.n = ns.n + 1 %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
              {% endif %}
            {% endfor %}
            {{ ns.n }}
          tomorrow_valid: "{{ state_attr('sensor.energi_data_service', 'tomorrow_valid') }}"
  - sensor:
      - name: Lammitys sekoitus kayra
        unique_id: lammitys_sekoitus_kayra
        unit_of_measurement: "°C"
        device_class: temperature
        icon: mdi:chart-bell-curve
        state: >
          {% set outdoor = states('sensor.ulkolampotila_met_no') | float(0) %}
          {% set out_w = states('input_number.lammitys_kayra_ulko_vih') | float(18) %}
          {% set out_c = states('input_number.lammitys_kayra_ulko_kylma') | float(-25) %}
          {% set t_w = states('input_number.lammitys_kayra_meno_min') | float(35) %}
          {% set t_c = states('input_number.lammitys_kayra_meno_max') | float(48) %}
          {% set span = out_w - out_c %}
          {% if span | abs < 0.1 %}{{ t_w | round(1) }}
          {% elif outdoor >= out_w %}{{ t_w | round(1) }}
          {% elif outdoor <= out_c %}{{ t_c | round(1) }}
          {% else %}{{ (t_w + (t_c - t_w) * (out_w - outdoor) / span) | round(1) }}{% endif %}
      - name: Lammitys sekoitus hinta korjaus
        unique_id: lammitys_sekoitus_hinta_korjaus
        unit_of_measurement: "°C"
        icon: mdi:flash
        state: >
          {% set price_now = states('sensor.energi_data_service') | float(0) %}
          {% set look = states('input_number.lammitys_hinta_ennakko_h') | int(6) %}
          {% set ns = namespace(sum=0.0, n=0) %}
          {% for attr in ['raw_today', 'raw_tomorrow'] %}
            {% set rows = state_attr('sensor.energi_data_service', attr) %}
            {% if rows %}
              {% for item in rows %}
                {% set ts = item.hour if item.hour is defined else none %}
                {% set pr = item.price if item.price is defined else none %}
                {% if ts is not none and pr is not none %}
                  {% set start = as_datetime(ts) %}
                  {% if start is not none and start >= now() - timedelta(minutes=15) and start < now() + timedelta(hours=look) %}
                    {% set ns.sum = ns.sum + (pr | float(0)) %}
                    {% set ns.n = ns.n + 1 %}
                  {% endif %}
                {% endif %}
              {% endfor %}
            {% endif %}
          {% endfor %}
          {% set avg_ahead = (ns.sum / ns.n) if ns.n > 0 else price_now %}
          {% set price_eff = price_now + 0.5 * (price_now - avg_ahead) %}
          {% set p_lo = states('input_number.lammitys_hinta_halpa') | float(5) %}
          {% set p_hi = states('input_number.lammitys_hinta_kallis') | float(50) %}
          {% set nosto = states('input_number.lammitys_hinta_nosto_max') | float(2) %}
          {% set rajoitus = states('input_number.lammitys_hinta_rajoitus_max') | float(8) %}
          {% if p_hi <= p_lo %}0
          {% elif price_eff <= p_lo %}{{ nosto | round(1) }}
          {% elif price_eff >= p_hi %}{{ (-rajoitus) | round(1) }}
          {% else %}
            {% set x = (price_eff - p_lo) / (p_hi - p_lo) %}
            {{ (nosto + (-rajoitus - nosto) * x) | round(1) }}
          {% endif %}
      - name: Lammitys sekoitus kaytto
        unique_id: lammitys_sekoitus_kaytto
        unit_of_measurement: "°C"
        device_class: temperature
        icon: mdi:valve
        state: >
          {% set outdoor = states('sensor.ulkolampotila_met_no') | float(0) %}
          {% set out_w = states('input_number.lammitys_kayra_ulko_vih') | float(18) %}
          {% set out_c = states('input_number.lammitys_kayra_ulko_kylma') | float(-25) %}
          {% set t_w = states('input_number.lammitys_kayra_meno_min') | float(35) %}
          {% set t_c = states('input_number.lammitys_kayra_meno_max') | float(48) %}
          {% set span = out_w - out_c %}
          {% if span | abs < 0.1 %}{% set curve = t_w %}
          {% elif outdoor >= out_w %}{% set curve = t_w %}
          {% elif outdoor <= out_c %}{% set curve = t_c %}
          {% else %}{% set curve = t_w + (t_c - t_w) * (out_w - outdoor) / span %}{% endif %}
          {% set price_now = states('sensor.energi_data_service') | float(0) %}
          {% set look = states('input_number.lammitys_hinta_ennakko_h') | int(6) %}
          {% set ns = namespace(sum=0.0, n=0) %}
          {% for attr in ['raw_today', 'raw_tomorrow'] %}
            {% set rows = state_attr('sensor.energi_data_service', attr) %}
            {% if rows %}
              {% for item in rows %}
                {% set ts = item.hour if item.hour is defined else none %}
                {% set pr = item.price if item.price is defined else none %}
                {% if ts is not none and pr is not none %}
                  {% set start = as_datetime(ts) %}
                  {% if start is not none and start >= now() - timedelta(minutes=15) and start < now() + timedelta(hours=look) %}
                    {% set ns.sum = ns.sum + (pr | float(0)) %}
                    {% set ns.n = ns.n + 1 %}
                  {% endif %}
                {% endif %}
              {% endfor %}
            {% endif %}
          {% endfor %}
          {% set avg_ahead = (ns.sum / ns.n) if ns.n > 0 else price_now %}
          {% set price_eff = price_now + 0.5 * (price_now - avg_ahead) %}
          {% set p_lo = states('input_number.lammitys_hinta_halpa') | float(5) %}
          {% set p_hi = states('input_number.lammitys_hinta_kallis') | float(50) %}
          {% set nosto = states('input_number.lammitys_hinta_nosto_max') | float(2) %}
          {% set rajoitus = states('input_number.lammitys_hinta_rajoitus_max') | float(8) %}
          {% if p_hi <= p_lo %}{% set adj = 0 %}
          {% elif price_eff <= p_lo %}{% set adj = nosto %}
          {% elif price_eff >= p_hi %}{% set adj = -rajoitus %}
          {% else %}
            {% set x = (price_eff - p_lo) / (p_hi - p_lo) %}
            {% set adj = nosto + (-rajoitus - nosto) * x %}
          {% endif %}
          {{ [[t_w, curve + adj] | max, t_c] | min | round(1) }}
      - name: Sekoitusventtiilin tavoite ja hinta
        unique_id: lammitys_sekoitus_teksti
        icon: mdi:valve
        state: >
          {% set kv = states('sensor.vilp_ohjaus_lampotilat_air_temperature_8') | float(none) %}
          {% set tavoite = states('sensor.lammitys_sekoitus_kaytto') | float(none) %}
          {% set kayra = states('sensor.lammitys_sekoitus_kayra') | float(none) %}
          {% set adj = states('sensor.lammitys_sekoitus_hinta_korjaus') | float(0) %}
          {% set price = states('sensor.energi_data_service') | float(none) %}
          {% set ennakko = states('sensor.lammitys_hinta_ennakko') | float(none) %}
          {% set look = states('input_number.lammitys_hinta_ennakko_h') | int(6) %}
          {% if kv is none %}Ei käyttövesidataa
          {% elif kv <= 55 %}Pois — käyttövesi {{ kv | round(1) }} °C (raja 55 °C)
          {% else %}Sekoitus {{ tavoite | round(1) }} °C (käyrä {{ kayra | round(1) }}°{% if adj != 0 %}, hinta {{ adj | round(1) }}° @ {{ price | round(1) }} c nyt{% if ennakko is not none %}, ennakko {{ ennakko | round(1) }} c / {{ look }} h{% endif %}{% endif %}, KV {{ kv | round(1) }} °C){% endif %}
      - name: Miksi sekoituspumppu on päällä tai pois
        unique_id: lammitys_menovesi_teksti
        icon: mdi:pipe-valve
        state: >
          {% set meno = states('sensor.vilp_ohjaus_lampotilat_air_temperature_10') | float(none) %}
          {% set tavoite = states('sensor.lammitys_sekoitus_kaytto') | float(none) %}
          {% set tank = states('sensor.vilp_ohjaus_lampotilat_air_temperature_13') | float(none) %}
          {% set kv = states('sensor.vilp_ohjaus_lampotilat_air_temperature_8') | float(none) %}
          {% set hyst = states('input_number.lammitys_menovesi_hystereesi') | float(1) %}
          {% set delta = [hyst, 1.5] | max %}
          {% set kv_on = states('input_number.lammitys_kv_pumppu_paalle') | float(58) %}
          {% set kv_off = [states('input_number.lammitys_kv_pumppu_pois') | float(56), kv_on - 0.5] | min %}
          {% set katto = states('input_number.lammitys_kayra_meno_max') | float(48) %}
          {% set pump_e = states('input_text.lammitys_sekoituspumppu') | trim %}
          {% if pump_e in ['unknown', 'unavailable', 'none', '', 'switch.sonoff_4_ch_pro_2'] %}
            {% set pump_e = 'switch.sonoff_4_ch_pro_2_tasmota4' %}
          {% endif %}
          {% set pump_on = is_state(pump_e, 'on') if pump_e not in ['unknown', 'unavailable', 'none', ''] else false %}
          {% set kenno = states('sensor.nele_ja_keittio_lattialammitys_anturit_air_temperature_8') | float(0) %}
          {% set solar_p = states('sensor.aurinkolampo_teho_kw') | float(0) %}
          {% set solar_on = is_state('switch.sonoff_4_ch_pro_2_tasmota3', 'on') and (solar_p >= 0.3 or (kenno - (tank if tank is not none else 0)) >= 5) %}
          {% set solar_block = solar_on and (solar_p >= (states('input_number.lammitys_aurinko_teho_raja') | float(0.8))) %}
          {% set solar_extra = states('input_number.lammitys_aurinko_varo') | float(2.5) if solar_on else 0 %}
          {% set raja = (tavoite - hyst - solar_extra) if tavoite is not none else none %}
          {% if kv is none %}Ei käyttövesidataa
          {% elif tank is none %}Ei lämmitysvaraajadataa
          {% elif kv <= kv_off %}Sekoituspumppu pois — suojaa käyttövettä {{ kv | round(1) }} °C (pois ≤ {{ kv_off | round(1) }} °C)
          {% elif is_state('timer.lammitys_sekoitus_pulssi', 'active') %}Pulssi {{ states('input_number.lammitys_sekoitus_pulssi_s') | int(30) }} s — KV {{ kv | round(1) }} °C → varaaja {{ tank | round(1) }} °C
          {% elif is_state('timer.lammitys_sekoitus_odota', 'active') %}Odottaa KV {{ states('input_number.lammitys_sekoitus_odota_s') | int(90) }} s · edellinen lasku {{ states('input_number.lammitys_kv_viime_lasku') }} °C · KV {{ kv | round(1) }} °C
          {% elif solar_block %}Sekoituspumppu pois — aurinko lämmittää samaa piiriä ({{ solar_p }} kW), ei kilpailla
          {% elif kv < kv_on and not pump_on %}Sekoituspumppu odottaa — KV {{ kv | round(1) }} °C (päälle ≥ {{ kv_on | round(1) }} °C, ettei KV laske liikaa)
          {% elif kv < tank + delta %}Sekoituspumppu pois — KV {{ kv | round(1) }} °C ei ole tarpeeksi kuumempi kuin varaaja {{ tank | round(1) }} °C (ero ≥ {{ delta | round(1) }} °C)
          {% elif tank >= katto %}Sekoituspumppu pois — varaaja {{ tank | round(1) }} °C (katto {{ katto | round(1) }} °C)
          {% elif solar_on and raja is not none and tank >= raja %}Aurinko lämmittää — sekoituspumppu lepää kunnes varaaja {{ raja | round(1) }} °C
          {% elif pump_on %}Siirtää KV {{ kv | round(1) }} °C → varaaja {{ tank | round(1) }} °C{% if tavoite is not none %} · tavoite {{ tavoite | round(1) }} °C{% endif %}
          {% elif raja is not none and tank >= raja %}Varaaja {{ tank | round(1) }} °C · tavoite {{ tavoite | round(1) }} °C — ok
          {% else %}Varaaja {{ tank | round(1) }} °C alle tavoitteen {{ tavoite | round(1) if tavoite is not none else '?' }} °C — seuraava pulssi kun KV ≥ {{ kv_on | round(1) }} °C
          {% endif %}
  - binary_sensor:
      - name: Lammitys sekoitus sallittu
        unique_id: lammitys_sekoitus_sallittu
        icon: mdi:valve
        state: >
          {{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_8') | float(0) > 55 }}
