      - platform: state
        entity_id: sensor.vilp_ohjaus_lampotilat_air_temperature_8
        id: kv
      - platform: state
        entity_id:
          - sensor.vilp_ohjaus_lampotilat_air_temperature_10
          - sensor.vilp_ohjaus_lampotilat_air_temperature_13
          - sensor.lammitys_sekoitus_kaytto
          - switch.sonoff_4_ch_pro_2_tasmota2
          - switch.sonoff_4_ch_pro_2_tasmota3
          - switch.sonoff_4_ch_pro_2_tasmota4
          - input_text.lammitys_sekoituspumppu
          - input_number.lammitys_menovesi_hystereesi
          - input_number.lammitys_kayra_meno_max
          - input_number.lammitys_kv_pumppu_paalle
          - input_number.lammitys_kv_pumppu_pois
          - input_number.lammitys_aurinko_varo
          - input_number.lammitys_aurinko_teho_raja
          - input_number.lammitys_hinta_nosto_max
          - binary_sensor.lammitys_aurinko_lammittaa
          - binary_sensor.aurinkolampo_riittaa
          - binary_sensor.lammitys_ennakoiva
          - binary_sensor.lammitys_halpa_sahko
          - binary_sensor.lammitys_varaaja_tarve
          - binary_sensor.lammitys_kv_vastus
          - binary_sensor.lammitys_hetki_rajoita_huone
          - binary_sensor.lammitys_huone_alaraja
          - sensor.lammitys_kv_pulssi_raja
          - sensor.lammitys_kv_seuranta
          - sensor.energi_data_service
          - climate.lattialammitys
    action:
      - variables:
          pump_e: >
            {% set c = states('input_text.lammitys_sekoituspumppu') | trim %}
            {{ 'switch.sonoff_4_ch_pro_2_tasmota4' if c in ['unknown', 'unavailable', 'none', '', 'switch.sonoff_4_ch_pro_2'] else c }}
          tank_s: "{{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_13') }}"
          tank: "{{ tank_s | float(none) }}"
          kv: "{{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_8') | float(0) }}"
          kv_ennen: "{{ states('input_number.lammitys_kv_ennen_pulssia') | float(0) }}"
          tavoite: "{{ states('sensor.lammitys_sekoitus_kaytto') | float(35) }}"
          hyst: "{{ states('input_number.lammitys_menovesi_hystereesi') | float(1) }}"
          delta: "{{ [states('input_number.lammitys_menovesi_hystereesi') | float(1), 1.5] | max }}"
          katto: "{{ states('input_number.lammitys_kayra_meno_max') | float(48) }}"
          kv_on: "{{ [states('sensor.lammitys_kv_pulssi_raja') | float(67), 67] | max }}"
          kv_off: "{{ [[states('input_number.lammitys_kv_pumppu_pois') | float(64), 64] | max, ([states('sensor.lammitys_kv_pulssi_raja') | float(67), 67] | max) - 0.5] | min }}"
          max_lasku: "{{ states('input_number.lammitys_kv_pulse_max_lasku') | float(0.5) }}"
          lasku_nyt: "{{ ((states('input_number.lammitys_kv_ennen_pulssia') | float(0)) - (states('sensor.vilp_ohjaus_lampotilat_air_temperature_8') | float(0))) | round(2) }}"
          lasku_5min: "{{ state_attr('sensor.lammitys_kv_seuranta', 'lasku_5min') | float(0) }}"
          solar_block: "{{ 1 if (is_state('binary_sensor.lammitys_aurinko_lammittaa', 'on') and is_state('binary_sensor.aurinkolampo_riittaa', 'on') and (states('sensor.aurinkolampo_teho_kw') | float(0) >= (states('input_number.lammitys_aurinko_teho_raja') | float(0.8)))) else 0 }}"
          solar_extra: "{{ states('input_number.lammitys_aurinko_varo') | float(2.5) if is_state('binary_sensor.aurinkolampo_riittaa', 'on') else 0 }}"
          tank_raja: "{{ [((tavoite | float(35)) - (solar_extra | float(0))), (katto | float(48))] | min }}"
          tank_ok: "{{ 1 if tank_s not in ['unknown', 'unavailable', 'none', ''] else 0 }}"
          pulssi: "{{ 1 if is_state('timer.lammitys_sekoitus_pulssi', 'active') else 0 }}"
          odottaa: "{{ 1 if is_state('timer.lammitys_sekoitus_odota', 'active') else 0 }}"
          nosta: >
            {{ 1 if (solar_block | int(0) == 0)
               and (tank_ok | int(0) == 1)
               and (kv | float(0) >= (kv_on | float(67)))
               and (kv | float(0) >= ((tank | float(0)) + (delta | float(1.5))))
               and (tank | float(99) < (katto | float(48)))
               and (tank | float(99) < (tank_raja | float(35)))
               and (not is_state('binary_sensor.lammitys_kv_vastus', 'on'))
               and (not is_state('binary_sensor.lammitys_hetki_rajoita_huone', 'on')
                    or is_state('binary_sensor.lammitys_huone_alaraja', 'on'))
               and ((lasku_5min | float(0)) < 1.2)
               else 0 }}
          kv_abort: >
            {{ 1 if (kv | float(0) <= (kv_off | float(64)))
               or ((pulssi | int(0) == 1) and (lasku_nyt | float(0) >= (max_lasku | float(0.5))))
               or ((pulssi | int(0) == 1) and is_state('binary_sensor.lammitys_kv_vastus', 'on'))
               else 0 }}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ (pulssi | int(0) == 1) and (kv_abort | int(0) == 1) }}"
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.lammitys_kv_viime_lasku
                data:
                  value: "{{ lasku_nyt | float(0) }}"
              - action: script.lammitys_sekoitus_pulssi_loppu
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'pulssi_loppu' }}"
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.lammitys_kv_viime_lasku
                data:
                  value: "{{ lasku_nyt | float(0) }}"
              - action: script.lammitys_sekoitus_pulssi_loppu
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'odota_loppu' }}"
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.lammitys_kv_viime_lasku
                data:
                  value: "{{ lasku_nyt | float(0) }}"
              - action: script.lammitys_aseta_sekoituspumppu
                data:
                  paalle: false
              - if:
                  - condition: template
                    value_template: "{{ (nosta | int(0) == 1) and (lasku_nyt | float(0) < (max_lasku | float(1))) }}"
                then:
                  - action: script.lammitys_sekoitus_pulssi_alku
          - conditions:
              - condition: template
                value_template: "{{ odottaa | int(0) == 1 }}"
            sequence:
              - action: script.lammitys_aseta_sekoituspumppu
                data:
                  paalle: false
          - conditions:
              - condition: template
                value_template: "{{ pulssi | int(0) == 1 }}"
            sequence:
              - action: script.lammitys_aseta_sekoituspumppu
                data:
                  paalle: true
          - conditions:
              - condition: template
                value_template: "{{ nosta | int(0) == 1 }}"
            sequence:
              - action: script.lammitys_sekoitus_pulssi_alku
        default:
          - action: script.lammitys_aseta_sekoituspumppu
            data:
              paalle: false

  - id: lammitys_aurinkopumppu
    alias: Aurinkolämpöpumppu
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/3"
      - platform: state
        entity_id:
          - sensor.nele_ja_keittio_lattialammitys_anturit_air_temperature_8
          - sensor.vilp_ohjaus_lampotilat_air_temperature_13
          - input_select.lammitys_aurinkopumppu
    action:
      - variables:
          tila: "{{ states('input_select.lammitys_aurinkopumppu') }}"
          solar: "{{ states('sensor.nele_ja_keittio_lattialammitys_anturit_air_temperature_8') | float(0) }}"
          tank: "{{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_13') | float(0) }}"
          diff: "{{ solar - tank }}"
          pump: switch.sonoff_4_ch_pro_2_tasmota3
      - choose:
          - conditions: "{{ tila == 'Pois' }}"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: "{{ pump }}"
          - conditions: "{{ tila == 'Pakko päälle' }}"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: "{{ pump }}"
        default:
          - choose:
              - conditions: "{{ diff | float(0) > 7 }}"
                sequence:
                  - action: switch.turn_on
                    target:
                      entity_id: "{{ pump }}"
            default:
              - action: switch.turn_off
                target:
                  entity_id: "{{ pump }}"

  - id: lammitys_pumppu
    alias: Lattialämmityspumppu päälle/pois
    mode: restart
    trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: state
        entity_id:
          - binary_sensor.lammitys_ll_tarve
          - binary_sensor.lammitys_varaaja_tarve
      - platform: state
        entity_id:
          - switch.pannuhuone_lapivirtausvastus
          - timer.lammitys_ll_pumppu_viive
          - timer.lammitys_vastus_pulssi
          - timer.lammitys_vastus_odota
          - binary_sensor.lammitys_vastus_nostaa
      - platform: state
        entity_id:
          - switch.eteisen_lattialammitys
          - switch.nele_ja_keittio_lattialammitys_anturit
          - switch.olohuone_hm_lattialammitys_6
          - switch.makuhuone_glen_lattialammitys
          - switch.olohuone_hm_lattialammitys
          - switch.makuhuone_glen_lattialammitys_6
          - switch.nele_ja_keittio_lattialammitys_anturit_6
      - platform: state
        entity_id:
          - climate.olohuone_lattialammitys
          - climate.keittio_lattialammitys
          - climate.hm_lattialammitys
          - climate.makuhuone_lattialammitys
          - climate.glen_lattialammitys
          - climate.nele_lattialammitys
          - climate.eteisen_lattialammitys
        attribute: hvac_action
    action:
      - variables:
          tarve: >
            {{ is_state('binary_sensor.lammitys_ll_tarve', 'on')
               or (is_state('binary_sensor.lammitys_vastus_nostaa', 'on')
                   and (
                     state_attr('climate.olohuone_lattialammitys', 'temperature') | float(17) > 17
                     or state_attr('climate.keittio_lattialammitys', 'temperature') | float(17) > 17
                     or state_attr('climate.hm_lattialammitys', 'temperature') | float(17) > 17
                     or state_attr('climate.makuhuone_lattialammitys', 'temperature') | float(17) > 17
                     or state_attr('climate.glen_lattialammitys', 'temperature') | float(17) > 17
                     or state_attr('climate.nele_lattialammitys', 'temperature') | float(17) > 17
                     or state_attr('climate.eteisen_lattialammitys', 'temperature') | float(17) > 17
                   ))
               or (is_state('binary_sensor.lammitys_varaaja_tarve', 'on')
                   and is_state('input_select.lammitys_vastus', 'Automaatti')
                   and (not is_state('binary_sensor.lammitys_hetki_rajoita_vesi', 'on')
                        or is_state('binary_sensor.lammitys_huone_alaraja', 'on'))
                   and (states('sensor.vilp_ohjaus_lampotilat_air_temperature_8') | float(99))
                       < (states('input_number.lammitys_kv_pumppu_paalle') | float(58))
                   and ((states('sensor.lammitys_vesi_huone_raja') | float(0)) > 0
                        or is_state('binary_sensor.lammitys_ennakoiva', 'on'))) }}
          vastus_kaytossa: >
            {{ is_state('switch.pannuhuone_lapivirtausvastus', 'on')
               or is_state('timer.lammitys_vastus_pulssi', 'active')
               or is_state('timer.lammitys_vastus_odota', 'active') }}
      - choose:
          - conditions: "{{ tarve }}"
            sequence:
              - action: timer.cancel
                target:
                  entity_id: timer.lammitys_ll_pumppu_viive
                continue_on_error: true
              - action: switch.turn_on
                target:
                  entity_id: switch.sonoff_4_ch_pro_2_tasmota2
        default:
          - action: script.lammitys_vastus_pois
          - choose:
              - conditions: "{{ vastus_kaytossa or is_state('timer.lammitys_ll_pumppu_viive', 'active') }}"
                sequence:
                  - action: switch.turn_on
                    target:
                      entity_id: switch.sonoff_4_ch_pro_2_tasmota2
                  - if:
                      - condition: state
                        entity_id: timer.lammitys_ll_pumppu_viive
                        state: idle
                    then:
                      - action: timer.start
                        target:
                          entity_id: timer.lammitys_ll_pumppu_viive
                        data:
                          duration: "{{ states('input_number.lammitys_ll_pumppu_viive_s') | int(120) }}"
            default:
              - action: switch.turn_off
                target:
                  entity_id: switch.sonoff_4_ch_pro_2_tasmota2

  - id: lammitys_ll_pumppu_viive_loppu
    alias: Lattialämmityspumppu poisviive loppu
    mode: single
    trigger:
      - platform: state
        entity_id: timer.lammitys_ll_pumppu_viive
        from: active
        to: idle
    action:
      - if:
          - condition: template
            value_template: >
              {{ is_state('binary_sensor.lammitys_ll_tarve', 'off')
                 and is_state('binary_sensor.lammitys_varaaja_tarve', 'off') }}
        then:
          - action: script.lammitys_vastus_pois
          - action: switch.turn_off
            target:
              entity_id: switch.sonoff_4_ch_pro_2_tasmota2

  - id: lammitys_vastus_hata
    alias: Lämmitys vastus hätäpois
    mode: restart
    trigger:
      - platform: time_pattern
        seconds: "/10"
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: switch.sonoff_4_ch_pro_2_tasmota2
        to: "off"
      - platform: state
        entity_id:
          - switch.pannuhuone_lapivirtausvastus
          - binary_sensor.lammitys_ll_tarve
          - binary_sensor.lammitys_piiri_auki
          - binary_sensor.lammitys_varaaja_tarve
          - binary_sensor.lammitys_vastus_sallittu
          - binary_sensor.lammitys_hetki_rajoita_vesi
          - sensor.vilp_ohjaus_lampotilat_air_temperature_10
          - input_select.lammitys_vastus
    action:
      - variables:
          vastus_on: "{{ 1 if is_state('switch.pannuhuone_lapivirtausvastus', 'on') else 0 }}"
          pulssi: "{{ 1 if is_state('timer.lammitys_vastus_pulssi', 'active') else 0 }}"
          odottaa: "{{ 1 if is_state('timer.lammitys_vastus_odota', 'active') else 0 }}"
          kielletty: >
            {{ 1 if is_state('input_select.lammitys_vastus', 'Pois')
               or (is_state('binary_sensor.lammitys_hetki_rajoita_vesi', 'on')
                   and not is_state('binary_sensor.lammitys_huone_alaraja', 'on'))
               or not is_state('switch.sonoff_4_ch_pro_2_tasmota2', 'on')
               or not is_state('binary_sensor.lammitys_piiri_auki', 'on')
               or not (is_state('binary_sensor.lammitys_ll_tarve', 'on')
                       or is_state('binary_sensor.lammitys_varaaja_tarve', 'on'))
               or (states('sensor.vilp_ohjaus_lampotilat_air_temperature_10') | float(0) >= (states('input_number.lammitys_kayra_meno_max') | float(48)))
               or (is_state('timer.lammitys_vastus_pulssi', 'active')
                   and (((states('sensor.vilp_ohjaus_lampotilat_air_temperature_10') | float(0)) - (states('input_number.lammitys_vastus_meno_ennen') | float(0))) >= (states('input_number.lammitys_vastus_max_nousu') | float(1.5))))
               else 0 }}
          jumissa: >
            {% set e = states.switch.pannuhuone_lapivirtausvastus %}
            {{ 1 if is_state('switch.pannuhuone_lapivirtausvastus', 'on')
               and not is_state('timer.lammitys_vastus_pulssi', 'active')
               and not is_state('timer.lammitys_vastus_odota', 'active')
               and e is not none
               and (as_timestamp(now()) - as_timestamp(e.last_changed)) > 8
               else 0 }}
      - choose:
          - conditions: "{{ trigger.platform == 'homeassistant' }}"
            sequence:
              - action: script.lammitys_vastus_pois
          - conditions: "{{ (vastus_on | int(0) == 1) and ((kielletty | int(0) == 1) or (jumissa | int(0) == 1)) }}"
            sequence:
              - action: script.lammitys_vastus_pois
          - conditions: "{{ (pulssi | int(0) == 1) and not is_state('binary_sensor.lammitys_vastus_sallittu', 'on') }}"
            sequence:
              - action: script.lammitys_vastus_pois

  - id: lammitys_vastus
    alias: Lämmitys läpivirtausvastus pulssi
    mode: queued
    max: 8
    trigger:
      - platform: time_pattern
        seconds: "/15"
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: timer.lammitys_vastus_pulssi
        from: active
        to: idle
        id: pulssi_loppu
      - platform: state
        entity_id: timer.lammitys_vastus_odota
        from: active
        to: idle
        id: odota_loppu
      - platform: state
        entity_id:
          - binary_sensor.lammitys_vastus_sallittu
          - binary_sensor.lammitys_ll_pumppu_valmis
          - switch.sonoff_4_ch_pro_2_tasmota2
          - binary_sensor.lammitys_ll_tarve
          - binary_sensor.lammitys_piiri_auki
          - binary_sensor.lammitys_varaaja_tarve
          - input_select.lammitys_vastus
    action:
      - variables:
          sallittu: "{{ 1 if is_state('binary_sensor.lammitys_vastus_sallittu', 'on') else 0 }}"
          pulssi: "{{ 1 if is_state('timer.lammitys_vastus_pulssi', 'active') else 0 }}"
          odottaa: "{{ 1 if is_state('timer.lammitys_vastus_odota', 'active') else 0 }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.platform == 'homeassistant' }}"
            sequence:
              - action: script.lammitys_vastus_pois
          - conditions:
              - condition: template
                value_template: "{{ sallittu | int(0) == 0 }}"
            sequence:
              - action: script.lammitys_vastus_pois
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'pulssi_loppu' }}"
            sequence:
              - action: script.lammitys_vastus_pulssi_loppu
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'odota_loppu' }}"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ sallittu | int(0) == 1 }}"
                then:
                  - action: script.lammitys_vastus_pulssi_alku
                else:
                  - action: script.lammitys_vastus_pois
          - conditions:
              - condition: template
                value_template: "{{ odottaa | int(0) == 1 }}"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.pannuhuone_lapivirtausvastus
                continue_on_error: true
          - conditions:
              - condition: template
                value_template: "{{ pulssi | int(0) == 1 }}"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.pannuhuone_lapivirtausvastus
                continue_on_error: true
          - conditions:
              - condition: template
                value_template: "{{ sallittu | int(0) == 1 }}"
            sequence:
              - action: script.lammitys_vastus_pulssi_alku
        default:
          - action: script.lammitys_vastus_pois
