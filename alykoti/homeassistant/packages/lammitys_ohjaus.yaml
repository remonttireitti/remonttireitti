# lammitys_ohjaus.yaml
# → config/packages/lammitys_ohjaus.yaml
# Tiedostonimi ILMAN yhdysviivaa. EI Lovelace-kortti (älä laita type: vertical-stack).
#
# Huonekohtaiset termostaatit + varaajan termostaatti (climate.lattialammitys)
# + lattialämmityspumppu (tasmota2) + sekoituspumppu (KV → lämmitysvaraaja).
#
# climate.lattialammitys on varaajan generic thermostat. Sen heater
# switch.energia_mittaus_koko_talo on virtuaalinen (energiamittaus) —
# se EI lämmitä varaajaa. Kun termostaatti näyttää heating, oikea lämpö
# tulee sekoituspumpusta (KV kuuma) tai läpivirtausvastuksesta (KV kylmä,
# kierto päällä). Älä ohjaa energia_mittaus_koko_talo-kytkintä lämmittimeksi.
#
# Menovesi:          sensor.vilp_ohjaus_lampotilat_air_temperature_10 (LL meno)
# Paluu:             sensor.vilp_ohjaus_lampotilat_air_temperature_9
# Käyttövesi (KV):   sensor.vilp_ohjaus_lampotilat_air_temperature_8
# Lämmitysvaraaja:   sensor.vilp_ohjaus_lampotilat_air_temperature_13
# Tavoite:  sensor.lammitys_sekoitus_kaytto
#   Huoneiden asetus (kaikki alueet) muuttuu ulkolämmöstä, spotista ja
#   hetkellisestä kulutuksesta (tavoite_*) + ennakoiva/korotus/hetki-raja
#   (kaytto_*). Menoveden tavoite seuraa: vähintään korkein huone + 5 °C,
#   plus ulkokäyrä siirrettynä saman verran kuin huone poikkeaa 21 °C:sta.
#   Olo 21 °C → vesi ≥ 26 °C. Huone laskee → vesi laskee. Huone nousee → vesi nousee.
# Sekoituspumppu: input_text.lammitys_sekoituspumppu
#   (switch.sonoff_4_ch_pro_2_tasmota4).
# Pumppu EI lämmitä menovettä suoraan. Se ottaa lämpöä käyttövettä (8)
# ja lataa lämmityspiirin varaajaa (13). Varaaja on pieni, hyöty ylilatauksesta
# on vähäinen, mutta ennakoivasti sitäkin ladataan hieman yli (hinta_nosto_max).
# Painopiste on lattiassa, etenkin suuressa hintaheilunnassa.
# Pumppu EI saa jäädä päälle: lyhyt pulssi (15 s), pitkä odotus (180 s).
# Uusi pulssi vain jos KV ≥ ~68 °C (vähintään 67, plus lisää jos spot kallis),
# KV on kuumempi kuin varaaja, varaaja alle lataustavoitteen, KV ei ole
# juuri laskenut jyrkästi, eikä 3 kW KV-vastus näytä olevan päällä
# (kytkintä ei ole — päätellään tehon ~3 kW hypystä tai KV:n noususta).
# Keskeytys heti jos KV ≤ ~64 °C tai lasku pulssin aikana ≥ 0,5 °C.
# Jyrkkä lasku tai kallis spot → lyhyempi pulssi ja pidempi tauko.
# 3 kW vastus nostaa hetkellistä: kallista sähköä ei pidä laukaista.
# Korotus-ajastin: oletus +4 °C / 240 min. Vanhat 1,5 °C / 60 min
# siirretään käynnistyksessä; jos arvoa on jo muutettu, sitä ei ylikirjoiteta.
#
# Aurinko samassa piirissä: kenno kuumempi → pumppu päälle.
# Sekoitus/vastus väistää vain jos aurinko RIITTÄÄ 300 l varaajaan
# (kausi + kWh). Talvella tai 1 kWh-luokan tuotolla pumppu saa olla,
# mutta KV ja vastus jatkavat — aurinkoa ei oteta tosissaan.
#
# Läpivirtausvastus 4 kW (switch.pannuhuone_lapivirtausvastus):
# lämmittää SUORAAN menoveden (sensor.vilp_ohjaus_lampotilat_air_temperature_10).
# Asennettu läpivirtauksena: EI SAA olla päällä ilman kiertoa.
# Kiertopumppu switch.sonoff_4_ch_pro_2_tasmota2 PITÄÄ olla päällä.
# Pelkkä pumppu ei riitä: vähintään 1 lämmityspiiri (venttiili) yhtä aikaa
# päällä, muuten vesi ei kierrä vastuksen läpi (ylikuumenemisvaara).
# Pumppu ensin päälle → vastus vasta kun kierto on käynyt ≥ 4 min JA piiri auki.
# Pumppu tai kaikki piirit pois → vastus heti pois.
# Päällä vain kun: KV liian kylmä sekoituspumpulle (< kv_pumppu_paalle),
# lattia tarvitsee lämpöä (meno < tavoite), ja jokin piiri on auki.
# Aina pulssi (alku 15 s / 30 s pois), ei jatkuvaa päälle.
# Teho ei riitä → nosta päällä-aikaa; meno nousee → vähennä.
# Lattiatarve pois → vastus heti pois, kiertopumppu jää 120 s jäähdyttämään.
#
# Olo+keittiö vs ILP:
#   Keittiö ILP on olo+keittiön edullisin lämmittäjä. Ei lämmitä makuuhuoneita.
#   Olo+keittiö lattia normaalisti taustalla (lattia_tausta_olokeittio).
#   Kaikissa huoneissa varaava lattia: edullinen jakso + hinta nousemassa
#   → lattia-asetusta nostetaan (hinta_nosto_max). Lattia varaa eniten.
#   Varaajaa ladataan silti vähän yli. Suuri hintaheilunta → painopiste lattiassa.
#   Hetkellinen kulutus rajoittaa ensin huoneet, sitten vastuksen.
#
# Huoneiden vakio (keskiverto hinta ja kulutus):
#   olo+keittiö 21 °C, makuuhuoneet 20 °C, eteinen 23 °C.
#   Ikkuna/ovi auki → asetus minimiin (17 °C).
#   Mitattu huone alle alarajan ja ikkuna/ovi kiinni → ohita rajoitukset
#   (hetkellinen −2 °C, vastuskielto, vesi+5 pois). Makuuhuoneet ja
#   olo+keittiö 19 °C on jo kriittinen, eteinen 20 °C. Hystereesi +0.5 °C.
# Lattia lämmittää vain jos varaaja tai menovesi on vähintään huone + 5 °C.
# Muuten turha (vesi ei nosta huonetta). Poikkeus: läpivirtausvastus nostaa
# vettä (KV liian kylmä sekoitukselle) → huoneiden lämmitys ja lattiakierto
# pidetään päällä, jotta vastus saa virtauksen.
#
# Tila ja historia: sensor.lammitys_ohjaus_tila (syy + logbook).
# Loki kirjoittaa tilan vaihdon, sekoitus-/vastuspulssin, lattiakierron
# ja 15 min välein jos rajoitus tai lämmitys jää päälle (ei jää 10:19:ään).
# Liput: rajoitettu, hetkellinen, korotus, ennakoiva, halpa/kallis, menovesi nosto/rajoitus.
#
# Hetkellinen kustannus (sensor.hetkellinen_kustannus, c/t):
#   ≥ 40 → rajoita ensin huonetermostaatteja (−2 °C, min 17 °C).
#   ≥ 50 → sen jälkeen kiellä läpivirtausvastus (lämmitysveden sähkölämmitys).
#   Hystereesi 5 c/t: huoneet pois ≤ 35, vastus pois ≤ 45. Korotus ja huoneen
#   alaraja (ikkuna kiinni) ohittavat huone- ja vastusrajoituksen.

homeassistant:
  customize:
    switch.sonoff_4_ch_pro_2_tasmota2:
      friendly_name: "Lattian kiertopumppu — tekee läpivirtauksen vastukselle. Vastus kielletty jos tämä ei ole päällä tai ei ole käynyt vähintään 4 min. Lattia pois → tämä jää 120 s jäähdyttämään"
    switch.sonoff_4_ch_pro_2_tasmota4:
      friendly_name: "Sekoituspumppu — lataa pientä lämmitysvaraajaa (13) käyttövettä (8). Ennakoivasti vähän yli, painopiste silti lattiassa"
    switch.pannuhuone_lapivirtausvastus:
      friendly_name: "Läpivirtausvastus 4 kW. Lämmittää suoraan menovettä (anturi 10). Vaati virtauksen — kiertopumppu (tasmota2) ≥ 4 min JA vähintään 1 lämmityspiiri päällä. Pelkkä pumppu ei riitä. Pulssi kun KV kylmä. Kielletty jos hetkellinen ≥ 50 c/t"
    binary_sensor.lammitys_piiri_auki:
      friendly_name: "Vähintään yksi lämmityspiiri auki — vastus kielletty ilman tätä, pelkkä lattiapumppu ei tee läpivirtauksia"
    climate.lattialammitys:
      friendly_name: "Lämmitysvaraajan termostaatti — tavoite käyrästä. Heater switch.energia_mittaus_koko_talo on virtuaalinen, ei lämmitä. Lämpö: sekoituspumppu KV:stä tai läpivirtausvastus"
    switch.energia_mittaus_koko_talo:
      friendly_name: "Virtuaalinen — climate.lattialammitys kytkee tämän kun varaaja kutsuu lämpöä. Ei lämmitä mitään"
    sensor.lammitys_ohjaus_tila:
      friendly_name: "Lämmitys ohjaus — tila (historia kertoo mitä tehtiin ja miksi)"
    binary_sensor.lammitys_korotus_paalla:
      friendly_name: "Huonekorotus päällä — asetusta nostettu ajastimella"
    binary_sensor.lammitys_ennakoiva:
      friendly_name: "Ennakoiva lämmitys — halpa sähkö ja hinta nousemassa. Lattia ensin, varaajaa silti vähän yli. Suuri heilunta → painopiste lattiassa"
    binary_sensor.lammitys_hinta_heilunta:
      friendly_name: "Suuri hintaheilunta — tuleva keskihinta ≥ 8 c kalliimpi kuin nyt. Painopiste varaavassa lattiassa"
    binary_sensor.lammitys_menovesi_nosto:
      friendly_name: "Menovettä nostettu halvan tai nousevan hinnan takia — lämpö lattioihin"
    binary_sensor.lammitys_menovesi_rajoitus:
      friendly_name: "Menovettä rajoitettu kalliin sähkön takia"
    binary_sensor.lammitys_vesi_riittaa:
      friendly_name: "Lämmitysvesi riittää huoneeseen — varaaja tai meno ≥ huone + 5 °C"
    binary_sensor.lammitys_vastus_nostaa:
      friendly_name: "Läpivirtausvastus nostaa vettä — lattia ja kierto pidetään päällä vaikka vesi on vielä alle huone + 5 °C"
    binary_sensor.aurinkolampo_riittaa:
      friendly_name: "Aurinkolämpö riittää 300 l varaajaan — vain silloin sekoitus väistää. Talvella ja pienellä tuotolla ei."
    binary_sensor.lammitys_kv_vastus:
      friendly_name: "KV 3 kW vastus näyttää olevan päällä (ei kytkintä — teho ~+3 kW tai KV nousee). Sekoitus ei varasta lisää."
    binary_sensor.lammitys_huone_alaraja:
      friendly_name: "Huone alarajalla — ikkuna/ovi kiinni, mitattu alle 19 °C (eteinen 20 °C). Rajoitukset ohitetaan kunnes +0.5 °C"
    switch.sonoff_4_ch_pro_2_tasmota3:
      friendly_name: "Aurinkolämpöpumppu — siirtää kennon lämpöä varaajaan kun kenno on kuumempi"

