          {% if base_s in ['unknown', 'unavailable', 'none', ''] %}
            {% set base = state_attr('climate.nele_lattialammitys', 'temperature') | float(20) %}
          {% else %}
            {% set base = base_s | float(20) %}
          {% endif %}
          {% set korotus = states('input_number.lammitys_korotus_nele') | float(0) %}
          {% if is_state('timer.lammitys_korotus_nele', 'active') %}
            {{ [base + korotus, 30] | min | round(1) }}
          {% elif 'Nele' in (state_attr('binary_sensor.lammitys_huone_alaraja', 'huoneet') | default('')) %}
            {{ [base, 19] | max | round(1) }}
          {% elif is_state('binary_sensor.lammitys_hetki_rajoita_huone', 'on') %}
            {% set drop = states('input_number.lammitys_hetki_huone_lasku') | float(2) %}
            {{ [base - drop, 17] | max | round(1) }}
          {% elif is_state('binary_sensor.lammitys_ennakoiva', 'on') %}
            {% set extra = states('input_number.lammitys_hinta_nosto_max') | float(2) %}
            {{ [base + extra, 26] | min | round(1) }}
          {% else %}{{ base | round(1) }}{% endif %}
      - name: Lammitys kaytto eteinen
        unique_id: lammitys_kaytto_eteinen
        unit_of_measurement: "°C"
        device_class: temperature
        state: >
          {% set base_s = states('sensor.lammitys_tavoite_eteinen') %}
          {% if base_s in ['unknown', 'unavailable', 'none', ''] %}
            {% set base = state_attr('climate.eteisen_lattialammitys', 'temperature') | float(23) %}
          {% else %}
            {% set base = base_s | float(23) %}
          {% endif %}
          {% set korotus = states('input_number.lammitys_korotus_eteinen') | float(0) %}
          {% if is_state('timer.lammitys_korotus_eteinen', 'active') %}
            {{ [base + korotus, 30] | min | round(1) }}
          {% elif 'Eteinen' in (state_attr('binary_sensor.lammitys_huone_alaraja', 'huoneet') | default('')) %}
            {{ [base, 20] | max | round(1) }}
          {% elif is_state('binary_sensor.lammitys_hetki_rajoita_huone', 'on') %}
            {% set drop = states('input_number.lammitys_hetki_huone_lasku') | float(2) %}
            {{ [base - drop, 17] | max | round(1) }}
          {% elif is_state('binary_sensor.lammitys_ennakoiva', 'on') %}
            {% set extra = states('input_number.lammitys_hinta_nosto_max') | float(2) %}
            {{ [base + extra, 26] | min | round(1) }}
          {% else %}{{ base | round(1) }}{% endif %}
  - trigger:
      - platform: time_pattern
        minutes: "/3"
      - platform: homeassistant
        event: start
      - platform: state
        entity_id:
          - sensor.ulkolampotila_met_no
          - sensor.energi_data_service
          - sensor.vilp_ohjaus_lampotilat_air_temperature_8
          - sensor.vilp_ohjaus_lampotilat_air_temperature_10
          - sensor.vilp_ohjaus_lampotilat_air_temperature_9
          - sensor.vilp_ohjaus_lampotilat_air_temperature_13
          - sensor.lammitys_sekoitus_kaytto
          - switch.sonoff_4_ch_pro_2_tasmota2
          - switch.sonoff_4_ch_pro_2_tasmota4
          - input_text.lammitys_sekoituspumppu
          - input_number.lammitys_menovesi_hystereesi
          - input_number.lammitys_kayra_ulko_vih
          - input_number.lammitys_kayra_ulko_kylma
          - input_number.lammitys_kayra_meno_min
          - input_number.lammitys_kayra_meno_max
          - input_number.lammitys_hinta_halpa
          - input_number.lammitys_hinta_kallis
          - input_number.lammitys_hinta_nosto_max
          - input_number.lammitys_hinta_rajoitus_max
          - input_number.lammitys_hinta_ennakko_h
          - input_number.lammitys_kv_pumppu_paalle
          - input_number.lammitys_kv_pumppu_pois
          - input_number.lammitys_aurinko_varo
          - input_number.lammitys_aurinko_teho_raja
          - switch.sonoff_4_ch_pro_2_tasmota3
          - sensor.nele_ja_keittio_lattialammitys_anturit_air_temperature_8
          - sensor.aurinkolampo_teho_kw
    sensor:
      - name: Lammitys hinta ennakko
        unique_id: lammitys_hinta_ennakko
        unit_of_measurement: c/kWh
        icon: mdi:chart-timeline-variant
        state: >
          {% set look = states('input_number.lammitys_hinta_ennakko_h') | int(6) %}
          {% set ns = namespace(sum=0.0, n=0) %}
          {% for attr in ['raw_today', 'raw_tomorrow'] %}
            {% set rows = state_attr('sensor.energi_data_service', attr) %}
            {% if rows %}
              {% for item in rows %}
                {% set ts = item.hour if item.hour is defined else none %}
                {% set pr = item.price if item.price is defined else none %}
                {% if ts is not none and pr is not none %}
                  {% set start = as_datetime(ts) %}
                  {% if start is not none and start >= now() - timedelta(minutes=15) and start < now() + timedelta(hours=look) %}
                    {% set ns.sum = ns.sum + (pr | float(0)) %}
                    {% set ns.n = ns.n + 1 %}
                  {% endif %}
                {% endif %}
              {% endfor %}
            {% endif %}
          {% endfor %}
          {% if ns.n == 0 %}{{ states('sensor.energi_data_service') | float(0) | round(1) }}
          {% else %}{{ (ns.sum / ns.n) | round(1) }}{% endif %}
        attributes:
          tunteja: "{{ states('input_number.lammitys_hinta_ennakko_h') }}"
          naytteet: >
            {% set look = states('input_number.lammitys_hinta_ennakko_h') | int(6) %}
            {% set ns = namespace(n=0) %}
            {% for attr in ['raw_today', 'raw_tomorrow'] %}
              {% set rows = state_attr('sensor.energi_data_service', attr) %}
              {% if rows %}
                {% for item in rows %}
                  {% set ts = item.hour if item.hour is defined else none %}
                  {% set pr = item.price if item.price is defined else none %}
                  {% if ts is not none and pr is not none %}
                    {% set start = as_datetime(ts) %}
                    {% if start is not none and start >= now() - timedelta(minutes=15) and start < now() + timedelta(hours=look) %}
                      {% set ns.n = ns.n + 1 %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
              {% endif %}
            {% endfor %}
            {{ ns.n }}
          tomorrow_valid: "{{ state_attr('sensor.energi_data_service', 'tomorrow_valid') }}"
  - sensor:
      - name: Lammitys sekoitus kayra
        unique_id: lammitys_sekoitus_kayra
        unit_of_measurement: "°C"
        device_class: temperature
        icon: mdi:chart-bell-curve
        state: >
          {% set outdoor = states('sensor.ulkolampotila_met_no') | float(0) %}
          {% set out_w = states('input_number.lammitys_kayra_ulko_vih') | float(18) %}
          {% set out_c = states('input_number.lammitys_kayra_ulko_kylma') | float(-25) %}
          {% set t_w = states('input_number.lammitys_kayra_meno_min') | float(35) %}
          {% set t_c = states('input_number.lammitys_kayra_meno_max') | float(48) %}
          {% set span = out_w - out_c %}
          {% if span | abs < 0.1 %}{{ t_w | round(1) }}
          {% elif outdoor >= out_w %}{{ t_w | round(1) }}
          {% elif outdoor <= out_c %}{{ t_c | round(1) }}
          {% else %}{{ (t_w + (t_c - t_w) * (out_w - outdoor) / span) | round(1) }}{% endif %}
      - name: Lammitys sekoitus hinta korjaus
        unique_id: lammitys_sekoitus_hinta_korjaus
        unit_of_measurement: "°C"
        icon: mdi:flash
        state: >
          {% set price_now = states('sensor.energi_data_service') | float(0) %}
          {% set look = states('input_number.lammitys_hinta_ennakko_h') | int(6) %}
          {% set ns = namespace(sum=0.0, n=0) %}
          {% for attr in ['raw_today', 'raw_tomorrow'] %}
            {% set rows = state_attr('sensor.energi_data_service', attr) %}
            {% if rows %}
              {% for item in rows %}
                {% set ts = item.hour if item.hour is defined else none %}
                {% set pr = item.price if item.price is defined else none %}
                {% if ts is not none and pr is not none %}
                  {% set start = as_datetime(ts) %}
                  {% if start is not none and start >= now() - timedelta(minutes=15) and start < now() + timedelta(hours=look) %}
                    {% set ns.sum = ns.sum + (pr | float(0)) %}
                    {% set ns.n = ns.n + 1 %}
                  {% endif %}
                {% endif %}
              {% endfor %}
            {% endif %}
          {% endfor %}
          {% set avg_ahead = (ns.sum / ns.n) if ns.n > 0 else price_now %}
          {% set price_eff = price_now + 0.5 * (price_now - avg_ahead) %}
          {% set p_lo = states('input_number.lammitys_hinta_halpa') | float(5) %}
          {% set p_hi = states('input_number.lammitys_hinta_kallis') | float(50) %}
          {% set nosto = states('input_number.lammitys_hinta_nosto_max') | float(2) %}
          {% set rajoitus = states('input_number.lammitys_hinta_rajoitus_max') | float(8) %}
          {% if p_hi <= p_lo %}0
          {% elif price_eff <= p_lo %}{{ nosto | round(1) }}
          {% elif price_eff >= p_hi %}{{ (-rajoitus) | round(1) }}
          {% else %}
            {% set x = (price_eff - p_lo) / (p_hi - p_lo) %}
            {{ (nosto + (-rajoitus - nosto) * x) | round(1) }}
          {% endif %}
      - name: Lammitys sekoitus kaytto
        unique_id: lammitys_sekoitus_kaytto
        unit_of_measurement: "°C"
        device_class: temperature
        icon: mdi:valve
        state: >
          {% set kayra = states('sensor.lammitys_sekoitus_kayra') | float(35) %}
          {% set huone = states('sensor.lammitys_huone_max') | float(0) %}
          {% set raja = states('sensor.lammitys_vesi_huone_raja') | float(0) %}
          {% set katto = states('input_number.lammitys_kayra_meno_max') | float(48) %}
          {% set lattia = states('input_number.lammitys_kayra_meno_min') | float(35) %}
          {% if raja <= 0 %}
            {{ [[lattia, kayra] | min, katto] | min | round(1) }}
          {% else %}
            {% set siirto = huone - 21 %}
            {{ [[raja, kayra + siirto] | max, katto] | min | round(1) }}
          {% endif %}
      - name: Sekoitusventtiilin tavoite ja hinta
        unique_id: lammitys_sekoitus_teksti
        icon: mdi:valve
        state: >
          {% set tavoite = states('sensor.lammitys_sekoitus_kaytto') | float(none) %}
          {% set kayra = states('sensor.lammitys_sekoitus_kayra') | float(none) %}
          {% set huone = states('sensor.lammitys_huone_max') | float(none) %}
          {% set raja = states('sensor.lammitys_vesi_huone_raja') | float(none) %}
          {% set kv = states('sensor.vilp_ohjaus_lampotilat_air_temperature_8') | float(none) %}
          {% if tavoite is none %}Ei menovesitavoitetta
          {% elif raja is none or raja <= 0 %}Ei huonelämmitystä — käyrä {{ kayra | round(1) if kayra is not none else '?' }} °C
          {% else %}Huone {{ huone | round(1) }} °C → vesi ≥ {{ raja | round(1) }} °C · käyrä {{ kayra | round(1) if kayra is not none else '?' }} °C siirto {{ (huone - 21) | round(1) }} ° → tavoite {{ tavoite | round(1) }} °C{% if kv is not none %} · KV {{ kv | round(1) }} °C{% endif %}{% endif %}
      - name: Miksi sekoituspumppu on päällä tai pois
        unique_id: lammitys_menovesi_teksti
        icon: mdi:pipe-valve
        state: >
          {% set meno = states('sensor.vilp_ohjaus_lampotilat_air_temperature_10') | float(none) %}
          {% set tavoite = states('sensor.lammitys_sekoitus_kaytto') | float(none) %}
          {% set tank = states('sensor.vilp_ohjaus_lampotilat_air_temperature_13') | float(none) %}
          {% set kv = states('sensor.vilp_ohjaus_lampotilat_air_temperature_8') | float(none) %}
          {% set hyst = states('input_number.lammitys_menovesi_hystereesi') | float(1) %}
          {% set delta = [hyst, 1.5] | max %}
          {% set kv_on = [states('sensor.lammitys_kv_pulssi_raja') | float(67), 67] | max %}
          {% set kv_off = [[states('input_number.lammitys_kv_pumppu_pois') | float(64), 64] | max, kv_on - 0.5] | min %}
          {% set katto = states('input_number.lammitys_kayra_meno_max') | float(48) %}
          {% set pump_e = states('input_text.lammitys_sekoituspumppu') | trim %}
          {% if pump_e in ['unknown', 'unavailable', 'none', '', 'switch.sonoff_4_ch_pro_2'] %}
            {% set pump_e = 'switch.sonoff_4_ch_pro_2_tasmota4' %}
          {% endif %}
          {% set pump_on = is_state(pump_e, 'on') if pump_e not in ['unknown', 'unavailable', 'none', ''] else false %}
          {% set kenno = states('sensor.nele_ja_keittio_lattialammitys_anturit_air_temperature_8') | float(0) %}
          {% set solar_p = states('sensor.aurinkolampo_teho_kw') | float(0) %}
          {% set solar_on = is_state('switch.sonoff_4_ch_pro_2_tasmota3', 'on') and (solar_p >= 0.3 or (kenno - (tank if tank is not none else 0)) >= 5) %}
          {% set solar_riittaa = is_state('binary_sensor.aurinkolampo_riittaa', 'on') %}
          {% set solar_block = solar_on and solar_riittaa and (solar_p >= (states('input_number.lammitys_aurinko_teho_raja') | float(0.8))) %}
          {% set solar_extra = states('input_number.lammitys_aurinko_varo') | float(2.5) if solar_block else 0 %}
          {% set raja = ([tavoite - solar_extra, katto] | min) if tavoite is not none else none %}
          {% if kv is none %}Ei käyttövesidataa
          {% elif tank is none %}Ei lämmitysvaraajadataa
          {% elif kv <= kv_off %}Sekoituspumppu pois — suojaa käyttövettä {{ kv | round(1) }} °C (pois ≤ {{ kv_off | round(1) }} °C), lämmitä lattia vastuksella
          {% elif is_state('binary_sensor.lammitys_kv_vastus', 'on') %}KV 3 kW vastus näyttää päällä ({{ state_attr('sensor.lammitys_kv_seuranta', 'teho_extra_kw') | float(0) | round(1) }} kW yli) — sekoitus ei varasta, ettei vastus jää päälle
          {% elif (state_attr('sensor.lammitys_kv_seuranta', 'lasku_5min') | float(0)) >= 1.2 %}KV laski {{ state_attr('sensor.lammitys_kv_seuranta', 'lasku_5min') }} °C / 5 min — sekoitus seis
          {% elif is_state('timer.lammitys_sekoitus_pulssi', 'active') %}Pulssi — KV {{ kv | round(1) }} °C → varaaja {{ tank | round(1) }} °C
          {% elif is_state('timer.lammitys_sekoitus_odota', 'active') %}Odottaa KV · edellinen lasku {{ states('input_number.lammitys_kv_viime_lasku') }} °C · KV {{ kv | round(1) }} °C
          {% elif solar_block %}Sekoituspumppu pois — aurinko riittää 300 l varaajaan ({{ solar_p }} kW), ei kilpailla
          {% elif kv < kv_on and not pump_on %}{% if is_state('binary_sensor.lammitys_varaaja_tarve', 'on') %}Varaaja kutsuu lämpöä — KV {{ kv | round(1) }} °C liian kylmä sekoitukselle (päälle ≥ {{ kv_on | round(1) }} °C), läpivirtausvastus jos kierto päällä{% else %}Sekoituspumppu odottaa — KV {{ kv | round(1) }} °C (päälle ≥ {{ kv_on | round(1) }} °C, ettei KV laske liikaa){% endif %}{% if solar_on and not solar_riittaa %} · aurinko päällä, ei riitä 300 l{% endif %}
          {% elif kv < tank + delta %}Sekoituspumppu pois — KV {{ kv | round(1) }} °C ei ole tarpeeksi kuumempi kuin varaaja {{ tank | round(1) }} °C (ero ≥ {{ delta | round(1) }} °C)
          {% elif tank >= katto %}Sekoituspumppu pois — varaaja {{ tank | round(1) }} °C (katto {{ katto | round(1) }} °C)
          {% elif solar_block and raja is not none and tank >= raja %}Aurinko lämmittää — sekoituspumppu lepää kunnes varaaja {{ raja | round(1) }} °C
          {% elif pump_on %}Lataa varaajaa KV {{ kv | round(1) }} °C → {{ tank | round(1) }} °C{% if raja is not none %} · lataus {{ raja | round(1) }} °C{% endif %} — painopiste lattiassa{% if solar_on and not solar_riittaa %} · aurinko päällä, ei riitä 300 l, lämmitä myös vastuksella{% endif %}
          {% elif raja is not none and tank >= raja %}Varaaja {{ tank | round(1) }} °C · lataus {{ raja | round(1) }} °C — ok
          {% else %}Varaaja {{ tank | round(1) }} °C alle latauksen {{ raja | round(1) if raja is not none else '?' }} °C — seuraava pulssi kun KV ≥ {{ kv_on | round(1) }} °C{% if solar_on and not solar_riittaa %} · aurinko päällä, ei riitä 300 l, lämmitä myös vastuksella{% endif %}
          {% endif %}
  - trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: homeassistant
        event: start
    sensor:
      - name: Lammitys kv seuranta
        unique_id: lammitys_kv_seuranta
        unit_of_measurement: "°C"
        device_class: temperature
        icon: mdi:water-thermometer
        state: "{{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_8') | float(0) | round(1) }}"
        attributes:
          kv_minuutit: >
            {% set kv = states('sensor.vilp_ohjaus_lampotilat_air_temperature_8') | float(0) %}
            {% set raw = state_attr('sensor.lammitys_kv_seuranta', 'kv_minuutit') %}
            {% set old = raw.split(',') if raw is string else [] %}
            {% set ns = namespace(v=[]) %}
            {% for p in old[:11] %}{% set ns.v = ns.v + [p | float(0)] %}{% endfor %}
            {{ ([kv] + ns.v)[:12] | join(',') }}
          teho_minuutit: >
            {% set p = states('sensor.energia_vaiheiden_summa') | float(0) %}
            {% set raw = state_attr('sensor.lammitys_kv_seuranta', 'teho_minuutit') %}
            {% set old = raw.split(',') if raw is string else [] %}
            {% set ns = namespace(v=[]) %}
            {% for x in old[:11] %}{% set ns.v = ns.v + [x | float(0)] %}{% endfor %}
            {{ ([p] + ns.v)[:12] | join(',') }}
          lasku_5min: >
            {% set kv = states('sensor.vilp_ohjaus_lampotilat_air_temperature_8') | float(0) %}
            {% set raw = state_attr('sensor.lammitys_kv_seuranta', 'kv_minuutit') %}
            {% set old = raw.split(',') if raw is string else [] %}
            {% set hist = [kv] + old %}
            {% if hist | count >= 6 %}{{ ((hist[5] | float(0)) - (hist[0] | float(0))) | round(2) }}
            {% else %}0{% endif %}
          teho_extra_kw: >
            {% set p = states('sensor.energia_vaiheiden_summa') | float(0) %}
            {% set raw = state_attr('sensor.lammitys_kv_seuranta', 'teho_minuutit') %}
            {% set old = raw.split(',') if raw is string else [] %}
            {% set hist = [p] + old %}
            {% if hist | count < 4 %}0
            {% else %}
              {% set ns = namespace(m=none) %}
              {% for x in hist[1:] %}
                {% set v = x | float(0) %}
                {% if ns.m is none or v < ns.m %}{% set ns.m = v %}{% endif %}
              {% endfor %}
              {{ ((p - (ns.m | float(p))) / 1000) | round(2) }}
            {% endif %}
  - sensor:
      - name: Lammitys kv pulssi raja
        unique_id: lammitys_kv_pulssi_raja
        unit_of_measurement: "°C"
        device_class: temperature
        icon: mdi:water-thermometer
        state: >
          {% set base = [states('input_number.lammitys_kv_pumppu_paalle') | float(68), 67] | max %}
          {% set spot = states('sensor.energi_data_service') | float(10) %}
          {% set extra = [[(spot - 6) / 4, 0] | max, 5] | min %}
          {{ (base + extra) | round(1) }}
        attributes:
          selite: "Vähintään 67 °C. Kallista spotista lisä (3 kW KV-vastus ei saa syttyä turhaan)."
  - binary_sensor:
      - name: Lammitys kv vastus
        unique_id: lammitys_kv_vastus
        icon: mdi:heating-coil
        device_class: heat
        state: >
          {% set extra = state_attr('sensor.lammitys_kv_seuranta', 'teho_extra_kw') | float(0) %}
          {% set lasku = state_attr('sensor.lammitys_kv_seuranta', 'lasku_5min') | float(0) %}
          {% set pump = is_state('binary_sensor.lammitys_sekoituspumppu_paalla', 'on') %}
          {{ (extra >= 2.2 and extra <= 5.5) or ((not pump) and lasku <= -0.3) }}
      - name: Lammitys sekoitus sallittu
        unique_id: lammitys_sekoitus_sallittu
        icon: mdi:valve
        state: >
          {{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_8') | float(0) >= (states('sensor.lammitys_kv_pulssi_raja') | float(67)) }}
      - name: Lammitys varaaja tarve
        unique_id: lammitys_varaaja_tarve
        icon: mdi:water-boiler
        device_class: heat
        state: >
          {% set mode = states('climate.lattialammitys') %}
          {% set act = state_attr('climate.lattialammitys', 'hvac_action') %}
          {% set cur = state_attr('climate.lattialammitys', 'current_temperature') | float(none) %}
          {% set tgt = state_attr('climate.lattialammitys', 'temperature') | float(none) %}
          {% set tank = states('sensor.vilp_ohjaus_lampotilat_air_temperature_13') | float(none) %}
          {% set tavoite = states('sensor.lammitys_sekoitus_kaytto') | float(35) %}
          {% set katto = states('input_number.lammitys_kayra_meno_max') | float(48) %}
          {% set raja = [tavoite, katto] | min %}
          {% set mitta = cur if cur is not none else tank %}
          {{ mode == 'heat'
             and (
               act == 'heating'
               or (mitta is not none and tgt is not none and mitta < tgt)
               or (mitta is not none and mitta < raja)
             ) }}
      - name: Lammitys aurinko lammittaa
        unique_id: lammitys_aurinko_lammittaa
        icon: mdi:solar-power
        device_class: heat
        state: >
          {% set pump = is_state('switch.sonoff_4_ch_pro_2_tasmota3', 'on') %}
          {% set kenno = states('sensor.nele_ja_keittio_lattialammitys_anturit_air_temperature_8') | float(0) %}
          {% set tank = states('sensor.vilp_ohjaus_lampotilat_air_temperature_13') | float(0) %}
          {% set p = states('sensor.aurinkolampo_teho_kw') | float(0) %}
          {{ pump and (p >= 0.3 or (kenno - tank) >= 5) }}
      - name: Lammitys sekoituspumppu paalla
        unique_id: lammitys_sekoituspumppu_paalla
        icon: mdi:pump
        device_class: running
        state: >
          {% set pump_e = states('input_text.lammitys_sekoituspumppu') | trim %}
          {% if pump_e in ['unknown', 'unavailable', 'none', '', 'switch.sonoff_4_ch_pro_2'] %}
            {% set pump_e = 'switch.sonoff_4_ch_pro_2_tasmota4' %}
          {% endif %}
          {{ is_state(pump_e, 'on') if pump_e not in ['unknown', 'unavailable', 'none', ''] else false }}
      - name: Lammitys ll tarve
        unique_id: lammitys_ll_tarve
        icon: mdi:radiator
        device_class: heat
        state: >
          {{ is_state('switch.eteisen_lattialammitys', 'on')
             or is_state('switch.nele_ja_keittio_lattialammitys_anturit', 'on')
             or is_state('switch.olohuone_hm_lattialammitys_6', 'on')
             or is_state('switch.makuhuone_glen_lattialammitys', 'on')
             or is_state('switch.olohuone_hm_lattialammitys', 'on')
             or is_state('switch.makuhuone_glen_lattialammitys_6', 'on')
             or is_state('switch.nele_ja_keittio_lattialammitys_anturit_6', 'on')
             or state_attr('climate.olohuone_lattialammitys', 'hvac_action') == 'heating'
             or state_attr('climate.keittio_lattialammitys', 'hvac_action') == 'heating'
             or state_attr('climate.hm_lattialammitys', 'hvac_action') == 'heating'
             or state_attr('climate.makuhuone_lattialammitys', 'hvac_action') == 'heating'
             or state_attr('climate.glen_lattialammitys', 'hvac_action') == 'heating'
             or state_attr('climate.nele_lattialammitys', 'hvac_action') == 'heating'
             or state_attr('climate.eteisen_lattialammitys', 'hvac_action') == 'heating' }}
      - name: Lammitys piiri auki
        unique_id: lammitys_piiri_auki
        icon: mdi:pipe-valve
        state: >
          {{ is_state('switch.eteisen_lattialammitys', 'on')
             or is_state('switch.nele_ja_keittio_lattialammitys_anturit', 'on')
             or is_state('switch.olohuone_hm_lattialammitys_6', 'on')
             or is_state('switch.makuhuone_glen_lattialammitys', 'on')
             or is_state('switch.olohuone_hm_lattialammitys', 'on')
             or is_state('switch.makuhuone_glen_lattialammitys_6', 'on')
             or is_state('switch.nele_ja_keittio_lattialammitys_anturit_6', 'on') }}
      - name: Lammitys vastus nostaa
        unique_id: lammitys_vastus_nostaa
        icon: mdi:heating-coil
        device_class: heat
        state: >
          {{ is_state('input_select.lammitys_vastus', 'Automaatti')
             and (not is_state('binary_sensor.lammitys_hetki_rajoita_vesi', 'on')
                  or is_state('binary_sensor.lammitys_huone_alaraja', 'on'))
             and (states('sensor.vilp_ohjaus_lampotilat_air_temperature_8') | float(99))
                 < (states('input_number.lammitys_kv_pumppu_paalle') | float(58)) }}
      - name: Lammitys vesi riittaa
        unique_id: lammitys_vesi_riittaa
        icon: mdi:water-thermometer
        state: >
          {% set raja = states('sensor.lammitys_vesi_huone_raja') | float(0) %}
          {% if raja <= 0 %}true
          {% else %}
            {% set tank = states('sensor.vilp_ohjaus_lampotilat_air_temperature_13') | float(none) %}
            {% set meno = states('sensor.vilp_ohjaus_lampotilat_air_temperature_10') | float(none) %}
            {% set vesi = [tank if tank is not none else -99, meno if meno is not none else -99] | max %}
            {{ vesi >= raja }}
          {% endif %}
  - sensor:
      - name: Lammitys huone max
        unique_id: lammitys_huone_max
        unit_of_measurement: "°C"
        device_class: temperature
        icon: mdi:thermostat
        state: >
          {% set ns = namespace(t=0) %}
          {% if is_state('input_select.lammitys_tila_olohuone_keittio', 'Automaatti')
             and is_state('binary_sensor.lammitys_terassi_auki', 'off') %}
            {% if is_state('timer.lammitys_korotus_olohuone_keittio', 'active') %}
              {% set ns.t = [ns.t, states('sensor.lammitys_kaytto_olohuone_keittio') | float(21)] | max %}
            {% elif 'Olo+keittiö' in (state_attr('binary_sensor.lammitys_huone_alaraja', 'huoneet') | default('')) %}
              {% set ns.t = [ns.t, states('sensor.lammitys_kaytto_olohuone_keittio') | float(21)] | max %}
            {% elif is_state('binary_sensor.lammitys_hetki_rajoita_huone', 'on') %}
              {% set tausta = states('input_number.lammitys_lattia_tausta_olokeittio') | float(18) %}
              {% set drop = states('input_number.lammitys_hetki_huone_lasku') | float(2) %}
              {% set ns.t = [ns.t, [tausta - drop, 17] | max] | max %}
            {% elif is_state('binary_sensor.lammitys_ennakoiva', 'on') %}
              {% set ns.t = [ns.t, states('sensor.lammitys_kaytto_olohuone_keittio') | float(21)] | max %}
            {% else %}
              {% set ns.t = [ns.t, states('input_number.lammitys_lattia_tausta_olokeittio') | float(18)] | max %}
            {% endif %}
          {% endif %}
          {% for z in [
            ('input_select.lammitys_tila_hm', 'binary_sensor.lammitys_hm_ikkuna_auki', 'sensor.lammitys_kaytto_hm', 20),
            ('input_select.lammitys_tila_makuhuone', 'binary_sensor.lammitys_makuhuone_ikkuna_auki', 'sensor.lammitys_kaytto_makuhuone', 20),
            ('input_select.lammitys_tila_glen', 'binary_sensor.lammitys_glen_ikkuna_auki', 'sensor.lammitys_kaytto_glen', 20),
            ('input_select.lammitys_tila_nele', 'binary_sensor.lammitys_nele_ikkuna_auki', 'sensor.lammitys_kaytto_nele', 20),
            ('input_select.lammitys_tila_eteinen', 'binary_sensor.lammitys_eteinen_ovi_auki', 'sensor.lammitys_kaytto_eteinen', 23)
          ] %}
            {% if is_state(z[0], 'Automaatti') and is_state(z[1], 'off') %}
              {% set ns.t = [ns.t, states(z[2]) | float(z[3])] | max %}
            {% endif %}
          {% endfor %}
          {{ ns.t | round(1) if ns.t > 17 else 0 }}
      - name: Lammitys vesi huone raja
        unique_id: lammitys_vesi_huone_raja
        unit_of_measurement: "°C"
        device_class: temperature
        icon: mdi:thermometer-water
        state: >
          {% set h = states('sensor.lammitys_huone_max') | float(0) %}
          {{ (h + 5) | round(1) if h > 17 else 0 }}
  - trigger:
      - platform: time_pattern
        seconds: "/10"
      - platform: homeassistant
        event: start
      - platform: state
        entity_id:
          - switch.sonoff_4_ch_pro_2_tasmota2
          - switch.pannuhuone_lapivirtausvastus
          - binary_sensor.lammitys_ll_tarve
          - binary_sensor.lammitys_piiri_auki
          - binary_sensor.lammitys_varaaja_tarve
          - input_select.lammitys_vastus
          - sensor.vilp_ohjaus_lampotilat_air_temperature_8
          - sensor.vilp_ohjaus_lampotilat_air_temperature_10
          - sensor.lammitys_sekoitus_kaytto
          - input_number.lammitys_kv_pumppu_paalle
          - input_number.lammitys_menovesi_hystereesi
          - input_number.lammitys_kayra_meno_max
          - input_number.lammitys_vastus_pumppu_min
          - input_number.lammitys_vastus_paalla_nyt
          - timer.lammitys_vastus_pulssi
          - timer.lammitys_vastus_odota
          - timer.lammitys_ll_pumppu_viive
          - binary_sensor.lammitys_hetki_rajoita_vesi
          - binary_sensor.lammitys_huone_alaraja
          - sensor.hetkellinen_kustannus
    binary_sensor:
      - name: Lammitys ll pumppu valmis
        unique_id: lammitys_ll_pumppu_valmis
        icon: mdi:pump
        device_class: running
        state: >
          {% set e = states.switch.sonoff_4_ch_pro_2_tasmota2 %}
          {% set min_s = (states('input_number.lammitys_vastus_pumppu_min') | float(4)) * 60 %}
          {{ is_state('switch.sonoff_4_ch_pro_2_tasmota2', 'on')
             and e is not none
             and (as_timestamp(now()) - as_timestamp(e.last_changed)) >= min_s }}
      - name: Lammitys vastus sallittu
        unique_id: lammitys_vastus_sallittu
        icon: mdi:heating-coil
        state: >
          {% set kv = states('sensor.vilp_ohjaus_lampotilat_air_temperature_8') | float(none) %}
          {% set meno_s = states('sensor.vilp_ohjaus_lampotilat_air_temperature_10') %}
          {% set meno = meno_s | float(none) if meno_s not in ['unknown', 'unavailable', 'none', ''] else none %}
          {% set tavoite = states('sensor.lammitys_sekoitus_kaytto') | float(35) %}
          {% set hyst = states('input_number.lammitys_menovesi_hystereesi') | float(1) %}
          {% set kv_on = states('input_number.lammitys_kv_pumppu_paalle') | float(58) %}
          {% set katto = states('input_number.lammitys_kayra_meno_max') | float(48) %}
          {% set e = states.switch.sonoff_4_ch_pro_2_tasmota2 %}
          {% set min_s = (states('input_number.lammitys_vastus_pumppu_min') | float(4)) * 60 %}
          {% set kierto_ok = is_state('switch.sonoff_4_ch_pro_2_tasmota2', 'on') and e is not none and (as_timestamp(now()) - as_timestamp(e.last_changed)) >= min_s %}
          {{ is_state('input_select.lammitys_vastus', 'Automaatti')
             and (not is_state('binary_sensor.lammitys_hetki_rajoita_vesi', 'on')
                  or is_state('binary_sensor.lammitys_huone_alaraja', 'on'))
             and is_state('binary_sensor.lammitys_piiri_auki', 'on')
             and (is_state('binary_sensor.lammitys_ll_tarve', 'on')
                  or (is_state('binary_sensor.lammitys_varaaja_tarve', 'on')
                      and ((states('sensor.lammitys_vesi_huone_raja') | float(0)) > 0
                           or is_state('binary_sensor.lammitys_ennakoiva', 'on'))))
             and kierto_ok
             and kv is not none and kv < kv_on
             and meno is not none
             and meno < (tavoite - hyst)
             and meno < (katto - 0.5) }}
    sensor:
      - name: Miksi läpivirtausvastus on päällä tai pois
        unique_id: lammitys_vastus_teksti
        icon: mdi:heating-coil
        state: >
          {% set kv = states('sensor.vilp_ohjaus_lampotilat_air_temperature_8') | float(none) %}
          {% set meno = states('sensor.vilp_ohjaus_lampotilat_air_temperature_10') | float(none) %}
          {% set tavoite = states('sensor.lammitys_sekoitus_kaytto') | float(none) %}
          {% set kv_on = states('input_number.lammitys_kv_pumppu_paalle') | float(58) %}
          {% set nyt = states('input_number.lammitys_vastus_paalla_nyt') | int(15) %}
          {% set pois = states('input_number.lammitys_vastus_pois_s') | int(30) %}
          {% set min_m = states('input_number.lammitys_vastus_pumppu_min') | int(4) %}
          {% set e = states.switch.sonoff_4_ch_pro_2_tasmota2 %}
          {% set kierto_s = (as_timestamp(now()) - as_timestamp(e.last_changed)) | int(0) if e is not none and is_state('switch.sonoff_4_ch_pro_2_tasmota2', 'on') else 0 %}
          {% if is_state('input_select.lammitys_vastus', 'Pois') %}Pois
          {% elif is_state('binary_sensor.lammitys_hetki_rajoita_vesi', 'on')
               and not is_state('binary_sensor.lammitys_huone_alaraja', 'on') %}Hetkellinen {{ states('sensor.hetkellinen_kustannus') }} c/t — läpivirtausvastus kielletty
          {% elif is_state('binary_sensor.lammitys_hetki_rajoita_vesi', 'on')
               and is_state('binary_sensor.lammitys_huone_alaraja', 'on') %}Huone alarajalla — vastuskielto ohitettu
          {% elif not is_state('switch.sonoff_4_ch_pro_2_tasmota2', 'on') %}Kierto pois — ei läpivirtauksia, vastus kielletty
          {% elif not is_state('binary_sensor.lammitys_piiri_auki', 'on') %}Ei yhtään lämmityspiiriä päällä — pelkkä kiertopumppu ei riitä, vastus kielletty
          {% elif is_state('switch.pannuhuone_lapivirtausvastus', 'on') %}Pulssi {{ nyt }} s — lämmittää menovettä {{ meno | round(1) if meno is not none else '?' }} °C
          {% elif is_state('timer.lammitys_vastus_odota', 'active') %}Tauko {{ pois }} s · seuraava {{ nyt }} s · meno {{ meno | round(1) if meno is not none else '?' }} °C
          {% elif not is_state('binary_sensor.lammitys_ll_tarve', 'on')
               and not is_state('binary_sensor.lammitys_varaaja_tarve', 'on') %}Ei lattia- eikä varaajatarvetta — vastus pois
          {% elif not is_state('binary_sensor.lammitys_ll_pumppu_valmis', 'on') %}Odottaa kiertoa {{ [min_m * 60 - kierto_s, 0] | max }} s (min {{ min_m }} min) ennen vastusta
          {% elif kv is none %}Ei käyttövesidataa — vastus pois
          {% elif kv >= kv_on %}KV {{ kv | round(1) }} °C riittää — sekoituspumppu lataa varaajaa, vastus pois
          {% elif meno is none %}Ei menovesidataa — vastus pois
          {% elif tavoite is not none and meno >= tavoite - (states('input_number.lammitys_menovesi_hystereesi') | float(1)) %}Menovesi {{ meno | round(1) }} °C riittää
          {% else %}Valmis pulssittamaan {{ nyt }}/{{ pois }} s · meno {{ meno | round(1) }} → {{ tavoite | round(1) if tavoite is not none else '?' }} °C
          {% endif %}
automation:
  - id: lammitys_korotus_oletus
    alias: Lämmitys korotus oletus
    mode: single
    trigger:
      - platform: homeassistant
        event: start
    action:
      - repeat:
          for_each:
            - olohuone_keittio
            - hm
            - makuhuone
            - glen
            - nele
            - eteinen
          sequence:
            - if:
                - condition: template
                  value_template: "{{ states('input_number.lammitys_korotus_' ~ repeat.item) | float(0) == 1.5 }}"
              then:
                - action: input_number.set_value
                  target:
                    entity_id: "input_number.lammitys_korotus_{{ repeat.item }}"
                  data:
                    value: 4
            - if:
                - condition: template
                  value_template: "{{ states('input_number.lammitys_kesto_' ~ repeat.item) | float(0) == 60 }}"
              then:
                - action: input_number.set_value
                  target:
                    entity_id: "input_number.lammitys_kesto_{{ repeat.item }}"
                  data:
                    value: 240
      - if:
          - condition: template
            value_template: "{{ states('input_number.lammitys_kv_pumppu_paalle') | float(0) == 58 }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.lammitys_kv_pumppu_paalle
            data:
              value: 68
      - if:
          - condition: template
            value_template: "{{ states('input_number.lammitys_kv_pumppu_pois') | float(0) == 56 }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.lammitys_kv_pumppu_pois
            data:
              value: 64
      - if:
          - condition: template
            value_template: "{{ states('input_number.lammitys_sekoitus_pulssi_s') | float(0) == 30 }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.lammitys_sekoitus_pulssi_s
            data:
              value: 15
      - if:
          - condition: template
            value_template: "{{ states('input_number.lammitys_sekoitus_odota_s') | float(0) == 90 }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.lammitys_sekoitus_odota_s
            data:
              value: 180
      - if:
          - condition: template
            value_template: "{{ states('input_number.lammitys_kv_pulse_max_lasku') | float(0) == 1 }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.lammitys_kv_pulse_max_lasku
            data:
              value: 0.5
  - id: lammitys_olohuone_keittio
    alias: Lämmitys olohuone ja keittiö
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/3"
      - platform: state
        entity_id:
          - sensor.vilp_ohjaus_lampotilat_air_temperature_13
          - sensor.vilp_ohjaus_lampotilat_air_temperature_10
          - binary_sensor.terassi_ovi_contact
          - input_select.lammitys_tila_olohuone_keittio
          - timer.lammitys_korotus_olohuone_keittio
          - sensor.lammitys_kaytto_olohuone_keittio
          - sensor.lammitys_tavoite_olohuone_keittio
          - input_number.lammitys_korotus_olohuone_keittio
          - binary_sensor.lammitys_halpa_sahko
          - input_number.lammitys_hinta_lattia_raja
          - input_number.lammitys_lattia_tausta_olokeittio
          - binary_sensor.lammitys_hetki_rajoita_huone
          - input_number.lammitys_hetki_huone_lasku
          - binary_sensor.lammitys_huone_alaraja
          - binary_sensor.lammitys_ennakoiva
          - binary_sensor.lammitys_vastus_nostaa
    action:
      - variables:
          lampo: >
            {% set kylma = 'Olo+keittiö' in (state_attr('binary_sensor.lammitys_huone_alaraja', 'huoneet') | default('')) %}
            {% if is_state('input_select.lammitys_tila_olohuone_keittio', 'Pois') %}{% set t = 17 %}
            {% elif is_state('timer.lammitys_korotus_olohuone_keittio', 'active') %}
              {% set s = states('sensor.lammitys_tavoite_olohuone_keittio') %}
              {% set base = s | float(21) if s not in ['unknown','unavailable','none',''] else 21 %}
              {% set k = states('input_number.lammitys_korotus_olohuone_keittio') | float(4) %}
              {% set t = [base + k, 30] | min | round(1) %}
            {% elif is_state('binary_sensor.lammitys_terassi_auki', 'on') %}{% set t = 17 %}
            {% elif kylma %}
              {% set t = [states('sensor.lammitys_kaytto_olohuone_keittio') | float(21), 19] | max %}
            {% elif is_state('binary_sensor.lammitys_hetki_rajoita_huone', 'on') %}
              {% set tausta = states('input_number.lammitys_lattia_tausta_olokeittio') | float(18) %}
              {% set drop = states('input_number.lammitys_hetki_huone_lasku') | float(2) %}
              {% set t = [tausta - drop, 17] | max | round(1) %}
            {% elif is_state('binary_sensor.lammitys_ennakoiva', 'on') %}
              {% set t = states('sensor.lammitys_kaytto_olohuone_keittio') | float(21) %}
            {% else %}{% set t = states('input_number.lammitys_lattia_tausta_olokeittio') | float(18) %}
            {% endif %}
            {% set tank = states('sensor.vilp_ohjaus_lampotilat_air_temperature_13') | float(0) %}
            {% set meno = states('sensor.vilp_ohjaus_lampotilat_air_temperature_10') | float(0) %}
            {% set vesi = [tank, meno] | max %}
            {% if t <= 17 %}17
            {% elif kylma or is_state('binary_sensor.lammitys_vastus_nostaa', 'on') or vesi >= (t + 5) %}{{ t }}
            {% else %}17{% endif %}
      - action: script.lammitys_aseta_termostaatti
        data:
          climates:
            - climate.olohuone_lattialammitys
            - climate.keittio_lattialammitys
          temperature: "{{ lampo }}"
  - id: lammitys_hm
    alias: Lämmitys HM
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/3"
      - platform: state
        entity_id:
          - sensor.vilp_ohjaus_lampotilat_air_temperature_13
          - sensor.vilp_ohjaus_lampotilat_air_temperature_10
          - binary_sensor.hm_ikkunatunnistin_contact
          - input_select.lammitys_tila_hm
          - timer.lammitys_korotus_hm
          - sensor.lammitys_kaytto_hm
          - sensor.lammitys_tavoite_hm
          - input_number.lammitys_korotus_hm
          - binary_sensor.lammitys_hetki_rajoita_huone
          - binary_sensor.lammitys_huone_alaraja
          - binary_sensor.lammitys_ennakoiva
          - binary_sensor.lammitys_vastus_nostaa
    action:
      - variables:
          lampo: >
            {% set kylma = 'HM' in (state_attr('binary_sensor.lammitys_huone_alaraja', 'huoneet') | default('')) %}
            {% if is_state('input_select.lammitys_tila_hm', 'Pois') %}{% set t = 17 %}
            {% elif is_state('timer.lammitys_korotus_hm', 'active') %}
              {% set s = states('sensor.lammitys_tavoite_hm') %}
              {% set base = s | float(20) if s not in ['unknown','unavailable','none',''] else 20 %}
              {% set k = states('input_number.lammitys_korotus_hm') | float(4) %}
              {% set t = [base + k, 30] | min | round(1) %}
            {% elif is_state('binary_sensor.lammitys_hm_ikkuna_auki', 'on') %}{% set t = 17 %}
            {% else %}{% set t = states('sensor.lammitys_kaytto_hm') | float(20) %}
