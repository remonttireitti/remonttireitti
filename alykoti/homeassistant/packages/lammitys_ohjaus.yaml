    max: 90
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:water-thermometer
    initial: 0
  lammitys_kv_viime_lasku:
    name: "Mittaus: paljonko KV laski viime pulssissa (ohjaus käyttää, ei tarvitse säätää)"
    min: -5
    max: 20
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:delta
    initial: 0
  lammitys_vastus_paalla_min:
    name: "Vastus: lyhin päällä-aika. Ohjaus aloittaa tästä ja nostaa vain jos meno ei nouse"
    min: 10
    max: 30
    step: 5
    mode: slider
    unit_of_measurement: s
    icon: mdi:timer-outline
    initial: 15
  lammitys_vastus_paalla_max:
    name: "Vastus: pisin päällä-aika. Ei jatkuvaa päälle, aina tauko väliin"
    min: 20
    max: 60
    step: 5
    mode: slider
    unit_of_measurement: s
    icon: mdi:timer
    initial: 45
  lammitys_vastus_paalla_nyt:
    name: "Vastus: nykyinen päällä-aika (ohjaus säätää itse)"
    min: 10
    max: 60
    step: 5
    mode: box
    unit_of_measurement: s
    icon: mdi:timer-play
    initial: 15
  lammitys_vastus_pois_s:
    name: "Vastus: pois-aika pulssien välissä. Vesi ehtii sekoittua, putki ei kuumene paikallaan"
    min: 20
    max: 90
    step: 5
    mode: slider
    unit_of_measurement: s
    icon: mdi:timer-sand
    initial: 30
  lammitys_vastus_pumppu_min:
    name: Vastus kielletty kunnes kiertopumppu on ollut päällä näin monta minuuttia
    min: 2
    max: 10
    step: 1
    mode: slider
    unit_of_measurement: min
    icon: mdi:pump
    initial: 4
  lammitys_ll_pumppu_viive_s:
    name: "Kun lattia sammuu: vastus pois heti, kiertopumppu jää tähän ajaksi jäähdyttämään vastusta"
    min: 30
    max: 300
    step: 10
    mode: slider
    unit_of_measurement: s
    icon: mdi:timer-sand
    initial: 120
  lammitys_vastus_max_nousu:
    name: Vastus pois heti jos meno nousee näin paljon yhden pulssin aikana (ylikuumeneminen)
    min: 0.5
    max: 4
    step: 0.1
    mode: slider
    unit_of_measurement: "°C"
    icon: mdi:thermometer-chevron-up
    initial: 1.5
  lammitys_vastus_meno_ennen:
    name: "Mittaus: meno pulssin alussa (ohjaus käyttää, ei tarvitse säätää)"
    min: 0
    max: 90
    step: 0.1
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:thermometer
    initial: 0
  lammitys_hetki_raja_huone:
    name: "Hetkellinen kustannus: tästä alkaen rajoitetaan huonetermostaatteja (c/t)"
    min: 20
    max: 80
    step: 1
    mode: box
    unit_of_measurement: "c/t"
    icon: mdi:cash-minus
    initial: 40
  lammitys_hetki_raja_vesi:
    name: "Hetkellinen kustannus: tästä alkaen kielletään läpivirtausvastus (c/t)"
    min: 25
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "c/t"
    icon: mdi:cash-remove
    initial: 50
  lammitys_hetki_hystereesi:
    name: "Hetkellinen kustannus: rajoitus purkautuu tämän verran rajan alle (c/t)"
    min: 2
    max: 15
    step: 1
    mode: box
    unit_of_measurement: "c/t"
    icon: mdi:swap-vertical
    initial: 5
  lammitys_hetki_huone_lasku:
    name: "Kun hetkellinen kustannus ylittää huonerajan: montako °C termostaatteja lasketaan"
    min: 1
    max: 5
    step: 0.5
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:thermometer-chevron-down
    initial: 2

input_text:
  lammitys_sekoituspumppu:
    name: Sekoituspumpun kytkin (tasmota4). Vie käyttöveden lämpöä lämmityspiirin varaajaan
    initial: switch.sonoff_4_ch_pro_2_tasmota4
    max: 128
    icon: mdi:pump

timer:
  lammitys_korotus_olohuone_keittio:
    name: "Olo+keittiö korotus: montako °C lisätään lattian tavoitteeseen ajastimen ajaksi"
    duration: "04:00:00"
    icon: mdi:timer-sand
  lammitys_korotus_hm:
    name: "HM korotus: montako °C lisätään lattian tavoitteeseen ajastimen ajaksi"
    duration: "04:00:00"
    icon: mdi:timer-sand
  lammitys_korotus_makuhuone:
    name: "Makuhuone korotus: montako °C lisätään lattian tavoitteeseen ajastimen ajaksi"
    duration: "04:00:00"
    icon: mdi:timer-sand
  lammitys_korotus_glen:
    name: "Glen korotus: montako °C lisätään lattian tavoitteeseen ajastimen ajaksi"
    duration: "04:00:00"
    icon: mdi:timer-sand
  lammitys_korotus_nele:
    name: "Nele korotus: montako °C lisätään lattian tavoitteeseen ajastimen ajaksi"
    duration: "04:00:00"
    icon: mdi:timer-sand
  lammitys_korotus_eteinen:
    name: "Eteinen korotus: montako °C lisätään lattian tavoitteeseen ajastimen ajaksi"
    duration: "04:00:00"
    icon: mdi:timer-sand
  lammitys_sekoitus_pulssi:
    name: "Sekoituspumppu: yhden pulssin kesto — siirtää KV:n lämpöä lämmitysvaraajaan, ei saa jäädä päälle"
    duration: "00:00:15"
    icon: mdi:timer-outline
  lammitys_sekoitus_odota:
    name: "Sekoituspumppu: tauko pulssien välissä, mitataan ettei KV laskenut liikaa"
    duration: "00:03:00"
    icon: mdi:timer-sand
  lammitys_vastus_pulssi:
    name: Läpivirtausvastus pulssi
    duration: "00:00:15"
    icon: mdi:timer-outline
  lammitys_vastus_odota:
    name: Läpivirtausvastus tauko
    duration: "00:00:30"
    icon: mdi:timer-sand
  lammitys_ll_pumppu_viive:
    name: "Kun lattia sammuu: vastus pois heti, kiertopumppu jää tähän ajaksi jäähdyttämään vastusta"
    duration: "00:02:00"
    icon: mdi:timer-sand

script:
  lammitys_korotus_kaynnista:
    alias: Lämmitys korotus käynnistä
    mode: parallel
    fields:
      alue:
        description: Lämmitysalue
        required: true
        selector:
          select:
            options:
              - olohuone_keittio
              - hm
              - makuhuone
              - glen
              - nele
              - eteinen
    sequence:
      - variables:
          zone: "{{ alue }}"
          mins: "{{ states('input_number.lammitys_kesto_' ~ zone) | int(240) }}"
          duration: >
            {{ '%02d:%02d:00' | format(mins // 60, mins % 60) }}
      - action: timer.start
        target:
          entity_id: "timer.lammitys_korotus_{{ zone }}"
        data:
          duration: "{{ duration }}"
      - action: automation.trigger
        target:
          entity_id: "automation.lammitys_{{ zone }}"
        data:
          skip_condition: true

  lammitys_korotus_lopeta:
    alias: Lämmitys korotus lopeta
    mode: parallel
    fields:
      alue:
        description: Lämmitysalue
        required: true
        selector:
          select:
            options:
              - olohuone_keittio
              - hm
              - makuhuone
              - glen
              - nele
              - eteinen
    sequence:
      - action: timer.cancel
        target:
          entity_id: "timer.lammitys_korotus_{{ alue }}"
      - action: automation.trigger
        target:
          entity_id: "automation.lammitys_{{ alue }}"
        data:
          skip_condition: true

  lammitys_aseta_termostaatti:
    alias: Lämmitys aseta termostaatti
    description: Sisäinen. Huoneautomaatiot kutsuvat tätä. Älä aja käsin.
    mode: queued
    fields:
      climates:
        description: Climate-entityt
        required: true
        selector:
          entity:
            domain: climate
            multiple: true
      temperature:
        description: Tavoitelämpötila °C
        required: true
        selector:
          number:
            min: 5
            max: 35
            step: 0.5
    sequence:
      - variables:
          climate_list: >
            {% if climates is string %}
              {{ [climates] }}
            {% else %}
              {{ climates }}
            {% endif %}
      - repeat:
          for_each: "{{ climate_list }}"
          sequence:
            - variables:
                eid: "{{ repeat.item }}"
                modes: "{{ state_attr(eid, 'preset_modes') or [] }}"
                clear_preset: >
                  {% if 'none' in modes %}none
                  {% elif 'None' in modes %}None
                  {% elif 'home' in modes %}home
                  {% elif 'comfort' in modes %}comfort
                  {% elif 'Comfort' in modes %}Comfort
                  {% else %}none{% endif %}
            - action: climate.set_preset_mode
              target:
                entity_id: "{{ eid }}"
              data:
                preset_mode: "{{ clear_preset }}"
            - delay:
                milliseconds: 700
            - action: climate.set_hvac_mode
              target:
                entity_id: "{{ eid }}"
              data:
                hvac_mode: heat
            - action: climate.set_temperature
              target:
                entity_id: "{{ eid }}"
              data:
                temperature: "{{ temperature }}"
            - delay:
                milliseconds: 900
            - action: climate.set_preset_mode
              target:
                entity_id: "{{ eid }}"
              data:
                preset_mode: "{{ clear_preset }}"

  lammitys_aseta_sekoitus:
    alias: Lämmitys aseta varaajan termostaatti
    description: Sisäinen. Kirjoittaa climate.lattialammitys -varaajalle tavoitteen. Heater on virtuaalinen, ei lämmitä. Älä aja käsin.
    mode: single
    fields:
      active:
        description: Pidä termostaatti heat-tilassa (aina, paitsi jos lämmitys kokonaan pois)
        required: true
        selector:
          boolean:
      temperature:
        description: Varaajan tavoite °C
        required: true
        selector:
          number:
            min: 30
            max: 55
            step: 0.5
    sequence:
      - choose:
          - conditions: "{{ active }}"
            sequence:
              - action: climate.set_hvac_mode
                target:
                  entity_id: climate.lattialammitys
                data:
                  hvac_mode: heat
              - action: climate.set_temperature
                target:
                  entity_id: climate.lattialammitys
                data:
                  temperature: "{{ temperature }}"
        default:
          - action: climate.set_hvac_mode
            target:
              entity_id: climate.lattialammitys
            data:
              hvac_mode: "off"

  lammitys_aseta_sekoituspumppu:
    alias: Lämmitys aseta sekoituspumppu
    description: Sisäinen. Automaatio Lämmitys sekoituspumppu kutsuu tätä. Älä aja käsin. Ohjaa switch.sonoff_4_ch_pro_2_tasmota4.
    mode: queued
    max: 3
    fields:
      paalle:
        selector:
          boolean:
    sequence:
      - variables:
          pump: >
            {% set c = states('input_text.lammitys_sekoituspumppu') | trim %}
            {{ 'switch.sonoff_4_ch_pro_2_tasmota4' if c in ['unknown', 'unavailable', 'none', '', 'switch.sonoff_4_ch_pro_2'] else c }}
      - choose:
          - conditions: "{{ paalle | bool }}"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: "{{ pump }}"
                continue_on_error: true
        default:
          - action: switch.turn_off
            target:
              entity_id: "{{ pump }}"
            continue_on_error: true

  lammitys_sekoitus_pulssi_alku:
    alias: Lämmitys sekoitus pulssi alku
    description: Sisäinen. Lyhyt pulssi. Älä aja käsin.
    mode: restart
    sequence:
      - variables:
          pulssi_s: >
            {% set b = states('input_number.lammitys_sekoitus_pulssi_s') | int(15) %}
            {% set l = states('input_number.lammitys_kv_viime_lasku') | float(0) %}
            {% set s = states('sensor.energi_data_service') | float(10) %}
            {% set p = b %}
            {% set p = [10, (p * 0.5) | int] | max if l >= 0.4 else p %}
            {% set p = [10, (p * 0.6) | int] | max if s >= 12 else p %}
            {{ p }}
      - action: timer.cancel
        target:
          entity_id: timer.lammitys_sekoitus_odota
      - action: input_number.set_value
        target:
          entity_id: input_number.lammitys_kv_ennen_pulssia
        data:
          value: "{{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_8') | float(0) | round(1) }}"
      - action: timer.start
        target:
          entity_id: timer.lammitys_sekoitus_pulssi
        data:
          duration: "{{ pulssi_s | int(15) }}"
      - action: script.lammitys_aseta_sekoituspumppu
        data:
          paalle: true
      - action: logbook.log
        data:
          name: Lämmitys ohjaus
          entity_id: sensor.lammitys_ohjaus_tila
          message: >
            Sekoituspulssi {{ pulssi_s }} s — KV {{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_8') | float(0) | round(1) }} °C → varaaja {{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_13') | float(0) | round(1) }} °C

  lammitys_sekoitus_pulssi_loppu:
    alias: Lämmitys sekoitus pulssi loppu
    description: Sisäinen. Pumppu pois, KV-odotus (pitenee jos KV laski tai spot kallis). Älä aja käsin.
    mode: restart
    sequence:
      - variables:
          wait_s: >
            {% set l = (states('input_number.lammitys_kv_ennen_pulssia') | float(0)) - (states('sensor.vilp_ohjaus_lampotilat_air_temperature_8') | float(0)) %}
            {% set s = states('sensor.energi_data_service') | float(10) %}
            {% set w = states('input_number.lammitys_sekoitus_odota_s') | int(180) %}
            {% set w = w * 4 if l >= 0.8 else (w * 2 if l >= 0.4 else w) %}
            {% set w = w * 2 if s >= 15 else (w * 1.5 if s >= 8 else w) %}
            {% set w = w * 2 if is_state('binary_sensor.lammitys_kv_vastus', 'on') else w %}
            {{ [w | int, 600] | min }}
      - action: script.lammitys_aseta_sekoituspumppu
        data:
          paalle: false
      - action: timer.cancel
        target:
          entity_id: timer.lammitys_sekoitus_pulssi
      - action: timer.start
        target:
          entity_id: timer.lammitys_sekoitus_odota
        data:
          duration: "{{ wait_s | int(180) }}"
      - action: logbook.log
        data:
          name: Lämmitys ohjaus
          entity_id: sensor.lammitys_ohjaus_tila
          message: >
            Sekoituspulssi ohi — KV laski {{ ((states('input_number.lammitys_kv_ennen_pulssia') | float(0)) - (states('sensor.vilp_ohjaus_lampotilat_air_temperature_8') | float(0))) | round(2) }} °C, odotus {{ wait_s }} s

  lammitys_vastus_pois:
    alias: Lämmitys vastus pois
    description: Sisäinen. Vastus heti pois, pulssit nollaan. Älä aja käsin.
    mode: restart
    sequence:
      - variables:
          oli_paalla: "{{ is_state('switch.pannuhuone_lapivirtausvastus', 'on') }}"
      - action: switch.turn_off
        target:
          entity_id: switch.pannuhuone_lapivirtausvastus
        continue_on_error: true
      - action: timer.cancel
        target:
          entity_id:
            - timer.lammitys_vastus_pulssi
            - timer.lammitys_vastus_odota
        continue_on_error: true
      - action: input_number.set_value
        target:
          entity_id: input_number.lammitys_vastus_paalla_nyt
        data:
          value: "{{ states('input_number.lammitys_vastus_paalla_min') | float(15) }}"
      - if:
          - condition: template
            value_template: "{{ oli_paalla | bool }}"
        then:
          - action: logbook.log
            data:
              name: Lämmitys ohjaus
              entity_id: sensor.lammitys_ohjaus_tila
              message: Läpivirtausvastus pois

  lammitys_vastus_pulssi_alku:
    alias: Lämmitys vastus pulssi alku
    description: Sisäinen. Maltillinen pulssi. Älä aja käsin.
    mode: restart
    sequence:
      - condition: state
        entity_id: binary_sensor.lammitys_vastus_sallittu
        state: "on"
      - condition: state
        entity_id: switch.sonoff_4_ch_pro_2_tasmota2
        state: "on"
      - condition: state
        entity_id: binary_sensor.lammitys_piiri_auki
        state: "on"
      - condition: state
        entity_id: binary_sensor.lammitys_ll_pumppu_valmis
        state: "on"
      - action: timer.cancel
        target:
          entity_id: timer.lammitys_vastus_odota
        continue_on_error: true
      - action: input_number.set_value
        target:
          entity_id: input_number.lammitys_vastus_meno_ennen
        data:
          value: "{{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_10') | float(0) | round(1) }}"
      - variables:
          paalla: >
            {% set n = states('input_number.lammitys_vastus_paalla_nyt') | int(15) %}
            {% set lo = states('input_number.lammitys_vastus_paalla_min') | int(15) %}
            {% set hi = states('input_number.lammitys_vastus_paalla_max') | int(45) %}
            {{ [[n, lo] | max, hi] | min }}
      - action: timer.start
        target:
          entity_id: timer.lammitys_vastus_pulssi
        data:
          duration: "{{ paalla | int(15) }}"
      - action: switch.turn_on
        target:
          entity_id: switch.pannuhuone_lapivirtausvastus
        continue_on_error: true
      - action: logbook.log
        data:
          name: Lämmitys ohjaus
          entity_id: sensor.lammitys_ohjaus_tila
          message: >
            Läpivirtausvastus pulssi {{ paalla }} s — meno {{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_10') | float(0) | round(1) }} °C

  lammitys_vastus_pulssi_loppu:
    alias: Lämmitys vastus pulssi loppu
    description: Sisäinen. Vastus pois, säädä pulssia, tauko. Älä aja käsin.
    mode: restart
    sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.pannuhuone_lapivirtausvastus
        continue_on_error: true
      - action: timer.cancel
        target:
          entity_id: timer.lammitys_vastus_pulssi
        continue_on_error: true
      - variables:
          meno: "{{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_10') | float(0) }}"
          ennen: "{{ states('input_number.lammitys_vastus_meno_ennen') | float(0) }}"
          delta: "{{ (meno | float(0)) - (ennen | float(0)) }}"
          tavoite: "{{ states('sensor.lammitys_sekoitus_kaytto') | float(35) }}"
          hyst: "{{ states('input_number.lammitys_menovesi_hystereesi') | float(1) }}"
          max_nousu: "{{ states('input_number.lammitys_vastus_max_nousu') | float(1.5) }}"
          lo: "{{ states('input_number.lammitys_vastus_paalla_min') | int(15) }}"
          hi: "{{ states('input_number.lammitys_vastus_paalla_max') | int(45) }}"
          nyt: "{{ states('input_number.lammitys_vastus_paalla_nyt') | int(15) }}"
          seuraava: >
            {% set d = delta | float(0) %}
            {% set err = (tavoite | float(35)) - (meno | float(0)) %}
            {% set n = nyt | int(15) %}
            {% set lo = lo | int(15) %}
            {% set hi = hi | int(45) %}
            {% if d >= (max_nousu | float(1.5)) %}
              {% set n = n - 10 %}
            {% elif err <= (hyst | float(1)) %}
              {% set n = lo %}
            {% elif d >= 0.3 %}
              {% set n = n - 5 %}
            {% elif d <= 0.05 %}
              {% set n = n + 5 %}
            {% endif %}
            {{ [[n, lo] | max, hi] | min }}
      - action: logbook.log
        data:
          name: Lämmitys ohjaus
          entity_id: sensor.lammitys_ohjaus_tila
          message: >
            Läpivirtausvastus pois — meno {{ meno | float(0) | round(1) }} °C ({{ delta | float(0) | round(2) }} °C), seuraava pulssi {{ seuraava }} s
      - action: input_number.set_value
        target:
          entity_id: input_number.lammitys_vastus_paalla_nyt
        data:
          value: "{{ seuraava | int(15) }}"
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.lammitys_vastus_sallittu
                state: "on"
            sequence:
              - action: timer.start
                target:
                  entity_id: timer.lammitys_vastus_odota
                data:
                  duration: "{{ states('input_number.lammitys_vastus_pois_s') | int(30) }}"
        default:
          - action: timer.cancel
            target:
              entity_id: timer.lammitys_vastus_odota
            continue_on_error: true
          - action: input_number.set_value
            target:
              entity_id: input_number.lammitys_vastus_paalla_nyt
            data:
              value: "{{ states('input_number.lammitys_vastus_paalla_min') | float(15) }}"

template:
  - sensor:
      - name: Lammitys rajoitus teksti
        unique_id: lammitys_rajoitus_teksti
        icon: mdi:thermometer-alert
        state: >
          {% set t = states('sensor.vilp_ohjaus_lampotilat_air_temperature_13') | float(none) %}
          {% set c = states('sensor.hetkellinen_kustannus') | float(none) %}
          {% set raja_h = states('input_number.lammitys_hetki_raja_huone') | float(40) %}
          {% set raja_v = [states('input_number.lammitys_hetki_raja_vesi') | float(50), raja_h] | max %}
          {% set drop = states('input_number.lammitys_hetki_huone_lasku') | float(2) %}
          {% set huone = is_state('binary_sensor.lammitys_hetki_rajoita_huone', 'on') %}
          {% set vesi = is_state('binary_sensor.lammitys_hetki_rajoita_vesi', 'on') %}
          {% if is_state('binary_sensor.lammitys_huone_alaraja', 'on') %}{{ state_attr('binary_sensor.lammitys_huone_alaraja', 'syy') }} — rajoitukset ohitettu
          {% elif is_state('binary_sensor.lammitys_vastus_nostaa', 'on') and is_state('binary_sensor.lammitys_vesi_riittaa', 'off') %}Varaaja/meno alle huone + 5 °C — vastus nostaa, kierto päällä
          {% elif is_state('binary_sensor.lammitys_vesi_riittaa', 'off') %}Lämmitysvesi alle huone + 5 °C — lattiat pois (turha)
          {% elif vesi %}Hetkellinen {{ c | round(1) if c is not none else '?' }} c/t ≥ {{ raja_v | int }} — huoneet (−{{ drop }} °C) ja läpivirtausvastus pois
          {% elif huone %}Hetkellinen {{ c | round(1) if c is not none else '?' }} c/t ≥ {{ raja_h | int }} — huonetermostaatit −{{ drop }} °C
          {% elif t is none %}Ei lämmitysvesidataa
          {% else %}Lämmitysvesi {{ t | round(1) }} °C · hetkellinen {{ c | round(1) if c is not none else '?' }} c/t — normaali ohjaus{% endif %}
  - trigger:
      - platform: state
        entity_id:
          - switch.sonoff_4_ch_pro_2_tasmota3
          - sensor.vilp_ohjaus_lampotilat_air_temperature_12
          - sensor.vilp_ohjaus_lampotilat_air_temperature_11
          - input_number.lammitys_aurinko_virtaus_l_s
      - platform: homeassistant
        event: start
    sensor:
      - name: Aurinkolämpö lämpötilaero c
        unique_id: aurinkolampo_lampotilaero_c
        unit_of_measurement: °C
        device_class: temperature
        icon: mdi:delta
        state: >
          {% set meno = states('sensor.vilp_ohjaus_lampotilat_air_temperature_12') | float(none) %}
          {% set paluu = states('sensor.vilp_ohjaus_lampotilat_air_temperature_11') | float(none) %}
          {% if meno is none or paluu is none %}unknown
          {% else %}{{ (meno - paluu) | abs | round(1) }}{% endif %}
      - name: Aurinkolämpö teho kW
        unique_id: aurinkolampo_teho_kw
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        icon: mdi:solar-power-variant
        state: >
          {# P = virtaus[L/s] × ρ[kg/L] × cp[kJ/kgK] × ΔT[°C]; 30 % PG ~50 °C #}
          {% set pump = is_state('switch.sonoff_4_ch_pro_2_tasmota3', 'on') %}
          {% set meno = states('sensor.vilp_ohjaus_lampotilat_air_temperature_12') | float(none) %}
          {% set paluu = states('sensor.vilp_ohjaus_lampotilat_air_temperature_11') | float(none) %}
          {% set flow = states('input_number.lammitys_aurinko_virtaus_l_s') | float(0.5) %}
          {% if not pump or meno is none or paluu is none %}0
          {% else %}
            {% set delta = (meno - paluu) | abs %}
            {% if delta < 0.15 %}0
            {% else %}
              {% set rho = 1.042 %}
              {% set cp = 3.75 %}
              {{ (flow * rho * cp * delta) | round(2) }}
            {% endif %}
          {% endif %}
        attributes:
          virtaus_l_s: "{{ states('input_number.lammitys_aurinko_virtaus_l_s') }}"
          lampotilaero_c: "{{ states('sensor.aurinkolampo_lampotilaero_c') }}"
          meno_c: "{{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_12') }}"
          paluu_c: "{{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_11') }}"
          neste: "Propyleeniglykoli 30 %"
          laskenta: "P[kW] = virtaus × 1,042 kg/L × 3,75 kJ/kgK × |meno−paluu|"
      - name: Aurinkolämpö teho teksti
        unique_id: aurinkolampo_teho_teksti
        icon: mdi:solar-power-variant
        state: >
          {% set p = states('sensor.aurinkolampo_teho_kw') | float(0) %}
          {% set d = states('sensor.aurinkolampo_lampotilaero_c') | float(none) %}
          {% set f = states('input_number.lammitys_aurinko_virtaus_l_s') | float(0.5) %}
          {% if not is_state('switch.sonoff_4_ch_pro_2_tasmota3', 'on') %}Pumppu pois — teho 0 kW
          {% elif p < 0.05 %}Pumppu päällä, lämpötilaero pieni ({{ d if d is not none else '?' }} °C) — teho ~0 kW
          {% else %}{{ p }} kW ({{ f }} L/s, ΔT {{ d }} °C, PG 30 %){% endif %}
  - binary_sensor:
      - name: Lammitys rajoitettu
        unique_id: lammitys_rajoitettu
        icon: mdi:thermometer-alert
        state: >
          {{ (is_state('binary_sensor.lammitys_vesi_riittaa', 'off')
              and not is_state('binary_sensor.lammitys_vastus_nostaa', 'on'))
             or is_state('binary_sensor.lammitys_hetki_rajoita_huone', 'on')
             or is_state('binary_sensor.lammitys_hetki_rajoita_vesi', 'on') }}
      - name: Lammitys halpa sahko
        unique_id: lammitys_halpa_sahko
        icon: mdi:cash
        state: >
          {{ (states('sensor.energi_data_service') | float(99)) < (states('input_number.lammitys_hinta_lattia_raja') | float(5)) }}
      - name: Lammitys korotus paalla
        unique_id: lammitys_korotus_paalla
        icon: mdi:thermometer-chevron-up
        state: >
          {{ is_state('timer.lammitys_korotus_olohuone_keittio', 'active')
             or is_state('timer.lammitys_korotus_hm', 'active')
             or is_state('timer.lammitys_korotus_makuhuone', 'active')
             or is_state('timer.lammitys_korotus_glen', 'active')
             or is_state('timer.lammitys_korotus_nele', 'active')
             or is_state('timer.lammitys_korotus_eteinen', 'active') }}
      - name: Lammitys ennakoiva
        unique_id: lammitys_ennakoiva
        icon: mdi:chart-timeline-variant
        state: >
          {% set now_p = states('sensor.energi_data_service') | float(0) %}
          {% set ahead = states('sensor.lammitys_hinta_ennakko') | float(0) %}
          {% set adj = states('sensor.lammitys_sekoitus_hinta_korjaus') | float(0) %}
          {% set p_lo = states('input_number.lammitys_hinta_halpa') | float(5) %}
          {{ ahead > (now_p + 1.5)
             and (is_state('binary_sensor.lammitys_halpa_sahko', 'on') or now_p <= p_lo or adj > 0.2) }}
      - name: Lammitys hinta heilunta
        unique_id: lammitys_hinta_heilunta
        icon: mdi:chart-bell-curve
        state: >
          {% set now_p = states('sensor.energi_data_service') | float(0) %}
          {% set ahead = states('sensor.lammitys_hinta_ennakko') | float(0) %}
          {{ (ahead - now_p) >= 8 }}
      - name: Lammitys menovesi nosto
        unique_id: lammitys_menovesi_nosto
        icon: mdi:thermometer-chevron-up
        state: "{{ (states('sensor.lammitys_sekoitus_kaytto') | float(0)) > ((states('sensor.lammitys_sekoitus_kayra') | float(0)) + 0.3) }}"
      - name: Lammitys menovesi rajoitus
        unique_id: lammitys_menovesi_rajoitus
        icon: mdi:thermometer-chevron-down
        state: "{{ (states('sensor.lammitys_sekoitus_kaytto') | float(99)) < ((states('sensor.lammitys_sekoitus_kayra') | float(0)) - 0.3) }}"
  - trigger:
      - platform: state
        entity_id:
