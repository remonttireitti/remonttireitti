# lammitys_ohjaus.yaml
# → config/packages/lammitys_ohjaus.yaml
# Tiedostonimi ILMAN yhdysviivaa. EI Lovelace-kortti (älä laita type: vertical-stack).
#
# Huonekohtaiset termostaatit + varaajan sekoitusventtiili (climate.lattialammitys)
# + lattialämmityspumppu (tasmota2) + sekoituspumppu (menoveden nosto).
#
# Menovesi: sensor.vilp_ohjaus_lampotilat_air_temperature_10 (LL meno)
# Paluu:    sensor.vilp_ohjaus_lampotilat_air_temperature_9
# Tavoite:  sensor.lammitys_sekoitus_kaytto (ulkolämpö + hinta, 35–48 °C)
# Sekoituspumppu: input_text.lammitys_sekoituspumppu
#   (oletus switch.sonoff_4_ch_pro_2 = 4CH kanava 1).
# Pumppu päälle kun LL-kierto käy, KV > 55 °C, varaaja > 25 °C,
# varaaja kuumempi kuin meno, ja meno < tavoite − hystereesi.
# Pumppu pois kun meno ≥ tavoite tai kierto/KV ei salli.

