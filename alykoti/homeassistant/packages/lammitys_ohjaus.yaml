    binary_sensor:
      - name: Lammitys hetki rajoita huone
        unique_id: lammitys_hetki_rajoita_huone
        icon: mdi:thermostat-box
        state: >
          {% set raw = states('sensor.hetkellinen_kustannus') %}
          {% set c = raw | float(none) if raw not in ['unknown', 'unavailable', 'none', ''] else none %}
          {% set on = states('input_number.lammitys_hetki_raja_huone') | float(40) %}
          {% set hyst = states('input_number.lammitys_hetki_hystereesi') | float(5) %}
          {% set off = on - hyst %}
          {% if c is none %}false
          {% elif c >= on %}true
          {% elif c <= off %}false
          {% else %}{{ this.state | default('off') == 'on' }}{% endif %}
      - name: Lammitys hetki rajoita vesi
        unique_id: lammitys_hetki_rajoita_vesi
        icon: mdi:heating-coil
        state: >
          {% set raw = states('sensor.hetkellinen_kustannus') %}
          {% set c = raw | float(none) if raw not in ['unknown', 'unavailable', 'none', ''] else none %}
          {% set on_h = states('input_number.lammitys_hetki_raja_huone') | float(40) %}
          {% set on = [states('input_number.lammitys_hetki_raja_vesi') | float(50), on_h] | max %}
          {% set hyst = states('input_number.lammitys_hetki_hystereesi') | float(5) %}
          {% set off = on - hyst %}
          {% if c is none %}false
          {% elif c >= on %}true
          {% elif c <= off %}false
          {% else %}{{ this.state | default('off') == 'on' }}{% endif %}
