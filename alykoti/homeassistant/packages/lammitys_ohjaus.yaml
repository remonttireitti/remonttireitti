          {% elif is_state('binary_sensor.lammitys_ennakoiva', 'on') %}
            {% set extra = states('input_number.lammitys_hinta_nosto_max') | float(2) %}
            {{ [base + extra, 26] | min | round(1) }}
          {% else %}{{ base | round(1) }}{% endif %}
      - name: Lammitys kaytto nele
        unique_id: lammitys_kaytto_nele
        unit_of_measurement: "°C"
        device_class: temperature
        state: >
