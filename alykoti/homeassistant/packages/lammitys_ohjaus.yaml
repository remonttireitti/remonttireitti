      - platform: state
        entity_id:
          - sensor.ulkolampotila_met_no
          - sensor.energi_data_service
          - sensor.vilp_ohjaus_lampotilat_air_temperature_8
          - sensor.lammitys_sekoitus_kaytto
    action:
      - variables:
          kv_ok: "{{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_8') | float(0) > 55 }}"
          lampo: "{{ states('sensor.lammitys_sekoitus_kaytto') | float(35) }}"
      - action: script.lammitys_aseta_sekoitus
        data:
          active: "{{ kv_ok }}"
          temperature: "{{ lampo }}"

  - id: lammitys_sekoituspumppu
    alias: Lämmitys sekoituspumppu nostaa menoveden
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: homeassistant
        event: start
      - platform: state
        entity_id:
          - sensor.vilp_ohjaus_lampotilat_air_temperature_10
          - sensor.vilp_ohjaus_lampotilat_air_temperature_9
          - sensor.vilp_ohjaus_lampotilat_air_temperature_13
          - sensor.vilp_ohjaus_lampotilat_air_temperature_8
          - sensor.lammitys_sekoitus_kaytto
          - switch.sonoff_4_ch_pro_2_tasmota2
          - climate.lattialammitys
          - input_text.lammitys_sekoituspumppu
          - input_number.lammitys_menovesi_hystereesi
    action:
      - variables:
          pump_e: "{{ states('input_text.lammitys_sekoituspumppu') | trim }}"
          meno_s: "{{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_10') }}"
          meno: "{{ meno_s | float(none) }}"
          paluu: "{{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_9') | float(none) }}"
          tank: "{{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_13') | float(0) }}"
          kv: "{{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_8') | float(0) }}"
          tavoite: "{{ states('sensor.lammitys_sekoitus_kaytto') | float(35) }}"
          hyst: "{{ states('input_number.lammitys_menovesi_hystereesi') | float(1) }}"
          ll_kierto: "{{ 1 if is_state('switch.sonoff_4_ch_pro_2_tasmota2', 'on') else 0 }}"
          nyt_paalla: "{{ 1 if pump_e not in ['unknown', 'unavailable', 'none', ''] and is_state(pump_e, 'on') else 0 }}"
          meno_ok: "{{ 1 if meno_s not in ['unknown', 'unavailable', 'none', ''] else 0 }}"
          nosta: >
            {{ 1 if (ll_kierto | int(0) == 1)
               and (kv | float(0) > 55)
               and (tank | float(0) > 25)
               and (meno_ok | int(0) == 1)
               and (tank | float(0) > (meno | float(0) + 0.8))
               and (meno | float(99) < 48)
               and (meno | float(99) < ((tavoite | float(35)) - (hyst | float(1))))
               else 0 }}
          pidetaan: >
            {{ 1 if (nyt_paalla | int(0) == 1)
               and (ll_kierto | int(0) == 1)
               and (kv | float(0) > 55)
               and (tank | float(0) > 25)
               and (meno_ok | int(0) == 1)
               and (meno | float(0) < 48)
               and (meno | float(0) < ((tavoite | float(35)) + 0.3))
               else 0 }}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ (nosta | int(0) == 1) or (pidetaan | int(0) == 1) }}"
            sequence:
              - action: script.lammitys_aseta_sekoituspumppu
                data:
                  paalle: true
        default:
          - action: script.lammitys_aseta_sekoituspumppu
            data:
              paalle: false

  - id: lammitys_aurinkopumppu
    alias: Aurinkolämpöpumppu
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/3"
      - platform: state
        entity_id:
          - sensor.nele_ja_keittio_lattialammitys_anturit_air_temperature_8
          - sensor.vilp_ohjaus_lampotilat_air_temperature_13
          - input_select.lammitys_aurinkopumppu
    action:
      - variables:
          tila: "{{ states('input_select.lammitys_aurinkopumppu') }}"
          solar: "{{ states('sensor.nele_ja_keittio_lattialammitys_anturit_air_temperature_8') | float(0) }}"
          tank: "{{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_13') | float(0) }}"
          diff: "{{ solar - tank }}"
          pump: switch.sonoff_4_ch_pro_2_tasmota3
      - choose:
          - conditions: "{{ tila == 'Pois' }}"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: "{{ pump }}"
          - conditions: "{{ tila == 'Pakko päälle' }}"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: "{{ pump }}"
        default:
          - choose:
              - conditions: "{{ diff | float(0) > 7 }}"
                sequence:
                  - action: switch.turn_on
                    target:
                      entity_id: "{{ pump }}"
            default:
              - action: switch.turn_off
                target:
                  entity_id: "{{ pump }}"

  - id: lammitys_pumppu
    alias: Lattialämmityspumppu päälle/pois
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: state
        entity_id:
          - switch.eteisen_lattialammitys
          - switch.nele_ja_keittio_lattialammitys_anturit
          - switch.olohuone_hm_lattialammitys_6
          - switch.makuhuone_glen_lattialammitys
          - switch.olohuone_hm_lattialammitys
          - switch.makuhuone_glen_lattialammitys_6
          - switch.nele_ja_keittio_lattialammitys_anturit_6
      - platform: state
        entity_id:
          - climate.olohuone_lattialammitys
          - climate.keittio_lattialammitys
          - climate.hm_lattialammitys
          - climate.makuhuone_lattialammitys
          - climate.glen_lattialammitys
          - climate.nele_lattialammitys
          - climate.eteisen_lattialammitys
        attribute: hvac_action
    action:
      - variables:
          joku_paalla: >
            {{ is_state('switch.eteisen_lattialammitys', 'on')
               or is_state('switch.nele_ja_keittio_lattialammitys_anturit', 'on')
               or is_state('switch.olohuone_hm_lattialammitys_6', 'on')
               or is_state('switch.makuhuone_glen_lattialammitys', 'on')
               or is_state('switch.olohuone_hm_lattialammitys', 'on')
               or is_state('switch.makuhuone_glen_lattialammitys_6', 'on')
               or is_state('switch.nele_ja_keittio_lattialammitys_anturit_6', 'on')
               or state_attr('climate.olohuone_lattialammitys', 'hvac_action') == 'heating'
               or state_attr('climate.keittio_lattialammitys', 'hvac_action') == 'heating'
               or state_attr('climate.hm_lattialammitys', 'hvac_action') == 'heating'
               or state_attr('climate.makuhuone_lattialammitys', 'hvac_action') == 'heating'
               or state_attr('climate.glen_lattialammitys', 'hvac_action') == 'heating'
               or state_attr('climate.nele_lattialammitys', 'hvac_action') == 'heating'
               or state_attr('climate.eteisen_lattialammitys', 'hvac_action') == 'heating' }}
      - choose:
          - conditions: "{{ joku_paalla }}"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.sonoff_4_ch_pro_2_tasmota2
        default:
          - action: switch.turn_off
            target:
              entity_id: switch.sonoff_4_ch_pro_2_tasmota2
