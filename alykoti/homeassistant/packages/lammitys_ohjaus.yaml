        unit_of_measurement: "°C"
        device_class: temperature
        icon: mdi:chart-bell-curve
        state: >
          {% set outdoor = states('sensor.ulkolampotila_met_no') | float(0) %}
          {% set out_w = 18 %}
          {% set out_c = -25 %}
          {% set t_w = 35 %}
          {% set t_c = 48 %}
          {% if outdoor >= out_w %}{{ t_w | round(1) }}
          {% elif outdoor <= out_c %}{{ t_c | round(1) }}
          {% else %}{{ (t_w + (t_c - t_w) * (out_w - outdoor) / (out_w - out_c)) | round(1) }}{% endif %}
      - name: Lammitys sekoitus hinta korjaus
        unique_id: lammitys_sekoitus_hinta_korjaus
        unit_of_measurement: "°C"
        icon: mdi:flash
        state: >
          {% set price = states('sensor.energi_data_service') | float(0) %}
          {% set p_lo = 5 %}
          {% set p_hi = 50 %}
          {% set adj_max = 8 %}
          {% if price <= p_lo %}0
          {% elif price >= p_hi %}{{ (-adj_max) | round(1) }}
          {% else %}{{ (-adj_max * (price - p_lo) / (p_hi - p_lo)) | round(1) }}{% endif %}
      - name: Lammitys sekoitus kaytto
        unique_id: lammitys_sekoitus_kaytto
        unit_of_measurement: "°C"
        device_class: temperature
        icon: mdi:valve
        state: >
          {% set outdoor = states('sensor.ulkolampotila_met_no') | float(0) %}
          {% set out_w = 18 %}
          {% set out_c = -25 %}
          {% set t_w = 35 %}
          {% set t_c = 48 %}
          {% if outdoor >= out_w %}{% set curve = t_w %}
          {% elif outdoor <= out_c %}{% set curve = t_c %}
          {% else %}{% set curve = t_w + (t_c - t_w) * (out_w - outdoor) / (out_w - out_c) %}{% endif %}
          {% set price = states('sensor.energi_data_service') | float(0) %}
          {% set p_lo = 5 %}
          {% set p_hi = 50 %}
          {% set adj_max = 8 %}
          {% if price <= p_lo %}{% set adj = 0 %}
          {% elif price >= p_hi %}{% set adj = -adj_max %}
          {% else %}{% set adj = -adj_max * (price - p_lo) / (p_hi - p_lo) %}{% endif %}
          {{ [[35, curve + adj] | max, 48] | min | round(1) }}
      - name: Lammitys sekoitus teksti
        unique_id: lammitys_sekoitus_teksti
        icon: mdi:valve
        state: >
          {% set kv = states('sensor.vilp_ohjaus_lampotilat_air_temperature_8') | float(none) %}
          {% set tavoite = states('sensor.lammitys_sekoitus_kaytto') | float(none) %}
          {% set kayra = states('sensor.lammitys_sekoitus_kayra') | float(none) %}
          {% set adj = states('sensor.lammitys_sekoitus_hinta_korjaus') | float(0) %}
          {% set price = states('sensor.energi_data_service') | float(none) %}
          {% if kv is none %}Ei käyttövesidataa
          {% elif kv <= 55 %}Pois — käyttövesi {{ kv | round(1) }} °C (raja 55 °C)
          {% else %}Sekoitus {{ tavoite | round(1) }} °C (käyrä {{ kayra | round(1) }}°{% if adj != 0 %}, hinta {{ adj | round(1) }}° @ {{ price | round(1) }} c/kWh{% endif %}, KV {{ kv | round(1) }} °C){% endif %}
      - name: Lammitys menovesi teksti
        unique_id: lammitys_menovesi_teksti
        icon: mdi:pipe-valve
        state: >
          {% set meno = states('sensor.vilp_ohjaus_lampotilat_air_temperature_10') | float(none) %}
          {% set paluu = states('sensor.vilp_ohjaus_lampotilat_air_temperature_9') | float(none) %}
          {% set tavoite = states('sensor.lammitys_sekoitus_kaytto') | float(none) %}
          {% set tank = states('sensor.vilp_ohjaus_lampotilat_air_temperature_13') | float(none) %}
          {% set kv = states('sensor.vilp_ohjaus_lampotilat_air_temperature_8') | float(none) %}
          {% set hyst = states('input_number.lammitys_menovesi_hystereesi') | float(1) %}
          {% set kierto = is_state('switch.sonoff_4_ch_pro_2_tasmota2', 'on') %}
          {% set pump_e = states('input_text.lammitys_sekoituspumppu') | trim %}
          {% set pump_on = is_state(pump_e, 'on') if pump_e not in ['unknown', 'unavailable', 'none', ''] else false %}
          {% if meno is none %}Ei menovesidataa (LL meno)
          {% elif kv is none %}Ei käyttövesidataa
          {% elif kv <= 55 %}Sekoituspumppu pois — käyttövesi {{ kv | round(1) }} °C (raja 55 °C)
          {% elif tank is none or tank <= 25 %}Sekoituspumppu pois — varaaja {{ tank | round(1) if tank is not none else '?' }} °C (raja 25 °C)
          {% elif not kierto %}Sekoituspumppu pois — lattialämmityskierto ei käy
          {% elif tank <= meno + 0.8 %}Sekoituspumppu pois — varaaja {{ tank | round(1) }} °C ei nosta menovettä {{ meno | round(1) }} °C
          {% elif meno >= 48 %}Sekoituspumppu pois — menovesi {{ meno | round(1) }} °C (katto 48 °C)
          {% elif pump_on %}Nostaa menovettä {{ meno | round(1) }} → {{ tavoite | round(1) }} °C{% if paluu is not none %} · paluu {{ paluu | round(1) }} °C{% endif %}
          {% elif tavoite is not none and meno >= tavoite - hyst %}Menovesi {{ meno | round(1) }} °C · tavoite {{ tavoite | round(1) }} °C — ok
          {% else %}Menovesi {{ meno | round(1) }} °C alle tavoitteen {{ tavoite | round(1) }} °C — sekoituspumppu käynnistyy
          {% endif %}
