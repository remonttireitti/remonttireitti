          - input_select.lammitys_tila_hm
          - input_select.lammitys_tila_makuhuone
          - input_select.lammitys_tila_glen
          - input_select.lammitys_tila_nele
          - input_select.lammitys_tila_eteinen
    binary_sensor:
      - name: Lammitys huone alaraja
        unique_id: lammitys_huone_alaraja
        icon: mdi:thermometer-low
        device_class: cold
        state: >
          {% set hyst = 0.5 %}
          {% set prev = this.attributes.huoneet | default('') %}
          {% set ns = namespace(nimet=[]) %}
          {% set t1 = state_attr('climate.olohuone_lattialammitys', 'current_temperature') | float(none) %}
          {% set t2 = state_attr('climate.keittio_lattialammitys', 'current_temperature') | float(none) %}
          {% set olo = t2 if t1 is none else (t1 if t2 is none else [t1, t2] | min) %}
          {% for z in [
            ('Olo+keittiö', 19, 'input_select.lammitys_tila_olohuone_keittio', 'binary_sensor.lammitys_terassi_auki', olo),
            ('HM', 19, 'input_select.lammitys_tila_hm', 'binary_sensor.lammitys_hm_ikkuna_auki', state_attr('climate.hm_lattialammitys', 'current_temperature') | float(none)),
            ('Makuhuone', 19, 'input_select.lammitys_tila_makuhuone', 'binary_sensor.lammitys_makuhuone_ikkuna_auki', state_attr('climate.makuhuone_lattialammitys', 'current_temperature') | float(none)),
            ('Glen', 19, 'input_select.lammitys_tila_glen', 'binary_sensor.lammitys_glen_ikkuna_auki', state_attr('climate.glen_lattialammitys', 'current_temperature') | float(none)),
            ('Nele', 19, 'input_select.lammitys_tila_nele', 'binary_sensor.lammitys_nele_ikkuna_auki', state_attr('climate.nele_lattialammitys', 'current_temperature') | float(none)),
            ('Eteinen', 20, 'input_select.lammitys_tila_eteinen', 'binary_sensor.lammitys_eteinen_ovi_auki', state_attr('climate.eteisen_lattialammitys', 'current_temperature') | float(none))
          ] %}
            {% if is_state(z[2], 'Automaatti') and is_state(z[3], 'off') and z[4] is not none
               and (z[4] < z[1] or (z[0] in prev and z[4] < (z[1] + hyst))) %}
              {% set ns.nimet = ns.nimet + [z[0]] %}
            {% endif %}
          {% endfor %}
          {{ ns.nimet | length > 0 }}
        attributes:
          huoneet: >
            {% set hyst = 0.5 %}
            {% set prev = this.attributes.huoneet | default('') %}
            {% set ns = namespace(nimet=[]) %}
            {% set t1 = state_attr('climate.olohuone_lattialammitys', 'current_temperature') | float(none) %}
            {% set t2 = state_attr('climate.keittio_lattialammitys', 'current_temperature') | float(none) %}
            {% set olo = t2 if t1 is none else (t1 if t2 is none else [t1, t2] | min) %}
            {% for z in [
              ('Olo+keittiö', 19, 'input_select.lammitys_tila_olohuone_keittio', 'binary_sensor.lammitys_terassi_auki', olo),
              ('HM', 19, 'input_select.lammitys_tila_hm', 'binary_sensor.lammitys_hm_ikkuna_auki', state_attr('climate.hm_lattialammitys', 'current_temperature') | float(none)),
              ('Makuhuone', 19, 'input_select.lammitys_tila_makuhuone', 'binary_sensor.lammitys_makuhuone_ikkuna_auki', state_attr('climate.makuhuone_lattialammitys', 'current_temperature') | float(none)),
