  - id: lammitys_korjaa_away
    alias: Lämmitys korjaa Away-esiasetus
    mode: queued
    trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: state
        entity_id:
          - climate.olohuone_lattialammitys
          - climate.keittio_lattialammitys
          - climate.hm_lattialammitys
          - climate.makuhuone_lattialammitys
          - climate.glen_lattialammitys
          - climate.nele_lattialammitys
          - climate.eteisen_lattialammitys
        attribute: preset_mode
      - platform: state
        entity_id:
          - climate.olohuone_lattialammitys
          - climate.keittio_lattialammitys
          - climate.hm_lattialammitys
          - climate.makuhuone_lattialammitys
          - climate.glen_lattialammitys
          - climate.nele_lattialammitys
          - climate.eteisen_lattialammitys
        attribute: temperature
      - platform: state
        entity_id:
          - binary_sensor.lammitys_ennakoiva
          - binary_sensor.lammitys_hetki_rajoita_huone
          - binary_sensor.lammitys_huone_alaraja
          - binary_sensor.lammitys_vastus_nostaa
          - sensor.vilp_ohjaus_lampotilat_air_temperature_13
          - sensor.vilp_ohjaus_lampotilat_air_temperature_10
    action:
      - variables:
          zones:
            - entity: climate.olohuone_lattialammitys
              tila: input_select.lammitys_tila_olohuone_keittio
              kaytto: sensor.lammitys_kaytto_olohuone_keittio
            - entity: climate.keittio_lattialammitys
              tila: input_select.lammitys_tila_olohuone_keittio
              kaytto: sensor.lammitys_kaytto_olohuone_keittio
            - entity: climate.hm_lattialammitys
              tila: input_select.lammitys_tila_hm
              kaytto: sensor.lammitys_kaytto_hm
            - entity: climate.makuhuone_lattialammitys
              tila: input_select.lammitys_tila_makuhuone
              kaytto: sensor.lammitys_kaytto_makuhuone
            - entity: climate.glen_lattialammitys
              tila: input_select.lammitys_tila_glen
              kaytto: sensor.lammitys_kaytto_glen
            - entity: climate.nele_lattialammitys
              tila: input_select.lammitys_tila_nele
              kaytto: sensor.lammitys_kaytto_nele
            - entity: climate.eteisen_lattialammitys
              tila: input_select.lammitys_tila_eteinen
              kaytto: sensor.lammitys_kaytto_eteinen
      - repeat:
          for_each: "{{ zones }}"
          sequence:
            - variables:
                eid: "{{ repeat.item.entity }}"
                preset: "{{ state_attr(repeat.item.entity, 'preset_mode') | default('') | lower }}"
                ohjaus: "{{ states(repeat.item.tila) }}"
                tavoite: >
                  {% set nimet = state_attr('binary_sensor.lammitys_huone_alaraja', 'huoneet') | default('') %}
                  {% set kylma = (
                    (repeat.item.entity in ['climate.olohuone_lattialammitys', 'climate.keittio_lattialammitys'] and 'Olo+keittiö' in nimet)
                    or (repeat.item.entity == 'climate.hm_lattialammitys' and 'HM' in nimet)
                    or (repeat.item.entity == 'climate.makuhuone_lattialammitys' and 'Makuhuone' in nimet)
                    or (repeat.item.entity == 'climate.glen_lattialammitys' and 'Glen' in nimet)
                    or (repeat.item.entity == 'climate.nele_lattialammitys' and 'Nele' in nimet)
                    or (repeat.item.entity == 'climate.eteisen_lattialammitys' and 'Eteinen' in nimet)
                  ) %}
                  {% if kylma %}
                    {% set t = states(repeat.item.kaytto) | float(20) %}
                  {% elif repeat.item.entity in ['climate.olohuone_lattialammitys', 'climate.keittio_lattialammitys']
                       and not is_state('timer.lammitys_korotus_olohuone_keittio', 'active')
                       and not is_state('binary_sensor.lammitys_ennakoiva', 'on') %}
                    {% set t = states('input_number.lammitys_lattia_tausta_olokeittio') | float(18) %}
                    {% set drop = states('input_number.lammitys_hetki_huone_lasku') | float(2) if is_state('binary_sensor.lammitys_hetki_rajoita_huone', 'on') else 0 %}
                    {% set t = [t - drop, 17] | max %}
                  {% else %}
                    {% set t = states(repeat.item.kaytto) | float(20) %}
                  {% endif %}
                  {% set tank = states('sensor.vilp_ohjaus_lampotilat_air_temperature_13') | float(0) %}
                  {% set meno = states('sensor.vilp_ohjaus_lampotilat_air_temperature_10') | float(0) %}
                  {% set vesi = [tank, meno] | max %}
                  {% if t <= 17 %}17
                  {% elif kylma or is_state('binary_sensor.lammitys_vastus_nostaa', 'on') or vesi >= (t + 5) %}{{ t }}
                  {% else %}17{% endif %}
                termo: "{{ state_attr(repeat.item.entity, 'temperature') | float(99) }}"
            - if:
                - condition: template
                  value_template: >
                    {{ ohjaus == 'Automaatti' and (
                      preset == 'away' or
                      (
                        repeat.item.entity == 'climate.nele_lattialammitys' and
                        termo < 20 and
                        tavoite >= 20 and
                        is_state('binary_sensor.lammitys_nele_ikkuna_auki', 'off')
                      )
                    ) }}
              then:
                - action: script.lammitys_aseta_termostaatti
                  data:
                    climates:
                      - "{{ eid }}"
                    temperature: "{{ tavoite }}"

  - id: lammitys_ohjaus_loki
    alias: Lämmitys ohjaus loki
    description: Kirjaa tilan vaihdon, lattiakierron ja jatkuvan rajoituksen lokiin. Älä aja käsin.
    mode: queued
    max: 30
    trigger:
      - platform: state
        entity_id: sensor.lammitys_ohjaus_tila
        id: tila
      - platform: state
        entity_id: switch.sonoff_4_ch_pro_2_tasmota2
        id: kierto
      - platform: time_pattern
        minutes: "/15"
        id: edelleen
    condition:
      - condition: template
        value_template: >
          {% if trigger.id == 'edelleen' %}
            {{ is_state('binary_sensor.lammitys_hetki_rajoita_huone', 'on')
               or is_state('binary_sensor.lammitys_hetki_rajoita_vesi', 'on')
               or is_state('binary_sensor.lammitys_huone_alaraja', 'on')
               or is_state('binary_sensor.lammitys_korotus_paalla', 'on')
               or is_state('timer.lammitys_sekoitus_pulssi', 'active')
               or is_state('timer.lammitys_vastus_odota', 'active')
               or is_state('switch.pannuhuone_lapivirtausvastus', 'on')
               or is_state('binary_sensor.lammitys_vesi_riittaa', 'off')
               or is_state('binary_sensor.lammitys_vastus_nostaa', 'on') }}
          {% elif trigger.id == 'kierto' %}
            {{ trigger.from_state is none or trigger.from_state.state != trigger.to_state.state }}
          {% else %}
            {% set old_s = trigger.from_state.state if trigger.from_state else '' %}
            {% set new_s = trigger.to_state.state %}
            {% set old_y = (trigger.from_state.attributes.syy | default('') if trigger.from_state else '') | regex_replace('[0-9.,]+', '#') %}
            {% set new_y = (trigger.to_state.attributes.syy | default('')) | regex_replace('[0-9.,]+', '#') %}
            {{ old_s != new_s or old_y != new_y }}
          {% endif %}
    action:
      - action: logbook.log
        data:
          name: Lämmitys ohjaus
          entity_id: sensor.lammitys_ohjaus_tila
          message: >
            {% if trigger.id == 'edelleen' %}
              Edelleen {{ now().strftime('%H:%M') }}: {{ states('sensor.lammitys_ohjaus_tila') }} — {{ state_attr('sensor.lammitys_ohjaus_tila', 'syy') }}
            {% elif trigger.id == 'kierto' %}
              Lattiakierto {{ 'päälle' if trigger.to_state.state == 'on' else 'pois' }}
            {% else %}
              {{ trigger.to_state.state }} — {{ trigger.to_state.attributes.syy | default(states('sensor.lammitys_ohjaus_tila')) }}
              {%- if trigger.from_state is not none and trigger.from_state.state not in ['unknown', 'unavailable', 'none', ''] %}
               (ennen {{ trigger.from_state.state }})
              {%- endif %}
            {% endif %}

  - id: lammitys_sekoitus
    alias: Lämmitys sekoitus climate.lattialammitys
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/3"
      - platform: homeassistant
