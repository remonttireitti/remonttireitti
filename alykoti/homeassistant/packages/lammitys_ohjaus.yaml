              ('Nele', 'timer.lammitys_korotus_nele'),
              ('Eteinen', 'timer.lammitys_korotus_eteinen')
            ] %}
              {% if is_state(item[1], 'active') %}{% set ns.z = ns.z + [item[0]] %}{% endif %}
            {% endfor %}
            {% if tank is not none and tank <= 25 %}Lämmitysvaraaja {{ tank | round(1) }} °C ≤ 25 °C — huoneet 17 °C
            {% elif is_state('binary_sensor.lammitys_hetki_rajoita_vesi', 'on') %}Hetkellinen {{ c | round(1) if c is not none else '?' }} c/t ≥ {{ raja_v | int }} — huoneet −{{ drop }} °C ja läpivirtausvastus pois
            {% elif is_state('binary_sensor.lammitys_hetki_rajoita_huone', 'on') %}Hetkellinen {{ c | round(1) if c is not none else '?' }} c/t ≥ {{ raja_h | int }} — huonetermostaatit −{{ drop }} °C
            {% elif ns.z %}Korotus päällä: {{ ns.z | join(', ') }}
            {% elif is_state('binary_sensor.lammitys_ennakoiva', 'on') %}Spot {{ spot | round(1) if spot is not none else '?' }} c, ennakko {{ ahead | round(1) if ahead is not none else '?' }} c / {{ look }} h — menovettä nostettu {{ adj | round(1) }} °C ennen hinnan nousua
            {% elif is_state('binary_sensor.lammitys_halpa_sahko', 'on') %}Spot {{ spot | round(1) if spot is not none else '?' }} c alle rajan {{ states('input_number.lammitys_hinta_lattia_raja') }} c — lattia lämmittää{% if adj > 0.3 %}, menovesi +{{ adj | round(1) }} °C{% endif %}
            {% elif is_state('binary_sensor.lammitys_menovesi_rajoitus', 'on') %}Spot {{ spot | round(1) if spot is not none else '?' }} c — menovettä rajoitettu {{ adj | round(1) }} °C, olo+keittiö ILP:llä
            {% else %}Spot {{ spot | round(1) if spot is not none else '?' }} c — olo+keittiö ILP, muut huoneet lattialla{% endif %}
