    icon: mdi:timer-sand
  lammitys_korotus_makuhuone:
    name: "Makuhuone korotus: montako °C lisätään lattian tavoitteeseen ajastimen ajaksi"
    duration: "01:00:00"
    icon: mdi:timer-sand
  lammitys_korotus_glen:
    name: "Glen korotus: montako °C lisätään lattian tavoitteeseen ajastimen ajaksi"
    duration: "01:00:00"
    icon: mdi:timer-sand
  lammitys_korotus_nele:
    name: "Nele korotus: montako °C lisätään lattian tavoitteeseen ajastimen ajaksi"
    duration: "01:00:00"
