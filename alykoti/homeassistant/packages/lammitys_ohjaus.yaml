            {% set pump_e = 'switch.sonoff_4_ch_pro_2_tasmota4' %}
          {% endif %}
          {{ is_state(pump_e, 'on') if pump_e not in ['unknown', 'unavailable', 'none', ''] else false }}
      - name: Lammitys ll tarve
        unique_id: lammitys_ll_tarve
        icon: mdi:radiator
        device_class: heat
        state: >
          {{ is_state('switch.eteisen_lattialammitys', 'on')
             or is_state('switch.nele_ja_keittio_lattialammitys_anturit', 'on')
             or is_state('switch.olohuone_hm_lattialammitys_6', 'on')
             or is_state('switch.makuhuone_glen_lattialammitys', 'on')
             or is_state('switch.olohuone_hm_lattialammitys', 'on')
             or is_state('switch.makuhuone_glen_lattialammitys_6', 'on')
             or is_state('switch.nele_ja_keittio_lattialammitys_anturit_6', 'on')
             or state_attr('climate.olohuone_lattialammitys', 'hvac_action') == 'heating'
             or state_attr('climate.keittio_lattialammitys', 'hvac_action') == 'heating'
             or state_attr('climate.hm_lattialammitys', 'hvac_action') == 'heating'
             or state_attr('climate.makuhuone_lattialammitys', 'hvac_action') == 'heating'
             or state_attr('climate.glen_lattialammitys', 'hvac_action') == 'heating'
             or state_attr('climate.nele_lattialammitys', 'hvac_action') == 'heating'
             or state_attr('climate.eteisen_lattialammitys', 'hvac_action') == 'heating' }}
  - trigger:
      - platform: time_pattern
        seconds: "/10"
      - platform: homeassistant
        event: start
      - platform: state
        entity_id:
          - switch.sonoff_4_ch_pro_2_tasmota2
          - switch.pannuhuone_lapivirtausvastus
          - binary_sensor.lammitys_ll_tarve
          - input_select.lammitys_vastus
          - sensor.vilp_ohjaus_lampotilat_air_temperature_8
          - sensor.vilp_ohjaus_lampotilat_air_temperature_10
          - sensor.lammitys_sekoitus_kaytto
          - input_number.lammitys_kv_pumppu_paalle
          - input_number.lammitys_menovesi_hystereesi
          - input_number.lammitys_kayra_meno_max
          - input_number.lammitys_vastus_pumppu_min
          - input_number.lammitys_vastus_paalla_nyt
          - timer.lammitys_vastus_pulssi
          - timer.lammitys_vastus_odota
          - timer.lammitys_ll_pumppu_viive
          - binary_sensor.lammitys_hetki_rajoita_vesi
          - sensor.hetkellinen_kustannus
    binary_sensor:
      - name: Lammitys ll pumppu valmis
        unique_id: lammitys_ll_pumppu_valmis
        icon: mdi:pump
        device_class: running
        state: >
          {% set e = states.switch.sonoff_4_ch_pro_2_tasmota2 %}
          {% set min_s = (states('input_number.lammitys_vastus_pumppu_min') | float(4)) * 60 %}
          {{ is_state('switch.sonoff_4_ch_pro_2_tasmota2', 'on')
             and e is not none
             and (as_timestamp(now()) - as_timestamp(e.last_changed)) >= min_s }}
      - name: Lammitys vastus sallittu
        unique_id: lammitys_vastus_sallittu
        icon: mdi:heating-coil
        state: >
          {% set kv = states('sensor.vilp_ohjaus_lampotilat_air_temperature_8') | float(none) %}
          {% set meno_s = states('sensor.vilp_ohjaus_lampotilat_air_temperature_10') %}
          {% set meno = meno_s | float(none) if meno_s not in ['unknown', 'unavailable', 'none', ''] else none %}
          {% set tavoite = states('sensor.lammitys_sekoitus_kaytto') | float(35) %}
          {% set hyst = states('input_number.lammitys_menovesi_hystereesi') | float(1) %}
          {% set kv_on = states('input_number.lammitys_kv_pumppu_paalle') | float(58) %}
          {% set katto = states('input_number.lammitys_kayra_meno_max') | float(48) %}
          {% set e = states.switch.sonoff_4_ch_pro_2_tasmota2 %}
          {% set min_s = (states('input_number.lammitys_vastus_pumppu_min') | float(4)) * 60 %}
          {% set kierto_ok = is_state('switch.sonoff_4_ch_pro_2_tasmota2', 'on') and e is not none and (as_timestamp(now()) - as_timestamp(e.last_changed)) >= min_s %}
          {{ is_state('input_select.lammitys_vastus', 'Automaatti')
             and not is_state('binary_sensor.lammitys_hetki_rajoita_vesi', 'on')
             and is_state('binary_sensor.lammitys_ll_tarve', 'on')
             and kierto_ok
             and kv is not none and kv < kv_on
             and meno is not none
             and meno < (tavoite - hyst)
             and meno < (katto - 0.5) }}
    sensor:
      - name: Miksi läpivirtausvastus on päällä tai pois
        unique_id: lammitys_vastus_teksti
        icon: mdi:heating-coil
        state: >
          {% set kv = states('sensor.vilp_ohjaus_lampotilat_air_temperature_8') | float(none) %}
          {% set meno = states('sensor.vilp_ohjaus_lampotilat_air_temperature_10') | float(none) %}
          {% set tavoite = states('sensor.lammitys_sekoitus_kaytto') | float(none) %}
          {% set kv_on = states('input_number.lammitys_kv_pumppu_paalle') | float(58) %}
          {% set nyt = states('input_number.lammitys_vastus_paalla_nyt') | int(15) %}
          {% set pois = states('input_number.lammitys_vastus_pois_s') | int(30) %}
          {% set min_m = states('input_number.lammitys_vastus_pumppu_min') | int(4) %}
          {% set e = states.switch.sonoff_4_ch_pro_2_tasmota2 %}
          {% set kierto_s = (as_timestamp(now()) - as_timestamp(e.last_changed)) | int(0) if e is not none and is_state('switch.sonoff_4_ch_pro_2_tasmota2', 'on') else 0 %}
          {% if is_state('input_select.lammitys_vastus', 'Pois') %}Pois
          {% elif is_state('binary_sensor.lammitys_hetki_rajoita_vesi', 'on') %}Hetkellinen {{ states('sensor.hetkellinen_kustannus') }} c/t — läpivirtausvastus kielletty
          {% elif not is_state('switch.sonoff_4_ch_pro_2_tasmota2', 'on') %}Kierto pois — ei läpivirtauksia, vastus kielletty
          {% elif is_state('switch.pannuhuone_lapivirtausvastus', 'on') %}Pulssi {{ nyt }} s — lämmittää menovettä {{ meno | round(1) if meno is not none else '?' }} °C
          {% elif is_state('timer.lammitys_vastus_odota', 'active') %}Tauko {{ pois }} s · seuraava {{ nyt }} s · meno {{ meno | round(1) if meno is not none else '?' }} °C
          {% elif not is_state('binary_sensor.lammitys_ll_tarve', 'on') %}Ei lattiatarvetta — vastus pois
          {% elif not is_state('binary_sensor.lammitys_ll_pumppu_valmis', 'on') %}Odottaa kiertoa {{ [min_m * 60 - kierto_s, 0] | max }} s (min {{ min_m }} min) ennen vastusta
          {% elif kv is none %}Ei käyttövesidataa — vastus pois
          {% elif kv >= kv_on %}KV {{ kv | round(1) }} °C riittää — sekoituspumppu lataa varaajaa, vastus pois
          {% elif meno is none %}Ei menovesidataa — vastus pois
          {% elif tavoite is not none and meno >= tavoite - (states('input_number.lammitys_menovesi_hystereesi') | float(1)) %}Menovesi {{ meno | round(1) }} °C riittää
          {% else %}Valmis pulssittamaan {{ nyt }}/{{ pois }} s · meno {{ meno | round(1) }} → {{ tavoite | round(1) if tavoite is not none else '?' }} °C
          {% endif %}
automation:
  - id: lammitys_olohuone_keittio
    alias: Lämmitys olohuone ja keittiö
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/3"
