    sensor:
      - name: Lammitys ohjaus tila
        unique_id: lammitys_ohjaus_tila
        icon: mdi:state-machine
        state: >
          {% set tank = states('sensor.vilp_ohjaus_lampotilat_air_temperature_13') | float(99) %}
          {% if is_state('binary_sensor.lammitys_huone_alaraja', 'on') %}Huone alarajalla
          {% elif is_state('binary_sensor.lammitys_vastus_nostaa', 'on')
               and is_state('binary_sensor.lammitys_vesi_riittaa', 'off') %}Vastus nostaa vettä
          {% elif is_state('binary_sensor.lammitys_vesi_riittaa', 'off') %}Lämmitysvesi kylmä
          {% elif is_state('binary_sensor.lammitys_hetki_rajoita_huone', 'on')
               or is_state('binary_sensor.lammitys_hetki_rajoita_vesi', 'on') %}Liian korkea hetkellinen kulutus
          {% elif is_state('binary_sensor.lammitys_korotus_paalla', 'on') %}Asetusta nostettu
          {% elif is_state('binary_sensor.lammitys_ennakoiva', 'on') %}Ennakoiva lämmitys
          {% elif is_state('binary_sensor.lammitys_halpa_sahko', 'on') %}Halpa sähkö
          {% elif states('sensor.energi_data_service') not in ['unknown', 'unavailable', 'none', ''] %}Kallis sähkö
          {% else %}Normaali{% endif %}
        attributes:
          syy: >
            {% set tank = states('sensor.vilp_ohjaus_lampotilat_air_temperature_13') | float(none) %}
            {% set c = states('sensor.hetkellinen_kustannus') | float(none) %}
            {% set spot = states('sensor.energi_data_service') | float(none) %}
            {% set ahead = states('sensor.lammitys_hinta_ennakko') | float(none) %}
            {% set adj = states('sensor.lammitys_sekoitus_hinta_korjaus') | float(0) %}
            {% set raja_h = states('input_number.lammitys_hetki_raja_huone') | float(40) %}
            {% set raja_v = [states('input_number.lammitys_hetki_raja_vesi') | float(50), raja_h] | max %}
            {% set drop = states('input_number.lammitys_hetki_huone_lasku') | float(2) %}
            {% set look = states('input_number.lammitys_hinta_ennakko_h') | int(6) %}
            {% set ns = namespace(z=[]) %}
            {% for item in [
              ('Olo+keittiö', 'timer.lammitys_korotus_olohuone_keittio'),
              ('HM', 'timer.lammitys_korotus_hm'),
              ('Makuhuone', 'timer.lammitys_korotus_makuhuone'),
              ('Glen', 'timer.lammitys_korotus_glen'),
              ('Nele', 'timer.lammitys_korotus_nele'),
              ('Eteinen', 'timer.lammitys_korotus_eteinen')
            ] %}
              {% if is_state(item[1], 'active') %}{% set ns.z = ns.z + [item[0]] %}{% endif %}
            {% endfor %}
            {% set meno = states('sensor.vilp_ohjaus_lampotilat_air_temperature_10') | float(none) %}
            {% set vesi = [tank if tank is not none else -99, meno if meno is not none else -99] | max %}
            {% set raja = states('sensor.lammitys_vesi_huone_raja') | float(26) %}
            {% if is_state('binary_sensor.lammitys_huone_alaraja', 'on') %}{{ state_attr('binary_sensor.lammitys_huone_alaraja', 'syy') }} — rajoitukset ohitettu
            {% elif is_state('binary_sensor.lammitys_vastus_nostaa', 'on') and is_state('binary_sensor.lammitys_vesi_riittaa', 'off') %}Varaaja {{ tank | round(1) if tank is not none else '?' }} °C / meno {{ meno | round(1) if meno is not none else '?' }} °C < huone + 5 °C ({{ raja | round(1) }} °C) — vastus nostaa, lattia ja kierto päällä
            {% elif is_state('binary_sensor.lammitys_vesi_riittaa', 'off') %}Varaaja {{ tank | round(1) if tank is not none else '?' }} °C / meno {{ meno | round(1) if meno is not none else '?' }} °C < huone + 5 °C ({{ raja | round(1) }} °C) — lattiat pois, turha lämmittää
            {% elif is_state('binary_sensor.lammitys_hetki_rajoita_vesi', 'on') %}Hetkellinen {{ c | round(1) if c is not none else '?' }} c/t ≥ {{ raja_v | int }} — huoneet −{{ drop }} °C ja läpivirtausvastus pois
            {% elif is_state('binary_sensor.lammitys_hetki_rajoita_huone', 'on') %}Hetkellinen {{ c | round(1) if c is not none else '?' }} c/t ≥ {{ raja_h | int }} — huonetermostaatit −{{ drop }} °C
            {% elif ns.z %}Korotus päällä: {{ ns.z | join(', ') }}
            {% elif is_state('binary_sensor.lammitys_ennakoiva', 'on') %}Spot {{ spot | round(1) if spot is not none else '?' }} c, ennakko {{ ahead | round(1) if ahead is not none else '?' }} c / {{ look }} h — lattia +{{ states('input_number.lammitys_hinta_nosto_max') | float(2) | round(1) }} °C, varaajaa vähän yli{% if is_state('binary_sensor.lammitys_hinta_heilunta', 'on') %} · suuri heilunta, painopiste lattiassa{% endif %}. ILP lämmittää olo+keittiön
            {% elif is_state('binary_sensor.lammitys_halpa_sahko', 'on') %}Spot {{ spot | round(1) if spot is not none else '?' }} c — ILP lämmittää olo+keittiön, makuuhuoneet lattialla{% if adj > 0.3 %}, menovesi +{{ adj | round(1) }} °C{% endif %}
            {% elif is_state('binary_sensor.lammitys_menovesi_rajoitus', 'on') %}Spot {{ spot | round(1) if spot is not none else '?' }} c — menovettä rajoitettu {{ adj | round(1) }} °C, olo+keittiö ILP:llä
            {% else %}Spot {{ spot | round(1) if spot is not none else '?' }} c — ILP lämmittää olo+keittiön (ei makuuhuoneita), muut huoneet lattialla{% endif %}
          spot_c: "{{ states('sensor.energi_data_service') }}"
          ennakko_c: "{{ states('sensor.lammitys_hinta_ennakko') }}"
          hetkellinen_ct: "{{ states('sensor.hetkellinen_kustannus') }}"
          menovesi_korjaus: "{{ states('sensor.lammitys_sekoitus_hinta_korjaus') }}"
  - trigger:
