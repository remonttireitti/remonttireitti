    name: Lämmitys korotus hm
    duration: "01:00:00"
    icon: mdi:timer-sand
  lammitys_korotus_makuhuone:
    name: Lämmitys korotus makuhuone
    duration: "01:00:00"
    icon: mdi:timer-sand
  lammitys_korotus_glen:
    name: Lämmitys korotus glen
    duration: "01:00:00"
    icon: mdi:timer-sand
  lammitys_korotus_nele:
    name: Lämmitys korotus nele
    duration: "01:00:00"
