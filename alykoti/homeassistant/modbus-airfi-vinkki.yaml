# Tämä EI ole paketti. Kopioi arvot OLEMASSA OLEVAAN
# configuration.yaml → modbus: -hubiin. Älä lisää toista hubia samaan IP:hen.
#
# AirFi tässä talossa: 192.168.50.26:502 (TCP) tai Yellow RTU.
# Kaksi masteria samaan koneeseen = väylä jumittuu.
#
# modbus:
#   - name: airfi
#     type: tcp
#     host: 192.168.50.26
#     port: 502
#     delay: 1
#     timeout: 5
#     retries: 0
#     message_wait_milliseconds: 50
#
# Jokaiselle sensorille tässä hubissa:
#     scan_interval: 30
