              content: "{{ 'Sauna ' ~ states('sensor.iv_sauna_jaljella') if is_state('timer.iv_sauna', 'active') else 'Sauna' }}"
              tap_action:
                action: call-service
                service: script.turn_on
                service_data:
                  entity_id: script.iv_sauna
            - type: template
              icon: mdi:plus
              icon_color: orange
              content: "+15"
              tap_action:
                action: call-service
                service: script.turn_on
                service_data:
                  entity_id: script.iv_sauna_lisaa
            - type: template
              icon: mdi:stop
              content: Lopeta
              tap_action:
                action: call-service
                service: script.turn_on
                service_data:
                  entity_id: script.iv_sauna_lopeta
        - type: custom:mushroom-chips-card
