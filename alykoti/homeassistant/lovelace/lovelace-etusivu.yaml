                {{ 'orange' if is_state('input_boolean.iv_sauna', 'on') or
                states('sensor.airfi_saunatila') | int(0) > 0 else ('blue' if
                is_state('input_select.iv_ohjaus', 'Manuaali') else ('red' if
                is_state('input_select.iv_ohjaus', 'Tehostus') else ('disabled' if
                is_state('input_select.iv_ohjaus', 'Pois') else 'green'))) }}
              content: >-
                {{ 'Sauna' if is_state('input_boolean.iv_sauna', 'on') or
                states('sensor.airfi_saunatila') | int(0) > 0 else
                states('input_select.iv_ohjaus') }}
              tap_action:
                action: more-info
                entity: input_select.iv_ohjaus
            - type: template
              icon: mdi:fan
              content: >
                {% set s = states('sensor.airfi_poistoilmapuhallin_nopeus') %}
                {{ 'P —' if s in ['unknown', 'unavailable', 'none', ''] else 'P ' ~ (s | int) ~ ' %' }}
              tap_action:
                action: more-info
                entity: sensor.airfi_poistoilmapuhallin_nopeus
            - type: template
              icon: mdi:fan-plus
              content: >
                {% set s = states('sensor.airfi_tuloilmapuhallin_nopeus') %}
                {{ 'T —' if s in ['unknown', 'unavailable', 'none', ''] else 'T ' ~ (s | int) ~ ' %' }}
              tap_action:
                action: more-info
                entity: sensor.airfi_tuloilmapuhallin_nopeus
            - type: template
              icon: mdi:thermometer
              content: >
                {% set s = states('sensor.airfi_lampotila_asetus_luku') %}
                {{ 'L —' if s in ['unknown', 'unavailable', 'none', ''] else (s | float(0) | round(1)) ~ ' °' }}
              tap_action:
                action: more-info
                entity: sensor.airfi_lampotila_asetus_luku
            - type: template
              icon: mdi:thermometer
              content: "T1 {{ states('sensor.airfi_t1_ulkoilma') }}"
              tap_action:
                action: more-info
                entity: sensor.airfi_t1_ulkoilma
            - type: template
