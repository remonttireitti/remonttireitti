# Kopioi TÄMÄ koko YAML Lovelace-kortin editoriin (korvaa koko kortti).
# Ei vaadi sensor.energia_kokonaisteho_w eikä sensor.energia_vaiheiden_summa.
# Kokonaisteho = L1 + L2 + L3.

type: vertical-stack
cards:
  - type: custom:mushroom-template-card
    layout: horizontal
    fill_container: true
    primary: >
      {% set w = states('sensor.l1_vaihe_power') | float(0)
               + states('sensor.l2_vaihe_power') | float(0)
               + states('sensor.l3_vaihe_power') | float(0) %}
      {% set c = states('sensor.energia_tanaan_kustannus_eur') %}
      {% set a = 'Maltillinen' if w < 2500 else ('Korkea' if w > 5500 else 'Normaali') %}
      ⚡ {{ w | round(0) }} W{% if c not in ['unknown','unavailable','none',''] %} · {{ c }} €{% endif %} · {{ a }}
    secondary: >
      L1 {{ states('sensor.l1_vaihe_power') | float(0) | round(0) }} ·
      L2 {{ states('sensor.l2_vaihe_power') | float(0) | round(0) }} ·
      L3 {{ states('sensor.l3_vaihe_power') | float(0) | round(0) }} W
    icon: mdi:flash
    icon_color: >
      {% set w = states('sensor.l1_vaihe_power') | float(0)
               + states('sensor.l2_vaihe_power') | float(0)
               + states('sensor.l3_vaihe_power') | float(0) %}
      {% if w < 2500 %}green
      {% elif w > 5500 %}red
      {% else %}amber{% endif %}
    tap_action:
      action: more-info
      entity: sensor.l1_vaihe_power
  - type: custom:mushroom-chips-card
    alignment: center
    chips:
      - type: template
        icon: mdi:trending-down
        content: Maltillinen
        icon_color: >
          {% set w = states('sensor.l1_vaihe_power') | float(0)
                   + states('sensor.l2_vaihe_power') | float(0)
                   + states('sensor.l3_vaihe_power') | float(0) %}
          {{ 'green' if w < 2500 else 'disabled' }}
      - type: template
        icon: mdi:approximately-equal
        content: Normaali
        icon_color: >
          {% set w = states('sensor.l1_vaihe_power') | float(0)
                   + states('sensor.l2_vaihe_power') | float(0)
                   + states('sensor.l3_vaihe_power') | float(0) %}
          {{ 'amber' if w >= 2500 and w <= 5500 else 'disabled' }}
      - type: template
        icon: mdi:trending-up
        content: Korkea
        icon_color: >
          {% set w = states('sensor.l1_vaihe_power') | float(0)
                   + states('sensor.l2_vaihe_power') | float(0)
                   + states('sensor.l3_vaihe_power') | float(0) %}
          {{ 'red' if w > 5500 else 'disabled' }}
  - type: custom:mod-card
    card_mod:
      style:
        hui-grid-card$:
          power-gauge-card$: >
            .title { font-size: 10px !important; font-weight: 700 !important; }
            .subtitle { font-size: 7px !important; font-weight: 600 !important; }
            .value { font-size: 15px !important; font-weight: 700 !important; }
            .unit-inline { font-size: 8px !important; font-weight: 600 !important; }
            .label-now { font-size: 6px !important; font-weight: 700 !important; }
            .unit { font-size: 7px !important; font-weight: 600 !important; }
            .status { font-size: 7px !important; font-weight: 600 !important; }
            .panel { padding: 6px 4px 4px !important; }
            .gauge { max-width: 160px !important; }
        .: >
          ha-card { background: none !important; box-shadow: none !important; border: none !important; }
    card:
      type: grid
      columns: 4
      square: false
      cards:
        - type: custom:mushroom-template-card
          layout: vertical
          fill_container: true
          primary: >
            {{ (states('sensor.l1_vaihe_power') | float(0)
              + states('sensor.l2_vaihe_power') | float(0)
              + states('sensor.l3_vaihe_power') | float(0)) | round(0) }} W
          secondary: Kokonaisteho
          icon: mdi:flash
          icon_color: >
            {% set w = states('sensor.l1_vaihe_power') | float(0)
                     + states('sensor.l2_vaihe_power') | float(0)
                     + states('sensor.l3_vaihe_power') | float(0) %}
            {% if w < 2500 %}green
            {% elif w > 5500 %}red
            {% else %}amber{% endif %}
          tap_action:
            action: more-info
            entity: sensor.l3_vaihe_power
        - type: custom:power-gauge-card
          entity: sensor.l1_vaihe_power
          name: L1
          unit: W
          min: 0
          max: 4000
          normal: 600
          warning: 1800
          critical: 3200
          rolling_numbers: false
          background: transparent
        - type: custom:power-gauge-card
          entity: sensor.l2_vaihe_power
          name: L2
          unit: W
          min: 0
          max: 4000
          normal: 600
          warning: 1800
          critical: 3200
          rolling_numbers: false
          background: transparent
        - type: custom:power-gauge-card
          entity: sensor.l3_vaihe_power
          name: L3
          unit: W
          min: 0
          max: 4000
          normal: 600
          warning: 1800
          critical: 3200
          rolling_numbers: false
          background: transparent
