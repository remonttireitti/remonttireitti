# Valinnainen käsinajo. Liitä vasta kun lukemat näkyvät
# ja packages/iv.yaml on ladattu. Älä lisää toista Modbus-hubia.

type: vertical-stack
cards:
  - type: custom:mushroom-template-card
    primary: >
      {% if is_state('input_boolean.iv_modbus_kirjoitus', 'on') %}
        Modbus-kirjoitus päällä
      {% else %}
        Modbus-kirjoitus pois
      {% endif %}
    secondary: Napauta kytkeäksesi — pidä pois kunnes lukemat ok
    icon: mdi:upload-network
    icon_color: "{{ 'orange' if is_state('input_boolean.iv_modbus_kirjoitus', 'on') else 'grey' }}"
    layout: horizontal
    tap_action:
      action: toggle
      entity: input_boolean.iv_modbus_kirjoitus
  - type: custom:mushroom-chips-card
    alignment: center
    chips:
      - type: template
        icon: mdi:robot-outline
        content: Auto
        icon_color: "{{ 'green' if is_state('input_select.iv_ohjaus', 'Automaatti') else 'grey' }}"
        tap_action:
          action: perform-action
          perform_action: script.iv_automaatti
      - type: template
        icon: mdi:gesture-tap
        content: Käsi
        icon_color: "{{ 'blue' if is_state('input_select.iv_ohjaus', 'Manuaali') else 'grey' }}"
        tap_action:
          action: perform-action
          perform_action: script.iv_manuaali
      - type: template
        icon: mdi:fan-plus
        content: Tehostus
        icon_color: "{{ 'red' if is_state('input_select.iv_ohjaus', 'Tehostus') else 'grey' }}"
        tap_action:
          action: perform-action
          perform_action: script.iv_tehostus
      - type: template
        icon: mdi:fan-off
        content: Pois
        icon_color: "{{ 'red' if is_state('input_select.iv_ohjaus', 'Pois') else 'grey' }}"
        tap_action:
          action: perform-action
          perform_action: script.iv_pois
      - type: template
        icon: mdi:hot-tub
        content: >
          {% set s = states('sensor.airfi_saunatila') %}
          Sauna · {{ 'Päällä' if s not in ['unknown','unavailable','none',''] and s | int(0) > 0 else 'Pois' }}
        icon_color: >
          {% set s = states('sensor.airfi_saunatila') %}
          {{ 'orange' if s not in ['unknown','unavailable','none',''] and s | int(0) > 0 else 'grey' }}
        tap_action:
          action: perform-action
          perform_action: script.iv_sauna
  - type: custom:mushroom-template-card
    primary: Kuittaa hälytys
    secondary: Kirjoittaa holding 1 = 0 (vaatii kirjoituksen päälle)
    icon: mdi:alert-decagram-outline
    icon_color: red
    layout: horizontal
    tap_action:
      action: perform-action
      perform_action: script.iv_kuittaa
  - type: conditional
    conditions:
      - condition: state
        entity: timer.iv_tehostus
        state: active
    card:
      type: custom:mushroom-entity-card
      entity: timer.iv_tehostus
      name: Tehostus jäljellä
      icon: mdi:timer-sand
      icon_color: red
      layout: horizontal
      tap_action:
        action: perform-action
        perform_action: script.iv_automaatti
  - type: conditional
    conditions:
      - condition: state
        entity: input_select.iv_ohjaus
        state: Manuaali
    card:
      type: vertical-stack
      cards:
        - type: custom:mushroom-number-card
          entity: input_number.iv_manuaali_poisto
          display_mode: slider
          layout: horizontal
          icon_color: blue
        - type: custom:mushroom-number-card
          entity: input_number.iv_manuaali_tulo
          display_mode: slider
          layout: horizontal
          icon_color: cyan
