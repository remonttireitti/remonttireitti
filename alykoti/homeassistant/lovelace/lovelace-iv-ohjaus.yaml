# Kopioi TÄMÄ koko tiedosto Lovelace-kortin YAML-editoriin (korvaa koko kortti).
# Asetukset chipeissä — napauta, more-info avaa säädön.

type: vertical-stack
cards:
  - type: custom:mod-card
    card_mod:
      style: |
        ha-card {
          border-radius: 16px;
          border: 1px solid rgba(0, 0, 0, 0.16);
          box-shadow: none;
          overflow: hidden;
          --stack-card-margin: 2px;
          margin: 6px 0;
          --ha-card-border-width: 0;
        }
    card:
      type: vertical-stack
      cards:
        - type: custom:mushroom-template-card
          layout: horizontal
          fill_container: false
          primary: IV ohjaus
          icon: mdi:fan
          icon_color: blue
          tap_action:
            action: none
          card_mod:
            style: |
              ha-card {
                padding: 4px 8px 0 !important;
                background: none !important;
                border: none !important;
                box-shadow: none !important;
              }
        - type: custom:mushroom-chips-card
          alignment: justify
          card_mod:
            style: |
              ha-card {
                padding: 2px 4px 0 !important;
                background: none !important;
                border: none !important;
                box-shadow: none !important;
              }
          chips:
            - type: template
              icon: mdi:fan
              icon_color: >-
                {{ 'orange' if is_state('input_boolean.iv_sauna', 'on') or
                states('sensor.airfi_saunatila') | int(0) > 0 else ('blue' if
                is_state('input_select.iv_ohjaus', 'Manuaali') else ('red' if
                is_state('input_select.iv_ohjaus', 'Tehostus') else ('disabled' if
                is_state('input_select.iv_ohjaus', 'Pois') else 'green'))) }}
              content: >-
                {{ 'Sauna' if is_state('input_boolean.iv_sauna', 'on') or
                states('sensor.airfi_saunatila') | int(0) > 0 else
                states('input_select.iv_ohjaus') }}
              tap_action:
                action: more-info
                entity: input_select.iv_ohjaus
            - type: template
              icon: mdi:fan
              content: >
                {% set s = states('sensor.airfi_poistoilmapuhallin_nopeus') %}
                {{ 'P —' if s in ['unknown', 'unavailable', 'none', ''] else 'P ' ~ (s | int) ~ ' %' }}
              tap_action:
                action: more-info
                entity: sensor.airfi_poistoilmapuhallin_nopeus
            - type: template
              icon: mdi:fan-plus
              content: >
                {% set s = states('sensor.airfi_tuloilmapuhallin_nopeus') %}
                {{ 'T —' if s in ['unknown', 'unavailable', 'none', ''] else 'T ' ~ (s | int) ~ ' %' }}
              tap_action:
                action: more-info
                entity: sensor.airfi_tuloilmapuhallin_nopeus
            - type: template
              icon: mdi:thermometer
              content: >
                {% set s = states('sensor.airfi_lampotila_asetus_luku') %}
                {{ 'L —' if s in ['unknown', 'unavailable', 'none', ''] else (s | float(0) | round(1)) ~ ' °' }}
              tap_action:
                action: more-info
                entity: sensor.airfi_lampotila_asetus_luku
            - type: template
              icon: mdi:thermometer
              content: "T1 {{ states('sensor.airfi_t1_ulkoilma') }}"
              tap_action:
                action: more-info
                entity: sensor.airfi_t1_ulkoilma
            - type: template
              icon: mdi:thermometer
              content: "T3 {{ states('sensor.airfi_t3_poistoilma') }}"
              tap_action:
                action: more-info
                entity: sensor.airfi_t3_poistoilma
            - type: template
              icon: mdi:thermometer
              content: "T5 {{ states('sensor.airfi_t5_tuloilma') }}"
              tap_action:
                action: more-info
                entity: sensor.airfi_t5_tuloilma
            - type: template
              icon: mdi:check-bold
              icon_color: orange
              content: Aseta
              tap_action:
                action: call-service
                service: script.turn_on
                service_data:
                  entity_id: script.iv_kirjoita
        - type: custom:mushroom-chips-card
          alignment: center
          card_mod:
            style: |
              ha-card {
                padding: 0 4px !important;
                background: none !important;
                border: none !important;
                box-shadow: none !important;
              }
          chips:
            - type: template
              icon: mdi:robot-outline
              icon_color: "{{ 'green' if is_state('input_select.iv_ohjaus', 'Automaatti') else 'grey' }}"
              content: Auto
              tap_action:
                action: call-service
                service: script.turn_on
                service_data:
                  entity_id: script.iv_automaatti
            - type: template
              icon: mdi:gesture-tap
              icon_color: "{{ 'blue' if is_state('input_select.iv_ohjaus', 'Manuaali') else 'grey' }}"
              content: Käsi
              tap_action:
                action: call-service
                service: script.turn_on
                service_data:
                  entity_id: script.iv_manuaali
            - type: template
              icon: mdi:fan-plus
              icon_color: "{{ 'red' if is_state('input_select.iv_ohjaus', 'Tehostus') else 'grey' }}"
              content: "{{ 'Teho ' ~ states('sensor.iv_tehostus_jaljella') if is_state('timer.iv_tehostus', 'active') else 'Teho' }}"
              tap_action:
                action: call-service
                service: script.turn_on
                service_data:
                  entity_id: script.iv_tehostus
            - type: template
              icon: mdi:plus
              icon_color: red
              content: "+15"
              tap_action:
                action: call-service
                service: script.turn_on
                service_data:
                  entity_id: script.iv_tehostus_lisaa
            - type: template
              icon: mdi:stop
              content: Lopeta
              tap_action:
                action: call-service
                service: script.turn_on
                service_data:
                  entity_id: script.iv_tehostus_lopeta
            - type: template
              icon: mdi:fan-off
              icon_color: "{{ 'red' if is_state('input_select.iv_ohjaus', 'Pois') else 'grey' }}"
              content: Pois
              tap_action:
                action: call-service
                service: script.turn_on
                service_data:
                  entity_id: script.iv_pois
            - type: template
              icon: mdi:hot-tub
              icon_color: "{{ 'orange' if is_state('input_boolean.iv_sauna', 'on') or states('sensor.airfi_saunatila') | int(0) > 0 else 'grey' }}"
              content: "{{ 'Sauna ' ~ states('sensor.iv_sauna_jaljella') if is_state('timer.iv_sauna', 'active') else 'Sauna' }}"
              tap_action:
                action: call-service
                service: script.turn_on
                service_data:
                  entity_id: script.iv_sauna
            - type: template
              icon: mdi:plus
              icon_color: orange
              content: "+15"
              tap_action:
                action: call-service
                service: script.turn_on
                service_data:
                  entity_id: script.iv_sauna_lisaa
            - type: template
              icon: mdi:stop
              content: Lopeta
              tap_action:
                action: call-service
                service: script.turn_on
                service_data:
                  entity_id: script.iv_sauna_lopeta
        - type: custom:mushroom-chips-card
          alignment: center
          card_mod:
            style: |
              ha-card {
                padding: 0 4px 4px !important;
                background: none !important;
                border: none !important;
                box-shadow: none !important;
              }
          chips:
            - type: template
              icon: mdi:water-percent
              content: "RH {{ states('sensor.airfi_kosteus_rh') }}"
              tap_action:
                action: more-info
                entity: sensor.airfi_kosteus_rh
            - type: template
              icon: mdi:molecule-co2
              content: >
                {% set e = states('input_text.iv_co2_entiteetti') | trim %}
                {% set c = states(e) if e not in ['unknown', 'unavailable', 'none', ''] else '' %}
                {% if c in ['unknown', 'unavailable', 'none', ''] %}
                  {% set c = states('sensor.olohuone_ilmanlaatu_anturi_hiilidioksidi') %}
                {% endif %}
                {{ 'CO2 —' if c in ['unknown', 'unavailable', 'none', ''] else 'CO2 ' ~ (c | int) }}
              tap_action:
                action: more-info
                entity: sensor.olohuone_ilmanlaatu_anturi_hiilidioksidi
            - type: template
              icon: mdi:alert-octagon
              icon_color: "{{ 'red' if states('sensor.airfi_hataseis_tila') | int(0) > 0 or states('sensor.airfi_vikatila') | int(0) > 0 else 'green' }}"
              content: "Hälytys {{ states('sensor.airfi_hataseis_tila') }}/{{ states('sensor.airfi_vikatila') }}"
              tap_action:
                action: more-info
                entity: sensor.airfi_hataseis_tila
            - type: template
              icon: mdi:alert-decagram-outline
              icon_color: red
              content: Kuittaa
              tap_action:
                action: call-service
                service: script.turn_on
                service_data:
                  entity_id: script.iv_kuittaa
            - type: entity
              entity: input_select.iv_auto_anturit
              icon: mdi:tune-variant
              content_info: state
            - type: entity
              entity: input_number.iv_lampo_asetus
              icon: mdi:thermometer
              content_info: state
            - type: entity
              entity: input_number.iv_poissa_lampo
              icon: mdi:home-export-outline
              content_info: state
            - type: entity
              entity: input_number.iv_ohitus_asetus
              icon: mdi:swap-horizontal
              content_info: state
            - type: entity
              entity: input_number.iv_ohitus_ulko
              icon: mdi:thermometer-low
              content_info: state
            - type: entity
              entity: input_number.iv_ohitus_viive
              icon: mdi:timer-sand
              content_info: state
        - type: conditional
          conditions:
            - condition: state
              entity: input_select.iv_ohjaus
              state: Manuaali
          card:
            type: custom:mushroom-chips-card
            alignment: center
            card_mod:
              style: |
                ha-card {
                  padding: 0 4px 6px !important;
                  background: none !important;
                  border: none !important;
                  box-shadow: none !important;
                }
            chips:
              - type: entity
                entity: input_number.iv_manuaali_poisto
                icon: mdi:fan
                content_info: state
              - type: entity
                entity: input_number.iv_manuaali_tulo
                icon: mdi:fan-plus
                content_info: state
