type: vertical-stack
cards:
  - type: custom:mushroom-chips-card
    alignment: justify
    chips:
      - type: template
        icon: mdi:fan
        icon_color: "{{ 'orange' if is_state('input_boolean.iv_sauna', 'on') or states('sensor.airfi_saunatila') | int(0) > 0 else ('blue' if is_state('input_select.iv_ohjaus', 'Manuaali') else ('red' if is_state('input_select.iv_ohjaus', 'Tehostus') else ('disabled' if is_state('input_select.iv_ohjaus', 'Pois') else 'green'))) }}"
        content: "{{ 'Sauna' if is_state('input_boolean.iv_sauna', 'on') or states('sensor.airfi_saunatila') | int(0) > 0 else states('input_select.iv_ohjaus') }}"
        tap_action:
          action: more-info
          entity: input_select.iv_ohjaus
      - type: template
        icon: mdi:fan
        content: >
          {% set s = states('sensor.airfi_poistoilmapuhallin_nopeus') %}
          {{ 'P —' if s in ['unknown', 'unavailable', 'none', ''] else 'P ' ~ (s | int) ~ ' %' }}
        tap_action:
          action: more-info
          entity: sensor.airfi_poistoilmapuhallin_nopeus
      - type: template
        icon: mdi:fan-plus
        content: >
          {% set s = states('sensor.airfi_tuloilmapuhallin_nopeus') %}
          {{ 'T —' if s in ['unknown', 'unavailable', 'none', ''] else 'T ' ~ (s | int) ~ ' %' }}
        tap_action:
          action: more-info
          entity: sensor.airfi_tuloilmapuhallin_nopeus
      - type: template
        icon: mdi:thermometer
        content: >
          {% set s = states('sensor.airfi_lampotila_asetus_luku') %}
          {{ 'L —' if s in ['unknown', 'unavailable', 'none', ''] else (s | float(0) | round(1)) ~ ' °' }}
        tap_action:
          action: more-info
          entity: sensor.airfi_lampotila_asetus_luku
      - type: template
        icon: mdi:check-bold
        icon_color: orange
        content: Aseta
        tap_action:
          action: call-service
          service: script.turn_on
          service_data:
            entity_id: script.iv_kirjoita
  - type: custom:mushroom-template-card
    entity: timer.iv_tehostus
    layout: horizontal
    primary: "Tehostus {{ states('sensor.iv_tehostus_jaljella') }}"
    secondary: "+20 % tulo ja poisto · 15 min"
    icon: mdi:fan-plus
    icon_color: "{{ 'red' if is_state('timer.iv_tehostus', 'active') else 'grey' }}"
    tap_action:
      action: more-info
  - type: custom:mushroom-template-card
    entity: timer.iv_sauna
    layout: horizontal
    primary: "Sauna {{ states('sensor.iv_sauna_jaljella') }}"
    secondary: "Tulo = poisto + 20 %"
    icon: mdi:hot-tub
    icon_color: "{{ 'orange' if is_state('timer.iv_sauna', 'active') else 'grey' }}"
    tap_action:
      action: more-info
  - type: custom:mushroom-select-card
    entity: input_select.iv_auto_anturit
    name: Auto
    icon: mdi:tune-variant
    layout: horizontal
    secondary_info: none
  - type: custom:mushroom-template-card
    entity: input_select.iv_ohjaus
    layout: horizontal
    primary: "{{ 'Käsi: säädä puhaltimia' if is_state('input_select.iv_ohjaus', 'Manuaali') else 'Nopeudet seuraavat tilaa' }}"
    secondary: >
      {% set t = states('sensor.iv_auto_tavoite') %}
      {% set tulo = t | int(0) if t not in ['unknown', 'unavailable', 'none', ''] else 0 %}
      Automaatti: poisto = tulo + 5 %{% if tulo > 0 %} · {{ tulo }} / {{ [100, tulo + 5] | min }} %{% endif %}
    icon: mdi:tune
    icon_color: "{{ 'blue' if is_state('input_select.iv_ohjaus', 'Manuaali') else 'grey' }}"
    tap_action:
      action: none
  - type: custom:mushroom-number-card
    entity: input_number.iv_manuaali_poisto
    name: Poisto
    display_mode: slider
    layout: horizontal
    icon_color: blue
  - type: custom:mushroom-number-card
    entity: input_number.iv_manuaali_tulo
    name: Tulo
    display_mode: slider
    layout: horizontal
    icon_color: cyan
  - type: custom:mushroom-chips-card
    alignment: center
    chips:
      - type: template
        icon: mdi:robot-outline
        icon_color: "{{ 'green' if is_state('input_select.iv_ohjaus', 'Automaatti') else 'grey' }}"
        content: Auto
        tap_action:
          action: call-service
          service: script.turn_on
          service_data:
            entity_id: script.iv_automaatti
      - type: template
        icon: mdi:gesture-tap
        icon_color: "{{ 'blue' if is_state('input_select.iv_ohjaus', 'Manuaali') else 'grey' }}"
        content: Käsi
        tap_action:
          action: call-service
          service: script.turn_on
          service_data:
            entity_id: script.iv_manuaali
      - type: template
        icon: mdi:fan-plus
        icon_color: "{{ 'red' if is_state('input_select.iv_ohjaus', 'Tehostus') else 'grey' }}"
        content: "{{ 'Teho ' ~ states('sensor.iv_tehostus_jaljella') if is_state('timer.iv_tehostus', 'active') else 'Teho' }}"
        tap_action:
          action: call-service
          service: script.turn_on
          service_data:
            entity_id: script.iv_tehostus
      - type: template
        icon: mdi:fan-off
        icon_color: "{{ 'red' if is_state('input_select.iv_ohjaus', 'Pois') else 'grey' }}"
        content: Pois
        tap_action:
          action: call-service
          service: script.turn_on
          service_data:
            entity_id: script.iv_pois
      - type: template
        icon: mdi:hot-tub
        icon_color: "{{ 'orange' if is_state('input_boolean.iv_sauna', 'on') or states('sensor.airfi_saunatila') | int(0) > 0 else 'grey' }}"
        content: "{{ 'Sauna ' ~ states('sensor.iv_sauna_jaljella') if is_state('timer.iv_sauna', 'active') else 'Sauna' }}"
        tap_action:
          action: call-service
          service: script.turn_on
          service_data:
            entity_id: script.iv_sauna
  - type: custom:mushroom-chips-card
    alignment: center
    chips:
      - type: template
        icon: mdi:plus
        icon_color: red
        content: "+15 teho"
        tap_action:
          action: call-service
          service: script.turn_on
          service_data:
            entity_id: script.iv_tehostus_lisaa
      - type: template
        icon: mdi:stop
        content: Lopeta teho
        tap_action:
          action: call-service
          service: script.turn_on
          service_data:
            entity_id: script.iv_tehostus_lopeta
      - type: template
        icon: mdi:plus
        icon_color: orange
        content: "+15 sauna"
        tap_action:
          action: call-service
          service: script.turn_on
          service_data:
            entity_id: script.iv_sauna_lisaa
      - type: template
        icon: mdi:stop
        content: Lopeta sauna
        tap_action:
          action: call-service
          service: script.turn_on
          service_data:
            entity_id: script.iv_sauna_lopeta
  - type: custom:mushroom-chips-card
    alignment: center
    chips:
      - type: template
        icon: mdi:water-percent
        content: "RH {{ states('sensor.airfi_kosteus_rh') }}"
        tap_action:
          action: more-info
          entity: sensor.airfi_kosteus_rh
      - type: template
        icon: mdi:molecule-co2
        content: >
          {% set e = states('input_text.iv_co2_entiteetti') | trim %}
          {% set c = states(e) if e not in ['unknown', 'unavailable', 'none', ''] else '' %}
          {% if c in ['unknown', 'unavailable', 'none', ''] %}
            {% set c = states('sensor.olohuone_ilmanlaatu_anturi_hiilidioksidi') %}
          {% endif %}
          {{ 'CO2 —' if c in ['unknown', 'unavailable', 'none', ''] else 'CO2 ' ~ (c | int) }}
        tap_action:
          action: more-info
          entity: sensor.olohuone_ilmanlaatu_anturi_hiilidioksidi
      - type: template
        icon: mdi:alert-octagon
        icon_color: "{{ 'red' if states('sensor.airfi_hataseis_tila') | int(0) > 0 or states('sensor.airfi_vikatila') | int(0) > 0 else 'green' }}"
        content: "Hälytys {{ states('sensor.airfi_hataseis_tila') }}/{{ states('sensor.airfi_vikatila') }}"
        tap_action:
          action: more-info
          entity: sensor.airfi_hataseis_tila
      - type: template
        icon: mdi:alert-decagram-outline
        icon_color: red
        content: Kuittaa
        tap_action:
          action: call-service
          service: script.turn_on
          service_data:
            entity_id: script.iv_kuittaa
  - type: custom:mushroom-template-card
    entity: input_number.iv_lampo_asetus
    layout: horizontal
    primary: "Lämpöasetus {{ states('sensor.airfi_lampotila_asetus_luku') }} °C"
    secondary: "T1 {{ states('sensor.airfi_t1_ulkoilma') }} · T3 {{ states('sensor.airfi_t3_poistoilma') }} · T5 {{ states('sensor.airfi_t5_tuloilma') }}"
    icon: mdi:thermometer
    icon_color: orange
    tap_action:
      action: more-info
      entity: sensor.airfi_lampotila_asetus_luku
  - type: custom:mushroom-number-card
    entity: input_number.iv_lampo_asetus
    name: Lämpöasetus
    display_mode: slider
    layout: horizontal
    icon_color: orange
  - type: custom:mushroom-number-card
    entity: input_number.iv_poissa_lampo
    name: Poissa lämpö
    display_mode: slider
    layout: horizontal
    icon_color: blue
  - type: custom:mushroom-number-card
    entity: input_number.iv_ohitus_asetus
    name: Ohituksen asetus
    display_mode: slider
    layout: horizontal
    icon_color: teal
  - type: custom:mushroom-number-card
    entity: input_number.iv_ohitus_ulko
    name: Ohituksen ulkoraja
    display_mode: slider
    layout: horizontal
    icon_color: cyan
  - type: custom:mushroom-number-card
    entity: input_number.iv_ohitus_viive
    name: Ohituksen viive
    display_mode: slider
    layout: horizontal
    icon_color: grey
