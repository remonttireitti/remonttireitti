      - type: custom:mod-card
        card_mod:
          style: |
            ha-card {
              border-radius: 16px;
              border: 1px solid rgba(0, 0, 0, 0.08);
              box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
              overflow: hidden;
              {% set pois = is_state('input_select.lammitys_tila_eteinen', 'Pois') %}
              {% set heat = state_attr('climate.eteisen_lattialammitys', 'hvac_action') == 'heating' %}
              {% set matala = state_attr('climate.eteisen_lattialammitys', 'temperature') | float(99) <= 17 %}
              {% if pois or matala %}
                background: rgba(100, 116, 139, 0.12);
              {% elif heat %}
                background: rgba(239, 68, 68, 0.16);
              {% else %}
                background: rgba(34, 197, 94, 0.14);
              {% endif %}
            }
        card:
          type: vertical-stack
          cards:
            - type: custom:mushroom-template-card
              entity: climate.eteisen_lattialammitys
              layout: horizontal
              fill_container: true
              primary: >
                {% set h = state_attr('climate.eteisen_lattialammitys',
                'current_temperature') %}
                Eteinen · {{ h | round(1) if h is not none else '—' }}°C
              secondary: >
                {% set auto_s = states('sensor.lammitys_kaytto_eteinen') %}
                {% set auto_t = auto_s | float(none) if auto_s not in
                ['unknown','unavailable','none',''] else none %}
                {% set termo = state_attr('climate.eteisen_lattialammitys',
                'temperature') %}
                {% set heat = state_attr('climate.eteisen_lattialammitys',
                'hvac_action') %}
                {% set ohj = states('input_select.lammitys_tila_eteinen') %}
                {% set kor = is_state('timer.lammitys_korotus_eteinen',
                'active') %}
                {% set ovi_auki =
                is_state('binary_sensor.lammitys_eteinen_ovi_auki', 'on') %}
                Auto {% if auto_t is not none %}{{ auto_t | round(1) }}{% else
                %}—{% endif %}° · Termo {% if termo is not none %}{{ termo |
                round(1) }}{% else %}—{% endif %}° · {% if ohj == 'Pois' or
                (termo is not none and termo | float(99) <= 17) %}📉 Matala{%
                elif heat == 'heating' %}♨️ Lämmittää{% else %}⏸ Odottaa{% endif
                %} · {% if ohj == 'Pois' %}Ohjaus pois{% elif kor %}Korotus ⏱{%
                else %}Ohjaus auto{% endif %}{% if ovi_auki %} · 🚪 Ovi auki{%
                endif %}
              icon: mdi:door-closed
              icon_color: >
                {% if is_state('input_select.lammitys_tila_eteinen', 'Pois')
                %}grey {% elif state_attr('climate.eteisen_lattialammitys',
                'temperature') | float(99) <= 17 %}disabled {% elif
                state_attr('climate.eteisen_lattialammitys', 'hvac_action') ==
                'heating' %}orange {% elif
                is_state('timer.lammitys_korotus_eteinen', 'active')
                %}deep-orange {% else %}amber{% endif %}
            - type: custom:mushroom-chips-card
              alignment: center
