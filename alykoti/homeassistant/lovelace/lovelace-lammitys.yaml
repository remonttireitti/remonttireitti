                    icon_color: grey
                    tap_action:
                      action: call-service
                      service: script.lammitys_korotus_kaynnista
                      data:
                        alue: eteinen
                - type: entity
                  entity: input_number.lammitys_korotus_eteinen
                  icon: mdi:thermometer-plus
                  content_info: state
                - type: entity
