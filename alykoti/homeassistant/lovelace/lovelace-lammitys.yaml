# Kopioi TÄMÄ koko tiedosto Home Assistantin Lovelace-kortin YAML-editoriin
# (korvaa koko nykyinen kortti). Älä liitä snippettejä.

type: vertical-stack
cards:
  - type: conditional
    conditions:
      - condition: state
        entity: binary_sensor.lammitys_rajoitettu
        state: "on"
    card:
      type: custom:mushroom-template-card
      layout: horizontal
      fill_container: true
      primary: ⚠️ Lämmitys rajoitettu
      secondary: "{{ states('sensor.lammitys_rajoitus_teksti') }}"
      icon: mdi:thermometer-alert
      icon_color: red
  - type: custom:mushroom-template-card
    layout: horizontal
    fill_container: true
    primary: Lämmityspiiri
    secondary: "{{ states('sensor.lammitys_menovesi_teksti') }}"
    icon: mdi:radiator
    icon_color: "{{ 'green' if is_state('binary_sensor.lammitys_sekoituspumppu_paalla', 'on') else ('orange' if is_state('binary_sensor.lammitys_sekoitus_sallittu', 'on') else 'disabled') }}"
    tap_action:
      action: more-info
      entity: sensor.vilp_ohjaus_lampotilat_air_temperature_10
  - type: custom:mushroom-template-card
    layout: horizontal
    fill_container: true
    primary: "Meno {{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_10') }}° · tavoite {{ states('sensor.lammitys_sekoitus_kaytto') }}° · paluu {{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_9') }}°"
    secondary: "{{ states('sensor.lammitys_sekoitus_teksti') }}"
    icon: mdi:pipe-valve
    icon_color: "{{ 'green' if is_state('binary_sensor.lammitys_sekoitus_sallittu', 'on') else 'disabled' }}"
    tap_action:
      action: more-info
      entity: climate.lattialammitys
  - type: custom:mod-card
    card_mod:
      style:
        hui-grid-card$:
          power-gauge-card$: >
            .title { font-size: 10px !important; font-weight: 700 !important; }
            .subtitle { font-size: 7px !important; font-weight: 600 !important; }
            .value { font-size: 15px !important; font-weight: 700 !important; }
            .unit-inline { font-size: 8px !important; font-weight: 600 !important; }
            .label-now { font-size: 6px !important; font-weight: 700 !important; }
            .unit { font-size: 7px !important; font-weight: 600 !important; }
            .status { font-size: 7px !important; font-weight: 600 !important; }
            .panel { padding: 6px 4px 4px !important; }
            .stage { margin: 0 !important; }
            .gauge { max-width: 160px !important; }
        .: >
          ha-card { background: none !important; box-shadow: none !important; border: none !important; }
    card:
      type: grid
      square: false
      columns: 4
      cards:
        - type: custom:power-gauge-card
          entity: sensor.vilp_ohjaus_lampotilat_air_temperature_13
          name: Varaaja
          unit: °C
          min: 15
          max: 60
          normal: 40
          warning: 30
          critical: 25
          precision: 1
          rolling_numbers: false
          background: transparent
        - type: custom:power-gauge-card
          entity: sensor.vilp_ohjaus_lampotilat_air_temperature_8
          name: Käyttövesi
          unit: °C
          min: 40
          max: 70
          normal: 55
          warning: 62
          critical: 68
          precision: 1
          rolling_numbers: false
          background: transparent
        - type: custom:power-gauge-card
          entity: sensor.vilp_ohjaus_lampotilat_air_temperature_10
          name: LL meno
          unit: °C
          min: 20
          max: 45
          normal: 28
          warning: 36
          critical: 42
          precision: 1
          rolling_numbers: false
          background: transparent
        - type: custom:power-gauge-card
          entity: sensor.vilp_ohjaus_lampotilat_air_temperature_9
          name: LL paluu
          unit: °C
          min: 20
          max: 45
          normal: 26
          warning: 34
          critical: 40
          precision: 1
          rolling_numbers: false
          background: transparent
  - type: custom:mushroom-chips-card
    alignment: center
    chips:
      - type: entity
        entity: switch.sonoff_4_ch_pro_2_tasmota2
        icon: mdi:pump
        content_info: name
      - type: template
        icon: mdi:pump
        icon_color: "{{ 'green' if is_state('binary_sensor.lammitys_sekoituspumppu_paalla', 'on') else 'grey' }}"
        content: "{{ 'Sekoituspumppu' if is_state('binary_sensor.lammitys_sekoituspumppu_paalla', 'on') else 'Sekoituspumppu pois' }}"
        tap_action:
          action: more-info
          entity: switch.sonoff_4_ch_pro_2_tasmota4
        hold_action:
          action: more-info
          entity: input_text.lammitys_sekoituspumppu
      - type: entity
        entity: climate.lattialammitys
        icon: mdi:valve
        content_info: state
      - type: entity
        entity: input_number.lammitys_menovesi_hystereesi
        icon: mdi:thermometer-chevron-down
        content_info: state
      - type: entity
        entity: input_number.lammitys_kayra_ulko_vih
        icon: mdi:weather-sunny
        content_info: state
      - type: entity
        entity: input_number.lammitys_kayra_ulko_kylma
        icon: mdi:snowflake
        content_info: state
      - type: entity
        entity: input_number.lammitys_kayra_meno_min
        icon: mdi:thermometer-low
        content_info: state
      - type: entity
        entity: input_number.lammitys_kayra_meno_max
        icon: mdi:thermometer-high
        content_info: state
      - type: entity
        entity: input_number.lammitys_hinta_halpa
        icon: mdi:currency-eur
        content_info: state
      - type: entity
        entity: input_number.lammitys_hinta_kallis
        icon: mdi:currency-eur-off
        content_info: state
      - type: entity
        entity: input_number.lammitys_hinta_nosto_max
        icon: mdi:thermometer-chevron-up
        content_info: state
      - type: entity
        entity: input_number.lammitys_hinta_rajoitus_max
        icon: mdi:thermometer-minus
        content_info: state
      - type: entity
        entity: input_number.lammitys_hinta_ennakko_h
        icon: mdi:clock-outline
        content_info: state
      - type: template
        icon: mdi:air-conditioner
        icon_color: "{{ 'green' if is_state('binary_sensor.lammitys_halpa_sahko', 'on') else 'orange' }}"
        content: >
          {% set p = states('sensor.energi_data_service') %}
          {% if is_state('binary_sensor.lammitys_halpa_sahko', 'on') %}
            Lattia lämmittää · {{ p }} snt
          {% else %}
            ILP lämmittää · {{ p }} snt
          {% endif %}
        tap_action:
          action: more-info
          entity: binary_sensor.lammitys_halpa_sahko
      - type: entity
        entity: input_number.lammitys_hinta_lattia_raja
        icon: mdi:cash
        content_info: state
      - type: entity
        entity: input_number.lammitys_lattia_tausta_olokeittio
        icon: mdi:thermometer-minus
        content_info: state
      - type: entity
        entity: input_number.lammitys_kv_pumppu_paalle
        icon: mdi:water-thermometer
        content_info: state
      - type: entity
        entity: input_number.lammitys_kv_pumppu_pois
        icon: mdi:water-alert
        content_info: state
  - type: custom:mod-card
    card_mod:
      style: |
        ha-card {
          border-radius: 16px;
          border: 1px solid rgba(0, 0, 0, 0.08);
          box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
          overflow: hidden;
          --stack-card-margin: 0px;
          --mush-spacing: 4px;
          --icon-size: 32px;
          {% set tila = states('input_select.keittio_ilp_tila') %}
          {% set ulko = states('sensor.ulkolampotila_met_no') | float(0) %}
          {% set action = state_attr('climate.keittio_ilp', 'hvac_action') %}
          {% if tila == 'Pois' %}
            background: rgba(100, 116, 139, 0.14);
          {% elif action == 'cooling' %}
            background: rgba(59, 130, 246, 0.16);
          {% elif action == 'heating' %}
            background: rgba(239, 68, 68, 0.16);
          {% elif ulko > 20 %}
            background: rgba(148, 163, 184, 0.14);
          {% else %}
            background: rgba(34, 197, 94, 0.12);
          {% endif %}
        }
    card:
      type: vertical-stack
      cards:
        - type: custom:mushroom-template-card
          layout: horizontal
          fill_container: false
          primary: >
            Keittiö ILP · {{ state_attr('climate.keittio_ilp',
            'current_temperature') | float(0) | round(1) }} → {{
            state_attr('climate.keittio_ilp', 'temperature') | float(0) |
            round(1) }} °C
          secondary: >
            {% set s1 = states('input_text.keittio_ilp') %}
            {% set s2 = states('input_text.keittio_ilp_status') %}
            {{ s2 if s1 in ['unknown', 'unavailable', 'none', ''] else s1 }}
          icon: mdi:air-conditioner
          icon_color: >
            {% set tila = states('input_select.keittio_ilp_tila') %} {% set
            action = state_attr('climate.keittio_ilp', 'hvac_action') %} {% if
            tila == 'Pois' %}disabled {% elif action == 'cooling' %}blue {% elif
            action == 'heating' %}orange {% elif
            is_state('input_select.keittio_ilp_tila', 'Manuaali') %}deep-orange
            {% else %}green{% endif %}
          tap_action:
            action: more-info
            entity: climate.keittio_ilp
          card_mod:
            style: |
              ha-card {
                padding: 2px 8px 0 !important;
                background: none !important;
                border: none !important;
                box-shadow: none !important;
              }
        - type: custom:mushroom-chips-card
          alignment: center
          card_mod:
            style: |
              ha-card {
                padding: 0 4px 4px !important;
                background: none !important;
                border: none !important;
                box-shadow: none !important;
              }
          chips:
            - type: template
              icon: mdi:robot-outline
              content: Auto
              icon_color: >-
                {{ 'green' if is_state('input_select.keittio_ilp_tila',
                'Automaatti') else 'grey' }}
              tap_action:
                action: call-service
                service: script.keittio_ilp_automaatti
            - type: template
              icon: mdi:power-off
              content: Pois
              icon_color: >-
                {{ 'red' if is_state('input_select.keittio_ilp_tila', 'Pois')
                else 'grey' }}
              tap_action:
                action: call-service
                service: script.keittio_ilp_pois
            - type: template
              icon: mdi:hand-back-right
              content: Käsi
              icon_color: >-
                {{ 'deep-orange' if is_state('input_select.keittio_ilp_tila',
                'Manuaali') else 'grey' }}
              tap_action:
                action: call-service
                service: input_select.select_option
                data:
                  entity_id: input_select.keittio_ilp_tila
                  option: Manuaali
            - type: template
              icon: mdi:cash
              icon_color: "{{ 'green' if is_state('binary_sensor.lammitys_halpa_sahko', 'on') else 'orange' }}"
              content: >
                {% set p = states('sensor.energi_data_service') | float(0) | round(1) %}
                {{ 'Lattia' if is_state('binary_sensor.lammitys_halpa_sahko', 'on') else 'ILP' }} {{ p }} snt
              tap_action:
                action: more-info
                entity: binary_sensor.lammitys_halpa_sahko
            - type: entity
              entity: input_number.keittio_ilp_lampo
              icon: mdi:fire
              content_info: state
            - type: entity
              entity: input_number.keittio_ilp_lepoasetus
              icon: mdi:sleep
              content_info: state
            - type: entity
              entity: input_number.keittio_ilp_jaahdytys
              icon: mdi:snowflake
              content_info: state
            - type: entity
              entity: input_number.keittio_ilp_jaahdytys_keski
              icon: mdi:calendar-clock
              content_info: state
            - type: entity
              entity: sensor.keittio_ilp_ulko_keski_24h
              icon: mdi:thermometer-lines
              content_info: state
            - type: entity
              entity: sensor.keittio_ilp_tavoite
              icon: mdi:chart-bell-curve-cumulative
              content_info: state
            - type: entity
              entity: sensor.ulkolampotila_met_no
              icon: mdi:thermometer
              content_info: state
            - type: entity
              entity: binary_sensor.terassi_ovi_contact
              icon: mdi:door
              content_info: name
        - type: conditional
          conditions:
            - condition: state
              entity: input_select.keittio_ilp_tila
              state: Manuaali
          card:
            type: custom:mushroom-chips-card
            alignment: center
            card_mod:
              style: |
                ha-card {
                  padding: 0 4px 6px !important;
                  background: none !important;
                  border: none !important;
                  box-shadow: none !important;
                }
            chips:
              - type: template
                icon: mdi:fire
                content: Lämmitys
                icon_color: >-
                  {{ 'orange' if
                  is_state('input_select.keittio_ilp_manuaali_tila', 'Lämmitys')
                  else 'grey' }}
                tap_action:
                  action: call-service
                  service: input_select.select_option
                  data:
                    entity_id: input_select.keittio_ilp_manuaali_tila
                    option: Lämmitys
              - type: template
                icon: mdi:snowflake
                content: Jäähdytys
                icon_color: >-
                  {{ 'blue' if
                  is_state('input_select.keittio_ilp_manuaali_tila',
                  'Jäähdytys') else 'grey' }}
                tap_action:
                  action: call-service
                  service: input_select.select_option
                  data:
                    entity_id: input_select.keittio_ilp_manuaali_tila
                    option: Jäähdytys
              - type: template
                icon: mdi:play
                content: Aja
                icon_color: green
                tap_action:
                  action: call-service
                  service: script.keittio_ilp_manuaali
  - type: custom:mushroom-template-card
    layout: horizontal
    fill_container: true
    primary: Aurinkolämpö
    secondary: "{{ states('sensor.aurinkolampo_tuotto_teksti') }}"
    icon: mdi:solar-power-variant
    icon_color: "{{ 'amber' if is_state('binary_sensor.lammitys_aurinko_lammittaa', 'on') else 'disabled' }}"
    tap_action:
      action: more-info
      entity: sensor.aurinkolampo_tuotto_tanaan
  - type: custom:mod-card
    card_mod:
      style:
        hui-grid-card$:
          power-gauge-card$: >
            .title { font-size: 10px !important; font-weight: 700 !important; }
            .subtitle { font-size: 7px !important; font-weight: 600 !important; }
            .value { font-size: 15px !important; font-weight: 700 !important; }
            .unit-inline { font-size: 8px !important; font-weight: 600 !important; }
            .label-now { font-size: 6px !important; font-weight: 700 !important; }
            .unit { font-size: 7px !important; font-weight: 600 !important; }
            .status { font-size: 7px !important; font-weight: 600 !important; }
            .panel { padding: 6px 4px 4px !important; }
            .stage { margin: 0 !important; }
            .gauge { max-width: 160px !important; }
        .: >
          ha-card { background: none !important; box-shadow: none !important; border: none !important; }
    card:
      type: grid
      square: false
      columns: 4
      cards:
        - type: custom:power-gauge-card
          entity: sensor.nele_ja_keittio_lattialammitys_anturit_air_temperature_8
          name: Kenno
          unit: °C
          min: 0
          max: 80
          normal: 35
          warning: 55
          critical: 70
          precision: 1
          rolling_numbers: false
          background: transparent
        - type: custom:power-gauge-card
          entity: sensor.vilp_ohjaus_lampotilat_air_temperature_12
          name: Aur.meno
          unit: °C
          min: 0
          max: 80
          normal: 35
          warning: 55
          critical: 70
          precision: 1
          rolling_numbers: false
          background: transparent
        - type: custom:power-gauge-card
          entity: sensor.vilp_ohjaus_lampotilat_air_temperature_11
          name: Aur.paluu
          unit: °C
          min: 0
          max: 80
          normal: 35
          warning: 55
          critical: 70
          precision: 1
          rolling_numbers: false
          background: transparent
        - type: custom:power-gauge-card
          entity: sensor.aurinkolampo_teho_kw
          name: Aur.teho
          unit: kW
          min: 0
          max: 12
          normal: 2
          warning: 6
          critical: 10
          precision: 2
          rolling_numbers: false
          background: transparent
  - type: custom:mushroom-chips-card
    alignment: center
    chips:
      - type: template
        icon: mdi:flash
        content: "Spot {{ states('sensor.energi_data_service') | float(0) | round(1) }} c"
      - type: template
        icon: mdi:chart-timeline-variant
        content: "Ennakko {{ states('sensor.lammitys_hinta_ennakko') }} c"
        tap_action:
          action: more-info
          entity: sensor.lammitys_hinta_ennakko
      - type: template
        icon: mdi:compare
        content: >-
          Ero {{
          (states('sensor.nele_ja_keittio_lattialammitys_anturit_air_temperature_8')
          | float(0) -
          states('sensor.vilp_ohjaus_lampotilat_air_temperature_13') | float(0))
          | round(1) }}°
      - type: template
        icon: mdi:solar-power
        content: Tänään {{ states('sensor.aurinkolampo_tuotto_tanaan') | float(0) | round(1) }} kWh
        tap_action:
          action: more-info
          entity: sensor.aurinkolampo_tuotto_tanaan
      - type: template
        icon: mdi:calendar-clock
        content: Eilen {{ states('sensor.aurinkolampo_tuotto_eilen') | float(0) | round(1) }} kWh
        tap_action:
          action: more-info
          entity: sensor.aurinkolampo_tuotto_eilen
      - type: entity
        entity: switch.sonoff_4_ch_pro_2_tasmota3
        icon: mdi:solar-power-variant
        content_info: name
      - type: entity
        entity: input_select.lammitys_aurinkopumppu
        icon: mdi:cog
        content_info: state
      - type: entity
        entity: input_number.lammitys_aurinko_varo
        icon: mdi:solar-power
        content_info: state
      - type: entity
        entity: input_number.lammitys_aurinko_teho_raja
        icon: mdi:solar-power-variant
        content_info: state
  - type: custom:mushroom-template-card
    layout: horizontal
    fill_container: true
    primary: Huoneet
    secondary: Auto / pois / korotus jokaisessa ruudussa
    icon: mdi:home-thermometer
    icon_color: blue
    tap_action:
      action: none
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mod-card
        card_mod:
          style: |
            ha-card {
              border-radius: 16px;
              border: 1px solid rgba(0, 0, 0, 0.08);
              box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
              overflow: hidden;
              {% set pois = is_state('input_select.lammitys_tila_olohuone_keittio', 'Pois') %}
              {% set heat = state_attr('climate.olohuone_lattialammitys', 'hvac_action') == 'heating' or state_attr('climate.keittio_lattialammitys', 'hvac_action') == 'heating' %}
              {% set matala = state_attr('climate.olohuone_lattialammitys', 'temperature') | float(99) <= 17 and state_attr('climate.keittio_lattialammitys', 'temperature') | float(99) <= 17 %}
              {% if pois or matala %}
                background: rgba(100, 116, 139, 0.12);
              {% elif heat %}
                background: rgba(239, 68, 68, 0.16);
              {% else %}
                background: rgba(34, 197, 94, 0.14);
              {% endif %}
            }
        card:
          type: vertical-stack
          cards:
            - type: custom:mushroom-template-card
              entity: climate.olohuone_lattialammitys
              layout: horizontal
              fill_container: true
              primary: >
                {% set o = state_attr('climate.olohuone_lattialammitys',
                'current_temperature') %}
                {% set k = state_attr('climate.keittio_lattialammitys',
                'current_temperature') %}
                {% set o_r = o | round(1) if o is not none else none %}
                {% set k_r = k | round(1) if k is not none else none %}
                Olo+keit · {% if o_r is not none and k_r is not none and o_r ==
                k_r %}{{ o_r }}{% elif o_r is not none and k_r is not none %}{{
                o_r }}/{{ k_r }}{% elif o_r is not none %}{{ o_r }}{% elif k_r
                is not none %}{{ k_r }}{% else %}—{% endif %}°C
              secondary: >
                {% set auto_s =
                states('sensor.lammitys_kaytto_olohuone_keittio') %}
                {% set auto_t = auto_s | float(none) if auto_s not in
                ['unknown','unavailable','none',''] else none %}
                {% set olo_t = state_attr('climate.olohuone_lattialammitys',
                'temperature') %}
                {% set keitt_t = state_attr('climate.keittio_lattialammitys',
                'temperature') %}
                {% set olo_tr = olo_t | round(1) if olo_t is not none else none
                %}
                {% set keitt_tr = keitt_t | round(1) if keitt_t is not none else
                none %}
                {% set h1 = state_attr('climate.olohuone_lattialammitys',
                'hvac_action') %}
                {% set h2 = state_attr('climate.keittio_lattialammitys',
                'hvac_action') %}
                {% set ohj =
                states('input_select.lammitys_tila_olohuone_keittio') %}
                {% set kor = is_state('timer.lammitys_korotus_olohuone_keittio',
                'active') %}
                {% set terassi_auki =
                is_state('binary_sensor.lammitys_terassi_auki', 'on') %}
                Auto {% if auto_t is not none %}{{ auto_t | round(1) }}{% else
                %}—{% endif %}° · Termo {% if olo_tr is not none and keitt_tr is
                not none and olo_tr == keitt_tr %}{{ olo_tr }}{% elif olo_tr is
                not none and keitt_tr is not none %}{{ olo_tr }}/{{ keitt_tr
                }}{% elif olo_tr is not none %}{{ olo_tr }}{% elif keitt_tr is
                not none %}{{ keitt_tr }}{% else %}—{% endif %}° · {% if ohj ==
                'Pois' or (olo_t is not none and olo_t | float(99) <= 17 and
                keitt_t is not none and keitt_t | float(99) <= 17) %}📉 Matala{%
                elif h1 == 'heating' or h2 == 'heating' %}♨️ Lämmittää{% else
                %}⏸ Odottaa{% endif %} · {% if ohj == 'Pois' %}Ohjaus pois{%
                elif kor %}Korotus ⏱{% else %}Ohjaus auto{% endif %}{% if
                terassi_auki %} · 🚪 Terassi auki{% endif %}{% if ohj != 'Pois'
                and not is_state('binary_sensor.lammitys_halpa_sahko', 'on') %}
                · ILP ensisijainen{% elif ohj != 'Pois' %} · Lattia
                lämmittää{% endif %}
              icon: mdi:sofa-outline
              icon_color: >
                {% if is_state('input_select.lammitys_tila_olohuone_keittio',
                'Pois') %}grey {% elif
                state_attr('climate.olohuone_lattialammitys', 'temperature') |
                float(99) <= 17 and state_attr('climate.keittio_lattialammitys',
                'temperature') | float(99) <= 17 %}disabled {% elif
