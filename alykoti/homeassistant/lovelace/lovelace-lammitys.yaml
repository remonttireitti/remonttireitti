# Kopioi TÄMÄ koko tiedosto Home Assistantin Lovelace-kortin YAML-editoriin
# (korvaa koko nykyinen kortti). Älä liitä snippettejä.

type: vertical-stack
cards:
  - type: custom:mod-card
    card_mod:
      style: |
        ha-card {
          border-radius: 16px;
          border: 2px solid rgba(234, 88, 12, 0.50);
          border-left: 8px solid rgb(234, 88, 12);
          background: rgba(234, 88, 12, 0.22);
          box-shadow: none;
          overflow: hidden;
          --stack-card-margin: 2px;
          margin: 8px 0;
          padding: 4px 0 6px;
          --ha-card-border-width: 0;
          --ha-card-background: transparent;
        }
    card:
      type: vertical-stack
      cards:
        - type: custom:mushroom-template-card
          layout: horizontal
          fill_container: true
          primary: "{{ states('sensor.lammitys_ohjaus_tila') }}"
          secondary: "{{ state_attr('sensor.lammitys_ohjaus_tila', 'syy') }}"
          icon: >
            {% set t = states('sensor.lammitys_ohjaus_tila') %}
            {% if t == 'Huone alarajalla' %}mdi:thermometer-low
            {% elif t == 'Lämmitysvesi kylmä' %}mdi:snowflake-alert
            {% elif t == 'Liian korkea hetkellinen kulutus' %}mdi:cash-remove
            {% elif t == 'Asetusta nostettu' %}mdi:thermometer-chevron-up
            {% elif t == 'Ennakoiva lämmitys' %}mdi:chart-timeline-variant
            {% elif t == 'Halpa sähkö' %}mdi:cash
            {% elif t == 'Kallis sähkö' %}mdi:cash-clock
            {% else %}mdi:radiator{% endif %}
          icon_color: >
            {% set t = states('sensor.lammitys_ohjaus_tila') %}
            {% if t in ['Huone alarajalla', 'Lämmitysvesi kylmä', 'Liian korkea hetkellinen kulutus'] %}red
            {% elif t == 'Asetusta nostettu' %}blue
            {% elif t == 'Ennakoiva lämmitys' %}orange
            {% elif t == 'Halpa sähkö' %}green
            {% elif t == 'Kallis sähkö' %}amber
            {% else %}disabled{% endif %}
          tap_action:
            action: more-info
            entity: sensor.lammitys_ohjaus_tila
          card_mod:
            style: |
              ha-card {
                background: none !important;
                border: none !important;
                box-shadow: none !important;
              }
        - type: custom:mushroom-chips-card
          alignment: center
          chips:
            - type: template
              icon: mdi:thermometer-alert
              icon_color: "{{ 'red' if is_state('binary_sensor.lammitys_rajoitettu', 'on') else 'grey' }}"
              content: "{{ 'Lämmitys rajoitettu' if is_state('binary_sensor.lammitys_rajoitettu', 'on') else 'Ei rajoitusta' }}"
              tap_action:
                action: more-info
                entity: sensor.lammitys_ohjaus_tila
            - type: template
              icon: mdi:cash-remove
              icon_color: "{{ 'red' if is_state('binary_sensor.lammitys_hetki_rajoita_huone', 'on') or is_state('binary_sensor.lammitys_hetki_rajoita_vesi', 'on') else 'grey' }}"
              content: >
                {% if is_state('binary_sensor.lammitys_hetki_rajoita_vesi', 'on') %}Hetkellinen korkea — huoneet ja vastus
                {% elif is_state('binary_sensor.lammitys_hetki_rajoita_huone', 'on') %}Hetkellinen korkea — huoneet
                {% else %}Hetkellinen ok{% endif %}
              tap_action:
                action: more-info
                entity: sensor.hetkellinen_kustannus
            - type: template
              icon: mdi:thermometer-chevron-up
              icon_color: "{{ 'blue' if is_state('binary_sensor.lammitys_korotus_paalla', 'on') else 'grey' }}"
              content: "{{ 'Asetusta nostettu' if is_state('binary_sensor.lammitys_korotus_paalla', 'on') else 'Ei korotusta' }}"
              tap_action:
                action: more-info
                entity: binary_sensor.lammitys_korotus_paalla
            - type: template
              icon: mdi:cash
              icon_color: "{{ 'green' if is_state('binary_sensor.lammitys_halpa_sahko', 'on') or is_state('binary_sensor.lammitys_ennakoiva', 'on') else 'amber' }}"
              content: "{{ 'Halpa sähkö' if is_state('binary_sensor.lammitys_halpa_sahko', 'on') or is_state('binary_sensor.lammitys_ennakoiva', 'on') else 'Kallis sähkö' }}"
              tap_action:
                action: more-info
                entity: binary_sensor.lammitys_halpa_sahko
            - type: template
              icon: mdi:chart-timeline-variant
              icon_color: "{{ 'orange' if is_state('binary_sensor.lammitys_ennakoiva', 'on') else 'grey' }}"
              content: "{{ 'Lattia vara' if is_state('binary_sensor.lammitys_ennakoiva', 'on') else 'Ei ennakkoa' }}"
              tap_action:
                action: more-info
                entity: binary_sensor.lammitys_ennakoiva
            - type: template
              icon: mdi:water-thermometer
              icon_color: >
                {% if is_state('binary_sensor.lammitys_menovesi_nosto', 'on') %}green
                {% elif is_state('binary_sensor.lammitys_menovesi_rajoitus', 'on') %}orange
                {% else %}grey{% endif %}
              content: >
                {% set adj = states('sensor.lammitys_sekoitus_hinta_korjaus') | float(0) %}
                {% if adj > 0.3 %}Menovesi +{{ adj | round(1) }}°
                {% elif adj < -0.3 %}Menovesi {{ adj | round(1) }}°
                {% else %}Menovesi käyrällä{% endif %}
              tap_action:
                action: more-info
                entity: sensor.lammitys_sekoitus_hinta_korjaus
        - type: custom:mushroom-template-card
          layout: horizontal
          fill_container: true
          primary: Lämmitys ohjaus
          secondary: "{{ states('sensor.lammitys_menovesi_teksti') }}"
          icon: mdi:radiator
          icon_color: "{{ 'green' if is_state('binary_sensor.lammitys_sekoituspumppu_paalla', 'on') else ('orange' if is_state('binary_sensor.lammitys_sekoitus_sallittu', 'on') else 'disabled') }}"
          tap_action:
            action: more-info
            entity: sensor.lammitys_menovesi_teksti
          card_mod:
            style: |
              ha-card {
                background: none !important;
                border: none !important;
                box-shadow: none !important;
              }
        - type: custom:mushroom-template-card
          layout: horizontal
          fill_container: true
          primary: "Meno {{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_10') }}° · tavoite {{ states('sensor.lammitys_sekoitus_kaytto') }}° · paluu {{ states('sensor.vilp_ohjaus_lampotilat_air_temperature_9') }}°"
          secondary: "{{ states('sensor.lammitys_sekoitus_teksti') }}"
          icon: mdi:pipe-valve
          icon_color: "{{ 'green' if is_state('binary_sensor.lammitys_sekoitus_sallittu', 'on') else 'disabled' }}"
          tap_action:
            action: more-info
            entity: sensor.lammitys_sekoitus_teksti
          card_mod:
            style: |
              ha-card {
                background: none !important;
                border: none !important;
                box-shadow: none !important;
              }
        - type: custom:mod-card
          card_mod:
            style: |
              ha-card { background: none !important; box-shadow: none !important; border: none !important; }
          card:
            type: grid
            square: false
            columns: 4
            cards:
              - type: custom:mod-card
                card_mod:
                  style:
                    power-gauge-card$: |
                      .title { font-size: 10px !important; font-weight: 700 !important; }
                      .value { font-size: 15px !important; font-weight: 700 !important; }
                      .unit-inline { font-size: 8px !important; font-weight: 600 !important; }
                      .panel { padding: 6px 4px 4px !important; }
                      .stage { margin: 0 !important; }
                      .gauge { max-width: 160px !important; }
                      .subtitle, .status { display: none !important; }
                      .label-now { font-size: 0 !important; }
                      .label-now::after { content: "NYT"; font-size: 6px !important; font-weight: 700; letter-spacing: 1.5px; }
                      .unit { font-size: 0 !important; }
                      .unit::after { content: "{% set t = states('sensor.vilp_ohjaus_lampotilat_air_temperature_13') | float(none) %}{{ 'Ei dataa' if t is none else ('Kriittinen' if t > 50 else ('Varoitus' if t > 40 else ('Matala' if t < 35 else 'Normaali'))) }}"; font-size: 7px !important; font-weight: 700; }
                card:
                  type: custom:power-gauge-card
                  entity: sensor.vilp_ohjaus_lampotilat_air_temperature_13
                  name: Varaaja
                  unit: °C
                  min: 20
                  max: 60
                  normal: 40
                  warning: 41
                  critical: 50
                  precision: 1
                  rolling_numbers: false
                  background: transparent
              - type: custom:mod-card
                card_mod:
                  style:
                    power-gauge-card$: |
                      .title { font-size: 10px !important; font-weight: 700 !important; }
                      .value { font-size: 15px !important; font-weight: 700 !important; }
                      .unit-inline { font-size: 8px !important; font-weight: 600 !important; }
                      .panel { padding: 6px 4px 4px !important; }
                      .stage { margin: 0 !important; }
                      .gauge { max-width: 160px !important; }
                      .subtitle, .status { display: none !important; }
                      .label-now { font-size: 0 !important; }
                      .label-now::after { content: "NYT"; font-size: 6px !important; font-weight: 700; letter-spacing: 1.5px; }
                      .unit { font-size: 0 !important; }
                      .unit::after { content: "{% set t = states('sensor.vilp_ohjaus_lampotilat_air_temperature_8') | float(none) %}{{ 'Ei dataa' if t is none else ('Kriittinen' if t > 80 else ('Varoitus' if t >= 75 else ('Matala' if t < 65 else 'Normaali'))) }}"; font-size: 7px !important; font-weight: 700; }
                card:
                  type: custom:power-gauge-card
                  entity: sensor.vilp_ohjaus_lampotilat_air_temperature_8
                  name: Käyttövesi
                  unit: °C
                  min: 40
                  max: 90
                  normal: 70
                  warning: 75
                  critical: 80
                  precision: 1
                  rolling_numbers: false
                  background: transparent
              - type: custom:mod-card
                card_mod:
                  style:
                    power-gauge-card$: |
                      .title { font-size: 10px !important; font-weight: 700 !important; }
                      .value { font-size: 15px !important; font-weight: 700 !important; }
                      .unit-inline { font-size: 8px !important; font-weight: 600 !important; }
                      .panel { padding: 6px 4px 4px !important; }
                      .stage { margin: 0 !important; }
                      .gauge { max-width: 160px !important; }
                      .subtitle, .status { display: none !important; }
                      .label-now { font-size: 0 !important; }
                      .label-now::after { content: "NYT"; font-size: 6px !important; font-weight: 700; letter-spacing: 1.5px; }
                      .unit { font-size: 0 !important; }
                      .unit::after { content: "{% set t = states('sensor.vilp_ohjaus_lampotilat_air_temperature_10') | float(none) %}{{ 'Ei dataa' if t is none else ('Kriittinen' if t >= 42 else ('Varoitus' if t >= 36 else 'Normaali')) }}"; font-size: 7px !important; font-weight: 700; }
                card:
                  type: custom:power-gauge-card
                  entity: sensor.vilp_ohjaus_lampotilat_air_temperature_10
                  name: LL meno
                  unit: °C
                  min: 20
                  max: 45
                  normal: 28
                  warning: 36
                  critical: 42
                  precision: 1
                  rolling_numbers: false
                  background: transparent
              - type: custom:mod-card
                card_mod:
                  style:
                    power-gauge-card$: |
                      .title { font-size: 10px !important; font-weight: 700 !important; }
                      .value { font-size: 15px !important; font-weight: 700 !important; }
                      .unit-inline { font-size: 8px !important; font-weight: 600 !important; }
                      .panel { padding: 6px 4px 4px !important; }
                      .stage { margin: 0 !important; }
                      .gauge { max-width: 160px !important; }
                      .subtitle, .status { display: none !important; }
                      .label-now { font-size: 0 !important; }
                      .label-now::after { content: "NYT"; font-size: 6px !important; font-weight: 700; letter-spacing: 1.5px; }
                      .unit { font-size: 0 !important; }
                      .unit::after { content: "{% set t = states('sensor.vilp_ohjaus_lampotilat_air_temperature_9') | float(none) %}{{ 'Ei dataa' if t is none else ('Kriittinen' if t >= 40 else ('Varoitus' if t >= 34 else 'Normaali')) }}"; font-size: 7px !important; font-weight: 700; }
                card:
                  type: custom:power-gauge-card
                  entity: sensor.vilp_ohjaus_lampotilat_air_temperature_9
                  name: LL paluu
                  unit: °C
                  min: 20
                  max: 45
                  normal: 26
                  warning: 34
                  critical: 40
                  precision: 1
                  rolling_numbers: false
                  background: transparent
        - type: custom:mushroom-chips-card
          alignment: center
          chips:
            - type: template
              icon: mdi:pump
              icon_color: "{{ 'green' if is_state('switch.sonoff_4_ch_pro_2_tasmota2', 'on') else 'grey' }}"
              content: "{{ 'Kierto päällä' if is_state('switch.sonoff_4_ch_pro_2_tasmota2', 'on') else 'Kierto pois' }}"
              tap_action:
                action: more-info
                entity: switch.sonoff_4_ch_pro_2_tasmota2
            - type: template
              icon: mdi:pump
              icon_color: "{{ 'orange' if is_state('timer.lammitys_sekoitus_pulssi', 'active') else ('blue' if is_state('timer.lammitys_sekoitus_odota', 'active') else ('green' if is_state('binary_sensor.lammitys_sekoituspumppu_paalla', 'on') else 'grey')) }}"
              content: >
                {% if is_state('timer.lammitys_sekoitus_pulssi', 'active') %}Sekoitus pulssi
                {% elif is_state('timer.lammitys_sekoitus_odota', 'active') %}Sekoitus odottaa KV
                {% elif is_state('binary_sensor.lammitys_sekoituspumppu_paalla', 'on') %}Sekoitus päällä
                {% else %}Sekoitus pois{% endif %}
              tap_action:
                action: more-info
                entity: sensor.lammitys_menovesi_teksti
              hold_action:
                action: more-info
                entity: switch.sonoff_4_ch_pro_2_tasmota4
            - type: template
              icon: mdi:water-boiler
              icon_color: >
                {% if is_state('timer.lammitys_sekoitus_pulssi', 'active') or is_state('binary_sensor.lammitys_sekoituspumppu_paalla', 'on') %}green
                {% elif is_state('switch.pannuhuone_lapivirtausvastus', 'on') %}orange
                {% elif is_state('binary_sensor.lammitys_varaaja_tarve', 'on') %}red
                {% else %}grey{% endif %}
              content: >
                {% set t = state_attr('climate.lattialammitys', 'temperature') %}
                {% if is_state('timer.lammitys_sekoitus_pulssi', 'active') or is_state('binary_sensor.lammitys_sekoituspumppu_paalla', 'on') %}Varaaja ← KV
                {% elif is_state('switch.pannuhuone_lapivirtausvastus', 'on') %}Varaaja ← vastus
                {% elif is_state('binary_sensor.lammitys_varaaja_tarve', 'on') %}Varaaja kutsuu
                {% else %}Varaaja {{ t }}°{% endif %}
              tap_action:
                action: more-info
                entity: climate.lattialammitys
            - type: entity
              entity: input_number.lammitys_menovesi_hystereesi
              icon: mdi:thermometer-chevron-down
              content_info: state
            - type: entity
              entity: input_number.lammitys_kayra_ulko_vih
              icon: mdi:weather-sunny
              content_info: state
            - type: entity
              entity: input_number.lammitys_kayra_ulko_kylma
              icon: mdi:snowflake
              content_info: state
            - type: entity
              entity: input_number.lammitys_kayra_meno_min
              icon: mdi:thermometer-low
              content_info: state
            - type: entity
              entity: input_number.lammitys_kayra_meno_max
              icon: mdi:thermometer-high
              content_info: state
            - type: entity
              entity: input_number.lammitys_hinta_halpa
              icon: mdi:currency-eur
              content_info: state
            - type: entity
              entity: input_number.lammitys_hinta_kallis
              icon: mdi:currency-eur-off
              content_info: state
            - type: entity
              entity: input_number.lammitys_hinta_nosto_max
              icon: mdi:thermometer-chevron-up
              content_info: state
            - type: entity
              entity: input_number.lammitys_hinta_rajoitus_max
              icon: mdi:thermometer-minus
              content_info: state
            - type: entity
              entity: input_number.lammitys_hinta_ennakko_h
              icon: mdi:clock-outline
              content_info: state
            - type: entity
              entity: input_number.lammitys_kv_pumppu_paalle
              icon: mdi:water-thermometer
              content_info: state
            - type: entity
              entity: input_number.lammitys_kv_pumppu_pois
              icon: mdi:water-alert
              content_info: state
            - type: entity
              entity: input_number.lammitys_sekoitus_pulssi_s
              icon: mdi:timer-outline
              content_info: state
            - type: entity
              entity: input_number.lammitys_sekoitus_odota_s
              icon: mdi:timer-sand
              content_info: state
            - type: entity
              entity: input_number.lammitys_kv_pulse_max_lasku
              icon: mdi:thermometer-chevron-down
              content_info: state
            - type: entity
              entity: input_number.lammitys_kv_viime_lasku
              icon: mdi:delta
              content_info: state
            - type: template
              icon: mdi:heating-coil
              icon_color: >
                {% if is_state('switch.pannuhuone_lapivirtausvastus', 'on') %}red
                {% elif is_state('timer.lammitys_vastus_odota', 'active') %}orange
                {% elif is_state('timer.lammitys_ll_pumppu_viive', 'active') %}blue
                {% elif is_state('binary_sensor.lammitys_vastus_sallittu', 'on') %}green
                {% else %}grey{% endif %}
              content: "{{ states('sensor.lammitys_vastus_teksti') }}"
              tap_action:
                action: more-info
                entity: sensor.lammitys_vastus_teksti
              hold_action:
                action: more-info
                entity: input_select.lammitys_vastus
        - type: logbook
          hours_to_show: 24
          entities:
            - sensor.lammitys_ohjaus_tila
            - switch.sonoff_4_ch_pro_2_tasmota4
            - switch.pannuhuone_lapivirtausvastus
            - switch.sonoff_4_ch_pro_2_tasmota2
            - binary_sensor.lammitys_hetki_rajoita_huone
            - binary_sensor.lammitys_hetki_rajoita_vesi
            - binary_sensor.lammitys_korotus_paalla
            - binary_sensor.lammitys_ennakoiva
            - binary_sensor.lammitys_halpa_sahko
            - binary_sensor.lammitys_menovesi_nosto
            - binary_sensor.lammitys_menovesi_rajoitus
  - type: custom:mod-card
    card_mod:
      style: |
        ha-card {
          border-radius: 16px;
          border: 1px solid rgba(0, 0, 0, 0.16);
          box-shadow: none;
          margin: 6px 0;
          overflow: hidden;
          --stack-card-margin: 0px;
          --mush-spacing: 4px;
          --icon-size: 32px;
          --ha-card-background: transparent;
          {% set tila = states('input_select.keittio_ilp_tila') %}
          {% set ulko = states('sensor.ulkolampotila_met_no') | float(0) %}
          {% set action = state_attr('climate.keittio_ilp', 'hvac_action') %}
          {% if tila == 'Pois' %}
            background: rgba(100, 116, 139, 0.28);
            border: 2px solid rgba(100, 116, 139, 0.55);
            border-left: 8px solid rgb(100, 116, 139);
          {% elif action == 'cooling' %}
            background: rgba(59, 130, 246, 0.26);
            border: 2px solid rgba(37, 99, 235, 0.55);
            border-left: 8px solid rgb(37, 99, 235);
          {% elif action == 'heating' %}
            background: rgba(239, 68, 68, 0.26);
            border: 2px solid rgba(220, 38, 38, 0.55);
            border-left: 8px solid rgb(220, 38, 38);
          {% elif ulko > 20 %}
            background: rgba(148, 163, 184, 0.24);
            border: 2px solid rgba(100, 116, 139, 0.50);
            border-left: 8px solid rgb(100, 116, 139);
          {% else %}
            background: rgba(34, 197, 94, 0.22);
            border: 2px solid rgba(22, 163, 74, 0.55);
            border-left: 8px solid rgb(22, 163, 74);
          {% endif %}
        }
    card:
      type: vertical-stack
      cards:
        - type: custom:mushroom-template-card
          layout: horizontal
          fill_container: false
          primary: >
            Keittiö ILP · {{ state_attr('climate.keittio_ilp',
            'current_temperature') | float(0) | round(1) }} → {{
            state_attr('climate.keittio_ilp', 'temperature') | float(0) |
            round(1) }} °C
          secondary: >
            {% set s1 = states('input_text.keittio_ilp') %}
            {% set s2 = states('input_text.keittio_ilp_status') %}
            {{ s2 if s1 in ['unknown', 'unavailable', 'none', ''] else s1 }}
          icon: mdi:air-conditioner
          icon_color: >
            {% set tila = states('input_select.keittio_ilp_tila') %} {% set
            action = state_attr('climate.keittio_ilp', 'hvac_action') %} {% if
            tila == 'Pois' %}disabled {% elif action == 'cooling' %}blue {% elif
            action == 'heating' %}orange {% elif
            is_state('input_select.keittio_ilp_tila', 'Manuaali') %}deep-orange
            {% else %}green{% endif %}
          tap_action:
            action: more-info
            entity: climate.keittio_ilp
          card_mod:
            style: |
              ha-card {
                padding: 2px 8px 0 !important;
                background: none !important;
                border: none !important;
                box-shadow: none !important;
              }
        - type: custom:mushroom-chips-card
          alignment: center
          card_mod:
            style: |
              ha-card {
                padding: 0 4px 4px !important;
                background: none !important;
                border: none !important;
                box-shadow: none !important;
              }
          chips:
            - type: template
              icon: mdi:robot-outline
              content: Auto
              icon_color: >-
                {{ 'green' if is_state('input_select.keittio_ilp_tila',
                'Automaatti') else 'grey' }}
              tap_action:
                action: call-service
                service: script.keittio_ilp_automaatti
            - type: template
              icon: mdi:power-off
              content: Pois
              icon_color: >-
                {{ 'red' if is_state('input_select.keittio_ilp_tila', 'Pois')
                else 'grey' }}
              tap_action:
                action: call-service
                service: script.keittio_ilp_pois
            - type: template
              icon: mdi:hand-back-right
              content: Käsi
              icon_color: >-
                {{ 'deep-orange' if is_state('input_select.keittio_ilp_tila',
                'Manuaali') else 'grey' }}
              tap_action:
                action: call-service
                service: input_select.select_option
                data:
                  entity_id: input_select.keittio_ilp_tila
                  option: Manuaali
            - type: template
              icon: mdi:cash
              icon_color: "{{ 'orange' if is_state('binary_sensor.lammitys_ennakoiva', 'on') else 'green' }}"
              content: >
                {% set p = states('sensor.energi_data_service') | float(0) | round(1) %}
                {{ 'ILP + lattia vara' if is_state('binary_sensor.lammitys_ennakoiva', 'on') else 'ILP olo+keittiö' }} {{ p }} snt
              tap_action:
                action: more-info
                entity: binary_sensor.lammitys_halpa_sahko
            - type: entity
              entity: input_number.keittio_ilp_lampo
              icon: mdi:fire
              content_info: state
            - type: entity
