# Koko IV-kortti. Korvaa Lovelace-editorissa koko YAML.
# Vaatii packages/iv.yaml (input_select.iv_auto_anturit ym.).

type: vertical-stack
cards:
  - type: custom:mod-card
    card_mod:
      style: |
        ha-card {
          border-radius: 16px 16px 0 0;
          border: 1px solid rgba(0, 0, 0, 0.08);
          border-bottom: none;
          box-shadow: none;
          {% set ohj = states('input_select.iv_ohjaus') %}
          {% if ohj == 'Pois' %}
            background: rgba(100, 116, 139, 0.12);
          {% elif ohj == 'Tehostus' %}
            background: rgba(239, 68, 68, 0.14);
          {% elif ohj == 'Manuaali' %}
            background: rgba(59, 130, 246, 0.12);
          {% else %}
            background: rgba(34, 197, 94, 0.12);
          {% endif %}
        }
    card:
      type: custom:mushroom-template-card
      entity: sensor.airfi_poistoilmapuhallin_nopeus
      layout: horizontal
      fill_container: true
      primary: >
        {% set ohj = states('input_select.iv_ohjaus') %}
        IV · {{ ohj if ohj not in ['unknown','unavailable','none',''] else 'AirFi' }}
      secondary: >
        {% set po = states('sensor.airfi_poistoilmapuhallin_nopeus') %}
        {% set tu = states('sensor.airfi_tuloilmapuhallin_nopeus') %}
        {% if po in ['unknown','unavailable','none',''] or tu in ['unknown','unavailable','none',''] %}
          Tarkista sensor.airfi_poistoilmapuhallin_nopeus
        {% elif is_state('input_select.iv_ohjaus', 'Automaatti') %}
          Poisto {{ po | float(0) | round(0) }} % · tulo {{ tu | float(0) | round(0) }} %
          · auto {{ states('input_select.iv_auto_anturit') }}
        {% else %}
          Poisto {{ po | float(0) | round(0) }} % · tulo {{ tu | float(0) | round(0) }} %
        {% endif %}
      icon: mdi:fan
      icon_color: >
        {% set ohj = states('input_select.iv_ohjaus') %}
        {% if ohj == 'Pois' %}disabled
        {% elif ohj == 'Tehostus' %}red
        {% elif ohj == 'Manuaali' %}blue
        {% else %}green{% endif %}
  - type: custom:mushroom-template-card
    entity: sensor.iv_auto_tavoite
    layout: horizontal
    primary: >
      {% set t = states('sensor.iv_auto_tavoite') %}
      {% if t in ['unknown','unavailable','none',''] %}
        Auto-tavoite ei valmis
      {% else %}
        Auto-tavoite {{ t | int }} %
      {% endif %}
    secondary: >
      {{ states('input_select.iv_auto_anturit') }}
      · määrää {{ states('sensor.iv_auto_lahde') }}
    icon: mdi:target
    icon_color: "{{ 'green' if states('sensor.iv_auto_tavoite') not in ['unknown','unavailable','none',''] else 'grey' }}"
    tap_action:
      action: more-info
  - type: custom:mushroom-select-card
    entity: input_select.iv_auto_anturit
    name: Automaatin anturit
    icon: mdi:tune-variant
    layout: horizontal
    secondary_info: none
  - type: custom:mushroom-chips-card
    alignment: center
    chips:
      - type: template
        icon: mdi:molecule-co2
        icon_color: "{{ 'green' if 'CO2' in states('input_select.iv_auto_anturit') else 'grey' }}"
        content: >
          {% set e = states('input_text.iv_co2_entiteetti') | trim %}
          {% set s = states(e) %}
          {% set t = states('sensor.iv_auto_co2_tavoite') %}
          {% if s in ['unknown','unavailable','none',''] %}CO₂ —
          {% elif t not in ['unknown','unavailable','none',''] %}CO₂ {{ s | float(0) | round(0) }} → {{ t | int }} %
          {% else %}CO₂ {{ s | float(0) | round(0) }}{% endif %}
        tap_action:
          action: more-info
          entity: sensor.iv_auto_co2_tavoite
      - type: template
        icon: mdi:water-percent
        icon_color: "{{ 'green' if 'kosteus' in states('input_select.iv_auto_anturit') else 'grey' }}"
        content: >
          {% set e = states('input_text.iv_kosteus_entiteetti') | trim %}
          {% set s = states(e) %}
          {% set t = states('sensor.iv_auto_kosteus_tavoite') %}
          {% if s in ['unknown','unavailable','none',''] %}RH —
          {% elif t not in ['unknown','unavailable','none',''] %}RH {{ s | float(0) | round(0) }} % → {{ t | int }} %
          {% else %}RH {{ s | float(0) | round(0) }} %{% endif %}
        tap_action:
          action: more-info
          entity: sensor.iv_auto_kosteus_tavoite
      - type: template
        icon: mdi:air-filter
        icon_color: "{{ 'green' if 'PM' in states('input_select.iv_auto_anturit') else 'grey' }}"
        content: >
          {% set e = states('input_text.iv_pm_entiteetti') | trim %}
          {% set s = states(e) %}
          {% set t = states('sensor.iv_auto_pm_tavoite') %}
          {% if s in ['unknown','unavailable','none',''] %}PM —
          {% elif t not in ['unknown','unavailable','none',''] %}PM {{ s | float(0) | round(0) }} → {{ t | int }} %
          {% else %}PM {{ s | float(0) | round(0) }}{% endif %}
        tap_action:
          action: more-info
          entity: sensor.iv_auto_pm_tavoite
  - type: custom:mushroom-template-card
    primary: >
      {% if is_state('input_boolean.iv_modbus_kirjoitus', 'on') %}
        Modbus-kirjoitus päällä
      {% else %}
        Modbus-kirjoitus pois
      {% endif %}
    secondary: Automaatti kirjoittaa vain kun tämä on päällä
    icon: mdi:upload-network
    icon_color: "{{ 'orange' if is_state('input_boolean.iv_modbus_kirjoitus', 'on') else 'grey' }}"
    layout: horizontal
    tap_action:
      action: toggle
      entity: input_boolean.iv_modbus_kirjoitus
  - type: custom:mushroom-chips-card
    alignment: center
    chips:
      - type: template
        icon: mdi:robot-outline
        content: Auto
        icon_color: "{{ 'green' if is_state('input_select.iv_ohjaus', 'Automaatti') else 'grey' }}"
        tap_action:
          action: perform-action
          perform_action: script.iv_automaatti
      - type: template
        icon: mdi:gesture-tap
        content: Käsi
        icon_color: "{{ 'blue' if is_state('input_select.iv_ohjaus', 'Manuaali') else 'grey' }}"
        tap_action:
          action: perform-action
          perform_action: script.iv_manuaali
      - type: template
        icon: mdi:fan-plus
        content: Tehostus
        icon_color: "{{ 'red' if is_state('input_select.iv_ohjaus', 'Tehostus') else 'grey' }}"
        tap_action:
          action: perform-action
          perform_action: script.iv_tehostus
      - type: template
        icon: mdi:fan-off
        content: Pois
        icon_color: "{{ 'red' if is_state('input_select.iv_ohjaus', 'Pois') else 'grey' }}"
        tap_action:
          action: perform-action
          perform_action: script.iv_pois
      - type: template
        icon: mdi:hot-tub
        content: >
          {% set s = states('sensor.airfi_saunatila') %}
          Sauna · {{ 'Päällä' if s not in ['unknown','unavailable','none',''] and s | int(0) > 0 else 'Pois' }}
        icon_color: >
          {% set s = states('sensor.airfi_saunatila') %}
          {{ 'orange' if s not in ['unknown','unavailable','none',''] and s | int(0) > 0 else 'grey' }}
        tap_action:
          action: perform-action
          perform_action: script.iv_sauna
  - type: conditional
    conditions:
      - condition: state
        entity: timer.iv_tehostus
        state: active
    card:
      type: custom:mushroom-entity-card
      entity: timer.iv_tehostus
      name: Tehostus jäljellä
      icon: mdi:timer-sand
      icon_color: red
      layout: horizontal
      tap_action:
        action: perform-action
        perform_action: script.iv_automaatti
  - type: conditional
    conditions:
      - condition: state
        entity: input_select.iv_ohjaus
        state: Manuaali
    card:
      type: vertical-stack
      cards:
        - type: custom:mushroom-number-card
          entity: input_number.iv_manuaali_poisto
          display_mode: slider
          layout: horizontal
          icon_color: blue
        - type: custom:mushroom-number-card
          entity: input_number.iv_manuaali_tulo
          display_mode: slider
          layout: horizontal
          icon_color: cyan
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-template-card
        entity: sensor.airfi_poistoilmapuhallin_nopeus
        layout: vertical
        primary: >
          {% set s = states('sensor.airfi_poistoilmapuhallin_nopeus') %}
          {% if s in ['unknown','unavailable','none',''] %}—{% else %}{{ s | float(0) | round(0) }} %{% endif %}
        secondary: Poisto
        icon: mdi:fan
        icon_color: green
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        entity: sensor.airfi_tuloilmapuhallin_nopeus
        layout: vertical
        primary: >
          {% set s = states('sensor.airfi_tuloilmapuhallin_nopeus') %}
          {% if s in ['unknown','unavailable','none',''] %}—{% else %}{{ s | float(0) | round(0) }} %{% endif %}
        secondary: Tulo
        icon: mdi:fan-plus
        icon_color: green
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        entity: sensor.airfi_t5_tuloilma
        layout: vertical
        primary: >
          {% set s = states('sensor.airfi_t5_tuloilma') %}
          {% if s in ['unknown','unavailable','none',''] %}—{% else %}{{ s }} °C{% endif %}
        secondary: T5 tulo
        icon: mdi:thermometer
        icon_color: orange
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        entity: sensor.airfi_t3_poistoilma
        layout: vertical
        primary: >
          {% set s = states('sensor.airfi_t3_poistoilma') %}
          {% if s in ['unknown','unavailable','none',''] %}—{% else %}{{ s }} °C{% endif %}
        secondary: T3 poisto
        icon: mdi:thermometer
        icon_color: orange
        tap_action:
          action: more-info
  - type: custom:mushroom-chips-card
    alignment: center
    chips:
      - type: template
        icon: mdi:thermometer
        content: >
          {% set s = states('sensor.airfi_t1_ulkoilma') %}
          {% if s in ['unknown','unavailable','none',''] %}T1 —{% else %}T1 {{ s }} °C{% endif %}
        tap_action:
          action: more-info
          entity: sensor.airfi_t1_ulkoilma
      - type: template
        icon: mdi:thermometer
        content: >
          {% set s = states('sensor.airfi_t2_lto_jalkeen') %}
          {% if s in ['unknown','unavailable','none',''] %}T2 —{% else %}T2 {{ s }} °C{% endif %}
        tap_action:
          action: more-info
          entity: sensor.airfi_t2_lto_jalkeen
      - type: template
        icon: mdi:thermometer
        content: >
          {% set s = states('sensor.airfi_t4_jateilma') %}
          {% if s in ['unknown','unavailable','none',''] %}T4 —{% else %}T4 {{ s }} °C{% endif %}
        tap_action:
          action: more-info
          entity: sensor.airfi_t4_jateilma
      - type: template
        icon: mdi:water-percent
        content: >
          {% set s = states('sensor.airfi_kosteus_rh') %}
          {% if s in ['unknown','unavailable','none',''] %}RH —{% else %}RH {{ s | float(0) | round(0) }} %{% endif %}
        tap_action:
          action: more-info
          entity: sensor.airfi_kosteus_rh
  - type: custom:mushroom-template-card
    entity: sensor.airfi_hataseis_tila
    layout: horizontal
    primary: >
      {% set h = states('sensor.airfi_hataseis_tila') %}
      {% set v = states('sensor.airfi_vikatila') %}
      {% if h in ['unknown','unavailable','none',''] and v in ['unknown','unavailable','none',''] %}
        Hälytyslukemia ei ole
      {% elif h | int(0) > 0 or v | int(0) > 0 %}
        Hälytys · hätäseis {{ h }} · vika {{ v }}
      {% else %}
        Ei hälytyksiä
      {% endif %}
    secondary: Kuittaa kirjoittaa holding 1 = 0
    icon: >
      {% set h = states('sensor.airfi_hataseis_tila') | int(0) %}
      {% set v = states('sensor.airfi_vikatila') | int(0) %}
      {{ 'mdi:alert-octagon' if h > 0 or v > 0 else 'mdi:check-circle' }}
    icon_color: >
      {% set h = states('sensor.airfi_hataseis_tila') | int(0) %}
      {% set v = states('sensor.airfi_vikatila') | int(0) %}
      {{ 'red' if h > 0 or v > 0 else 'green' }}
    tap_action:
      action: more-info
  - type: custom:mushroom-template-card
    primary: Kuittaa hälytys
    secondary: Vaatii kirjoituksen päälle
    icon: mdi:alert-decagram-outline
    icon_color: red
    layout: horizontal
    tap_action:
      action: perform-action
      perform_action: script.iv_kuittaa
  - type: entities
    title: Automaatin anturientiteetit
    entities:
      - entity: input_text.iv_co2_entiteetti
        name: CO₂
      - entity: input_text.iv_kosteus_entiteetti
        name: Kosteus
      - entity: input_text.iv_pm_entiteetti
        name: PM
      - entity: sensor.iv_auto_tavoite
        name: Auto-tavoite
      - entity: sensor.iv_auto_lahde
        name: Määräävä anturi
  - type: entities
    title: AirFi (modbus.yaml)
    state_color: true
    entities:
      - entity: sensor.airfi_t1_ulkoilma
        name: T1 ulkoilma
      - entity: sensor.airfi_t2_lto_jalkeen
        name: T2 LTO jälkeen
      - entity: sensor.airfi_t3_poistoilma
        name: T3 poistoilma
      - entity: sensor.airfi_t4_jateilma
        name: T4 jäteilma
      - entity: sensor.airfi_t5_tuloilma
        name: T5 tuloilma
      - entity: sensor.airfi_poistoilmapuhallin_nopeus
        name: Poistoilmapuhallin
      - entity: sensor.airfi_tuloilmapuhallin_nopeus
        name: Tuloilmapuhallin
      - entity: sensor.airfi_tuloilmamaara
        name: Tuloilmamäärä
      - entity: sensor.airfi_poistoilmamaara
        name: Poistoilmamäärä
      - entity: sensor.airfi_kosteus_rh
        name: Kosteus RH
      - entity: sensor.airfi_nopeustaso
        name: Nopeustaso
      - entity: sensor.airfi_hataseis_tila
        name: Hätäseis
      - entity: sensor.airfi_vikatila
        name: Vikatila
      - entity: sensor.airfi_saunatila
        name: Saunatila
