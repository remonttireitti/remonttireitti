# Koko IV-kortti. Korvaa Lovelace-editorissa koko YAML.
# Vain sinun modbus.yaml:n sensorit (sensor.airfi_*).
# Ei toista hubia. Ei sensor.iv_*-nimiä. Ei käsinajo-helpereitä.

type: vertical-stack
cards:
  - type: custom:mushroom-template-card
    entity: sensor.airfi_poistoilmapuhallin_nopeus
    layout: horizontal
    fill_container: true
    primary: >
      {% set po = states('sensor.airfi_poistoilmapuhallin_nopeus') %}
      {% if po in ['unknown','unavailable','none',''] %}
        AirFi · ei lukemaa
      {% else %}
        AirFi · ok
      {% endif %}
    secondary: >
      {% set po = states('sensor.airfi_poistoilmapuhallin_nopeus') %}
      {% set tu = states('sensor.airfi_tuloilmapuhallin_nopeus') %}
      {% if po in ['unknown','unavailable','none',''] or tu in ['unknown','unavailable','none',''] %}
        Tarkista Kehittäjätyökalut → sensor.airfi_poistoilmapuhallin_nopeus
      {% else %}
        Poisto {{ po | float(0) | round(0) }} % · tulo {{ tu | float(0) | round(0) }} %
      {% endif %}
    icon: mdi:fan
    icon_color: >
      {{ 'green' if states('sensor.airfi_poistoilmapuhallin_nopeus') not in ['unknown','unavailable','none',''] else 'red' }}
    tap_action:
      action: more-info
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-template-card
        entity: sensor.airfi_poistoilmapuhallin_nopeus
        layout: vertical
        primary: >
          {% set s = states('sensor.airfi_poistoilmapuhallin_nopeus') %}
          {% if s in ['unknown','unavailable','none',''] %}—{% else %}{{ s | float(0) | round(0) }} %{% endif %}
        secondary: Poisto
        icon: mdi:fan
        icon_color: green
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        entity: sensor.airfi_tuloilmapuhallin_nopeus
        layout: vertical
        primary: >
          {% set s = states('sensor.airfi_tuloilmapuhallin_nopeus') %}
          {% if s in ['unknown','unavailable','none',''] %}—{% else %}{{ s | float(0) | round(0) }} %{% endif %}
        secondary: Tulo
        icon: mdi:fan-plus
        icon_color: green
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        entity: sensor.airfi_t5_tuloilma
        layout: vertical
        primary: >
          {% set s = states('sensor.airfi_t5_tuloilma') %}
          {% if s in ['unknown','unavailable','none',''] %}—{% else %}{{ s }} °C{% endif %}
        secondary: T5 tulo
        icon: mdi:thermometer
        icon_color: orange
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        entity: sensor.airfi_t3_poistoilma
        layout: vertical
        primary: >
          {% set s = states('sensor.airfi_t3_poistoilma') %}
          {% if s in ['unknown','unavailable','none',''] %}—{% else %}{{ s }} °C{% endif %}
        secondary: T3 poisto
        icon: mdi:thermometer
        icon_color: orange
        tap_action:
          action: more-info
  - type: custom:mushroom-chips-card
    alignment: center
    chips:
      - type: template
        icon: mdi:thermometer
        content: >
          {% set s = states('sensor.airfi_t1_ulkoilma') %}
          {% if s in ['unknown','unavailable','none',''] %}T1 —{% else %}T1 {{ s }} °C{% endif %}
        tap_action:
          action: more-info
          entity: sensor.airfi_t1_ulkoilma
      - type: template
        icon: mdi:thermometer
        content: >
          {% set s = states('sensor.airfi_t2_lto_jalkeen') %}
          {% if s in ['unknown','unavailable','none',''] %}T2 —{% else %}T2 {{ s }} °C{% endif %}
        tap_action:
          action: more-info
          entity: sensor.airfi_t2_lto_jalkeen
      - type: template
        icon: mdi:thermometer
        content: >
          {% set s = states('sensor.airfi_t4_jateilma') %}
          {% if s in ['unknown','unavailable','none',''] %}T4 —{% else %}T4 {{ s }} °C{% endif %}
        tap_action:
          action: more-info
          entity: sensor.airfi_t4_jateilma
      - type: template
        icon: mdi:water-percent
        content: >
          {% set s = states('sensor.airfi_kosteus_rh') %}
          {% if s in ['unknown','unavailable','none',''] %}RH —{% else %}RH {{ s | float(0) | round(0) }} %{% endif %}
        tap_action:
          action: more-info
          entity: sensor.airfi_kosteus_rh
  - type: custom:mushroom-template-card
    entity: sensor.airfi_hataseis_tila
    layout: horizontal
    primary: >
      {% set h = states('sensor.airfi_hataseis_tila') %}
      {% set v = states('sensor.airfi_vikatila') %}
      {% if h in ['unknown','unavailable','none',''] and v in ['unknown','unavailable','none',''] %}
        Hälytyslukemia ei ole
      {% elif h | int(0) > 0 or v | int(0) > 0 %}
        Hälytys · hätäseis {{ h }} · vika {{ v }}
      {% else %}
        Ei hälytyksiä
      {% endif %}
    secondary: >
      Nopeustaso {{ states('sensor.airfi_nopeustaso') }}
      · AUX2 {{ states('sensor.airfi_aux2') }}
      · sauna {{ states('sensor.airfi_saunatila') }}
    icon: >
      {% set h = states('sensor.airfi_hataseis_tila') | int(0) %}
      {% set v = states('sensor.airfi_vikatila') | int(0) %}
      {{ 'mdi:alert-octagon' if h > 0 or v > 0 else 'mdi:check-circle' }}
    icon_color: >
      {% set h = states('sensor.airfi_hataseis_tila') | int(0) %}
      {% set v = states('sensor.airfi_vikatila') | int(0) %}
      {{ 'red' if h > 0 or v > 0 else 'green' }}
    tap_action:
      action: more-info
  - type: entities
    title: AirFi (modbus.yaml)
    state_color: true
    entities:
      - entity: sensor.airfi_t1_ulkoilma
        name: T1 ulkoilma
      - entity: sensor.airfi_t2_lto_jalkeen
        name: T2 LTO jälkeen
      - entity: sensor.airfi_t3_poistoilma
        name: T3 poistoilma
      - entity: sensor.airfi_t4_jateilma
        name: T4 jäteilma
      - entity: sensor.airfi_t5_tuloilma
        name: T5 tuloilma
      - entity: sensor.airfi_poistoilmapuhallin_nopeus
        name: Poistoilmapuhallin
      - entity: sensor.airfi_tuloilmapuhallin_nopeus
        name: Tuloilmapuhallin
      - entity: sensor.airfi_tuloilmamaara
        name: Tuloilmamäärä
      - entity: sensor.airfi_poistoilmamaara
        name: Poistoilmamäärä
      - entity: sensor.airfi_kosteus_rh
        name: Kosteus RH
      - entity: sensor.airfi_nopeustaso
        name: Nopeustaso
      - entity: sensor.airfi_lampotila_asetus_luku
        name: Lämpötila-asetus
      - entity: sensor.airfi_hataseis_tila
        name: Hätäseis
      - entity: sensor.airfi_vikatila
        name: Vikatila
      - entity: sensor.airfi_aux2
        name: AUX2 (LTO)
      - entity: sensor.airfi_liesipellin_tila
        name: Liesipelti
      - entity: sensor.airfi_takkatila
        name: Takkatila
      - entity: sensor.airfi_takkatila_asetus
        name: Takkatila asetus
      - entity: sensor.airfi_saunatila
        name: Saunatila
      - entity: sensor.airfi_kotona_poissa
        name: Kotona / poissa
      - entity: sensor.airfi_ohituksen_asetuslampotila
        name: Ohituksen asetuslämpötila
      - entity: sensor.airfi_ohituksen_ulkoilmaraja
        name: Ohituksen ulkoilmaraja
      - entity: sensor.airfi_ohituksen_viive
        name: Ohituksen viive
