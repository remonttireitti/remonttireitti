# IV käyttöpääte. Korvaa Lovelace-editorissa koko YAML.

type: vertical-stack
cards:
  - type: custom:mushroom-chips-card
    alignment: justify
    chips:
      - type: template
        icon: mdi:fan
        icon_color: >
          {% set ohj = states('input_select.iv_ohjaus') %}
          {% if ohj == 'Pois' %}disabled
          {% elif ohj == 'Tehostus' %}red
          {% elif ohj == 'Manuaali' %}blue
          {% else %}green{% endif %}
        content: >
          {% set ohj = states('input_select.iv_ohjaus') %}
          {{ ohj if ohj not in ['unknown','unavailable','none',''] else 'IV' }}
        tap_action:
          action: more-info
          entity: sensor.airfi_poistoilmapuhallin_nopeus
      - type: template
        icon: mdi:fan
        content: >
          {% set s = states('sensor.airfi_poistoilmapuhallin_nopeus') %}
          {% if s in ['unknown','unavailable','none',''] %}P —{% else %}P {{ s | float(0) | round(0) }} %{% endif %}
        tap_action:
          action: more-info
          entity: sensor.airfi_poistoilmapuhallin_nopeus
      - type: template
        icon: mdi:fan-plus
        content: >
          {% set s = states('sensor.airfi_tuloilmapuhallin_nopeus') %}
          {% if s in ['unknown','unavailable','none',''] %}T —{% else %}T {{ s | float(0) | round(0) }} %{% endif %}
        tap_action:
          action: more-info
          entity: sensor.airfi_tuloilmapuhallin_nopeus
      - type: template
        icon: mdi:target
        content: >
          {% set t = states('sensor.iv_auto_tavoite') %}
          {% if t in ['unknown','unavailable','none',''] %}→ —{% else %}→ {{ t | int }} %{% endif %}
        tap_action:
          action: more-info
          entity: sensor.iv_auto_tavoite
  - type: entities
    show_header_toggle: false
    entities:
      - entity: input_select.iv_auto_anturit
        name: Auto
  - type: custom:mushroom-chips-card
    alignment: center
    chips:
      - type: template
        icon: mdi:molecule-co2
        icon_color: "{{ 'green' if 'CO2' in states('input_select.iv_auto_anturit') else 'grey' }}"
        content: >
          {% set e = states('input_text.iv_co2_entiteetti') | trim %}
          {% set s = states(e) %}
          {% if s in ['unknown','unavailable','none',''] %}CO₂ —{% else %}CO₂ {{ s | float(0) | round(0) }}{% endif %}
      - type: template
        icon: mdi:water-percent
        icon_color: "{{ 'green' if 'kosteus' in states('input_select.iv_auto_anturit') else 'grey' }}"
        content: >
          {% set e = states('input_text.iv_kosteus_entiteetti') | trim %}
          {% set s = states(e) %}
          {% if s in ['unknown','unavailable','none',''] %}RH —{% else %}RH {{ s | float(0) | round(0) }}{% endif %}
      - type: template
        icon: mdi:air-filter
        icon_color: "{{ 'green' if 'PM' in states('input_select.iv_auto_anturit') else 'grey' }}"
        content: >
          {% set e = states('input_text.iv_pm_entiteetti') | trim %}
          {% set s = states(e) %}
          {% if s in ['unknown','unavailable','none',''] %}PM —{% else %}PM {{ s | float(0) | round(0) }}{% endif %}
  - type: custom:mushroom-chips-card
    alignment: center
    chips:
      - type: template
        icon: mdi:robot-outline
        content: Auto
        icon_color: "{{ 'green' if is_state('input_select.iv_ohjaus', 'Automaatti') else 'grey' }}"
        tap_action:
          action: perform-action
          perform_action: script.iv_automaatti
      - type: template
        icon: mdi:gesture-tap
        content: Käsi
        icon_color: "{{ 'blue' if is_state('input_select.iv_ohjaus', 'Manuaali') else 'grey' }}"
        tap_action:
          action: perform-action
          perform_action: script.iv_manuaali
      - type: template
        icon: mdi:fan-plus
        content: Teho
        icon_color: "{{ 'red' if is_state('input_select.iv_ohjaus', 'Tehostus') else 'grey' }}"
        tap_action:
          action: perform-action
          perform_action: script.iv_tehostus
      - type: template
        icon: mdi:fan-off
        content: Pois
        icon_color: "{{ 'red' if is_state('input_select.iv_ohjaus', 'Pois') else 'grey' }}"
        tap_action:
          action: perform-action
          perform_action: script.iv_pois
      - type: template
        icon: mdi:upload-network
        content: "{{ 'Kirjoitus' if is_state('input_boolean.iv_modbus_kirjoitus', 'on') else 'Luku' }}"
        icon_color: "{{ 'orange' if is_state('input_boolean.iv_modbus_kirjoitus', 'on') else 'grey' }}"
        tap_action:
          action: toggle
          entity: input_boolean.iv_modbus_kirjoitus
  - type: conditional
    conditions:
      - condition: state
        entity: input_select.iv_ohjaus
        state: Manuaali
    card:
      type: entities
      show_header_toggle: false
      entities:
        - entity: input_number.iv_manuaali_poisto
          name: Poisto
        - entity: input_number.iv_manuaali_tulo
          name: Tulo
  - type: conditional
    conditions:
      - condition: state
        entity: timer.iv_tehostus
        state: active
    card:
      type: custom:mushroom-chips-card
      alignment: center
      chips:
        - type: template
          icon: mdi:timer-sand
          icon_color: red
          content: Tehostus
          tap_action:
            action: perform-action
            perform_action: script.iv_automaatti
          entity: timer.iv_tehostus
  - type: conditional
    conditions:
      - condition: or
        conditions:
          - condition: numeric_state
            entity: sensor.airfi_hataseis_tila
            above: 0
          - condition: numeric_state
            entity: sensor.airfi_vikatila
            above: 0
    card:
      type: custom:mushroom-chips-card
      alignment: center
      chips:
        - type: template
          icon: mdi:alert-octagon
          icon_color: red
          content: >
            Hälytys {{ states('sensor.airfi_hataseis_tila') }}/{{ states('sensor.airfi_vikatila') }}
          tap_action:
            action: more-info
            entity: sensor.airfi_hataseis_tila
        - type: template
          icon: mdi:alert-decagram-outline
          icon_color: red
          content: Kuittaa
          tap_action:
            action: perform-action
            perform_action: script.iv_kuittaa
