type: vertical-stack
cards:
  - type: custom:mushroom-chips-card
    alignment: justify
    chips:
      - type: template
        icon: mdi:fan
        icon_color: "{{ 'orange' if is_state('input_boolean.iv_sauna', 'on') or states('sensor.airfi_saunatila') | int(0) > 0 else ('blue' if is_state('input_select.iv_ohjaus', 'Manuaali') else ('red' if is_state('input_select.iv_ohjaus', 'Tehostus') else ('disabled' if is_state('input_select.iv_ohjaus', 'Pois') else 'green'))) }}"
        content: "{{ 'Sauna' if is_state('input_boolean.iv_sauna', 'on') or states('sensor.airfi_saunatila') | int(0) > 0 else states('input_select.iv_ohjaus') }}"
        tap_action:
          action: more-info
          entity: input_select.iv_ohjaus
      - type: template
        icon: mdi:fan
        content: "P {{ states('sensor.airfi_poistoilmapuhallin_nopeus') }} %"
        tap_action:
          action: more-info
          entity: sensor.airfi_poistoilmapuhallin_nopeus
      - type: template
        icon: mdi:fan-plus
        content: "T {{ states('sensor.airfi_tuloilmapuhallin_nopeus') }} %"
        tap_action:
          action: more-info
          entity: sensor.airfi_tuloilmapuhallin_nopeus
      - type: template
        icon: mdi:check-bold
        icon_color: orange
        content: Aseta
        tap_action:
          action: call-service
          service: script.turn_on
          service_data:
            entity_id: script.iv_kirjoita
  - type: custom:mushroom-select-card
    entity: input_select.iv_auto_anturit
    name: Auto
    icon: mdi:tune-variant
    layout: horizontal
    secondary_info: none
  - type: custom:mushroom-number-card
    entity: input_number.iv_manuaali_poisto
    name: Poisto
    display_mode: slider
    layout: horizontal
    icon_color: blue
  - type: custom:mushroom-number-card
    entity: input_number.iv_manuaali_tulo
    name: Tulo
    display_mode: slider
    layout: horizontal
    icon_color: cyan
  - type: custom:mushroom-chips-card
    alignment: center
    chips:
      - type: template
        icon: mdi:robot-outline
        icon_color: "{{ 'green' if is_state('input_select.iv_ohjaus', 'Automaatti') else 'grey' }}"
        content: Auto
        tap_action:
          action: call-service
          service: script.turn_on
          service_data:
            entity_id: script.iv_automaatti
      - type: template
        icon: mdi:gesture-tap
        icon_color: "{{ 'blue' if is_state('input_select.iv_ohjaus', 'Manuaali') else 'grey' }}"
        content: Käsi
        tap_action:
          action: call-service
          service: script.turn_on
          service_data:
            entity_id: script.iv_manuaali
      - type: template
        icon: mdi:fan-plus
        icon_color: "{{ 'red' if is_state('input_select.iv_ohjaus', 'Tehostus') else 'grey' }}"
        content: Teho
        tap_action:
          action: call-service
          service: script.turn_on
          service_data:
            entity_id: script.iv_tehostus
      - type: template
        icon: mdi:fan-off
        icon_color: "{{ 'red' if is_state('input_select.iv_ohjaus', 'Pois') else 'grey' }}"
        content: Pois
        tap_action:
          action: call-service
          service: script.turn_on
          service_data:
            entity_id: script.iv_pois
      - type: template
        icon: mdi:hot-tub
        icon_color: "{{ 'orange' if is_state('input_boolean.iv_sauna', 'on') or states('sensor.airfi_saunatila') | int(0) > 0 else 'grey' }}"
        content: "{{ 'Sauna päällä' if is_state('input_boolean.iv_sauna', 'on') or states('sensor.airfi_saunatila') | int(0) > 0 else 'Sauna' }}"
        tap_action:
          action: call-service
          service: script.turn_on
          service_data:
            entity_id: script.iv_sauna
  - type: custom:mushroom-chips-card
    alignment: center
    chips:
      - type: entity
        entity: timer.iv_tehostus
        icon: mdi:fan-plus
        content_info: state
      - type: template
        icon: mdi:plus
        icon_color: red
        content: "+15 teho"
        tap_action:
          action: call-service
          service: script.turn_on
          service_data:
            entity_id: script.iv_tehostus_lisaa
      - type: template
        icon: mdi:stop
        content: Lopeta
        tap_action:
          action: call-service
          service: script.turn_on
          service_data:
            entity_id: script.iv_tehostus_lopeta
      - type: entity
        entity: timer.iv_sauna
        icon: mdi:hot-tub
        content_info: state
      - type: template
        icon: mdi:plus
        icon_color: orange
        content: "+15 sauna"
        tap_action:
          action: call-service
          service: script.turn_on
          service_data:
            entity_id: script.iv_sauna_lisaa
      - type: template
        icon: mdi:stop
        content: Lopeta
        tap_action:
          action: call-service
          service: script.turn_on
          service_data:
            entity_id: script.iv_sauna_lopeta
  - type: custom:mushroom-chips-card
    alignment: center
    chips:
      - type: template
        icon: mdi:water-percent
        content: "RH {{ states('sensor.airfi_kosteus_rh') }}"
        tap_action:
          action: more-info
          entity: sensor.airfi_kosteus_rh
      - type: template
        icon: mdi:alert-octagon
        icon_color: "{{ 'red' if states('sensor.airfi_hataseis_tila') | int(0) > 0 or states('sensor.airfi_vikatila') | int(0) > 0 else 'green' }}"
        content: "Hälytys {{ states('sensor.airfi_hataseis_tila') }}/{{ states('sensor.airfi_vikatila') }}"
        tap_action:
          action: more-info
          entity: sensor.airfi_hataseis_tila
      - type: template
        icon: mdi:alert-decagram-outline
        icon_color: red
        content: Kuittaa
        tap_action:
          action: call-service
          service: script.turn_on
          service_data:
            entity_id: script.iv_kuittaa
