# IV käyttöpääte. Korvaa Lovelace-editorissa koko YAML.
# Painikkeet vaihtavat input_select.iv_ohjaus — ei script.iv_* -kutsuja.

type: vertical-stack
cards:
  - type: custom:mushroom-chips-card
    alignment: justify
    chips:
      - type: template
        icon: mdi:fan
        icon_color: >
          {% set ohj = states('input_select.iv_ohjaus') %}
          {% if ohj == 'Pois' %}disabled
          {% elif ohj == 'Tehostus' %}red
          {% elif ohj == 'Manuaali' %}blue
          {% else %}green{% endif %}
        content: >
          {% set ohj = states('input_select.iv_ohjaus') %}
          {{ ohj if ohj not in ['unknown','unavailable','none',''] else 'IV' }}
        tap_action:
          action: more-info
          entity: sensor.airfi_poistoilmapuhallin_nopeus
      - type: template
        icon: mdi:fan
        content: >
          {% set s = states('sensor.airfi_poistoilmapuhallin_nopeus') %}
          {% if s in ['unknown','unavailable','none',''] %}P —{% else %}P {{ s | float(0) | round(0) }} %{% endif %}
        tap_action:
          action: more-info
          entity: sensor.airfi_poistoilmapuhallin_nopeus
      - type: template
        icon: mdi:fan-plus
        content: >
          {% set s = states('sensor.airfi_tuloilmapuhallin_nopeus') %}
          {% if s in ['unknown','unavailable','none',''] %}T —{% else %}T {{ s | float(0) | round(0) }} %{% endif %}
        tap_action:
          action: more-info
          entity: sensor.airfi_tuloilmapuhallin_nopeus
      - type: template
        icon: mdi:upload-network
        content: "{{ 'Kirjoitus' if is_state('input_boolean.iv_modbus_kirjoitus', 'on') else 'Luku' }}"
        icon_color: "{{ 'orange' if is_state('input_boolean.iv_modbus_kirjoitus', 'on') else 'grey' }}"
        tap_action:
          action: toggle
          entity: input_boolean.iv_modbus_kirjoitus
  - type: entities
    show_header_toggle: false
    entities:
      - entity: input_select.iv_auto_anturit
        name: Auto
  - type: custom:mushroom-chips-card
    alignment: center
    chips:
      - type: template
        icon: mdi:air-filter
        icon_color: >
          {% set t = states('sensor.iv_auto_tavoite') %}
          {{ 'green' if t not in ['unknown','unavailable','none',''] else 'grey' }}
        content: >
          {% set ns = namespace(osat=[]) %}
          {% set ce = states('input_text.iv_co2_entiteetti') | trim %}
          {% set ke = states('input_text.iv_kosteus_entiteetti') | trim %}
          {% set pe = states('input_text.iv_pm_entiteetti') | trim %}
          {% set c = states(ce) %}
          {% set k = states(ke) if ke not in ['unknown','unavailable','none',''] else states('sensor.airfi_kosteus_rh') %}
          {% set p = states(pe) %}
          {% if c not in ['unknown','unavailable','none',''] %}
            {% set ns.osat = ns.osat + ['CO₂ ' ~ (c | float(0) | round(0) | string)] %}
          {% endif %}
          {% if k not in ['unknown','unavailable','none',''] %}
            {% set ns.osat = ns.osat + ['RH ' ~ (k | float(0) | round(0) | string)] %}
          {% endif %}
          {% if p not in ['unknown','unavailable','none',''] %}
            {% set ns.osat = ns.osat + ['PM ' ~ (p | float(0) | round(0) | string)] %}
          {% endif %}
          {% set t = states('sensor.iv_auto_tavoite') %}
          {% if t not in ['unknown','unavailable','none',''] %}
            {% set ns.osat = ns.osat + ['→ ' ~ (t | int | string) ~ ' %'] %}
          {% endif %}
          {{ ns.osat | join(' · ') if ns.osat | count > 0 else 'Anturit' }}
        tap_action:
          action: none
  - type: custom:mushroom-chips-card
    alignment: center
    chips:
      - type: template
        icon: mdi:robot-outline
        content: Auto
        icon_color: "{{ 'green' if is_state('input_select.iv_ohjaus', 'Automaatti') else 'grey' }}"
        tap_action:
          action: call-service
          service: input_select.select_option
          target:
            entity_id: input_select.iv_ohjaus
          data:
            option: Automaatti
      - type: template
        icon: mdi:gesture-tap
        content: Käsi
        icon_color: "{{ 'blue' if is_state('input_select.iv_ohjaus', 'Manuaali') else 'grey' }}"
        tap_action:
          action: call-service
          service: input_select.select_option
          target:
            entity_id: input_select.iv_ohjaus
          data:
            option: Manuaali
      - type: template
        icon: mdi:fan-plus
        content: Teho
        icon_color: "{{ 'red' if is_state('input_select.iv_ohjaus', 'Tehostus') else 'grey' }}"
        tap_action:
          action: call-service
          service: input_select.select_option
          target:
            entity_id: input_select.iv_ohjaus
          data:
            option: Tehostus
      - type: template
        icon: mdi:fan-off
        content: Pois
        icon_color: "{{ 'red' if is_state('input_select.iv_ohjaus', 'Pois') else 'grey' }}"
        tap_action:
          action: call-service
          service: input_select.select_option
          target:
            entity_id: input_select.iv_ohjaus
          data:
            option: Pois
  - type: conditional
    conditions:
      - condition: state
        entity: input_select.iv_ohjaus
        state: Manuaali
    card:
      type: entities
      show_header_toggle: false
      entities:
        - entity: input_number.iv_manuaali_poisto
          name: Poisto
        - entity: input_number.iv_manuaali_tulo
          name: Tulo
  - type: conditional
    conditions:
      - condition: state
        entity: timer.iv_tehostus
        state: active
    card:
      type: custom:mushroom-chips-card
      alignment: center
      chips:
        - type: template
          icon: mdi:timer-sand
          icon_color: red
          content: Tehostus
          tap_action:
            action: call-service
            service: input_select.select_option
            target:
              entity_id: input_select.iv_ohjaus
            data:
              option: Automaatti
  - type: conditional
    conditions:
      - condition: or
        conditions:
          - condition: numeric_state
            entity: sensor.airfi_hataseis_tila
            above: 0
          - condition: numeric_state
            entity: sensor.airfi_vikatila
            above: 0
    card:
      type: custom:mushroom-chips-card
      alignment: center
      chips:
        - type: template
          icon: mdi:alert-octagon
          icon_color: red
          content: >
            Hälytys {{ states('sensor.airfi_hataseis_tila') }}/{{ states('sensor.airfi_vikatila') }}
          tap_action:
            action: more-info
            entity: sensor.airfi_hataseis_tila
        - type: template
          icon: mdi:alert-decagram-outline
          icon_color: red
          content: Kuittaa
          tap_action:
            action: call-service
            service: modbus.write_register
            data:
              hub: airfi
              slave: 1
              address: 1
              value: 0
